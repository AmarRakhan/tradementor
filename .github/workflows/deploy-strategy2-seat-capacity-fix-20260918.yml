name: Deploy Strategy 2 seat capacity + Top-N 800 fix 2026-09-18

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/deploy-strategy2-seat-capacity-fix-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-backend
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  VERIFIED_CODE_SHA: 1d2b84d362db87c329068bea1bd43ce179f699e2

jobs:
  test-build-verify-promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact source and one-shot scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$(git diff --name-only "$VERIFIED_CODE_SHA" HEAD)" = ".github/workflows/deploy-strategy2-seat-capacity-fix-20260918.yml"
          grep -Fq 'strategy_position_count = len(strategy_active_keys)' cloud_api/aster_multi_bb_core.py
          grep -Fq 'seat_capacity_position_count = account_position_count if capacity_ownership_fallback else strategy_position_count' cloud_api/aster_multi_bb_core.py
          grep -Fq 'settings.maximum_positions - seat_capacity_position_count' cloud_api/aster_multi_bb_core.py
          grep -Fq '"strategyPositionCount": strategy_position_count' cloud_api/aster_multi_bb_core.py
          grep -Fq 'test_two_free_strategy_seats_refill_even_when_untracked_positions_make_account_count_equal_maximum_positions' cloud_api/test_strategy2_untracked_seat_refill_20260918.py
          grep -Fq 'self.universe_top_n <= 800' cloud_api/aster_multi_bb_core.py
          grep -Fq 'Top-N moet tussen 1 en 800 liggen' cloud_api/aster_multi_bb_core.py
          grep -Fq 'test_automatic_top_n_allows_up_to_800_and_rejects_801' cloud_api/test_aster_multi_bb.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run seat-capacity regressions
        working-directory: cloud_api
        run: python -m pytest -q test_strategy2_untracked_seat_refill_20260918.py test_aster_multi_bb.py test_short_requires_long_pairing_20260917.py

      - name: Run full backend suite
        working-directory: cloud_api
        run: python -m pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Capture production state and IAM
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/before.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=s['spec']['template']['spec']
          env={x['name']:x.get('value') for x in spec['containers'][0].get('env',[])}
          assert env.get('ASTER_LIVE_EXECUTION_ENABLED') == 'true'
          assert env.get('ASTER_STRATEGY2_LIVE_ENABLED') == 'true'
          live=[x for x in s['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          assert len(live)==1, live
          print('BASE_REVISION='+live[0]['revisionName'])
          print('BASE_URL='+s['status']['url'])
          PY

      - name: Build and push exact backend source
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:seat-capacity-${VERIFIED_CODE_SHA}"
          docker build --build-arg SOURCE_COMMIT="$VERIFIED_CODE_SHA" --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy zero-traffic candidate preserving runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          TAG="scf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SUFFIX="scf-${VERIFIED_CODE_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --revision-suffix "$SUFFIX" --no-traffic --tag "$TAG" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          python - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json,os,sys
          before=json.load(open(sys.argv[1],encoding='utf-8'))
          after=json.load(open(sys.argv[2],encoding='utf-8'))
          tag=sys.argv[3]
          bs=before['spec']['template']['spec']
          a=after['spec']['template']['spec']
          assert bs.get('serviceAccountName') == a.get('serviceAccountName')
          assert bs.get('timeoutSeconds') == a.get('timeoutSeconds')
          assert bs.get('containerConcurrency') == a.get('containerConcurrency')
          benv={x['name']:x.get('value') for x in bs['containers'][0].get('env',[])}
          aenv={x['name']:x.get('value') for x in a['containers'][0].get('env',[])}
          assert benv == aenv
          live=[x for x in after['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          assert len(live)==1 and live[0].get('revisionName') == os.environ['BASE_REVISION'], live
          row=next(x for x in after['status']['traffic'] if x.get('tag')==tag)
          assert int(row.get('percent',0) or 0)==0
          print('CANDIDATE_URL='+row['url'])
          print('CANDIDATE_REVISION='+row['revisionName'])
          PY

      - name: Verify candidate health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 8 --retry-delay 4 "$CANDIDATE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1])
          assert h['status']=='ready'
          assert h['multiUser'] is True
          PY

      - name: Promote verified candidate to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$CANDIDATE_REVISION=100" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/final.json"
          python - "$RUNNER_TEMP/final.json" "$CANDIDATE_REVISION" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          rev=sys.argv[2]
          live=[x for x in s['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          assert len(live)==1 and live[0].get('revisionName')==rev, live
          PY
          curl --fail --silent --show-error --retry 8 --retry-delay 4 "$BASE_URL/health" >/dev/null

      - name: Verify IAM unchanged
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1],encoding='utf-8')) == json.load(open(sys.argv[2],encoding='utf-8'))
          PY
          echo "STRATEGY2_TOPN800_FIX_LIVE_REVISION=$CANDIDATE_REVISION" >> "$GITHUB_STEP_SUMMARY"
