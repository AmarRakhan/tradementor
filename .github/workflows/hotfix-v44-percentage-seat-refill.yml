name: Focus 2.0 one-shot builder

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/hotfix-v44-percentage-seat-refill.yml]

permissions:
  contents: write

concurrency:
  group: focus-v2-one-shot-builder
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply isolated Focus 2.0 implementation
        run: python tools/focus_v2_builder.py
      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Compile changed backend
        run: python -m py_compile cloud_api/aster_strategy2.py cloud_api/aster_strategy2_focus_live.py cloud_api/aster_strategy2_focus_v2.py
      - name: Run Focus 2.0 and legacy Focus regression tests
        env:
          PYTHONPATH: cloud_api
        run: pytest -q cloud_api/test_aster_strategy2_focus_v2.py cloud_api/test_focus_hedge_profit_gate_contract.py cloud_api/test_aster_strategy2_focus.py cloud_api/test_aster_strategy2_focus_live.py cloud_api/test_aster_strategy2_focus_multi.py
      - name: Run full backend suite
        working-directory: cloud_api
        run: pytest -q
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified Focus 2.0 source
        run: |
          git config user.name 'TradeMentor Focus 2.0 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_strategy2.py cloud_api/aster_strategy2_focus_live.py cloud_api/aster_strategy2_focus_v2.py cloud_api/test_aster_strategy2_focus_v2.py web/components/aster-strategy2-maker.tsx
          git commit -m 'feat: add isolated Focus 2.0 protected long builder'
          git push origin HEAD:amar-crypto-bot-2026-cloud
