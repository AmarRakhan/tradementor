name: Apply Realtime Aster UI
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: ['.github/workflows/realtime-ui-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - name: Patch backend tenant SSE and graceful shutdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_api/aster_realtime.py'); s=p.read_text()
          def once(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'aster anchor count {s.count(old)} {old[:80]!r}')
              s=s.replace(old,new,1)
          once('    def symbols(self) -> tuple[str, ...]:\n        with self._lock:\n            return tuple(sorted(self._by_symbol))\n\n    def tenant_count',
               '    def symbols(self) -> tuple[str, ...]:\n        with self._lock:\n            return tuple(sorted(self._by_symbol))\n\n    def symbols_for(self, uid: str) -> tuple[str, ...]:\n        tenant = str(uid).strip()\n        with self._lock:\n            return tuple(sorted(symbol for symbol, members in self._by_symbol.items() if tenant in members))\n\n    def tenant_count')
          once('        self._latest_by_symbol: dict[str, RealtimeMarketEvent] = {}\n\n    def stop(self) -> None:\n        self._stop.set()\n',
               '        self._latest_by_symbol: dict[str, RealtimeMarketEvent] = {}\n        self._loop: asyncio.AbstractEventLoop | None = None\n\n    def stop(self) -> None:\n        loop = self._loop\n        if loop is not None and loop.is_running():\n            loop.call_soon_threadsafe(self._stop.set)\n        else:\n            self._stop.set()\n')
          once('    async def run(self) -> None:\n        backoff = 1.0\n',
               '    async def run(self) -> None:\n        self._loop = asyncio.get_running_loop()\n        backoff = 1.0\n')
          p.write_text(s)

          p=Path('cloud_api/main.py'); s=p.read_text()
          anchor='@app.get("/internal/aster-realtime/health")\ndef aster_realtime_health(authorization:str|None=Header(default=None))->dict[str,Any]:\n    verify_internal_cloud_request(authorization);worker=_aster_realtime_worker\n    return {"workerEnabled":os.getenv("ASTER_REALTIME_WORKER","false").lower()=="true","executionEnabled":os.getenv("ASTER_REALTIME_EXECUTION_ENABLED","false").lower()=="true",**(worker.health() if worker else {"connected":False,"subscriptions":0,"tenants":0})}\n\n'
          if s.count(anchor)!=1: raise SystemExit('main realtime health anchor missing/nonunique')
          addition=anchor+r'''@app.on_event("shutdown")
def stop_aster_realtime_worker()->None:
    worker=_aster_realtime_worker
    if worker is not None:worker.stop()


@app.get("/v1/me/aster/realtime/events")
def aster_realtime_events(user:dict[str,Any]=Depends(authenticated_user))->StreamingResponse:
    uid=str(user["uid"])
    async def stream():
        last_seen:dict[str,int]={};last_heartbeat=time.monotonic()
        while True:
            worker=_aster_realtime_worker
            if worker is None:
                yield "event: status\ndata: {\"connected\":false,\"reason\":\"worker-disabled\"}\n\n"
                await asyncio.sleep(2.0);continue
            allowed=worker.registry.symbols_for(uid)
            latest=worker.latest(allowed)
            for symbol,payload in latest.items():
                stamp=int(payload.get("receivedAtMs",0) or 0)
                if stamp<=last_seen.get(symbol,0):continue
                last_seen[symbol]=stamp
                yield f"event: mark\ndata: {json.dumps(payload,separators=(',',':'))}\n\n"
            now=time.monotonic()
            if now-last_heartbeat>=15:
                yield ": heartbeat\n\n";last_heartbeat=now
            await asyncio.sleep(.25)
    return StreamingResponse(stream(),media_type="text/event-stream",headers={"Cache-Control":"no-cache, no-transform","X-Accel-Buffering":"no","Connection":"keep-alive"})


'''
          s=s.replace(anchor,addition,1); p.write_text(s)
          PY
      - name: Patch web authenticated stream and live mark merger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/lib/cloud-client.ts'); s=p.read_text()
          s += '''\nexport async function authenticatedStream(path: string, init: RequestInit = {}) {\n  const user = firebaseAuth.currentUser;\n  if (!user) throw new Error("Log eerst in bij TradeMentor.");\n  const request = async (forceRefresh: boolean) => {\n    const token = await user.getIdToken(forceRefresh);\n    const headers = new Headers(init.headers);\n    headers.set("Authorization", `Bearer ${token}`);\n    return fetch(path, { ...init, headers, cache: "no-store" });\n  };\n  let response = await request(false);\n  if (response.status === 401) response = await request(true);\n  if (!response.ok || !response.body) throw new Error("Realtime Aster-feed is niet beschikbaar.");\n  return response;\n}\n'''
          p.write_text(s)

          p=Path('web/lib/use-exchange-data.ts'); s=p.read_text()
          if 'authenticatedStream' in s: raise SystemExit('already patched')
          s=s.replace('import { authenticatedRequest } from "./cloud-client";','import { authenticatedRequest, authenticatedStream } from "./cloud-client";\nimport { applyAsterRealtimeMark, parseSseChunk } from "./aster-realtime.mjs";',1)
          anchor='  useEffect(() => {\n    if (!cloudReady) return;\n    refreshAll();\n'
          if s.count(anchor)!=1: raise SystemExit('use-exchange effect anchor missing')
          realtime='''  useEffect(() => {\n    if (!cloudReady || !uid) return;\n    const controller = new AbortController();\n    let stopped = false;\n    let retryMs = 1000;\n    const run = async () => {\n      while (!stopped) {\n        try {\n          const response = await authenticatedStream("/api/exchanges/aster/realtime", { signal: controller.signal });\n          const reader = response.body!.getReader();\n          const decoder = new TextDecoder();\n          let buffer = ""; retryMs = 1000;\n          while (!stopped) {\n            const { value, done } = await reader.read();\n            if (done) throw new Error("Realtime Aster-stream gesloten");\n            const parsed = parseSseChunk(buffer, decoder.decode(value, { stream: true }));\n            buffer = parsed.rest;\n            for (const event of parsed.events) {\n              if (!event || typeof event !== "object" || !("symbol" in event) || !("markPrice" in event)) continue;\n              setState((current) => {\n                if (current.uid !== uid) return current;\n                const previous = current.snapshots.aster;\n                if (!previous.data) return current;\n                const data = applyAsterRealtimeMark(previous.data, event) as Record<string, unknown>;\n                if (data === previous.data) return current;\n                return { ...current, snapshots: { ...current.snapshots, aster: { ...previous, data, updatedAt: Date.now() } } };\n              });\n            }\n          }\n        } catch (error) {\n          if (stopped || controller.signal.aborted) return;\n          console.warn("[TradeMentor Aster realtime] reconnect", error);\n          await new Promise((resolve) => window.setTimeout(resolve, retryMs));\n          retryMs = Math.min(15_000, retryMs * 2);\n        }\n      }\n    };\n    void run();\n    return () => { stopped = true; controller.abort(); };\n  }, [cloudReady, uid]);\n\n'''
          s=s.replace(anchor,realtime+anchor,1);p.write_text(s)
          PY
          mkdir -p web/app/api/exchanges/aster/realtime
          cat > web/app/api/exchanges/aster/realtime/route.ts <<'TS'
          import { NextRequest } from "next/server";

          export const dynamic = "force-dynamic";
          export const runtime = "nodejs";
          const CLOUD_API = process.env.TRADEMENTOR_CLOUD_API_URL || "https://tradementor-api-604335232956.europe-west4.run.app";

          export async function GET(request: NextRequest) {
            const authorization = request.headers.get("authorization");
            if (!authorization?.startsWith("Bearer ")) return new Response("Unauthorized", { status: 401 });
            const upstream = await fetch(`${CLOUD_API}/v1/me/aster/realtime/events`, {
              headers: { Authorization: authorization, Accept: "text/event-stream" },
              cache: "no-store",
              signal: request.signal,
            });
            if (!upstream.ok || !upstream.body) return new Response("Realtime feed unavailable", { status: upstream.status || 502 });
            return new Response(upstream.body, { status: 200, headers: {
              "Content-Type": "text/event-stream; charset=utf-8",
              "Cache-Control": "no-cache, no-transform",
              "X-Accel-Buffering": "no",
            }});
          }
          TS
      - name: Add regression tests
        shell: bash
        run: |
          cat >> cloud_api/test_aster_realtime.py <<'PY'

          def test_registry_symbols_for_tenant_isolated():
              registry=SymbolRegistry();registry.replace({"SOLUSDT":["a","b"],"BTCUSDT":["a"],"DOGEUSDT":["b"]})
              assert registry.symbols_for("a")== ("BTCUSDT","SOLUSDT")
              assert registry.symbols_for("b")== ("DOGEUSDT","SOLUSDT")
              assert registry.symbols_for("unknown")==()
          PY
          cat > web/tests/aster-realtime.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { applyAsterRealtimeMark, parseSseChunk } from "../lib/aster-realtime.mjs";

          test("live mark updates only matching position and recalculates PnL", () => {
            const source={positions:[{symbol:"SOLUSDT",side:"LONG",quantity:2,entryPrice:100,markPrice:100,unrealizedPnl:0},{symbol:"BTCUSDT",side:"SHORT",quantity:1,entryPrice:50,markPrice:50,unrealizedPnl:0}]};
            const out=applyAsterRealtimeMark(source,{symbol:"SOLUSDT",markPrice:103,receivedAtMs:10,transportLatencyMs:4});
            assert.equal(out.positions[0].markPrice,103);assert.equal(out.positions[0].unrealizedPnl,6);assert.equal(out.positions[0].notionalUsd,206);
            assert.equal(out.positions[1],source.positions[1]);assert.equal(out.unrealizedPnl,6);assert.equal(source.positions[0].markPrice,100);
          });
          test("short PnL uses inverse price direction",()=>{const out=applyAsterRealtimeMark({positions:[{symbol:"X",side:"SHORT",quantity:2,entryPrice:10}]},{symbol:"X",markPrice:8});assert.equal(out.positions[0].unrealizedPnl,4)});
          test("SSE parser preserves split frames",()=>{const a=parseSseChunk('', 'event: mark\ndata: {"symbol":"SOL');const b=parseSseChunk(a.rest,'USDT","markPrice":101}\n\n');assert.equal(b.events[0].symbol,'SOLUSDT');assert.equal(b.events[0].markPrice,101)});
          JS
      - name: Backend full tests
        working-directory: cloud_api
        run: |
          pip install -q -r requirements.txt pytest
          pytest -q
          python -m compileall -q .
      - name: Frontend full tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Commit tested integration
        shell: bash
        run: |
          git config user.name 'TradeMentor Realtime Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api web
          git diff --cached --check
          git commit -m 'feat: stream tenant-safe Aster marks to live UI'
          git push origin HEAD:amar-crypto-bot-2026-cloud
