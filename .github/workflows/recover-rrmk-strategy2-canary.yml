name: Inspect rrmk Strategy 2 recovery block

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/recover-rrmk-strategy2-canary.yml"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      EXECUTION_NAME: tm-s2-recover-139240-ftzgk
      JOB_NAME: tm-s2-recover-139240
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read exact Cloud Run execution logs
        shell: bash
        run: |
          set -euo pipefail
          LOGS="$RUNNER_TEMP/logs.json"
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB_NAME\"" \
            --project "$GCP_PROJECT_ID" --freshness 24h --limit 200 --order asc --format=json > "$LOGS"
          python - "$LOGS" "$EXECUTION_NAME" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8"))
          target=sys.argv[2]
          matched=[]
          for row in rows:
              raw=json.dumps(row,sort_keys=True,default=str)
              if target in raw:
                  matched.append(row)
                  payload=row.get("textPayload") or (row.get("jsonPayload") or {}).get("message") or raw
                  print(payload)
          print(f"EXECUTION_LOG_ROWS={len(matched)}")
          if not matched:
              raise SystemExit("RECOVERY_LOGS_NOT_FOUND")
          PY
