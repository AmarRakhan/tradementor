name: Inspect rrmk Strategy 2 recovery outcome

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/recover-rrmk-strategy2-canary.yml"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      JOB_NAME: tm-s2-recover-v2-199004
      EXECUTION_NAME: tm-s2-recover-v2-199004-tqrvl
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read exact recovery outcome
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB_NAME\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION_NAME\"" \
            --project "$GCP_PROJECT_ID" --freshness 24h --limit 100 --order asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)'
