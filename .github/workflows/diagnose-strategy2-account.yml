name: Diagnose one Strategy 2 account read-only

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/diagnose-strategy2-account.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read one account without exchange or order access
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-account-${GITHUB_RUN_ID: -6}"
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t SERVICE_VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json, sys
          service = json.load(open(sys.argv[1], encoding="utf-8"))
          spec = service["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"])
          print(spec["serviceAccountName"])
          PY
          )
          IMAGE="${SERVICE_VALUES[0]}"
          RUNTIME_SERVICE_ACCOUNT="${SERVICE_VALUES[1]}"
          test -n "$IMAGE"
          test -n "$RUNTIME_SERVICE_ACCOUNT"

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import os
          from datetime import datetime, timezone
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore

          project = "tradementor-amar-20260813"
          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={"projectId": "tradementor-production"})
          db = firestore.Client(project=project)
          candidates = []
          page = auth.list_users()
          while page:
              for candidate in page.users:
                  snapshot = db.collection("asterStrategy2").document(candidate.uid).get()
                  state = (snapshot.to_dict() or {}) if snapshot.exists else {}
                  configured = bool(state.get("settings") or state.get("ownedLegs") or state.get("exclusiveOwnership"))
                  if configured and bool(state.get("exclusiveOwnership")) and not bool(state.get("canaryValidated")):
                      candidates.append(candidate)
              page = page.get_next_page()
          if len(candidates) != 1:
              task_index = int(os.environ["CLOUD_RUN_TASK_INDEX"])
              raise SystemExit(min(len(candidates), 249) + 1 if task_index == 1 else 1)
          user = candidates[0]
          s2_snapshot = db.collection("asterStrategy2").document(user.uid).get()
          s2 = (s2_snapshot.to_dict() or {}) if s2_snapshot.exists else {}
          s1 = db.collection("asterAutomation").document(user.uid).get().to_dict() or {}
          s3 = db.collection("asterStrategy3").document(user.uid).get().to_dict() or {}

          def keys(state, strategy_ids, engines):
              result = set()
              for row in state.get("ownedLegs") if isinstance(state.get("ownedLegs"), list) else []:
                  if not isinstance(row, dict):
                      continue
                  strategy = str(row.get("strategy_id", row.get("strategyId", ""))).lower()
                  engine = str(row.get("engine_type", row.get("engineType", ""))).lower()
                  symbol = str(row.get("symbol", "")).upper()
                  side = str(row.get("side", "")).upper()
                  if strategy in strategy_ids and engine in engines and symbol and side in {"LONG", "SHORT"}:
                      result.add((symbol, side))
              return result

          s1_keys = keys(s1, {"aster-strategy-1", "strategy_1"}, {"strategy1", "strategy_1"})
          s2_keys = keys(s2, {"aster-strategy-2"}, {"strategy2"})
          s3_keys = keys(s3, {"aster-strategy-3"}, {"strategy3"})
          collisions = len((s1_keys & s2_keys) | (s1_keys & s3_keys) | (s2_keys & s3_keys))
          unassigned = int(s2.get("unassignedPositions", 0) or 0)
          legacy_active = int(bool(s1.get("monitor") or s1.get("enabled") or s3.get("monitor") or s3.get("enabled")))
          exclusive = int(bool(s2.get("exclusiveOwnership")))
          last_tick = s2.get("lastTickAt")
          if isinstance(last_tick, datetime):
              last_tick = last_tick.replace(tzinfo=timezone.utc) if last_tick.tzinfo is None else last_tick.astimezone(timezone.utc)
          heartbeat_fresh = int(bool(last_tick and 0 <= (datetime.now(timezone.utc) - last_tick).total_seconds() <= 180))
          phase = str(s2.get("phase", "")).upper()
          ownership_ok = int(bool(s2_snapshot.exists and exclusive and not unassigned and not collisions and not legacy_active and phase not in {"RECONCILING", "RECOVERY", "RECOVERING"}))
          canary = (
              db.collection("asterStrategy2").document(user.uid)
              .collection("canaries").document("open-fill-close-v1").get().to_dict() or {}
          )
          canary_status = str(canary.get("status", "")).upper()
          canary_status_codes = {"": 0, "OPENING": 1, "OPENED": 2, "UNKNOWN": 3, "REJECTED": 4, "COMPLETED": 5}
          metrics = [
              0,
              len(candidates),
              int(s2_snapshot.exists),
              int(bool(s2.get("canaryValidated"))),
              int(bool(s2.get("liveReady"))),
              int(bool(s2.get("enabled"))),
              int(bool(s2.get("monitor"))),
              exclusive,
              unassigned,
              collisions,
              legacy_active,
              canary_status_codes.get(canary_status, 9),
          ]
          index = int(os.environ["CLOUD_RUN_TASK_INDEX"])
          metric = metrics[index] if index < len(metrics) else 0
          raise SystemExit(min(max(int(metric), 0), 249) + 1)
          PY
          )"

          gcloud run jobs deploy "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --tasks 12 --parallelism 12 --max-retries 0 --task-timeout 120s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS_FIELDS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index: .index, exitCode: ([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          trap - EXIT
          printf 'ACCOUNT_STATUS_FIELDS %s\n' "$STATUS_FIELDS"
