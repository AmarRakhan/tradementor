name: Diagnose rrmk Strategy 2 canary read-only

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/diagnose-strategy2-canary-rrmk-read-only.yml"

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL: rrmk18@outlook.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect persisted canary and Aster evidence without writes
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-canary-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          service=json.load(open(sys.argv[1],encoding="utf-8"))
          spec=service["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"])
          print(spec["serviceAccountName"])
          PY
          )
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          from main import load_aster_secret, local_eip712_signer
          from aster_gateway import AsterV3Client

          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={"projectId":"tradementor-production"})
          user=auth.get_user_by_email(os.environ["TARGET_EMAIL"])
          db=firestore.Client(project="tradementor-amar-20260813")
          ref=db.collection("asterStrategy2").document(user.uid)
          state=ref.get().to_dict() or {}
          canary=ref.collection("canaries").document("open-fill-close-v1").get().to_dict() or {}
          status=str(canary.get("status","")).upper()
          status_codes={"":0,"OPENING":1,"OPENED":2,"UNKNOWN":3,"REJECTED":4,"COMPLETED":5}
          phase_codes={"":0,"RECONCILING":1,"CANARY_HOLD":2,"LIVE_READY":3,"RUNNING":4,"PAPER":5}
          symbol=str(canary.get("symbol","")).upper()
          prefix=str(canary.get("intentPrefix",""))
          started=canary.get("startedAt")
          if isinstance(started,datetime):
              started=started.replace(tzinfo=timezone.utc) if started.tzinfo is None else started.astimezone(timezone.utc)
          else:
              started=datetime.now(timezone.utc)-timedelta(hours=2)
          task=int(os.environ["CLOUD_RUN_TASK_INDEX"])
          metric=0
          if task==0: metric=status_codes.get(status,9)
          elif task==1: metric=int(bool(state.get("canaryValidated")))
          elif task==2: metric=int(bool(state.get("liveReady")))
          elif task==3: metric=phase_codes.get(str(state.get("phase","")).upper(),9)
          else:
              secret=load_aster_secret({"uid":user.uid})
              client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)
              if task==4:
                  metric=int(any(str(x.get("symbol","")).upper()==symbol and abs(float(x.get("positionAmt") or 0))>0 for x in client.position_risk(symbol or None)))
              elif task==5:
                  metric=int(any(str(x.get("symbol","")).upper()==symbol for x in client.open_orders(symbol or None)))
              else:
                  begin=int((started-timedelta(minutes=5)).timestamp()*1000)
                  orders=client.all_orders(symbol,start_time=begin,limit=1000) if symbol else []
                  evidence=[x for x in orders if prefix and str(x.get("clientOrderId",x.get("origClientOrderId",""))).startswith(prefix)]
                  if task==6: metric=min(len(evidence),249)
                  elif task==7: metric=min(sum(str(x.get("status","")).upper()=="FILLED" for x in evidence),249)
                  elif task==8: metric=min(sum(str(x.get("status","")).upper() in {"NEW","PARTIALLY_FILLED"} for x in evidence),249)
                  elif task==9: metric=int(bool(canary.get("error")))
          raise SystemExit(min(max(int(metric),0),249)+1)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "${VALUES[0]}" --service-account "${VALUES[1]}" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --set-env-vars "TARGET_EMAIL=$TARGET_EMAIL" --tasks 10 --parallelism 4             --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS_FIELDS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index:.index,exitCode:([.. | objects | .exitCode? | select(type=="number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          cleanup
          trap - EXIT
          printf 'RRMK_CANARY_FIELDS %s\n' "$STATUS_FIELDS"
          mkdir -p .github/diagnostics
          printf '%s\n' "$STATUS_FIELDS" > .github/diagnostics/rrmk-canary-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/rrmk-canary-result.json
          git commit -m 'diagnose: record rrmk canary read-only result'
          git push origin HEAD:amar-crypto-bot-2026-cloud
