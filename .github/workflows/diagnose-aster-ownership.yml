name: Diagnose Aster ownership counts read-only

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/aster-ownership-probe.trigger"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy3-live-api
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create, execute and remove isolated read-only diagnostic job
        shell: bash
        run: |
          JOB="tm-own-probe-${GITHUB_RUN_ID: -6}"
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t SERVICE_VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json, sys
          service = json.load(open(sys.argv[1], encoding="utf-8"))
          spec = service["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"])
          print(spec["serviceAccountName"])
          PY
          )
          IMAGE="${SERVICE_VALUES[0]}"
          RUNTIME_SERVICE_ACCOUNT="${SERVICE_VALUES[1]}"
          test -n "$IMAGE"
          test "$RUNTIME_SERVICE_ACCOUNT" = "tm-staging-runtime@tradementor-amar-20260813.iam.gserviceaccount.com"

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import json
          import os
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          from google.cloud import secretmanager

          db = firestore.Client(project="tradementor-amar-20260813")
          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={"projectId": "tradementor-amar-20260813"})
          secrets = secretmanager.SecretManagerServiceClient()
          uids = []
          page = auth.list_users()
          while page:
              for user in page.users:
                  name = f"projects/tradementor-amar-20260813/secrets/tradementor-aster-{user.uid}/versions/latest"
                  try:
                      secrets.access_secret_version(request={"name": name})
                  except Exception:
                      continue
                  uids.append(user.uid)
              page = page.get_next_page()
          if len(uids) != 4 or len(set(uids)) != 4:
              raise SystemExit(254)
          results = []
          for uid in sorted(uids):
              s2_snapshot = db.collection("asterStrategy2").document(uid).get()
              s3_snapshot = db.collection("asterStrategy3").document(uid).get()
              s1_snapshot = db.collection("asterAutomation").document(uid).get()
              s2 = (s2_snapshot.to_dict() or {}) if s2_snapshot.exists else {}
              s3 = (s3_snapshot.to_dict() or {}) if s3_snapshot.exists else {}
              s1 = (s1_snapshot.to_dict() or {}) if s1_snapshot.exists else {}

              def keys(state, strategy_ids, engines):
                  result = set()
                  rows = state.get("ownedLegs") if isinstance(state.get("ownedLegs"), list) else []
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      strategy = str(row.get("strategy_id", row.get("strategyId", ""))).lower()
                      engine = str(row.get("engine_type", row.get("engineType", ""))).lower()
                      symbol = str(row.get("symbol", "")).upper()
                      side = str(row.get("side", "")).upper()
                      if strategy in strategy_ids and engine in engines and symbol and side in {"LONG", "SHORT"}:
                          result.add((symbol, side))
                  return result, len(rows)

              s1_keys, s1_rows = keys(s1, {"aster-strategy-1", "strategy_1"}, {"strategy1", "strategy_1"})
              s2_keys, s2_rows = keys(s2, {"aster-strategy-2"}, {"strategy2"})
              s3_keys, s3_rows = keys(s3, {"aster-strategy-3"}, {"strategy3"})
              s2_account = s2.get("accountSnapshot") if isinstance(s2.get("accountSnapshot"), dict) else {}
              s3_account = s3.get("accountSnapshot") if isinstance(s3.get("accountSnapshot"), dict) else {}
              active_positions = max(
                  int(s2_account.get("accountActivePositions", s2_account.get("activePositions", 0)) or 0),
                  int(s3_account.get("accountActivePositions", s3_account.get("activePositions", 0)) or 0),
              )
              removals = list(
                  db.collection("asterStrategy2").document(uid).collection("audit")
                  .where("event", "==", "S2_SHADOW_OWNERSHIP_REMOVED").stream()
              )
              results.append({
                  "configured": int(bool(s2.get("settings") or s2.get("liveReady") or s2.get("canaryValidated") or s2.get("monitor") or s2.get("enabled") or s2.get("ownedLegs"))),
                  "strategy2DocumentExists": int(s2_snapshot.exists),
                  "strategy2Monitor": int(bool(s2.get("monitor"))),
                  "strategy2Enabled": int(bool(s2.get("enabled"))),
                  "legacyActive": int(bool(s1.get("monitor") or s1.get("enabled") or s3.get("monitor") or s3.get("enabled"))),
                  "phaseCategory": "OWNERSHIP_RECONCILING" if str(s2.get("phase", "")).upper() in {"RECONCILING", "RECOVERY", "RECOVERING"} else "OTHER",
                  "accountActivePositions": active_positions,
                  "reportedUnassignedPositions": int(s2.get("unassignedPositions", 0) or 0),
                  "strategy1Rows": s1_rows,
                  "strategy1ValidKeys": len(s1_keys),
                  "strategy2Rows": s2_rows,
                  "strategy2ValidKeys": len(s2_keys),
                  "strategy3Rows": s3_rows,
                  "strategy3ValidKeys": len(s3_keys),
                  "crossStrategyCollisions": len((s1_keys & s2_keys) | (s1_keys & s3_keys) | (s2_keys & s3_keys)),
                  "shadowRemovalEvents": len(removals),
              })
          metric_values = [
              len(results),
              sum(item["configured"] for item in results),
              sum(item["strategy2DocumentExists"] for item in results),
              sum(item["strategy2Monitor"] for item in results),
              sum(item["strategy2Enabled"] for item in results),
              sum(item["accountActivePositions"] for item in results),
              sum(item["reportedUnassignedPositions"] for item in results),
              sum(item["strategy2ValidKeys"] for item in results),
              sum(item["crossStrategyCollisions"] for item in results),
              sum(1 for item in results if item["phaseCategory"] == "OWNERSHIP_RECONCILING"),
              sum(item["legacyActive"] for item in results),
              sum(1 for item in results if item["accountActivePositions"] != item["strategy2ValidKeys"]),
          ]
          task_index = int(os.environ["CLOUD_RUN_TASK_INDEX"])
          metric = metric_values[task_index]
          if metric < 0 or metric > 249:
              raise SystemExit(254)
          raise SystemExit(metric + 1)
          PY
          )"

          gcloud run jobs deploy "$JOB"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --image "$IMAGE"             --service-account "$RUNTIME_SERVICE_ACCOUNT"             --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --tasks 12             --parallelism 12             --max-retries 0             --task-timeout 120s             --quiet
          set +e
          EXECUTE_OUTPUT="$(gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait 2>&1)"
          EXECUTE_RC=$?
          set -e
          test "$EXECUTE_RC" -ne 0
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          test -n "$EXECUTION"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS_FIELDS="$(jq -c '[.[] | {index: (.index // 0), exitCode: (.lastAttemptResult.exitCode // -1)}] | sort_by(.index)' <<<"$TASKS_JSON")"
          test -n "$STATUS_FIELDS"
          gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          trap - EXIT
          printf 'TASK_STATUS_FIELDS %s\n' "$STATUS_FIELDS"
