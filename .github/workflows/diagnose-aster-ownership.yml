name: Diagnose Aster ownership counts read-only

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/aster-ownership-probe.trigger"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: pip install google-cloud-firestore
      - name: Read aggregate ownership evidence only
        shell: python
        run: |
          from google.cloud import firestore

          db = firestore.Client(project="tradementor-amar-20260813")
          controls = list(db.collection("asterStrategy3").where("monitor", "==", True).stream())
          print("monitored_strategy3_documents", len(controls))
          for index, doc in enumerate(controls, 1):
              s3 = doc.to_dict() or {}
              s2_snapshot = db.collection("asterStrategy2").document(doc.id).get()
              s1_snapshot = db.collection("asterAutomation").document(doc.id).get()
              s2 = (s2_snapshot.to_dict() or {}) if s2_snapshot.exists else {}
              s1 = (s1_snapshot.to_dict() or {}) if s1_snapshot.exists else {}

              def keys(state, strategy_ids, engines):
                  result = set()
                  rows = state.get("ownedLegs") if isinstance(state.get("ownedLegs"), list) else []
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      strategy = str(row.get("strategy_id", row.get("strategyId", ""))).lower()
                      engine = str(row.get("engine_type", row.get("engineType", ""))).lower()
                      symbol = str(row.get("symbol", "")).upper()
                      side = str(row.get("side", "")).upper()
                      if strategy in strategy_ids and engine in engines and symbol and side in {"LONG", "SHORT"}:
                          result.add((symbol, side))
                  return result, len(rows)

              s1_keys, s1_rows = keys(s1, {"aster-strategy-1", "strategy_1"}, {"strategy1", "strategy_1"})
              s2_keys, s2_rows = keys(s2, {"aster-strategy-2"}, {"strategy2"})
              s3_keys, s3_rows = keys(s3, {"aster-strategy-3"}, {"strategy3"})
              snapshot = s3.get("accountSnapshot") if isinstance(s3.get("accountSnapshot"), dict) else {}
              print("record", index, {
                  "phase": str(s3.get("phase", "")),
                  "reasonCategory": "OWNERSHIP_UNKNOWN" if int(s3.get("unassignedPositions", 0) or 0) else "NONE",
                  "accountActivePositions": int(snapshot.get("accountActivePositions", 0) or 0),
                  "reportedUnassignedPositions": int(s3.get("unassignedPositions", 0) or 0),
                  "strategy1Rows": s1_rows,
                  "strategy1ValidKeys": len(s1_keys),
                  "strategy2Rows": s2_rows,
                  "strategy2ValidKeys": len(s2_keys),
                  "strategy3Rows": s3_rows,
                  "strategy3ValidKeys": len(s3_keys),
                  "crossStrategyCollisions": len((s1_keys & s2_keys) | (s1_keys & s3_keys) | (s2_keys & s3_keys)),
              })
