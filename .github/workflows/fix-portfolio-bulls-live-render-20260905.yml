name: Fix Portfolio Bulls Live Render 20260905

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - .github/fix-portfolio-bulls-live-render-20260905.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply live render repair
        run: python tools/fix_portfolio_bulls_live_render_20260905.py
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run regression suite
        working-directory: web
        run: npm test
      - name: Verify render contract
        working-directory: web
        shell: bash
        run: |
          grep -q "portfolio-impact-bulls.svg?v=2" components/portfolio-impact-battle.module.css
          ! grep -q "animation:sparkSpin 8s linear infinite" components/portfolio-impact-battle.module.css
          test -s public/portfolio-impact-bulls.svg
      - name: Commit live repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/portfolio-impact-battle.module.css
          git commit -m "Fix live Portfolio Impact bull render and stop endless spark spin"
          git push origin HEAD:amar-crypto-bot-2026-cloud
