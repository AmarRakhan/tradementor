name: Realtime Architecture Inspect

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/realtime-architecture-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect realtime integration points
        shell: bash
        run: |
          echo '=== ASTER ROUTES ==='
          grep -nE 'aster-automation|strategy2.*tick|tick.*strategy2|internal/aster|run_focus_live_step' cloud_api/main.py | head -140 || true
          echo '=== FRONTEND SNAPSHOT FILES ==='
          grep -RnlE 'fetchAsterSnapshot|loadAsterSnapshot|refreshAster|useExchangeSnapshots' web --exclude-dir=node_modules | head -80 || true
          echo '=== FRONTEND REFRESH / PUSH ==='
          grep -RniE 'fetchAsterSnapshot|setInterval|setTimeout|EventSource|WebSocket|useEffect|onRefresh' web/app web/components web/lib --exclude-dir=node_modules | head -260 || true
          echo '=== PACKAGE ==='
          cat web/package.json || true
          echo '=== API ROUTES ==='
          find web/app/api -type f -maxdepth 6 -print 2>/dev/null | sort | head -100 || true
          echo '=== CLOUD CLIENT ==='
          sed -n '1,240p' web/lib/cloud-client.ts || true
          echo '=== MAIN APP TOP/REFRESH ==='
          sed -n '1,220p' web/app/page.tsx || true
