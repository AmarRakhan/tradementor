name: Release V46 build 380 fixed position size

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/release-fixed-position-size-20260920.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-fixed-position-size-20260920
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TARGET_BRANCH: amar-crypto-bot-2026-cloud
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - name: Configure release committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply backend fixed-position-size patch
        run: python .github/scripts/apply_fixed_position_size_backend_20260920.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Run complete backend test suite
        run: |
          pip install -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q

      - name: Commit and push tested backend
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          git add cloud_api/aster_multi_bb.py cloud_api/main.py cloud_api/test_fixed_position_size.py
          if git diff --cached --quiet; then
            echo "Backend patch is already present; using current HEAD."
          else
            git commit -m "Backend: add optional fixed position-size entry sizing"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact tested backend to production
        shell: bash
        env:
          BACKEND_SHA: ${{ steps.backend.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloud-production.yml             --repo "$GITHUB_REPOSITORY"             --ref "$TARGET_BRANCH"             -f confirmation=DEPLOY_PRODUCTION_BACKEND             -f source_commit="$BACKEND_SHA"             -f request_issue=""

      - name: Wait for verified backend production deployment
        shell: bash
        env:
          BACKEND_SHA: ${{ steps.backend.outputs.sha }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cloud-production.yml/runs?branch=$TARGET_BRANCH&event=workflow_dispatch&per_page=30"               --jq ".workflow_runs[] | select(.head_sha==\"$BACKEND_SHA\") | .id" | head -1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"
          echo "BACKEND_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Apply web build 380 patch after backend is live
        run: python .github/scripts/apply_fixed_position_size_web_20260920.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run complete web build and regression suite
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Commit and push V46 build 380
        id: web
        shell: bash
        run: |
          set -euo pipefail
          git add web/components/aster-strategy2-maker.tsx             web/app/api/exchanges/aster/strategy2/settings/route.ts             web/tests/bot-settings-premium-maxlev-stoploss.test.mjs             web/lib/app-version.ts web/lib/release-history.ts
          if git diff --cached --quiet; then
            test "$(sed -n 's/^export const WEBAPP_BUILD_NUMBER = "\([0-9][0-9]*\)";/\1/p' web/lib/app-version.ts)" = "380"
          else
            git commit -m "V46 build 380: add optional fixed position size"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for verified V46 build 380 web deployment
        shell: bash
        env:
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-shared-v44-testapp.yml/runs?branch=$TARGET_BRANCH&event=push&per_page=30"               --jq ".workflow_runs[] | select(.head_sha==\"$WEB_SHA\") | .id" | head -1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"
          echo "WEB_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Publish release proof
        shell: bash
        env:
          BACKEND_SHA: ${{ steps.backend.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          {
            echo "RELEASE_FIXED_POSITION_SIZE_SUCCESS"
            echo "backend_sha=$BACKEND_SHA"
            echo "backend_run=$BACKEND_RUN_ID"
            echo "web_sha=$WEB_SHA"
            echo "web_run=$WEB_RUN_ID"
            echo "web_build=380"
          }
