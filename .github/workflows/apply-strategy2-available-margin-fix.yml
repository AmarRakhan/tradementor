name: Apply Strategy 2 available-margin fix
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/apply-strategy2-available-margin-fix.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d | git apply --check
          echo "$PATCH_B64" | base64 -d | git apply
          pip install -q -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q test_aster_strategy2_runtime.py test_aster_state.py test_aster_strategy2_execution.py
          python -m py_compile aster_strategy2.py aster_strategy2_runtime.py aster_state.py main.py
      - run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add cloud_api
          git commit -m "fix(strategy2): use Aster available margin for entries"
          git push origin HEAD:amar-crypto-bot-2026-cloud
