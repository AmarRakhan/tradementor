name: Apply strict SHORT requires LONG 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/apply-short-requires-long-strict-20260917.yml'
      - 'tools/repair_short_requires_long_strict_20260917.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: short-requires-long-strict-20260917
  cancel-in-progress: false

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply strict same-pair LONG gate repair
        run: python tools/repair_short_requires_long_strict_20260917.py

      - name: Install backend test dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run strict pairing and Multi DCA regressions
        working-directory: cloud_api
        run: python -m pytest -q test_short_requires_long_pairing_20260917.py test_same_symbol_dual_side_20260906.py test_aster_bollinger_entry_filter_seat_flow.py test_aster_side_settings_persistence.py test_aster_multi_bb.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web regression
        working-directory: web
        run: npm run build

      - name: Commit verified strict implementation
        run: |
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_short_requires_long_pairing_20260917.py
          if git diff --cached --quiet; then
            echo 'No strict implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Enforce strict same-pair LONG before new SHORT'
          git push origin HEAD:amar-crypto-bot-2026-cloud
