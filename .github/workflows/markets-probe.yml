name: Markets probe (alleen lezen, publieke Aster-data)
on:
  push:
    branches: [claude/markets-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe-out
          a=$(curl -sS -m 30 -w '%{http_code}' https://fapi.asterdex.com/fapi/v1/exchangeInfo -o probe-out/exchangeInfo.json || echo fail)
          b=$(curl -sS -m 30 -w '%{http_code}' https://fapi.asterdex.com/fapi/v1/ticker/24hr -o probe-out/ticker24h.json || echo fail)
          echo "::notice::exchangeInfo=$a ticker=$b sizes=$(wc -c probe-out/* | tr '\n' ' ')"
          git config user.name "markets-probe"; git config user.email "noreply@anthropic.com"
          mv probe-out /tmp/probe-out; git checkout --orphan claude/markets-probe-data; git rm -rqf .; mv /tmp/probe-out probe-out
          git add probe-out && git commit -qm "Publieke Aster-data voor Markets-ontwerp [skip ci]"
          git push -f origin claude/markets-probe-data 2>&1 | tail -3 | tr '\n' ' ' | sed 's/^/::notice::push /'
