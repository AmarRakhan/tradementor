name: Markets probe (alleen lezen, publieke Aster-data)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir out
          curl -sS -m 30 https://fapi.asterdex.com/fapi/v1/exchangeInfo -o out/exchangeInfo.json
          curl -sS -m 30 https://fapi.asterdex.com/fapi/v1/ticker/24hr -o out/ticker24h.json
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: aster-public
          path: out/
