name: Apply SHORT requires LONG pairing 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/short-requires-long-20260917.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: short-requires-long-20260917
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply SHORT requires LONG patch
        run: |
          set +e
          python tools/apply_short_requires_long_pairing_20260917.py > /tmp/short-pairing-patch.log 2>&1
          status=$?
          cat /tmp/short-pairing-patch.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/short-pairing-patch.log .github/short-pairing-patch-error.txt
            git config user.name 'TradeMentor Agent'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/short-pairing-patch-error.txt
            git commit -m 'Record SHORT pairing patch diagnostic'
            git push origin HEAD:amar-crypto-bot-2026-cloud
            exit "$status"
          fi

      - name: Install backend test dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run pairing and Multi DCA regressions
        working-directory: cloud_api
        run: python -m pytest -q test_short_requires_long_pairing_20260917.py test_same_symbol_dual_side_20260906.py test_aster_bollinger_entry_filter_seat_flow.py test_aster_side_settings_persistence.py test_aster_multi_bb.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_short_requires_long_pairing_20260917.py web/components/aster-strategy2-maker.tsx
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Add optional SHORT requires LONG pairing gate'
          git push origin HEAD:amar-crypto-bot-2026-cloud
