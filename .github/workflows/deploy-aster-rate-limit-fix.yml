name: Deploy Aster rate-limit fix without runtime changes

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/aster-rate-limit-fix.trigger"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-aster-rate-limit-fix
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Verify rate-limit guard and run all backend tests
        shell: bash
        run: |
          grep -q "class AsterRestGuard" cloud_api/aster_gateway.py
          grep -q "PUBLIC_EXCHANGE_INFO_TTL_SECONDS" cloud_api/aster_gateway.py
          cd cloud_api
          pytest -q

  deploy-production-api:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: tradementor-production
      GCP_REGION: europe-west4
      ARTIFACT_REPOSITORY: tradementor
      CLOUD_RUN_SERVICE: tradementor-api
      WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
      DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Capture service configuration and IAM
        shell: bash
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
      - name: Build and push exact source image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:$GITHUB_SHA"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy candidate without traffic
        shell: bash
        run: |
          TAG="rate-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --no-traffic --tag "$TAG"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/after.json"
          python - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          before, after = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:3])
          before_spec = before["spec"]["template"]["spec"]
          after_spec = after["spec"]["template"]["spec"]
          assert before_spec.get("serviceAccountName") == after_spec.get("serviceAccountName")
          assert before_spec.get("timeoutSeconds") == after_spec.get("timeoutSeconds")
          assert before_spec.get("containerConcurrency") == after_spec.get("containerConcurrency")
          assert before_spec["containers"][0].get("env", []) == after_spec["containers"][0].get("env", [])
          candidate = next(row for row in after["status"]["traffic"] if row.get("tag") == sys.argv[3])
          print(f'CANDIDATE_URL={candidate["url"]}')
          print(f'CANDIDATE_REVISION={candidate["revisionName"]}')
          PY
      - name: Verify and promote candidate
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$CANDIDATE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json, sys
          assert json.loads(sys.argv[1])["status"] == "ready"
          PY
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$CANDIDATE_REVISION=100"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$SERVICE_URL/health" >/dev/null
      - name: Verify IAM unchanged
        shell: bash
        run: |
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json, sys
          assert json.load(open(sys.argv[1], encoding="utf-8")) == json.load(open(sys.argv[2], encoding="utf-8"))
          PY

  deploy-strategy3-api:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      ARTIFACT_REPOSITORY: tradementor
      CLOUD_RUN_SERVICE: tradementor-strategy3-live-api
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Capture service configuration and IAM
        shell: bash
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
      - name: Build and push exact source image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/strategy3-live-api:$GITHUB_SHA"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy candidate without traffic
        shell: bash
        run: |
          TAG="rate-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --no-traffic --tag "$TAG"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/after.json"
          python - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          before, after = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:3])
          before_spec = before["spec"]["template"]["spec"]
          after_spec = after["spec"]["template"]["spec"]
          assert before_spec.get("serviceAccountName") == after_spec.get("serviceAccountName")
          assert before_spec.get("timeoutSeconds") == after_spec.get("timeoutSeconds")
          assert before_spec.get("containerConcurrency") == after_spec.get("containerConcurrency")
          assert before_spec["containers"][0].get("env", []) == after_spec["containers"][0].get("env", [])
          candidate = next(row for row in after["status"]["traffic"] if row.get("tag") == sys.argv[3])
          print(f'CANDIDATE_URL={candidate["url"]}')
          print(f'CANDIDATE_REVISION={candidate["revisionName"]}')
          PY
      - name: Verify Strategy 3 boundary and promote candidate
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$CANDIDATE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json, sys
          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["environment"] == "strategy3-live"
          assert health["dataProject"] == "tradementor-amar-20260813"
          PY
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$CANDIDATE_REVISION=100"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$SERVICE_URL/health" >/dev/null
      - name: Verify IAM unchanged
        shell: bash
        run: |
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json, sys
          assert json.load(open(sys.argv[1], encoding="utf-8")) == json.load(open(sys.argv[2], encoding="utf-8"))
          PY
