name: Probe Production Strategy 2 State

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/probe-production-strategy2-state.yml]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read Strategy 2 state through isolated runtime identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_S2_STATE_PROBE STARTED commit=$GITHUB_SHA"

          PROD_REVISION="$(gcloud run services describe tradementor-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          PROD_IMAGE="$(gcloud run revisions describe "$PROD_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.containers[0].image)')"
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_RUNTIME revision=$PROD_REVISION image=$PROD_IMAGE"

          RUNTIME_SA="$(gcloud run services describe tradementor-strategy2-recovery-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          IMAGE="$(gcloud run services describe tradementor-strategy2-recovery-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
          JOB="tm-s2-state-${GITHUB_RUN_ID: -6}"
          SCRIPT_B64="$(base64 -w0 <<'PY'
          from google.cloud import firestore
          import os
          db=firestore.Client(project='tradementor-production')
          def states(name):
              return [(d.to_dict() or {}) for d in db.collection(name).stream()]
          s2=states('asterStrategy2'); s1=states('asterAutomation'); s3=states('asterStrategy3')
          def active(x):
              return bool(x.get('enabled') or x.get('monitor'))
          def focus_enabled(x):
              return bool(x.get('focusV2Enabled') or x.get('focus_v2_enabled'))
          def simple_enabled(x):
              return bool(x.get('focusV2SimpleModeEnabled') or x.get('focus_v2_simple_mode_enabled'))
          def has_cycle(x):
              st=x.get('focusV2State') or {}
              return bool(isinstance(st,dict) and st.get('cycleId'))
          metrics=[
              len(s2),
              sum(1 for x in s2 if active(x)),
              sum(len(x.get('ownedLegs') or []) for x in s2),
              sum(1 for x in s2 if x.get('liveReady')),
              sum(1 for x in s2 if x.get('canaryValidated')),
              sum(1 for x in s1 if active(x)),
              sum(1 for x in s3 if active(x)),
              sum(1 for x in s2 if x.get('monitor')),
              sum(1 for x in s2 if focus_enabled(x)),
              sum(1 for x in s2 if simple_enabled(x)),
              sum(1 for x in s2 if active(x) and focus_enabled(x) and simple_enabled(x)),
              sum(1 for x in s2 if active(x) and focus_enabled(x) and simple_enabled(x) and has_cycle(x)),
          ]
          i=int(os.environ['CLOUD_RUN_TASK_INDEX'])
          raise SystemExit(min(max(int(metrics[i]),0),249)+1)
          PY
          )"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          set +e
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --service-account "$RUNTIME_SA" --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" --tasks 12 --parallelism 12 --max-retries 0 --task-timeout 120s --quiet > /tmp/deploy.out 2> /tmp/deploy.err
          DEPLOY_RC=$?
          set -e
          if [ "$DEPLOY_RC" -ne 0 ]; then
            ERR="$(tr '\n' ' ' < /tmp/deploy.err | head -c 600)"
            gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_S2_STATE_PROBE DEPLOY_FAILED rc=$DEPLOY_RC err=$ERR"
            exit 0
          fi
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/tmp/execute.out 2>/tmp/execute.err
          EXECUTE_RC=$?
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS_FIELDS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index: .index, exitCode: ([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          METRICS="$(python - "$STATUS_FIELDS" <<'PY'
          import json,sys
          rows=json.loads(sys.argv[1]); values={int(r['index']):max(0,int(r['exitCode'])-1) for r in rows if int(r.get('exitCode',-1))>=1}
          names=['documents','active','ownedLegs','liveReady','canaryValidated','legacyStrategy1Active','legacyStrategy3Active','monitoring','focusV2Enabled','simpleModeEnabled','activeFocusSimple','activeFocusSimpleWithCycle']
          print(','.join(f'{names[i]}={values.get(i,-1)}' for i in range(len(names))))
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_S2_STATE execute_rc=$EXECUTE_RC $METRICS"
          cleanup
          trap - EXIT
