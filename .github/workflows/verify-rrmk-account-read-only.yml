name: Verify rrmk Strategy 2 account read-only

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/verify-rrmk-account-read-only.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL: rrmk18@outlook.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify state and exchange truth without writes
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-account-check-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image' "$SERVICE_JSON")"
          RUNTIME_SERVICE_ACCOUNT="$(jq -r '.spec.template.spec.serviceAccountName' "$SERVICE_JSON")"
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import json, os
          from datetime import datetime, timezone
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          from main import load_aster_secret, local_eip712_signer
          from aster_gateway import AsterV3Client

          app=firebase_admin.initialize_app(options={"projectId":"tradementor-production"},name="rrmk-account-check")
          user=auth.get_user_by_email(os.environ["TARGET_EMAIL"],app=app)
          db=firestore.Client(project="tradementor-amar-20260813")
          ref=db.collection("asterStrategy2").document(user.uid)
          state=ref.get().to_dict() or {}
          settings=state.get("settings") if isinstance(state.get("settings"),dict) else {}
          s1=db.collection("asterAutomation").document(user.uid).get().to_dict() or {}
          s3=db.collection("asterStrategy3").document(user.uid).get().to_dict() or {}
          secret=load_aster_secret({"uid":user.uid})
          client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)
          positions=client.position_risk()
          orders=client.open_orders()
          active=[p for p in positions if abs(float(p.get("positionAmt") or 0))>0]
          longs=sum(1 for p in active if str(p.get("positionSide","")).upper()=="LONG")
          shorts=sum(1 for p in active if str(p.get("positionSide","")).upper()=="SHORT")
          owned=state.get("ownedLegs") if isinstance(state.get("ownedLegs"),list) else []
          last=state.get("lastTickAt")
          age=None
          if isinstance(last,datetime):
              stamp=last.replace(tzinfo=timezone.utc) if last.tzinfo is None else last.astimezone(timezone.utc)
              age=max(0,int((datetime.now(timezone.utc)-stamp).total_seconds()))
          out={
            "mode":settings.get("mode"),"target":settings.get("maximumPairs"),
            "enabled":bool(state.get("enabled")),"monitor":bool(state.get("monitor")),
            "phase":str(state.get("phase","")),"lastReason":str(state.get("lastReason","")),
            "heartbeatAgeSeconds":age,"liveReady":bool(state.get("liveReady")),
            "canaryValidated":bool(state.get("canaryValidated")),
            "exclusiveOwnership":bool(state.get("exclusiveOwnership")),
            "ownedLegs":len(owned),"unassignedPositions":int(state.get("unassignedPositions",0) or 0),
            "exchangePositions":len(active),"long":longs,"short":shorts,"openOrders":len(orders),
            "legacyStrategy1Active":bool(s1.get("enabled") or s1.get("monitor")),
            "strategy3Active":bool(s3.get("enabled") or s3.get("monitor")),
            "readOnly":True,"ordersSent":0,"stateWrites":0
          }
          print("RRMK_ACCOUNT_CHECK "+json.dumps(out,separators=(",",":"),ensure_ascii=True))
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE"             --service-account "$RUNTIME_SERVICE_ACCOUNT" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --set-env-vars "TARGET_EMAIL=$TARGET_EMAIL,GOOGLE_CLOUD_QUOTA_PROJECT=tradementor-production,GOOGLE_CLOUD_PROJECT=tradementor-amar-20260813"             --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB AND textPayload:\"RRMK_ACCOUNT_CHECK\""             --project "$GCP_PROJECT_ID" --freshness 15m --limit 5 --format='value(textPayload)'
