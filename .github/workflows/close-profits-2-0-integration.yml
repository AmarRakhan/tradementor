name: Close Profits 2.0 integration (isolated, no secrets, no orders)
# Test-only. Runs ONLY on the Close Profits 2.0 review branch (and manually). No secrets, no id-token, no deploy,
# no Aster access, no production Firebase project: Firestore is the local emulator (project close-profits-test-only).
on:
  push:
    branches: [review/close-profits-2-0-minimal-20261021, claude/close-profits-2-0-ci-gate]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: close-profits-2-0-integration-${{ github.ref }}
  # never cancel: a cancelled run is no evidence (dispatch + rerun used to cancel each other)
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: close-profits-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies (real fastapi, httpx, firestore client)
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Close Profits model tests with REAL dependencies
        working-directory: cloud_api
        run: ../tools/ci_report.sh "backend model tests (real deps)" 40 python -m unittest -v test_close_profits_2_0_integration test_close_profits_2_0_round6
      - name: Full backend regression (same as Cloud Backend CI; gated against baseline in verdict)
        working-directory: cloud_api
        continue-on-error: true
        run: ../tools/ci_report.sh "backend full pytest" 60 pytest -q -rfE -p no:cacheprovider --junitxml="$RUNNER_TEMP/backend.xml"
      - name: Record failing backend test ids
        if: always()
        run: mkdir -p ci-out && python3 tools/ci_failures.py ci-out/backend.txt "$RUNNER_TEMP/backend.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-candidate-backend
          path: ci-out/backend.txt
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: close-profits-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator and backend dependencies
        run: |
          npm install --no-save firebase-tools@14.21.0
          pip install -r cloud_api/requirements.txt
      - name: Same scenarios on the REAL Firestore emulator (transactions, leases, AlreadyExists)
        run: |
          printf '%s\n' '{"emulators":{"firestore":{"host":"127.0.0.1","port":8080}}}' > /tmp/cp20-firebase.json
          tools/ci_report.sh "firestore emulator tests" 60 npx firebase emulators:exec --config /tmp/cp20-firebase.json --only firestore --project close-profits-test-only \
            'cd cloud_api && python -m unittest -v test_close_profits_2_0_firestore_emulator'
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: TypeScript typecheck (normalised error set for comparison with baseline)
        working-directory: web
        continue-on-error: true
        run: ../tools/ci_report.sh "typescript errors (normalised)" 400 bash -c "npx tsc --noEmit -p tsconfig.json | sed -E 's/\\([0-9]+,[0-9]+\\)//' | sort | uniq -c | sort -rn; exit \${PIPESTATUS[0]}"
      - name: Production build
        working-directory: web
        run: ../tools/ci_report.sh "next production build" 30 npm run build
      - name: Close Profits web tests (handlers, scope, frontend -> real Next proxy code -> backend)
        working-directory: web
        run: |
          pip install -r ../cloud_api/requirements.txt
          ../tools/ci_report.sh "web close-profits tests" 25 node --test tests/aster-close-profits-*.test.mjs tests/aster-close-profitable.test.mjs
      - name: Full web test suite (gated against baseline in verdict)
        working-directory: web
        continue-on-error: true
        run: ../tools/ci_report.sh "web full suite" 40 node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/web.xml" tests/*.test.mjs
      - name: Record failing web test ids
        if: always()
        run: mkdir -p ci-out && python3 tools/ci_failures.py ci-out/web.txt "$RUNNER_TEMP/web.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-candidate-web
          path: ci-out/web.txt
  baseline:
    # Same checks on the original PR head and on the production-601 base, to separate pre-existing failures.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ref: [f8cd2af5f76c6b240bd49c87deedbbe8622ef4ea, e035431eca681586ae3e0d19e34ebe8722e6992d]
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools_src
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baseline backend pytest
        working-directory: base/cloud_api
        run: |
          pip install -r requirements.txt pytest
          ../../tools_src/tools/ci_report.sh "BASELINE ${{ matrix.ref }} backend pytest" 40 pytest -q -rfE -p no:cacheprovider --junitxml="$RUNNER_TEMP/backend.xml"
        continue-on-error: true
      - name: Baseline TypeScript errors (normalised)
        working-directory: base/web
        continue-on-error: true
        run: |
          npm ci
          ../../tools_src/tools/ci_report.sh "BASELINE ${{ matrix.ref }} typescript errors (normalised)" 400 bash -c "npx tsc --noEmit -p tsconfig.json | sed -E 's/\\([0-9]+,[0-9]+\\)//' | sort | uniq -c | sort -rn; exit \${PIPESTATUS[0]}"
      - name: Baseline web tests
        working-directory: base/web
        continue-on-error: true
        run: |
          pip install -r ../cloud_api/requirements.txt
          ../../tools_src/tools/ci_report.sh "BASELINE ${{ matrix.ref }} web node tests" 30 node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/web.xml" tests/*.test.mjs
      - name: Record failing baseline test ids
        if: always()
        run: |
          mkdir -p ci-out
          python3 tools_src/tools/ci_failures.py ci-out/backend.txt "$RUNNER_TEMP/backend.xml"
          python3 tools_src/tools/ci_failures.py ci-out/web.txt "$RUNNER_TEMP/web.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-baseline-${{ matrix.ref }}
          path: ci-out/
  verdict:
    # One verdict: Close Profits steps must pass, and the full suites may not add failures that the production
    # base (e035431) does not already have. Pre-existing failures are reported, never silently accepted as passes.
    if: always()
    needs: [backend, firestore-emulator, web, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: e035431eca681586ae3e0d19e34ebe8722e6992d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Compare candidate failures with production base
        env:
          R_BACKEND: ${{ needs.backend.result }}
          R_EMULATOR: ${{ needs.firestore-emulator.result }}
          R_WEB: ${{ needs.web.result }}
        run: |
          # GitHub runs bash with -e; counting zero matches must not abort the verdict
          set +e -u; export LC_ALL=C
          fail=0; report=""
          for j in BACKEND EMULATOR WEB; do v="R_$j"; report+="job ${j}: ${!v}"$'\n'; [ "${!v}" = success ] || fail=1; done
          for suite in backend web; do
            cand="art/failures-candidate-${suite}/${suite}.txt"; base="art/failures-baseline-${BASE}/${suite}.txt"
            if [ ! -f "$cand" ] || [ ! -f "$base" ]; then report+="${suite}: report missing -> FAIL"$'\n'; fail=1; continue; fi
            if grep -q '^__REPORT_MISSING__' "$cand"; then report+="${suite}: candidate run produced no report -> FAIL"$'\n'; fail=1; fi
            new="$(comm -23 "$cand" "$base")"; fixed="$(comm -13 "$cand" "$base")"; old="$(comm -12 "$cand" "$base")"
            report+="${suite}: new=$(printf '%s' "$new" | grep -c .) pre-existing=$(printf '%s' "$old" | grep -c .) fixed=$(printf '%s' "$fixed" | grep -c .)"$'\n'
            [ -n "$new" ] && { report+="  NEW FAILURES:"$'\n'"$(printf '%s\n' "$new" | sed 's/^/    /')"$'\n'; fail=1; }
            [ -n "$old" ] && report+="  pre-existing (also on ${BASE:0:7}):"$'\n'"$(printf '%s\n' "$old" | sed 's/^/    /')"$'\n'
          done
          verdict=$([ "$fail" = 0 ] && echo PASS || echo FAIL)
          report="VERDICT ${verdict}"$'\n'"${report}"
          printf '%s\n' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          enc="${report//'%'/'%25'}"; enc="${enc//$'\n'/'%0A'}"
          echo "::notice title=CLOSE PROFITS 2.0 VERDICT ${verdict}::${enc:0:3000}"
          exit "$fail"
