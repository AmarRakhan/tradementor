name: Focus Final Integration
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.focus-patch-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - name: Integrate Focus shadow endpoint and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          main=Path('cloud_api/main.py')
          text=main.read_text()
          import_anchor='from aster_strategy2_queue import MAX_ORDERS_PER_ACCOUNT_SCAN, QUEUE_FEATURE_FLAG\n'
          import_line='from aster_strategy2_focus_adapter import build_focus_shadow_report\n'
          if import_line not in text:
              if import_anchor not in text: raise SystemExit('main import anchor not found')
              text=text.replace(import_anchor, import_anchor+import_line, 1)
          route='''\n\n@app.get("/v1/me/aster/strategy2/focus/shadow")\ndef strategy2_focus_shadow(user:dict[str,Any]=Depends(authenticated_user))->dict[str,Any]:\n    """Evaluate one Focus scan against fresh Aster data without an order-capable execution path."""\n    uid=str(user["uid"]);raw=aster_strategy2_reference(uid).get().to_dict() or {}\n    settings=Strategy2Config.from_mapping(raw.get("settings"))\n    if settings.trading_mode!="focus" or not settings.focus_shadow_enabled:\n        return {"readOnly":True,"ordersSent":0,"wouldSendCount":0,"reason":"Focus Shadow staat uit"}\n    secret=load_aster_secret(user)\n    client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)\n    try:\n        report=build_focus_shadow_report(client=client,raw_state=raw,timestamp_ms=int(time.time()*1000))\n    except (AsterApiError,AsterValidationError,KeyError,TypeError,ValueError) as exc:\n        return {"readOnly":True,"ordersSent":0,"wouldSendCount":0,"reason":f"Focus Shadow fail-closed: {exc}"}\n    report["ordersSent"]=0\n    report["readOnly"]=True\n    return report\n'''
          route_anchor='\n\n@app.get("/v1/me/aster/strategy2/money-grabber/shadow")\n'
          if '/v1/me/aster/strategy2/focus/shadow' not in text:
              if route_anchor not in text: raise SystemExit('main route anchor not found')
              text=text.replace(route_anchor, route+route_anchor, 1)
          main.write_text(text)

          maker=Path('web/components/aster-strategy2-maker.tsx')
          text=maker.read_text()
          maker_import='import { AsterStrategy2FocusShadow } from "@/components/aster-strategy2-focus-shadow";\n'
          import_anchor='import { focusExposurePreview,focusStartNotional,MAX_FOCUS_DCA } from "@/lib/strategy2-focus";\n'
          if maker_import not in text:
              if import_anchor not in text: raise SystemExit('maker import anchor not found')
              text=text.replace(import_anchor, import_anchor+maker_import, 1)
          render_anchor='}<div className="strategy-message"><b>Nieuwe instappen:</b>'
          render='}{v.tradingMode==="focus"&&<AsterStrategy2FocusShadow enabled={v.focusShadow} manualPair={v.focusPair} onSelect={symbol=>setV({...v,focusPair:symbol,focusSelection:"manual"})}/>}<div className="strategy-message"><b>Nieuwe instappen:</b>'
          if 'AsterStrategy2FocusShadow enabled=' not in text:
              if render_anchor not in text: raise SystemExit('maker render anchor not found')
              text=text.replace(render_anchor, render, 1)
          maker.write_text(text)
          PY
      - name: Verify Focus integration contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('cloud_api/main.py').read_text()
          maker=Path('web/components/aster-strategy2-maker.tsx').read_text()
          assert '@app.get("/v1/me/aster/strategy2/focus/shadow")' in main
          assert 'live_authorized=False' in main
          assert 'report["ordersSent"]=0' in main
          assert 'AsterStrategy2FocusShadow enabled=' in maker
          assert 'if config.trading_mode=="focus":\n        return False' in Path('cloud_api/aster_strategy2_runtime.py').read_text()
          assert 'if config.trading_mode == "focus":\n        return ()' in Path('cloud_api/aster_strategy2_shadow_adapter.py').read_text()
          PY
      - name: Remove temporary patch mechanism and commit
        run: |
          rm -f .github/workflows/focus-surgical-patch.yml .focus-patch-trigger
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat: integrate Focus shadow endpoint and status panel"
          git push origin HEAD:amar-crypto-bot-2026-cloud
