name: Visual QA Portfolio Impact Bulls 20260905

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - .github/portfolio-impact-visual-qa-20260905.trigger
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply reference-parity refinement
        run: python tools/refine_portfolio_impact_visual_parity_20260905.py
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Run full build and regression suite
        working-directory: web
        run: npm test
      - name: Install visual QA browser tooling
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start visual QA server
        working-directory: web
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/portfolio-impact-vite.log 2>&1 &
          echo $! >/tmp/portfolio-impact-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/tests/visual/portfolio-impact.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-impact-vite.log
          exit 1
      - name: Capture Chromium and WebKit mobile screenshots
        working-directory: web
        run: node tests/visual/portfolio-impact-screenshots.mjs
      - name: Verify visual output inventory
        working-directory: web
        shell: bash
        run: |
          test -s artifacts/portfolio-impact/chromium-360.png
          test -s artifacts/portfolio-impact/chromium-390.png
          test -s artifacts/portfolio-impact/chromium-412.png
          test -s artifacts/portfolio-impact/chromium-430.png
          test -s artifacts/portfolio-impact/webkit-390.png
          test -s artifacts/portfolio-impact/reduced-motion-390.png
          test -s public/portfolio-impact-bulls.webp
          grep -q 'aspect-ratio:2.14/1' components/portfolio-impact-battle.module.css
          grep -q 'SHORTS VEROORZAKEN MEESTE VERLIES' lib/portfolio-impact-battle.mjs
          grep -q 'AANDEEL IN OPEN VERLIES' lib/portfolio-impact-battle.mjs
          grep -q 'destination === "aster" ? <PortfolioImpactBattle' app/page.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-impact-bulls-visual-qa
          path: |
            web/artifacts/portfolio-impact/*.png
            web/public/portfolio-impact-bulls.webp
          if-no-files-found: error
          retention-days: 14
