name: Diagnose today's soldier trades v2 2026-09-27

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/diag-todays-soldier-trades-v2-20260927.yml"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  OBSERVER_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run read-only today's soldier-trade analysis v2
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t V < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));sp=s['spec']['template']['spec']
          print(sp['containers'][0]['image']);print(sp['serviceAccountName'])
          PY
          )
          JOB="tm-today-sold-v2-${GITHUB_RUN_ID: -7}"
          MARKER="TODAYSOLDIERSV2_${GITHUB_RUN_ID}"
          echo "DIAG_JOB=$JOB" >> "$GITHUB_ENV"; echo "DIAG_MARKER=$MARKER" >> "$GITHUB_ENV"

          SCRIPT="$(base64 -w0 <<'PY'
          import json,os,math
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from google.cloud import firestore
          import main

          def n(v,d=0.0):
              try:
                  x=float(v);return x if math.isfinite(x) else d
              except Exception:return d
          def to_ms(v):
              if isinstance(v,datetime):
                  x=v if v.tzinfo else v.replace(tzinfo=timezone.utc)
                  return int(x.astimezone(timezone.utc).timestamp()*1000)
              if isinstance(v,(int,float)):return int(v)
              if isinstance(v,str):
                  try:return int(datetime.fromisoformat(v.replace('Z','+00:00')).timestamp()*1000)
                  except Exception:return int(n(v))
              return 0
          local=ZoneInfo('Europe/Amsterdam')
          def local_iso(ms):
              return datetime.fromtimestamp(ms/1000,timezone.utc).astimezone(local).isoformat() if ms else None

          db=firestore.Client(project='tradementor-production')
          owner=db.collection('systemConfiguration').document('continuityDashboardV1').get().to_dict() or {}
          uid=str(owner.get('ownerUid') or '').strip()
          if not uid:
              print(os.environ['MARKER']+'='+json.dumps({'error':'OWNER_NOT_CONFIGURED'}),flush=True);raise SystemExit

          user={'uid':uid}
          now=datetime.now(timezone.utc); local_now=now.astimezone(local)
          day_start_local=local_now.replace(hour=0,minute=0,second=0,microsecond=0)
          day_start_utc=day_start_local.astimezone(timezone.utc)

          audits=[]
          for d in main.aster_strategy2_reference(uid).collection('audit').where('timestamp','>=',day_start_utc).stream():
              v=d.to_dict() or {};v['_id']=d.id;v['_ms']=to_ms(v.get('timestamp',v.get('timestampMs')));audits.append(v)
          audits.sort(key=lambda x:x['_ms'])

          entries=[]
          for a in audits:
              if str(a.get('event') or '').upper()!='MULTI_BB_ENTRY':continue
              role=str(a.get('soldierRole') or '').upper();sid=str(a.get('soldierId') or '').strip()
              if role not in {'ZONE_BASE','EXPOSURE_BALANCER'} or not sid:continue
              entries.append({
                  'symbol':str(a.get('symbol') or '').upper(),'side':str(a.get('side') or '').upper(),
                  'soldierId':sid,'soldierRole':role,'entryZone':a.get('originZone'),
                  'entryMs':a['_ms'],'entryTimeLocal':local_iso(a['_ms']),
              })

          closes=[]
          for d in main.user_reference(user).collection('asterClosedTrades').where('closedAt','>=',day_start_utc).stream():
              v=d.to_dict() or {};v['_ms']=to_ms(v.get('closedAt'));closes.append(v)
          closes.sort(key=lambda x:x['_ms'])

          secret=main.load_aster_secret(user)
          client=main.AsterV3Client(signer_address=secret.signer_address,sign_message=main.local_eip712_signer(secret),live_authorized=False)
          live=[r for r in (client.position_risk() or []) if isinstance(r,dict) and abs(n(r.get('positionAmt',r.get('quantity'))))>0]
          live_keys={(str(r.get('symbol') or '').upper(),str(r.get('positionSide',r.get('side',''))).upper()) for r in live}

          # TP audits can supply close-zone truth. Other close paths must not invent it.
          tp_audits=[]
          for a in audits:
              if str(a.get('event') or '').upper()!='MULTI_BB_TP':continue
              role=str(a.get('soldierRole') or '').upper();sid=str(a.get('soldierId') or '').strip()
              if role in {'ZONE_BASE','EXPOSURE_BALANCER'} and sid:
                  tp_audits.append(a)

          rows=[]
          by_sid={}
          for e in entries:by_sid.setdefault(e['soldierId'],[]).append(e)
          for sid,arr in by_sid.items():
              arr.sort(key=lambda x:x['entryMs'])
              for i,e in enumerate(arr):
                  next_entry=arr[i+1]['entryMs'] if i+1<len(arr) else 10**30
                  candidates=[c for c in closes if
                      str(c.get('symbol') or '').upper()==e['symbol'] and
                      str(c.get('side') or '').upper()==e['side'] and
                      e['entryMs']<=c['_ms']<next_entry]
                  close=min(candidates,key=lambda c:c['_ms']) if candidates else None
                  tp=None
                  if close:
                      tp_candidates=[a for a in tp_audits if str(a.get('soldierId') or '')==sid and e['entryMs']<=a['_ms']<next_entry and abs(a['_ms']-close['_ms'])<=120000]
                      tp=min(tp_candidates,key=lambda a:abs(a['_ms']-close['_ms'])) if tp_candidates else None
                  is_live=(e['symbol'],e['side']) in live_keys and i==len(arr)-1
                  if close and not is_live: status='CLOSED'
                  elif is_live: status='OPEN'
                  else: status='NO_LONGER_OPEN_NO_CLOSE_EVIDENCE'
                  rows.append({
                      **e,
                      'status':status,
                      'closeTimeLocal':local_iso(close['_ms']) if close else None,
                      'closeMs':close['_ms'] if close else None,
                      'realizedPnlUsd':round(n(close.get('realizedPnlUsd')),8) if close else None,
                      'closeZone':tp.get('currentZoneAtClose') if tp else None,
                      'closeZoneSource':'MULTI_BB_TP_AUDIT' if tp else None,
                      'closeEvidence':'ASTER_CONFIRMED_CLOSE_FILL' if close else None,
                      'closeWasZoneTp':bool(tp),
                  })
          rows.sort(key=lambda x:x['entryMs'])
          out={
              'generatedAt':now.isoformat(),'localDate':local_now.date().isoformat(),'timezone':'Europe/Amsterdam','readOnly':True,
              'entryCount':len(rows),'closedCount':sum(1 for r in rows if r['status']=='CLOSED'),'openCount':sum(1 for r in rows if r['status']=='OPEN'),
              'rows':rows,
          }
          print(os.environ['MARKER']+'='+json.dumps(out,separators=(',',':'),sort_keys=True,default=str),flush=True)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "${V[0]}" --service-account "${V[1]}" --set-env-vars "MARKER=$MARKER"             --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT'))"             --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 240s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null

      - name: Authenticate observer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}

      - name: Collect and publish result
        shell: bash
        run: |
          set -euo pipefail
          for N in $(seq 1 15); do
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\"" --project "$GCP_PROJECT_ID" --freshness=15m --limit=100 --order=desc --format=json > "$RUNNER_TEMP/logs.json"
            python - "$DIAG_MARKER" "$RUNNER_TEMP/logs.json" > "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          m=sys.argv[1]+'=';rows=json.load(open(sys.argv[2],encoding='utf-8'))
          def walk(x):
              if isinstance(x,str):yield x
              elif isinstance(x,dict):
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          for row in rows:
              for s in walk(row):
                  if m in s:
                      raw=s[s.index(m)+len(m):].splitlines()[0];json.loads(raw);print(raw);raise SystemExit
          PY
            [ -s "$RUNNER_TEMP/result.json" ] && break
            sleep 3
          done
          test -s "$RUNNER_TEMP/result.json"
          mkdir -p .diagnostics
          cp "$RUNNER_TEMP/result.json" .diagnostics/todays-soldier-trades-v2-20260927.json
          git config user.name "TradeMentor Diagnostics";git config user.email "actions@users.noreply.github.com"
          git add .diagnostics/todays-soldier-trades-v2-20260927.json
          git diff --cached --quiet && exit 0
          git commit -m "Record today's soldier trades v2 diagnostic"
          git push origin HEAD:amar-crypto-bot-2026-cloud

      - name: Re-authenticate deploy for cleanup
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${DIAG_JOB:-}" ]; then gcloud run jobs delete "$DIAG_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true; fi
