name: Diagnose current LONG capacity 2026-09-18

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diag-current-long-capacity-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-long-capacity-readonly
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
          service_account: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      - name: Capture production revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/before.json"
          python - "$RUNNER_TEMP/before.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          live=[x for x in s['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          assert len(live)==1,live
          print("BASE_REVISION="+live[0]["revisionName"])
          PY

      - name: Inject token-gated read-only capacity endpoint
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
          HASH="$(python - "$TOKEN" <<'PY'
          import hashlib,sys
          print(hashlib.sha256(sys.argv[1].encode()).hexdigest())
          PY
          )"
          echo "DIAG_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          cat >> cloud_api/main.py <<PY

          @app.get("/__diag/long-capacity-$HASH")
          def __diag_long_capacity_current():
              import time as _time
              from aster_multi_bb_core import rank_top_volume as _rank_top_volume
              from aster_leverage_tiers import resolve_entry as _resolve_entry, bracket_rows as _bracket_rows
              from aster_execution import plan_pair as _plan_pair
              matches=[]
              for snap in db.collection("asterStrategy2").stream():
                  raw=snap.to_dict() or {}
                  settings_raw=raw.get("settings") if isinstance(raw.get("settings"),dict) else {}
                  report=raw.get("multiBbReport") if isinstance(raw.get("multiBbReport"),dict) else {}
                  try:
                      long_slots=int(settings_raw.get("longSlots",-1))
                      short_slots=int(settings_raw.get("shortSlots",-1))
                      min_lev=int(settings_raw.get("minimumLeverage",-1))
                      entry_margin=float(settings_raw.get("entryMarginUsd",-1))
                  except Exception:
                      continue
                  if not bool(raw.get("enabled") or raw.get("monitor")): continue
                  if str(settings_raw.get("engine",settings_raw.get("strategyKind","")))!="multi_bb_v1": continue
                  if long_slots!=36 or short_slots!=13 or min_lev!=50: continue
                  if abs(entry_margin-0.2)>1e-9: continue
                  if not bool(settings_raw.get("shortRequiresLongEnabled",False)): continue
                  if int(report.get("activeShort",-1) or -1)!=13: continue
                  matches.append((snap.id,raw,settings_raw,report))
              if len(matches)!=1:
                  return {"readOnly":True,"ordersSent":0,"matchCount":len(matches),"error":"account match not unique"}
              uid,raw,settings_raw,report=matches[0]
              settings=MultiBbConfig.from_mapping(settings_raw)
              secret=load_aster_secret({"uid":uid})
              client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)

              exchange_info=client.public_exchange_info()
              tickers=client.ticker_24h()
              price_rows=client.ticker_prices()
              prices={str(x.get("symbol","")).upper():safe_float(x.get("price")) for x in price_rows if isinstance(x,dict)}
              positions=client.position_risk()
              bulk=client.leverage_brackets()
              ranked=_rank_top_volume(tickers,exchange_info,settings.universe_top_n)
              info_map={str(x.get("symbol","")).upper():x for x in exchange_info.get("symbols",[]) if isinstance(x,dict)}
              active_long=set();active_short=set();contract_notional={}
              for row in positions:
                  qty=abs(safe_float(row.get("positionAmt")));mark=safe_float(row.get("markPrice",row.get("entryPrice")))
                  if qty<=0: continue
                  symbol=str(row.get("symbol","")).upper();side=str(row.get("positionSide","")).upper()
                  if side=="LONG": active_long.add(symbol)
                  if side=="SHORT": active_short.add(symbol)
                  contract_notional[symbol]=contract_notional.get(symbol,0.0)+qty*mark

              leverage_ge=[];plan_errors=[];capacity=[];missing_brackets=[]
              for index,row in enumerate(ranked,1):
                  symbol=str(row.get("symbol","")).upper()
                  rows=_bracket_rows(bulk,symbol)
                  if not rows:
                      missing_brackets.append(symbol)
                      continue
                  max_lev=max([int(safe_float(x.get("initialLeverage"))) for x in rows] or [0])
                  if max_lev<settings.minimum_leverage: continue
                  leverage_ge.append(symbol)
                  if symbol in active_long: continue
                  payload_for_symbol=[{"symbol":symbol,"brackets":rows}]
                  try:
                      resolved=_resolve_entry(payload_for_symbol,symbol,
                          configured_minimum=settings.minimum_leverage,
                          entry_margin_usd=settings.entry_margin_usd,
                          entry_notional_usd=settings.entry_notional_usd,
                          entry_sizing_mode=settings.entry_sizing_mode)
                      price=safe_float(prices.get(symbol))
                      plan=_plan_pair(info_map[symbol],rows,price,float(resolved["orderNotional"]),
                          accepted_leverage=int(resolved["leverage"]),existing_contract_notional=0)
                  except Exception as exc:
                      plan_errors.append({"rank":index,"symbol":symbol,"maxLeverage":max_lev,
                          "reason":"PLAN_ERROR","detail":str(exc)[:220],"hasOpenShort":symbol in active_short,
                          "currentContractNotional":round(contract_notional.get(symbol,0.0),8)})
                      continue
                  try:
                      remaining=float(client.remaining_openable_notional_value(symbol,int(plan.leverage)))
                      read_error=None
                  except Exception as exc:
                      remaining=None;read_error=str(exc)[:180]
                  row_out={"rank":index,"symbol":symbol,"maxLeverage":max_lev,
                      "plannedLeverage":int(plan.leverage),"plannedNotional":round(float(plan.notional_per_leg),8),
                      "remainingOpenableNotional":round(remaining,8) if remaining is not None else None,
                      "capacityPass":bool(remaining is not None and remaining+1e-9>=float(plan.notional_per_leg)),
                      "hasOpenShort":symbol in active_short,
                      "currentContractNotional":round(contract_notional.get(symbol,0.0),8)}
                  if read_error: row_out["capacityReadError"]=read_error
                  capacity.append(row_out)
                  _time.sleep(0.08)

              blocked=[x for x in capacity if not x.get("capacityPass")]
              openable=[x for x in capacity if x.get("capacityPass")]
              trading_usdt=sum(1 for x in exchange_info.get("symbols",[]) if isinstance(x,dict)
                  and str(x.get("quoteAsset","USDT")).upper()=="USDT"
                  and str(x.get("status","TRADING")).upper()=="TRADING"
                  and str(x.get("symbol","")).upper().endswith("USDT"))
              return {
                  "readOnly":True,"ordersSent":0,
                  "requestedTopN":settings.universe_top_n,
                  "rankedCandidateCount":len(ranked),
                  "tradingUsdtPerpetualCount":trading_usdt,
                  "bulkBracketSymbolCount":len(bulk) if isinstance(bulk,list) else None,
                  "missingBracketCount":len(missing_brackets),"missingBrackets":missing_brackets[:30],
                  "minimumLeverage":settings.minimum_leverage,
                  "activeLongCount":len(active_long),"activeShortCount":len(active_short),
                  "reportActiveLong":report.get("activeLong"),"reportRemainingLong":report.get("remainingLong"),
                  "leverageAtLeastMinimumCount":len(leverage_ge),
                  "leverageAtLeastMinimumSymbols":leverage_ge,
                  "freeMinLeverageCandidateCount":len([s for s in leverage_ge if s not in active_long]),
                  "planErrorCount":len(plan_errors),"planErrors":plan_errors,
                  "capacityCheckedCount":len(capacity),
                  "capacityBlockedCount":len(blocked),"capacityBlocked":blocked,
                  "capacityOpenableCount":len(openable),"capacityOpenable":openable
              }
          PY

      - name: Build zero-traffic diagnostic revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-8)"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:longcap-$GITHUB_SHA"
          docker build -t "$IMAGE" cloud_api
          docker push "$IMAGE"
          TAG="longcap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SUFFIX="lc-$SHORT_SHA-$GITHUB_RUN_ATTEMPT"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --revision-suffix "$SUFFIX" --no-traffic --tag "$TAG" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/after.json"
          python - "$RUNNER_TEMP/after.json" "$TAG" "$BASE_REVISION" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));tag=sys.argv[2];base=sys.argv[3]
          live=[x for x in s['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          assert len(live)==1 and live[0].get('revisionName')==base,live
          row=next(x for x in s['status']['traffic'] if x.get('tag')==tag)
          assert int(row.get('percent',0) or 0)==0,row
          print("DIAG_URL="+row["url"])
          print("DIAG_REVISION="+row["revisionName"])
          PY

      - name: Read current capacity result
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(python - "$DIAG_TOKEN" <<'PY'
          import hashlib,sys
          print(hashlib.sha256(sys.argv[1].encode()).hexdigest())
          PY
          )"
          curl --fail --silent --show-error --retry 8 --retry-delay 2             "$DIAG_URL/__diag/long-capacity-$HASH" | tee "$RUNNER_TEMP/result.json" | python -m json.tool

      - name: Confirm production traffic never moved
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          python - "$BASE_REVISION" "$NOW" <<'PY'
          import json,sys
          base=sys.argv[1];s=json.loads(sys.argv[2])
          live=[x for x in s['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          assert len(live)==1 and live[0].get('revisionName')==base,live
          PY
