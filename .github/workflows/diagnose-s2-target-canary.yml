name: Diagnose exact Strategy 2 stuck canary

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/diagnose-s2-target-canary.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove exact canary exchange state without mutations
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-canary-proof-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          spec=json.load(open(sys.argv[1],encoding="utf-8"))["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"]); print(spec["serviceAccountName"])
          PY
          )
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,json
          from datetime import datetime,timezone,timedelta
          from google.cloud import firestore
          from main import load_aster_secret,local_eip712_signer
          from aster_gateway import AsterV3Client

          target="44246fcb6d4b8400bc3944e50d1b62682399fb50e5bad2ad7729eae09910b94c"
          db=firestore.Client(project="tradementor-amar-20260813")
          matches=[x for x in db.collection("asterStrategy2").stream() if hashlib.sha256(x.id.encode()).hexdigest()==target]
          if len(matches)!=1: raise SystemExit(220+min(len(matches),9))
          uid=matches[0].id; state=matches[0].to_dict() or {}
          canary=db.collection("asterStrategy2").document(uid).collection("canaries").document("open-fill-close-v1").get().to_dict() or {}
          symbol=str(canary.get("symbol","")).upper(); prefix=str(canary.get("intentPrefix","")); status=str(canary.get("status","")).upper()
          if not symbol or not prefix or status not in {"OPENING","OPENED","UNKNOWN"}: raise SystemExit(31)
          started=canary.get("startedAt")
          start_ms=int(((started if isinstance(started,datetime) else datetime.now(timezone.utc)-timedelta(days=7))-timedelta(minutes=5)).timestamp()*1000)
          secret=load_aster_secret({"uid":uid})
          client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)
          positions=client.position_risk(); open_orders=client.open_orders(); history=client.all_orders(symbol,start_time=start_ms,limit=1000)
          intent_orders=[x for x in history if str(x.get("clientOrderId",x.get("origClientOrderId",""))).startswith(prefix)]
          intent_ids={str(x.get("orderId","")) for x in intent_orders if str(x.get("orderId",""))}
          fills=client.user_trades(symbol,start_time=start_ms,limit=1000)
          intent_fills=[x for x in fills if str(x.get("orderId","")) in intent_ids or str(x.get("clientOrderId","")).startswith(prefix)]
          active=[x for x in positions if str(x.get("symbol","")).upper()==symbol and abs(float(x.get("positionAmt") or 0))>0]
          open_intent=[x for x in open_orders if str(x.get("clientOrderId",x.get("origClientOrderId",""))).startswith(prefix)]
          proof={"status":status,"activeOnCanarySymbol":len(active),"openIntentOrders":len(open_intent),
                 "historicalIntentOrders":len(intent_orders),"intentFills":len(intent_fills),
                 "intentOrderStatuses":sorted({str(x.get("status","")) for x in intent_orders}),
                 "canaryValidated":int(bool(state.get("canaryValidated"))),"liveReady":int(bool(state.get("liveReady")))}
          print("CANARY_PROOF "+json.dumps(proof,sort_keys=True),flush=True)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${VALUES[0]}" --service-account "${VALUES[1]}" --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID" \
            --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB" \
            --project "$GCP_PROJECT_ID" --freshness 20m --limit 80 --order asc \
            --format='value(textPayload,jsonPayload.message)' | sort -u
          cleanup
          trap - EXIT
