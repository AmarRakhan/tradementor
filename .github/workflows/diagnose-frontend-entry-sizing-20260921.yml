name: Diagnose frontend entry sizing payload 20260921

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/diagnose-frontend-entry-sizing-20260921.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frontend sizing serialization
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Frontend entrySizingMode source scan"
            echo
            echo "BEGIN_SCAN"
            grep -R -n -C 8 --exclude-dir=node_modules --exclude-dir=.next -E 'entrySizingMode|entryNotional(Long|Short)?Usd|entryMargin(Long|Short)?Usd' web 2>/dev/null | head -n 500 || true
            echo "END_SCAN"
          } > "$RUNNER_TEMP/result.md"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 209 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
