name: Probe Recovery Strategy 2 Tick Disabled

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/probe-recovery-strategy2-tick-disabled.yml]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  RECOVERY_SERVICE: tradementor-strategy2-recovery-api
  RECOVERY_URL: https://tradementor-strategy2-recovery-api-cyyaq5otyq-ez.a.run.app
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="RECOVERY_S2_DISABLED_TICK4 STARTED commit=$GITHUB_SHA"
      - id: gcp_access
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Align only recovery internal audience and preserve disabled trading gates
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$RUNNER_TEMP/before.json"
          AFTER="$RUNNER_TEMP/after.json"
          gcloud run services describe "$RECOVERY_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$BEFORE"
          python - "$BEFORE" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=value['spec']['template']['spec']
          env={x['name']:x.get('value') for x in spec['containers'][0].get('env',[])}
          assert env.get('TRADEMENTOR_ALLOW_LIVE')=='false'
          assert env.get('ASTER_LIVE_EXECUTION_ENABLED')=='false'
          assert env.get('ASTER_STRATEGY2_LIVE_ENABLED')=='false'
          assert env.get('ASTER_STRATEGY3_LIVE_ENABLED')=='false'
          assert env.get('ASTER_STRATEGY3_RUNTIME_ENABLED')=='false'
          PY
          gcloud run services update "$RECOVERY_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --update-env-vars "MEXC_INTERNAL_AUDIENCE=$RECOVERY_URL" --quiet
          gcloud run services describe "$RECOVERY_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$AFTER"
          python - "$AFTER" "$RECOVERY_URL" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=value['spec']['template']['spec']
          env={x['name']:x.get('value') for x in spec['containers'][0].get('env',[])}
          assert env.get('MEXC_INTERNAL_AUDIENCE')==sys.argv[2]
          assert env.get('TRADEMENTOR_ALLOW_LIVE')=='false'
          assert env.get('ASTER_LIVE_EXECUTION_ENABLED')=='false'
          assert env.get('ASTER_STRATEGY2_LIVE_ENABLED')=='false'
          assert env.get('ASTER_STRATEGY3_LIVE_ENABLED')=='false'
          assert env.get('ASTER_STRATEGY3_RUNTIME_ENABLED')=='false'
          PY
      - id: gcp_id
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.RECOVERY_URL }}
          id_token_include_email: true
      - name: Probe disabled Strategy 2 scheduler
        env:
          GH_TOKEN: ${{ github.token }}
          ID_TOKEN: ${{ steps.gcp_id.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS --max-time 30 -o /tmp/response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" "$RECOVERY_URL/internal/aster-strategy2/tick")"
          BODY="$(head -c 1800 /tmp/response.json | tr '\n' ' ')"
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="RECOVERY_S2_DISABLED_TICK4 http=$HTTP response=$BODY gates=DISABLED audience=$RECOVERY_URL"
          test "$HTTP" = "200"
          grep -q 'centrally-disabled' /tmp/response.json
