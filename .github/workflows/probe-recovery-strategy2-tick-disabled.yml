name: Probe Recovery Strategy 2 Tick Disabled

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/probe-recovery-strategy2-tick-disabled.yml]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  RECOVERY_URL: https://tradementor-strategy2-recovery-api-cyyaq5otyq-ez.a.run.app
  INTERNAL_AUDIENCE: https://tradementor-api-604335232956.europe-west4.run.app
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="RECOVERY_S2_DISABLED_TICK3 STARTED commit=$GITHUB_SHA"
      - id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.INTERNAL_AUDIENCE }}
          id_token_include_email: true
      - name: Probe disabled Strategy 2 tick with auth-action ID token
        if: steps.gcp_auth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ID_TOKEN: ${{ steps.gcp_auth.outputs.id_token }}
        shell: bash
        run: |
          set +e
          HTTP="000"; CURL_RC=99; BODY=""
          if [ -n "$ID_TOKEN" ]; then
            HTTP="$(curl -sS --max-time 30 -o /tmp/response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" "$RECOVERY_URL/internal/aster-strategy2/tick")"
            CURL_RC=$?
            BODY="$(head -c 1800 /tmp/response.json 2>/dev/null | tr '\n' ' ')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="RECOVERY_S2_DISABLED_TICK3 auth=${{ steps.gcp_auth.outcome }} token_present=$([ -n "$ID_TOKEN" ] && echo yes || echo no) curl_rc=$CURL_RC http=$HTTP response=$BODY"
      - name: Report auth failure
        if: steps.gcp_auth.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="RECOVERY_S2_DISABLED_TICK3 auth=${{ steps.gcp_auth.outcome }}"
