name: Apply Aster Quick Trade Settings Phase 1

on:
  push:
    branches:
      - agent-aster-markets-quick-trade-settings
    paths:
      - tools/apply_aster_quick_trade_settings_phase1.py
      - .github/workflows/apply-aster-quick-trade-settings-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-aster-markets-quick-trade-settings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_aster_quick_trade_settings_phase1.py
      - name: Run focused backend tests
        working-directory: cloud_api
        run: python -m pytest -q test_aster_quick_trade_profiles.py test_aster_strategy2_state.py
      - name: Run web tests
        working-directory: web
        run: |
          npm ci
          npm test -- --runInBand
      - name: Commit generated changes
        run: |
          git config user.name "Aster Rebuild Agent"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_multi_bb.py cloud_api/test_aster_quick_trade_profiles.py web/components/markets-navigation-bridge.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[agent-patch] Persist Strategy 2 profiles and pair overrides"
          git push origin HEAD:agent-aster-markets-quick-trade-settings
