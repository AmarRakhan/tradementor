name: Agent Production Diagnostic Worker

on:
  workflow_dispatch:
    inputs:
      request_issue:
        description: "GitHub issue number that receives the diagnostic result"
        required: true
        type: string
      diagnostic_note:
        description: "Optional diagnostic note"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: agent-production-diagnostic-worker
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  ASTER_SCHEDULER_JOB: tradementor-aster-automation
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAGNOSTIC_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Verify immutable diagnostic scope
        shell: bash
        env:
          REQUEST_ISSUE: ${{ inputs.request_issue }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$GCP_PROJECT_ID" = "tradementor-production"
          test "$GCP_REGION" = "europe-west4"
          test -n "$REQUEST_ISSUE"
          case "$REQUEST_ISSUE" in (*[!0-9]*|'') exit 2;; esac

      - name: Authenticate read-only diagnostic session
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAGNOSTIC_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Collect sanitized production diagnostics
        id: collect
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          REQUEST_ISSUE: ${{ inputs.request_issue }}
          DIAGNOSTIC_NOTE: ${{ inputs.diagnostic_note }}
        run: |
          set +e
          mkdir -p control-plane-report
          REPORT="control-plane-report/report.md"
          STATUS="HEALTHY"

          {
            echo "## Agent production diagnosis"
            echo
            printf -- "- Checked: %s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf -- "- Project: %s\n" "$GCP_PROJECT_ID"
            printf -- "- Region: %s\n" "$GCP_REGION"
            printf -- "- Source branch: %s\n" "$GITHUB_REF_NAME"
            printf -- "- Worker commit: %s\n" "$GITHUB_SHA"
            echo "- Mode: **READ ONLY**"
            [ -n "$DIAGNOSTIC_NOTE" ] && printf -- "- Note: %s\n" "$DIAGNOSTIC_NOTE"
            echo
          } > "$REPORT"

          if [ "$AUTH_OUTCOME" != "success" ]; then
            {
              echo "### Authentication"
              echo "❌ Workload Identity Federation authentication failed on the trusted production branch."
            } >> "$REPORT"
            echo "UNAVAILABLE" > control-plane-report/status.txt
            exit 0
          fi

          ACCESS_TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          BILLING_PROJECT_FILE="control-plane-report/billing-project.json"
          BILLING_PROJECT_HTTP="$(curl --silent --show-error --max-time 20 \
            -o "$BILLING_PROJECT_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://cloudbilling.googleapis.com/v1/projects/$GCP_PROJECT_ID/billingInfo" 2>/dev/null || true)"
          BILLING_PROJECT_ERROR="$(python - "$BILLING_PROJECT_FILE" <<'PY'
          import json,sys
          try:
              payload=json.load(open(sys.argv[1],encoding="utf-8"))
              error=payload.get("error") if isinstance(payload,dict) else None
              print(str((error or {}).get("status") or ""))
          except Exception:
              print("")
          PY
          )"
          BILLING=""
          BILLING_ACCOUNT=""
          if [ "$BILLING_PROJECT_HTTP" = "200" ]; then
            BILLING="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("True" if d.get("billingEnabled") is True else "False" if d.get("billingEnabled") is False else "")' "$BILLING_PROJECT_FILE" 2>/dev/null)"
            BILLING_ACCOUNT="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print((d.get("billingAccountName") or "").split("/")[-1])' "$BILLING_PROJECT_FILE" 2>/dev/null)"
          fi

          BILLING_ACCOUNT_HTTP="not-requested"
          BILLING_ACCOUNT_ERROR=""
          BILLING_ACCOUNT_OPEN=""
          if [ -n "$BILLING_ACCOUNT" ]; then
            BILLING_ACCOUNT_FILE="control-plane-report/billing-account.json"
            BILLING_ACCOUNT_HTTP="$(curl --silent --show-error --max-time 20 \
              -o "$BILLING_ACCOUNT_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://cloudbilling.googleapis.com/v1/billingAccounts/$BILLING_ACCOUNT" 2>/dev/null || true)"
            BILLING_ACCOUNT_ERROR="$(python - "$BILLING_ACCOUNT_FILE" <<'PY'
          import json,sys
          try:
              payload=json.load(open(sys.argv[1],encoding="utf-8"))
              error=payload.get("error") if isinstance(payload,dict) else None
              print(str((error or {}).get("status") or ""))
          except Exception:
              print("")
          PY
          )"
            if [ "$BILLING_ACCOUNT_HTTP" = "200" ]; then
              BILLING_ACCOUNT_OPEN="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("True" if d.get("open") is True else "False" if d.get("open") is False else "")' "$BILLING_ACCOUNT_FILE" 2>/dev/null)"
            fi
          fi

          if [ "$BILLING" = "True" ]; then
            if [ "$BILLING_ACCOUNT_OPEN" = "True" ]; then
              BILLING_LINE="✅ project enabled · account open"
            else
              BILLING_LINE="✅ project enabled · account-state metadata unavailable"
            fi
          elif [ "$BILLING" = "False" ]; then
            BILLING_LINE="❌ project billing disabled"
            STATUS="DEGRADED"
          else
            BILLING_LINE="⚠️ project billing state unreadable"
            STATUS="DEGRADED"
          fi

          SERVICE_JSON="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json 2>/dev/null)"
          SERVICE_URL="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",{}).get("url",""))' <<<"$SERVICE_JSON" 2>/dev/null)"
          READY_REVISION="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",{}).get("latestReadyRevisionName",""))' <<<"$SERVICE_JSON" 2>/dev/null)"
          LIVE_REVISION="$(python -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("status",{}).get("traffic",[]); print(next((r.get("revisionName","") for r in rows if int(r.get("percent",0) or 0)==100),""))' <<<"$SERVICE_JSON" 2>/dev/null)"

          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$SERVICE_URL/health" 2>/dev/null)"
          HEALTH_OK="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print("yes" if d.get("status")=="ready" and d.get("multiUser") is True else "no")' "$HEALTH" 2>/dev/null)"
          SOURCE_COMMIT="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("sourceCommit") or d.get("imageSourceCommit") or "")' "$HEALTH" 2>/dev/null)"
          [ "$HEALTH_OK" != "yes" ] && STATUS="DEGRADED"

          FIRESTORE="$(gcloud firestore databases describe --database='(default)' --project "$GCP_PROJECT_ID" --format='value(name)' 2>/dev/null)"
          [ -z "$FIRESTORE" ] && STATUS="DEGRADED"

          SCHEDULER_STATE="$(gcloud scheduler jobs describe "$ASTER_SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format='value(state)' 2>/dev/null)"
          [ "$SCHEDULER_STATE" != "ENABLED" ] && STATUS="DEGRADED"

          LAST_TICK="$(gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND httpRequest.requestUrl:"/internal/aster-automation/tick"' --project "$GCP_PROJECT_ID" --freshness=30m --limit=1 --order=desc --format='csv[no-heading](timestamp,httpRequest.status)' 2>/dev/null)"
          LAST_TICK_STATUS="${LAST_TICK##*,}"
          [ "$LAST_TICK_STATUS" != "200" ] && STATUS="DEGRADED"

          ERROR_COUNT="$(gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND httpRequest.status>=500' --project "$GCP_PROJECT_ID" --freshness=30m --limit=100 --format='value(timestamp)' 2>/dev/null | wc -l | tr -d ' ')"
          [ "${ERROR_COUNT:-0}" -ge 10 ] 2>/dev/null && STATUS="DEGRADED"

          ASTER_HTTP="$(curl -sS -o control-plane-report/aster-exchange-info.json -w '%{http_code}' --max-time 20 'https://fapi.asterdex.com/fapi/v3/exchangeInfo' 2>/dev/null)"
          ASTER_OK="no"
          if [ "$ASTER_HTTP" = "200" ]; then
            ASTER_OK="$(python - <<'PY'
          import json
          try:
              with open("control-plane-report/aster-exchange-info.json", encoding="utf-8") as f:
                  payload=json.load(f)
              symbols=payload.get("symbols", [])
              print("yes" if symbols and any(str(x.get("status","")).upper()=="TRADING" for x in symbols if isinstance(x,dict)) else "no")
          except Exception:
              print("no")
          PY
          )"
          fi
          [ "$ASTER_OK" != "yes" ] && STATUS="DEGRADED"

          {
            echo "### Current state"
            printf -- "- Billing: %s\n" "$BILLING_LINE"
            printf -- "- Billing project API: HTTP %s%s\n" "${BILLING_PROJECT_HTTP:-none}" "${BILLING_PROJECT_ERROR:+ · $BILLING_PROJECT_ERROR}"
            printf -- "- Billing account API: HTTP %s%s\n" "${BILLING_ACCOUNT_HTTP:-none}" "${BILLING_ACCOUNT_ERROR:+ · $BILLING_ACCOUNT_ERROR}"
            printf -- "- Cloud Run health: %s\n" "$([ "$HEALTH_OK" = yes ] && echo '✅ ready' || echo '❌ unhealthy/unreachable')"
            printf -- "- Live revision: %s\n" "${LIVE_REVISION:-unknown}"
            printf -- "- Latest ready revision: %s\n" "${READY_REVISION:-unknown}"
            printf -- "- Source commit: %s\n" "${SOURCE_COMMIT:-unknown}"
            printf -- "- Firestore: %s\n" "$([ -n "$FIRESTORE" ] && echo '✅ reachable' || echo '❌ unavailable')"
            printf -- "- Aster scheduler: %s\n" "${SCHEDULER_STATE:-unknown}"
            printf -- "- Latest Aster tick: %s\n" "${LAST_TICK:-none in last 30m}"
            printf -- "- Backend HTTP 5xx in last 30m: %s\n" "${ERROR_COUNT:-unknown}"
            printf -- "- Aster public market API: %s\n" "$([ "$ASTER_OK" = yes ] && echo '✅ reachable' || echo '❌ unavailable')"
            echo
            echo "### Overall"
            printf "**%s**\n" "$STATUS"
            echo
            echo "_No secrets, wallet keys, private exchange credentials, order payloads, or account data were collected._"
          } >> "$REPORT"

          rm -f control-plane-report/aster-exchange-info.json control-plane-report/billing-project.json control-plane-report/billing-account.json
          echo "$STATUS" > control-plane-report/status.txt

      - name: Publish diagnosis back to GitHub issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ISSUE: ${{ inputs.request_issue }}
        run: |
          if [ -f control-plane-report/report.md ]; then
            gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file control-plane-report/report.md
          else
            gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Production diagnostic worker failed before a report could be generated."
          fi

      - name: Upload sanitized diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-production-diagnostic-${{ github.run_id }}
          path: control-plane-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark unhealthy diagnosis as failed
        if: always()
        shell: bash
        run: |
          STATUS="$(cat control-plane-report/status.txt 2>/dev/null || echo UNAVAILABLE)"
          test "$STATUS" = "HEALTHY"
