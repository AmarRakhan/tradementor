name: Read-only diagnose 35-30 Bollinger refill 20260921

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: tradementor-readonly-35-30-bollinger-diagnosis
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  RESULT_ISSUE: '209'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Read current Strategy-2 state via Firestore REST only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python - <<'PY' > "$RUNNER_TEMP/result.md"
          import os,json,urllib.request,urllib.parse
          from datetime import datetime,timezone

          project='tradementor-production'
          token=os.environ['ACCESS_TOKEN']
          base=f'https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents'

          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req,timeout=30) as resp:return json.load(resp)

          def val(v):
              if not isinstance(v,dict):return None
              for k in ('stringValue','booleanValue','integerValue','doubleValue','timestampValue','nullValue','referenceValue'):
                  if k in v:
                      x=v[k]
                      if k=='integerValue':
                          try:return int(x)
                          except:return x
                      if k=='doubleValue':
                          try:return float(x)
                          except:return x
                      if k=='nullValue':return None
                      return x
              if 'mapValue' in v:return {k:val(x) for k,x in (v['mapValue'].get('fields') or {}).items()}
              if 'arrayValue' in v:return [val(x) for x in (v['arrayValue'].get('values') or [])]
              return None

          def fields(doc):return {k:val(v) for k,v in (doc.get('fields') or {}).items()}

          def list_collection(path):
              out=[]; page=''
              while True:
                  q={'pageSize':'300'}
                  if page:q['pageToken']=page
                  payload=get(f"{base}/{path}?{urllib.parse.urlencode(q)}")
                  out.extend(payload.get('documents') or [])
                  page=payload.get('nextPageToken') or ''
                  if not page:break
              return out

          def num(v,default=0):
              try:return int(round(float(v)))
              except:return default

          def reason_counts(reasons):
              out={'bb':0,'leverage':0,'margin':0,'pair':0,'capacity':0,'other':0}
              if not isinstance(reasons,dict):return out
              for key,value in reasons.items():
                  s=str(key).upper()
                  try:n=max(1,int(value))
                  except:n=1
                  if s.startswith('BB_') or s.startswith('PRICE_') or 'BOLLINGER' in s: out['bb']+=n
                  elif 'LEVERAGE' in s: out['leverage']+=n
                  elif 'MARGIN' in s or 'BUDGET' in s or 'NOTIONAL' in s or '5018' in s: out['margin']+=n
                  elif 'SHORT_REQUIRES_LONG' in s: out['pair']+=n
                  elif 'CAPACITY' in s or 'SLOT_CAP' in s: out['capacity']+=n
                  else: out['other']+=n
              return out

          try:
              docs=list_collection('asterStrategy2')
          except Exception as exc:
              print('## Read-only LONG refill diagnosis')
              print()
              print(f'- Result: **READ_FAILED** · {type(exc).__name__}: {str(exc)[:240]}')
              print()
              print('_No UID, email, wallet, credential, order payload or setting was emitted or changed._')
              raise SystemExit(0)
          matches=[]
          for doc in docs:
              raw=fields(doc)
              s=raw.get('settings') if isinstance(raw.get('settings'),dict) else {}
              if num(s.get('longSlots'),-1)!=35: continue
              if num(s.get('shortSlots'),-1)!=30: continue
              if num(s.get('universeTopN'),-1)!=350: continue
              if num(s.get('maximumPositions'),-1)!=65: continue
              if num(s.get('minimumLeverage'),-1)!=20: continue
              matches.append(raw)

          print('## Read-only LONG refill diagnosis')
          print()
          print(f'- Matching anonymous configuration(s): **{len(matches)}**')
          if len(matches)!=1:
              print('- Result: **REFUSED_NOT_UNIQUE** — no account-specific conclusion was drawn.')
              print()
              print('_No UID, email, wallet, credential or order payload was emitted or changed._')
              raise SystemExit(0)

          raw=matches[0]
          s=raw.get('settings') if isinstance(raw.get('settings'),dict) else {}
          report=raw.get('multiBbReport') if isinstance(raw.get('multiBbReport'),dict) else {}
          state=raw.get('multiBbPositions') if isinstance(raw.get('multiBbPositions'),dict) else {}
          state_version=num(raw.get('configVersion',s.get('version',0)),0)
          report_version=num(report.get('configVersion'),0)
          current=(state_version>0 and report_version==state_version)
          reasons=reason_counts(report.get('entrySkipReasons'))
          status=str(report.get('entryStatus') or 'UNKNOWN')
          reason=str(report.get('entryReason') or '').strip()
          updated=num(report.get('updatedAtMs'),0)
          updated_iso=datetime.fromtimestamp(updated/1000,tz=timezone.utc).isoformat() if updated>0 else 'unknown'

          print(f'- Bot enabled: **{"yes" if raw.get("enabled") is True else "no"}**')
          print(f'- Scanner report is current for saved settings: **{"yes" if current else "no"}**')
          print(f'- Bollinger entry filter: **{"ON" if s.get("bollingerEntryFilter15mEnabled") is True else "OFF"}**')
          print(f'- Bollinger timeframe: **{s.get("bollingerEntryFilterTimeframe") or "15m"}**')
          print(f'- Slots configured: **{num(s.get("longSlots"))} LONG / {num(s.get("shortSlots"))} SHORT**')
          print(f'- Active in report: **{num(report.get("activeLong"))} LONG / {num(report.get("activeShort"))} SHORT**')
          print(f'- Remaining in report: **{num(report.get("remainingLong"))} LONG / {num(report.get("remainingShort"))} SHORT**')
          print(f'- Entry status: **{status}**')
          if reason: print(f'- Entry reason: **{reason[:240]}**')
          print(f'- Candidate count BEFORE Bollinger: **{num(report.get("candidateCount"))}**')
          print(f'- Scanned candidates: **{num(report.get("scannedCandidateCount"))}**')
          print(f'- Executable candidates: **{num(report.get("executableCandidateCount"))}**')
          print(f'- BB/price rejects: **{reasons["bb"]}**')
          print(f'- Leverage rejects: **{reasons["leverage"]}**')
          print(f'- Margin/minimum-order rejects: **{reasons["margin"] + num(report.get("minimumOrderRejectedCount"))}**')
          print(f'- SHORT-requires-LONG rejects: **{reasons["pair"]}**')
          print(f'- Capacity rejects: **{reasons["capacity"]}**')
          print(f'- Other rejects: **{reasons["other"]}**')
          print(f'- Account position count: **{num(report.get("accountPositionCount"))}**')
          print(f'- Account remaining capacity: **{num(report.get("accountRemainingCapacity"))}**')
          print(f'- Managed Strategy-2 rows: **{len(state)}**')
          print(f'- SHORT only with LONG: **{"ON" if s.get("shortRequiresLongEnabled") is True else "OFF"}**')
          print(f'- Legacy asymmetric mode: **{"ON" if s.get("asymmetricHedgeModeEnabled") is True else "OFF"}**')
          print(f'- Report updated UTC: **{updated_iso}**')
          print()
          print('### Conclusion')
          if not current:
              print('The visible “0 kandidaten” is not reliable evidence of a market/Bollinger shortage: the scanner report is from an older settings version. The UI intentionally displays 0 candidates until a fresh report catches up.')
          elif status=='WAITING_BOLLINGER_ENTRY' and reasons['bb']>0:
              print('Confirmed: the free seat(s) are currently waiting on the Bollinger entry gate. The pre-Bollinger pool exists, but candidates are rejected by the configured price/Bollinger condition.')
          elif num(report.get('candidateCount'))==0:
              print('Not Bollinger: the candidate pool is already empty before the Bollinger check. The cause is upstream market/ranking availability or candidate construction.')
          elif status=='WAITING_BUDGET' or reasons['margin']>0 or num(report.get('minimumOrderRejectedCount'))>0:
              print('Not primarily Bollinger: candidate(s) exist, but margin/minimum-order constraints are blocking entries.')
          elif status=='WAITING_EXCHANGE' or reasons['leverage']>0:
              print('Not primarily Bollinger: candidate(s) exist, but leverage/exchange data constraints are blocking entries.')
          elif status=='WAITING_ACCOUNT_CAP':
              print('Not Bollinger: account-capacity logic is blocking new entries.')
          else:
              print('Bollinger is not confirmed as the blocker by the current report. The entry status and rejection counts above show the active gate.')
          print()
          print('_Sanitized read-only inspection only. No UID, email, wallet, credential, order payload or setting was emitted or changed._')
          PY

      - name: Publish sanitized diagnosis
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/result.md" ]; then
            gh issue comment "$RESULT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
          else
            gh issue comment "$RESULT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Read-only 35/30 diagnosis failed before a sanitized result was produced. No settings or orders were changed."
          fi
