name: Verify Aster status sync fix 20260921

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/verify-aster-status-sync-fix-20260921.yml"

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - run: pip install -q -r cloud_api/requirements.txt pytest
      - name: Run complete backend regression suite
        working-directory: cloud_api
        run: pytest -q
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 209 --repo "$GITHUB_REPOSITORY" --body "ASTER_STATUS_SYNC_TESTS=PASS · complete backend pytest suite · source $(git rev-parse HEAD)"
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 209 --repo "$GITHUB_REPOSITORY" --body "ASTER_STATUS_SYNC_TESTS=FAIL · source $(git rev-parse HEAD)"
