name: Aavansh runtime IAM publish 2026-09-17

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/aavansh-runtime-iam-publish-20260917.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aavansh-runtime-iam-publish-20260917
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  BASE_CLOUD_RUN_SERVICE: amar-bot-v44-direct-install
  CLOUD_RUN_SERVICE: aavansh-trading-v1
  AAVANSH_IMAGE: europe-west4-docker.pkg.dev/tradementor-production/tradementor/aavansh-trading-web@sha256:3e53b57fe9f712773348b02b82c8d41b636d530f39992b342b14801c6204d913
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: 604335232956-compute@developer.gserviceaccount.com

jobs:
  probe-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify immutable isolation scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$GCP_PROJECT_ID" = "tradementor-production"
          test "$GCP_REGION" = "europe-west4"
          test "$BASE_CLOUD_RUN_SERVICE" = "amar-bot-v44-direct-install"
          test "$CLOUD_RUN_SERVICE" = "aavansh-trading-v1"
          test "$CLOUD_RUN_SERVICE" != "$BASE_CLOUD_RUN_SERVICE"

      - name: Authenticate canonical deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture Build 371 and Aavansh pre-state
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$BASE_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/base-before.json"
          gcloud run services get-iam-policy "$BASE_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/base-iam-before.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/aavansh-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/aavansh-iam-before.json"
          python - "$RUNNER_TEMP/base-before.json" "$RUNNER_TEMP/aavansh-before.json" "$RUNNER_TEMP/aavansh-iam-before.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          base=json.load(open(sys.argv[1],encoding='utf-8'))
          av=json.load(open(sys.argv[2],encoding='utf-8'))
          iam=json.load(open(sys.argv[3],encoding='utf-8'))
          base_live=[x for x in base['status'].get('traffic',[]) if int(x.get('percent',0))==100]
          av_live=[x for x in av['status'].get('traffic',[]) if int(x.get('percent',0))==100]
          assert len(base_live)==1, base_live
          assert len(av_live)==1, av_live
          print('BASE_URL='+str(base['status']['url']))
          print('BASE_REVISION='+str(base_live[0]['revisionName']))
          print('AAVANSH_BEFORE_REVISION='+str(av_live[0]['revisionName']))
          print('AAVANSH_URL='+str(av['status']['url']))
          public=any(b.get('role')=='roles/run.invoker' and 'allUsers' in b.get('members',[]) for b in iam.get('bindings',[]))
          print('AAVANSH_PUBLIC_BEFORE='+('1' if public else '0'))
          PY

      - name: Probe deploy identity Cloud Run IAM permission read-only
        id: deploy_iam
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > "$RUNNER_TEMP/permissions.json" <<'JSON'
          {"permissions":["run.services.get","run.services.update","run.services.setIamPolicy"]}
          JSON
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/permissions.json" \
            "https://run.googleapis.com/v1/projects/$GCP_PROJECT_ID/locations/$GCP_REGION/services/$CLOUD_RUN_SERVICE:testIamPermissions" \
            > "$RUNNER_TEMP/deploy-permissions.json"
          unset ACCESS_TOKEN
          python - "$RUNNER_TEMP/deploy-permissions.json" <<'PY'
          import json,sys
          p=set(json.load(open(sys.argv[1],encoding='utf-8')).get('permissions',[]))
          print('DEPLOY_IDENTITY_PERMISSIONS='+','.join(sorted(p)))
          print('DEPLOY_CAN_SET_IAM='+('1' if 'run.services.setIamPolicy' in p else '0'))
          PY

      - name: Test runtime service-account impersonation and IAM permission read-only
        id: runtime_probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RUNTIME_TOKEN="$(gcloud auth print-access-token --impersonate-service-account="$RUNTIME_SERVICE_ACCOUNT" 2>"$RUNNER_TEMP/impersonation.err")"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ -z "$RUNTIME_TOKEN" ]; then
            echo "RUNTIME_IMPERSONATION=0"
            cat "$RUNNER_TEMP/impersonation.err" >&2 || true
            echo "runtime_can_set_iam=0" >> "$GITHUB_OUTPUT"
            exit 21
          fi
          echo "RUNTIME_IMPERSONATION=1"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/permissions.json" \
            "https://run.googleapis.com/v1/projects/$GCP_PROJECT_ID/locations/$GCP_REGION/services/$CLOUD_RUN_SERVICE:testIamPermissions" \
            > "$RUNNER_TEMP/runtime-permissions.json"
          unset RUNTIME_TOKEN
          CAN_SET="$(python - "$RUNNER_TEMP/runtime-permissions.json" <<'PY'
          import json,sys
          p=set(json.load(open(sys.argv[1],encoding='utf-8')).get('permissions',[]))
          print('1' if 'run.services.setIamPolicy' in p else '0')
          print('RUNTIME_IDENTITY_PERMISSIONS='+','.join(sorted(p)), file=sys.stderr)
          PY
          )"
          echo "runtime_can_set_iam=$CAN_SET" >> "$GITHUB_OUTPUT"
          test "$CAN_SET" = "1"

      - name: Grant public invoker only to isolated Aavansh service
        id: public
        if: steps.runtime_probe.outputs.runtime_can_set_iam == '1'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --impersonate-service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --quiet
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/aavansh-iam-public.json"
          python - "$RUNNER_TEMP/aavansh-iam-public.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert any(b.get('role')=='roles/run.invoker' and 'allUsers' in b.get('members',[]) for b in p.get('bindings',[])), p
          PY

      - name: Deploy exact tested Aavansh image only
        id: deploy
        if: steps.public.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="a3-e31fbd8c-${GITHUB_RUN_ATTEMPT}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$AAVANSH_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "AAVANSH_TRADING=1" \
            --timeout 300 \
            --concurrency 80 \
            --revision-suffix "$SUFFIX" \
            --quiet

      - name: Verify anonymous root and isolated PWA contract
        id: verify
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          AAVANSH_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$AAVANSH_URL"
          test "$AAVANSH_URL" != "$BASE_URL"
          echo "VERIFIED_AAVANSH_URL=$AAVANSH_URL" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "$AAVANSH_URL/" > "$RUNNER_TEMP/aavansh-root.html"
          grep -q 'AAVANSH TRADING' "$RUNNER_TEMP/aavansh-root.html"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$AAVANSH_URL/manifest.webmanifest" > "$RUNNER_TEMP/aavansh-manifest.json"
          grep -q '"name": "Aavansh Trading"' "$RUNNER_TEMP/aavansh-manifest.json"
          grep -q '"id": "/aavansh-trading-v1"' "$RUNNER_TEMP/aavansh-manifest.json"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$AAVANSH_URL/sw.js" > "$RUNNER_TEMP/aavansh-sw.js"
          grep -q 'aavansh-trading-shell-v1' "$RUNNER_TEMP/aavansh-sw.js"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$AAVANSH_URL/offline.html" > /dev/null
          echo "PUBLIC_PWA_VERIFIED=$AAVANSH_URL"

      - name: Prove Build 371 stayed untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$BASE_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/base-after.json"
          gcloud run services get-iam-policy "$BASE_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/base-iam-after.json"
          python - "$RUNNER_TEMP/base-before.json" "$RUNNER_TEMP/base-after.json" "$RUNNER_TEMP/base-iam-before.json" "$RUNNER_TEMP/base-iam-after.json" "$BASE_REVISION" <<'PY'
          import json,sys
          before=json.load(open(sys.argv[1],encoding='utf-8'))
          after=json.load(open(sys.argv[2],encoding='utf-8'))
          ib=json.load(open(sys.argv[3],encoding='utf-8'))
          ia=json.load(open(sys.argv[4],encoding='utf-8'))
          expected=sys.argv[5]
          live=[x for x in after['status'].get('traffic',[]) if int(x.get('percent',0))==100]
          assert len(live)==1 and live[0].get('revisionName')==expected, live
          assert before['spec']==after['spec']
          assert ib==ia
          print('BUILD371_UNCHANGED=1')
          PY

      - name: Restore Aavansh pre-state if publication verification fails
        if: failure() && steps.public.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AAVANSH_BEFORE_REVISION:-}" ]; then
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$AAVANSH_BEFORE_REVISION=100" --quiet || true
          fi
          if [ "${AAVANSH_PUBLIC_BEFORE:-0}" = "0" ]; then
            gcloud run services remove-iam-policy-binding "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --member="allUsers" --role="roles/run.invoker" \
              --impersonate-service-account="$RUNTIME_SERVICE_ACCOUNT" --quiet || true
          fi

      - name: Publish verified install link
        if: success()
        shell: bash
        run: |
          {
            echo "## Aavansh Trading v1 publicly verified"
            echo ""
            echo "- Install/open URL: $VERIFIED_AAVANSH_URL"
            echo "- Exact image digest: sha256:3e53b57fe9f712773348b02b82c8d41b636d530f39992b342b14801c6204d913"
            echo "- Build 371 untouched: $BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
