name: Apply Focus V2 Directional Hedge Fix V2

on:
  push:
    branches: [agent/focus-v2-directional-fix-20260829]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'TradeMentor Directional Fix Agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/focus-v2-directional-fix-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply directional behavior and UI fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_api/aster_strategy2_focus_v2.py'); s=p.read_text()
          a='''    elif state.recovery_model_version>=RECOVERY_MODEL_SIMPLE:\n        simple_status=(\"SHORT VRIJ · LONG KRIJGT RUIMTE\" if state.release_stage>0 and short_qty<=max(1e-10,(max(1.0,long_notional*.002)/max(mark,1e-12))) else \"DALING · BESCHERMD\")'''
          b='''    elif state.recovery_model_version>=RECOVERY_MODEL_SIMPLE:\n        # Directional contract: upward recovery releases the airbag toward zero; downside protection is rebuilt.\n        simple_status=(\"OMHOOG · LONG-ONLY\" if state.release_stage>0 and short_qty<=max(1e-10,(max(1.0,long_notional*.002)/max(mark,1e-12))) else \"OMLAAG · SHORT BESCHERMT\")'''
          if a not in s: raise SystemExit('status marker missing')
          s=s.replace(a,b)
          a='''\"shortReleaseReady\":bool(price_met and middle_met and state.release_stage==0),\"recoveryStatus\":simple_status'''
          b='''\"shortReleaseReady\":bool(mark>state.recent_low and middle_met and state.release_stage==0),\"recoveryStatus\":simple_status'''
          if a not in s: raise SystemExit('release marker missing')
          s=s.replace(a,b); p.write_text(s)
          for fp in (Path('web/components/trading-chart.tsx'),Path('web/app/page.tsx')):
              if fp.exists():
                  t=fp.read_text().replace('HERSTELTRIGGER · SHORT VRIJ','HEDGE-AFBOUW · OMHOOG').replace('HERSTELTRIGGER','HEDGE-AFBOUW')
                  fp.write_text(t)
          Path('cloud_api/test_focus_v2_directional_contract.py').write_text('''from pathlib import Path\n\ndef test_simple_focus_v2_directional_contract():\n    src=Path(__file__).with_name("aster_strategy2_focus_v2.py").read_text()\n    assert "mark>state.recent_low and middle_met" in src\n    assert "OMHOOG · LONG-ONLY" in src\n    assert "OMLAAG · SHORT BESCHERMT" in src\n''')
          Path('web/tests/focus-v2-directional-hedge-ui.test.mjs').write_text('''import test from "node:test";import assert from "node:assert/strict";import fs from "node:fs";\ntest("no legacy fixed short-free trigger",()=>{const c=fs.readFileSync(new URL("../components/trading-chart.tsx",import.meta.url),"utf8");assert.equal(c.includes("HERSTELTRIGGER · SHORT VRIJ"),false);});\n''')
          PY
      - name: Backend regression tests
        run: |
          python -m pip install -r cloud_api/requirements.txt
          cd cloud_api
          pytest -q test_focus_v2_directional_contract.py test_aster_strategy2_focus_v2.py test_focus_v2_simple_recovery.py
      - name: Web regression tests
        run: |
          cd web
          npm ci
          npm test
      - name: Commit tested implementation
        run: |
          git config user.name 'TradeMentor Directional Fix Agent'
          git config user.email 'noreply@openai.com'
          git add cloud_api/aster_strategy2_focus_v2.py cloud_api/test_focus_v2_directional_contract.py web/components/trading-chart.tsx web/app/page.tsx web/tests/focus-v2-directional-hedge-ui.test.mjs
          git commit -m 'fix: restore directional Focus 2.0 hedge behavior'
          git push origin HEAD:agent/focus-v2-directional-fix-20260829
