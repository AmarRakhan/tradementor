name: Deploy Profit Lock Production Backend Once 20260911
# operational trigger: deploy canonical Profit Lock backend after stale production API was confirmed

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - .github/workflows/deploy-profit-lock-production-backend-once-20260911.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-backend
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out exact live branch source
        uses: actions/checkout@v4

      - name: Verify immutable production scope and Profit Lock source
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$GCP_PROJECT_ID" = "tradementor-production"
          test "$GCP_REGION" = "europe-west4"
          test "$CLOUD_RUN_SERVICE" = "tradementor-api"
          grep -q 'profit_lock_ladder_enabled' cloud_api/aster_multi_bb.py
          grep -q 'profitLockLadderEnabled' cloud_api/aster_multi_bb.py
          grep -q 'profitLockLevels' cloud_api/aster_multi_bb.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run all backend tests
        working-directory: cloud_api
        run: pytest -q

      - name: Authenticate to Google Cloud without stored keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture production configuration
        shell: bash
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/service-before.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          spec = service["spec"]["template"]["spec"]
          variables = {item["name"]: item.get("value") for item in spec["containers"][0].get("env", [])}
          assert variables.get("ASTER_LIVE_EXECUTION_ENABLED") == "true"
          assert variables.get("ASTER_STRATEGY2_LIVE_ENABLED") == "true"
          runtime_service_account = spec.get("serviceAccountName")
          service_url = service["status"]["url"]
          live = [row for row in service["status"].get("traffic", []) if int(row.get("percent", 0)) == 100]
          assert runtime_service_account and service_url.startswith("https://")
          assert len(live) == 1
          print(f"RUNTIME_SERVICE_ACCOUNT={runtime_service_account}")
          print(f"SERVICE_URL={service_url}")
          print(f"BEFORE_REVISION={live[0]['revisionName']}")
          PY

      - name: Build and push backend image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:$GITHUB_SHA"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy candidate without production traffic
        shell: bash
        run: |
          REVISION_SUFFIX="gh-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --update-env-vars "ASTER_REALTIME_WORKER=true,ASTER_REALTIME_EXECUTION_ENABLED=true" \
            --no-traffic \
            --tag "$TAG"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service-candidate.json"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))
          after = json.load(open(sys.argv[2], encoding="utf-8"))
          tag = sys.argv[3]
          before_spec = before["spec"]["template"]["spec"]
          after_spec = after["spec"]["template"]["spec"]
          assert before_spec.get("serviceAccountName") == after_spec.get("serviceAccountName")
          assert before_spec.get("timeoutSeconds") == after_spec.get("timeoutSeconds")
          assert before_spec.get("containerConcurrency") == after_spec.get("containerConcurrency")
          before_env = {item["name"]: item.get("value") for item in before_spec["containers"][0].get("env", [])}
          after_env = {item["name"]: item.get("value") for item in after_spec["containers"][0].get("env", [])}
          expected_env = dict(before_env)
          expected_env.update({"ASTER_REALTIME_WORKER": "true", "ASTER_REALTIME_EXECUTION_ENABLED": "true"})
          assert after_env == expected_env
          candidate = next(row for row in after["status"]["traffic"] if row.get("tag") == tag)
          print(f"CANDIDATE_URL={candidate['url']}")
          print(f"CANDIDATE_REVISION={candidate['revisionName']}")
          PY

      - name: Verify candidate health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$CANDIDATE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          PY

      - name: Promote verified revision
        shell: bash
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$CANDIDATE_REVISION=100"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$SERVICE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          PY

      - name: Verify promoted revision and IAM are unchanged
        shell: bash
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service-after.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/service-after.json" "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" "$CANDIDATE_REVISION" <<'PY'
          import json
          import sys

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          before_iam = json.load(open(sys.argv[2], encoding="utf-8"))
          after_iam = json.load(open(sys.argv[3], encoding="utf-8"))
          candidate = sys.argv[4]
          live = [row for row in service["status"].get("traffic", []) if int(row.get("percent", 0)) == 100]
          assert len(live) == 1 and live[0].get("revisionName") == candidate, live
          assert before_iam == after_iam
          PY
