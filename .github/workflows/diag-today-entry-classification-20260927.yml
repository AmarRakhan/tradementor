name: Diagnose today's entry classification 2026-09-27

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/diag-today-entry-classification-20260927.yml"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  OBSERVER_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run read-only today's entry classification
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t V < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));sp=s['spec']['template']['spec']
          print(sp['containers'][0]['image']);print(sp['serviceAccountName'])
          PY
          )
          JOB="tm-entryclass-${GITHUB_RUN_ID: -7}"
          MARKER="ENTRYCLASS_${GITHUB_RUN_ID}"
          echo "DIAG_JOB=$JOB" >> "$GITHUB_ENV"; echo "DIAG_MARKER=$MARKER" >> "$GITHUB_ENV"

          SCRIPT="$(base64 -w0 <<'PY'
          import json,os,math
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from google.cloud import firestore
          import main

          def n(v,d=0.0):
              try:
                  x=float(v);return x if math.isfinite(x) else d
              except Exception:return d
          def ms(v):
              if isinstance(v,datetime):
                  x=v if v.tzinfo else v.replace(tzinfo=timezone.utc)
                  return int(x.astimezone(timezone.utc).timestamp()*1000)
              if isinstance(v,(int,float)):return int(v)
              if isinstance(v,str):
                  try:return int(datetime.fromisoformat(v.replace('Z','+00:00')).timestamp()*1000)
                  except Exception:return int(n(v))
              return 0
          local=ZoneInfo('Europe/Amsterdam')
          def loc(m):
              return datetime.fromtimestamp(m/1000,timezone.utc).astimezone(local).isoformat() if m else None

          db=firestore.Client(project='tradementor-production')
          owner=db.collection('systemConfiguration').document('continuityDashboardV1').get().to_dict() or {}
          uid=str(owner.get('ownerUid') or '').strip()
          if not uid:
              print(os.environ['MARKER']+'='+json.dumps({'error':'OWNER_NOT_CONFIGURED'}),flush=True);raise SystemExit
          user={'uid':uid}

          now=datetime.now(timezone.utc); local_now=now.astimezone(local)
          start_local=local_now.replace(hour=0,minute=0,second=0,microsecond=0)
          start_utc=start_local.astimezone(timezone.utc)

          audits=[]
          for d in main.aster_strategy2_reference(uid).collection('audit').where('timestamp','>=',start_utc).stream():
              v=d.to_dict() or {};v['_id']=d.id;v['_ms']=ms(v.get('timestamp',v.get('timestampMs')));audits.append(v)
          audits.sort(key=lambda x:x['_ms'])

          entries=[]
          for a in audits:
              if str(a.get('event') or '').upper()!='MULTI_BB_ENTRY':continue
              role=str(a.get('soldierRole') or '').upper().strip()
              sid=str(a.get('soldierId') or '').strip()
              category='ZONE_BASE' if role=='ZONE_BASE' and sid else 'EXPOSURE_BALANCER' if role=='EXPOSURE_BALANCER' and sid else 'LEGACY_UNASSIGNED' if role=='LEGACY_UNASSIGNED' else 'NO_SOLDIER_METADATA'
              entries.append({
                  'timeLocal':loc(a['_ms']),
                  'symbol':str(a.get('symbol') or '').upper(),
                  'side':str(a.get('side') or '').upper(),
                  'originZone':a.get('originZone'),
                  'soldierRole':role or None,
                  'soldierId':sid or None,
                  'category':category,
                  'cycleId':a.get('cycleId'),
              })

          event_counts={}
          for a in audits:
              ev=str(a.get('event') or 'UNKNOWN').upper();event_counts[ev]=event_counts.get(ev,0)+1

          # Current open positions and current managed metadata, to show today's remaining inventory.
          secret=main.load_aster_secret(user)
          client=main.AsterV3Client(signer_address=secret.signer_address,sign_message=main.local_eip712_signer(secret),live_authorized=False)
          live=[r for r in (client.position_risk() or []) if isinstance(r,dict) and abs(n(r.get('positionAmt',r.get('quantity'))))>0]
          strategy=main.aster_strategy2_reference(uid).get().to_dict() or {}
          multi=strategy.get('multiBbPositions') if isinstance(strategy.get('multiBbPositions'),dict) else {}
          current_today=[]
          for key,v in multi.items():
              if not isinstance(v,dict) or '|' not in str(key):continue
              stamp=int(n(v.get('cycleStartedAtMs',v.get('openedAtMs'))))
              if stamp < int(start_utc.timestamp()*1000):continue
              sym,side=str(key).upper().split('|',1)
              current_today.append({
                  'symbol':sym,'side':side,'openedLocal':loc(stamp),
                  'soldierRole':str(v.get('soldierRole') or '').upper() or None,
                  'soldierId':str(v.get('soldierId') or '') or None,
                  'originZone':v.get('originZone'),
              })

          by_category={}
          for e in entries:by_category[e['category']]=by_category.get(e['category'],0)+1
          out={
              'generatedAt':now.isoformat(),'localDate':local_now.date().isoformat(),'timezone':'Europe/Amsterdam','readOnly':True,
              'auditEventCounts':event_counts,
              'multiBbEntryCountToday':len(entries),
              'entryCountByCategory':by_category,
              'entries':entries,
              'currentManagedPositionsOpenedToday':current_today,
              'currentManagedPositionsOpenedTodayCount':len(current_today),
          }
          print(os.environ['MARKER']+'='+json.dumps(out,separators=(',',':'),sort_keys=True,default=str),flush=True)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "${V[0]}" --service-account "${V[1]}" --set-env-vars "MARKER=$MARKER"             --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT'))"             --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null

      - name: Authenticate observer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}

      - name: Collect and publish
        shell: bash
        run: |
          set -euo pipefail
          for N in $(seq 1 15); do
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\"" --project "$GCP_PROJECT_ID" --freshness=15m --limit=100 --order=desc --format=json > "$RUNNER_TEMP/logs.json"
            python - "$DIAG_MARKER" "$RUNNER_TEMP/logs.json" > "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          m=sys.argv[1]+'=';rows=json.load(open(sys.argv[2],encoding='utf-8'))
          def walk(x):
              if isinstance(x,str):yield x
              elif isinstance(x,dict):
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          for row in rows:
              for s in walk(row):
                  if m in s:
                      raw=s[s.index(m)+len(m):].splitlines()[0];json.loads(raw);print(raw);raise SystemExit
          PY
            [ -s "$RUNNER_TEMP/result.json" ] && break
            sleep 2
          done
          test -s "$RUNNER_TEMP/result.json"
          mkdir -p .diagnostics
          cp "$RUNNER_TEMP/result.json" .diagnostics/today-entry-classification-20260927.json
          git config user.name "TradeMentor Diagnostics";git config user.email "actions@users.noreply.github.com"
          git add .diagnostics/today-entry-classification-20260927.json
          git diff --cached --quiet && exit 0
          git commit -m "Record today's entry classification diagnostic"
          git push origin HEAD:amar-crypto-bot-2026-cloud

      - name: Re-authenticate deploy for cleanup
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${DIAG_JOB:-}" ]; then gcloud run jobs delete "$DIAG_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true; fi
