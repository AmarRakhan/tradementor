name: Validate Dutch News V46

on:
  push:
    branches: [chatgpt/news-dutch-v46-build269-20260907]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Dutch News regression contract
        working-directory: web
        run: node --experimental-strip-types --test tests/news-view.test.mjs
