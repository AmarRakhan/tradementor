name: Apply Focus Simple Deterministic Flow 20260830

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - tools/apply_focus_simple_deterministic_flow_20260830.py
      - tools/apply_focus_simple_pending_sync_20260830.py
      - .github/workflows/apply-focus-simple-deterministic-flow-20260830.yml

permissions:
  contents: write

concurrency:
  group: focus-simple-deterministic-flow-20260830
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Apply deterministic Focus patch
        run: |
          python tools/apply_focus_simple_deterministic_flow_20260830.py
          python tools/apply_focus_simple_pending_sync_20260830.py

      - name: Normalize generated regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloud_api/test_focus_simple_deterministic_flow.py')
          s = p.read_text(encoding='utf-8')
          if '\\n' in s:
              p.write_text(s.replace('\\n', '\n'), encoding='utf-8')
          PY

      - name: Install backend test dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run focused regression tests
        working-directory: cloud_api
        run: |
          pytest -q \
            test_focus_simple_deterministic_flow.py \
            test_aster_strategy2_focus_trailing.py \
            test_aster_strategy2_focus_live_execution_paths.py

      - name: Run full backend suite
        working-directory: cloud_api
        run: pytest -q

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'focus-flow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            cloud_api/aster_strategy2_focus_trailing.py \
            cloud_api/test_focus_simple_deterministic_flow.py \
            cloud_api/test_aster_strategy2_focus_trailing.py
          if git diff --cached --quiet; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git commit -m 'Simplify Focus Strategy-2 deterministic hedge flow'
          git push origin HEAD:amar-crypto-bot-2026-cloud

