name: Reproduce and repair pairing exchange truth 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/apply-pairing-exchange-truth-fix-20260917.yml'

permissions:
  contents: write

jobs:
  reproduce-fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest
      - name: Reproduce reported stale-snapshot orphan miss on current source
        working-directory: cloud_api
        shell: bash
        run: |
          python - <<'PY'
          import time
          from aster_multi_bb import run_multi_bb_step
          from test_aster_multi_bb import Client, Ref, cfg
          from test_short_requires_long_pairing_20260917 import pos, state_for

          short = pos('ZECUSDT', 'SHORT')
          client = Client(
              positions=[short],
              tickers=[{'symbol':'AAAUSDT','quoteVolume':'999999'}],
              prices={'AAAUSDT':100,'ZECUSDT':100}, leverage=100,
          )
          result = run_multi_bb_step(
              client=client, ref=Ref(), raw_state=state_for('ZECUSDT','SHORT'),
              settings=cfg(maximumPositions=3,longSlots=2,shortSlots=1,
                           shortRequiresLongEnabled=True,universeTopN=2),
              uid='u', account={'availableBalance':'1000'},
              positions=[], open_orders=[], timestamp_ms=int(time.time()*1000), dry_run=True,
          )
          entries=[x for x in result['actions'] if x.get('kind')=='ENTRY']
          assert not any(x.get('symbol')=='ZECUSDT' and x.get('side')=='LONG' for x in entries), result
          assert entries and entries[0].get('symbol')=='AAAUSDT', result
          print('REPRODUCED: stale caller snapshot hides live ZEC orphan and unrelated LONG wins')
          PY
      - name: Apply exchange-truth repair and regression coverage
        run: python tools/fix_pairing_exchange_truth_20260917.py
      - name: Compile backend
        run: python -m compileall -q cloud_api
      - name: Run focused SHORT-LONG and Bollinger regressions
        working-directory: cloud_api
        run: python -m pytest -q test_short_requires_long_pairing_20260917.py test_aster_bollinger_entry_filter_seat_flow.py test_same_symbol_dual_side_20260906.py test_aster_multi_bb.py
      - name: Run full backend suite
        working-directory: cloud_api
        run: python -m pytest -q
      - name: Commit only verified runtime and regression changes
        run: |
          set -euo pipefail
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_short_requires_long_pairing_20260917.py
          git diff --cached --quiet && { echo 'No verified runtime changes to commit'; exit 1; }
          git commit -m 'Use fresh Aster position truth for SHORT-LONG pairing priority'
          git push origin HEAD:amar-crypto-bot-2026-cloud
