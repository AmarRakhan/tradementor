name: Temporary Portfolio Cycle Fix Validation

on:
  push:
    branches:
      - fix/portfolio-cycle-real-close-equity-20260926

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies
        working-directory: cloud_api
        run: pip install -r requirements.txt pytest
      - name: Portfolio TP regression
        working-directory: cloud_api
        run: pytest -q test_aster_portfolio_tp_mode.py test_aster_portfolio_tp_v2.py test_aster_portfolio_tp_races.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Portfolio Cycle card regression
        working-directory: web
        run: node --test tests/portfolio-cycle-card.test.mjs
      - name: Production web build
        working-directory: web
        run: npm run build
