name: Apply Focus V7 Emergency Equity Lock 20260830

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - .deploy/focus-v7-emergency-equity-lock-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Apply emergency equity lock
        run: python tools/apply_focus_v7_emergency_equity_lock_20260830.py
      - name: Install test dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Run focused emergency and Strategy 2 tests
        run: |
          cd cloud_api
          pytest -q test_focus_v7_emergency_equity_lock.py test_focus_portfolio_cycle_v7.py test_focus_simple_deterministic_flow.py test_aster_strategy2_focus_trailing.py
      - name: Run complete backend suite
        run: |
          cd cloud_api
          pytest -q
      - name: Commit verified hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_api/aster_strategy2_focus_trailing.py cloud_api/test_focus_v7_emergency_equity_lock.py
          git commit -m 'Stop Strategy 2 equity bleed below cycle baseline'
          git push origin HEAD:amar-crypto-bot-2026-cloud
