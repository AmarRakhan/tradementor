name: Diagnose rrmk Strategy 2 budget read-only
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/diagnose-rrmk-budget-read-only.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL: rrmk18@outlook.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-budget-${GITHUB_RUN_ID: -6}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          S="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$S"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image' "$S")"
          SA="$(jq -r '.spec.template.spec.serviceAccountName' "$S")"
          B64="$(base64 -w0 <<'PY'
          import json,os
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          from main import load_aster_secret,local_eip712_signer
          from aster_gateway import AsterV3Client
          app=firebase_admin.initialize_app(options={"projectId":"tradementor-production"},name="budget-check")
          u=auth.get_user_by_email(os.environ["TARGET_EMAIL"],app=app)
          db=firestore.Client(project="tradementor-amar-20260813")
          s=db.collection("asterStrategy2").document(u.uid).get().to_dict() or {}
          cfg=s.get("settings") if isinstance(s.get("settings"),dict) else {}
          snap=s.get("accountSnapshot") if isinstance(s.get("accountSnapshot"),dict) else {}
          sec=load_aster_secret({"uid":u.uid})
          c=AsterV3Client(signer_address=sec.signer_address,sign_message=local_eip712_signer(sec),live_authorized=False)
          acct=c.account_information(); ps=c.position_risk()
          active=[p for p in ps if abs(float(p.get("positionAmt") or 0))>0]
          def num(v):
            try:return float(v or 0)
            except:return 0
          out={"phase":s.get("phase"),"reason":s.get("lastReason"),"target":cfg.get("maximumPairs"),
            "strategyBudget":cfg.get("strategyBudget"),"defensiveMarginRatio":cfg.get("defensiveMarginRatio"),
            "snapshotEquity":snap.get("equity"),"snapshotStrategyMargin":snap.get("strategyMargin"),
            "snapshotMarginRatio":snap.get("marginRatio"),"exchangeTotalInitialMargin":num(acct.get("totalInitialMargin")),
            "exchangeTotalMaintMargin":num(acct.get("totalMaintMargin")),"exchangeAvailableBalance":num(acct.get("availableBalance")),
            "positionInitialMarginSum":sum(num(p.get("initialMargin")) for p in active),
            "positionIsolatedMarginSum":sum(num(p.get("isolatedMargin")) for p in active),
            "positions":len(active),"readOnly":True,"ordersSent":0,"stateWrites":0}
          print("RRMK_BUDGET_CHECK "+json.dumps(out,separators=(",",":"),ensure_ascii=True))
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --service-account "$SA" --command python --args=-c,"import base64;exec(base64.b64decode('$B64'))" --set-env-vars "TARGET_EMAIL=$TARGET_EMAIL,GOOGLE_CLOUD_QUOTA_PROJECT=tradementor-production,GOOGLE_CLOUD_PROJECT=tradementor-amar-20260813" --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB AND textPayload:\"RRMK_BUDGET_CHECK\"" --project "$GCP_PROJECT_ID" --freshness 15m --limit 5 --format='value(textPayload)'
