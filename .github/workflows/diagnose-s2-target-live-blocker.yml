name: Diagnose hashed Strategy 2 live blocker
# Recheck exact Aster snapshot after the account-specific IAM propagation window.

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/diagnose-s2-target-live-blocker.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read exact account and Aster state without mutations
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-target-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          spec=json.load(open(sys.argv[1],encoding="utf-8"))["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"])
          print(spec["serviceAccountName"])
          PY
          )
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from google.cloud import firestore
          from main import load_aster_secret,local_eip712_signer,proven_owned_rows
          from aster_gateway import AsterV3Client

          target_hash="44246fcb6d4b8400bc3944e50d1b62682399fb50e5bad2ad7729eae09910b94c"
          db=firestore.Client(project="tradementor-amar-20260813")
          matches=[row for row in db.collection("asterStrategy2").stream()
              if hashlib.sha256(row.id.encode()).hexdigest()==target_hash]
          if len(matches)!=1:
              raise SystemExit(220+min(len(matches),9))
          uid=matches[0].id
          snap=db.collection("asterStrategy2").document(uid).get()
          s2=(snap.to_dict() or {}) if snap.exists else {}
          s1=db.collection("asterAutomation").document(uid).get().to_dict() or {}
          s3=db.collection("asterStrategy3").document(uid).get().to_dict() or {}
          canary=(db.collection("asterStrategy2").document(uid).collection("canaries").document("open-fill-close-v1").get().to_dict() or {})
          rows=proven_owned_rows(s2.get("ownedLegs",[]),strategy_id="aster-strategy-2",engine_type="strategy2")
          persisted={(str(x.get("symbol","")).upper(),str(x.get("side","")).upper()) for x in rows}
          secret=load_aster_secret({"uid":uid})
          client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)
          positions=client.position_risk()
          orders=client.open_orders()
          active={(str(x.get("symbol","")).upper(),str(x.get("positionSide","")).upper()) for x in positions if abs(float(x.get("positionAmt") or 0))>0}
          now_ms=int(datetime.now(timezone.utc).timestamp()*1000)
          stale_costs=0
          for row in rows:
              checked=int(row.get("costs_updated_at_ms",row.get("costsUpdatedAtMs",0)) or 0)
              stale_costs+=int(not checked or now_ms-checked>300000)
          phase_codes={"":0,"STOPPED":1,"PROTECTIVE_ONLY":2,"RECONCILING":3,"RECOVERY":4,"DATA_HOLD":5,"RUNNING":6,"INITIAL_BUILD":7,"WAITING":8}
          canary_codes={"":0,"OPENING":1,"OPENED":2,"UNKNOWN":3,"REJECTED":4,"COMPLETED":5}
          intent=str(canary.get("intentPrefix",canary.get("intent_prefix","")))
          canary_orders=sum(str(x.get("clientOrderId","")).startswith(intent) for x in orders) if intent else 0
          metrics={"targetCount":len(matches),"document":int(snap.exists),"enabled":int(bool(s2.get("enabled"))),
              "monitor":int(bool(s2.get("monitor"))),"exclusive":int(bool(s2.get("exclusiveOwnership"))),
              "canaryValidated":int(bool(s2.get("canaryValidated"))),"liveReady":int(bool(s2.get("liveReady"))),
              "phase":phase_codes.get(str(s2.get("phase","")).upper(),9),
              "rawOwned":len(s2.get("ownedLegs",[]) if isinstance(s2.get("ownedLegs"),list) else []),
              "provenOwned":len(rows),"active":len(active),"openOrders":len(orders),
              "missingOwned":len(active-persisted),"staleOwned":len(persisted-active),"staleCosts":stale_costs,
              "canaryStatus":canary_codes.get(str(canary.get("status","")).upper(),9),
              "legacyActive":int(bool(s1.get("enabled") or s1.get("monitor") or s3.get("enabled") or s3.get("monitor"))),
              "canaryOrders":canary_orders,"reduceOnlyOrders":sum(bool(x.get("reduceOnly")) for x in orders)}
          print("TARGET_METRICS "+json.dumps(metrics,sort_keys=True),flush=True)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${VALUES[0]}" --service-account "${VALUES[1]}" --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS_FIELDS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index: .index, exitCode: ([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          printf 'TARGET_STATUS_FIELDS %s\n' "$STATUS_FIELDS"
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=$JOB" \
            --project "$GCP_PROJECT_ID" --freshness 20m --limit 80 --order asc \
            --format='value(textPayload,jsonPayload.message)' | sort -u
          cleanup
          trap - EXIT
