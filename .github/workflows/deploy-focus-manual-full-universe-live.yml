name: Deploy Focus Manual Full Universe Live
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
permissions:
  contents: write
  id-token: write
concurrency:
  group: focus-manual-full-universe-live
  cancel-in-progress: true
env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  ARTIFACT_REPOSITORY: tradementor
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Prove backend before deployment
        shell: bash
        run: |
          pip install -q -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Snapshot live service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/before.json"
          python - "$RUNNER_TEMP/before.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          svc=json.load(open(sys.argv[1]))
          env={x['name']:x.get('value') for x in svc['spec']['template']['spec']['containers'][0].get('env',[])}
          assert env.get('ASTER_LIVE_EXECUTION_ENABLED')=='true'
          assert env.get('ASTER_STRATEGY2_LIVE_ENABLED')=='true'
          live=[x for x in svc['status'].get('traffic',[]) if int(x.get('percent',0))==100]
          assert len(live)==1
          print('BEFORE_REVISION='+live[0]['revisionName'])
          print('SERVICE_URL='+svc['status']['url'])
          PY
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:$GITHUB_SHA"
          docker build -t "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Create and verify zero-traffic candidate
        shell: bash
        run: |
          set -euo pipefail
          TAG="focus-manual-${GITHUB_RUN_NUMBER}"
          SUFFIX="fm-${GITHUB_SHA:0:8}"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --revision-suffix "$SUFFIX" --no-traffic --tag "$TAG" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          python - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/candidate.json" "$TAG" <<'PY'
          import json,sys
          before=json.load(open(sys.argv[1]));after=json.load(open(sys.argv[2]));tag=sys.argv[3]
          assert before['spec']['template']['spec']['containers'][0].get('env',[])==after['spec']['template']['spec']['containers'][0].get('env',[])
          assert any(x.get('tag')==tag for x in after['status']['traffic'])
          PY
          CANDIDATE_REVISION=$(python -c 'import json,os; a=json.load(open(os.environ["RUNNER_TEMP"]+"/candidate.json")); tag="focus-manual-"+os.environ["GITHUB_RUN_NUMBER"]; print(next(x["revisionName"] for x in a["status"]["traffic"] if x.get("tag")==tag))')
          CANDIDATE_URL=$(python -c 'import json,os; a=json.load(open(os.environ["RUNNER_TEMP"]+"/candidate.json")); tag="focus-manual-"+os.environ["GITHUB_RUN_NUMBER"]; print(next(x["url"] for x in a["status"]["traffic"] if x.get("tag")==tag))')
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$CANDIDATE_URL/health" >/dev/null
          echo "CANDIDATE_REVISION=$CANDIDATE_REVISION" >> "$GITHUB_ENV"
      - name: Promote candidate to production
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$CANDIDATE_REVISION=100" --quiet
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$SERVICE_URL/health" >/dev/null
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/after.json"
          python - "$RUNNER_TEMP/after.json" "$CANDIDATE_REVISION" <<'PY'
          import json,sys
          svc=json.load(open(sys.argv[1]));candidate=sys.argv[2]
          live=[x for x in svc['status'].get('traffic',[]) if int(x.get('percent',0))==100]
          assert len(live)==1 and live[0].get('revisionName')==candidate
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/deploy-focus-manual-full-universe-live.yml
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add .github/workflows/deploy-focus-manual-full-universe-live.yml
          git commit -m 'chore: remove manual Focus full-universe deploy helper'
          git push origin HEAD:amar-crypto-bot-2026-cloud
