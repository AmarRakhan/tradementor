name: Dispatch dual-side DCA chart fix live v2

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/dispatch-dual-side-dca-live-v2-20260905.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical branch contains fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api repos/${{ github.repository }}/commits/amar-crypto-bot-2026-cloud --jq .sha)"
          echo "Canonical HEAD: $head"
          gh api repos/${{ github.repository }}/compare/bec7911e2130249a5cdc58210b8c82a26f7303a8...amar-crypto-bot-2026-cloud --jq '.status' | grep -Eq '^(ahead|identical)$'
      - name: Dispatch shared V46 deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-shared-v44-testapp.yml -R ${{ github.repository }} --ref amar-crypto-bot-2026-cloud
