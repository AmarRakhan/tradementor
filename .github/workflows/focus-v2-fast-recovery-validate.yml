name: Focus V2 Fast Recovery Validate

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - "scripts/focus_v2_fast_recovery_upgrade.py"
      - ".github/workflows/focus-v2-fast-recovery-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply Focus 2.0 upgrade in validation workspace
        run: python scripts/focus_v2_fast_recovery_upgrade.py
      - name: Show Focus 2.0 diff
        run: git diff --check && git diff --stat && git diff -- cloud_api/aster_strategy2_focus_v2.py cloud_api/tests/test_focus_v2_fast_recovery.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Backend pytest full suite
        working-directory: cloud_api
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web test suite
        working-directory: web
        run: npm test -- --runInBand
      - name: TypeScript check
        working-directory: web
        run: npm run typecheck --if-present
      - name: Production build
        working-directory: web
        run: npm run build
      - name: V45 contract probes
        shell: bash
        run: |
          set -euo pipefail
          if [ -d web/tests ]; then
            grep -RIl "V45\|v45" web/tests web/app 2>/dev/null | head -50 || true
          fi
          grep -R "SHORT RELEASE\|recoveryStage\|focusV2" web/app web/components 2>/dev/null | head -200 || true
