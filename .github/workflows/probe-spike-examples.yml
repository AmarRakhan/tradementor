name: Probe spike-voorbeelden (publiek, geen secrets, geen orders)
on:
  push:
    branches: [claude/probe-spike-examples]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/probe/spike_examples_probe.py tools/probe/tradable.txt "$RUNNER_TEMP/klines.json"
      - name: Data naar branch probe-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/klines.json" spike-examples-klines.json
          git init -q && git config user.name probe-bot && git config user.email noreply@github.com
          git checkout -q --orphan probe-data && git add . && git commit -qm "probe data [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-data
