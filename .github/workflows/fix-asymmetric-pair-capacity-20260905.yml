name: Fix asymmetric pair capacity 20260905

on:
  push:
    branches:
      - fix/asymmetric-pair-capacity-20260905
    paths:
      - scripts/fix_asymmetric_pair_capacity_20260905.py
      - .github/workflows/fix-asymmetric-pair-capacity-20260905.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asymmetric-pair-capacity-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r cloud_api/requirements.txt pytest
      - name: Apply repair
        run: python scripts/fix_asymmetric_pair_capacity_20260905.py
      - name: Run focused backend tests
        working-directory: cloud_api
        run: python -m pytest -q test_asymmetric_hedge_20260904.py test_aster_multi_bb.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb.py cloud_api/test_asymmetric_hedge_20260904.py
          git commit -m 'Fix asymmetric pair capacity with legacy positions'
          git push origin HEAD:fix/asymmetric-pair-capacity-20260905
