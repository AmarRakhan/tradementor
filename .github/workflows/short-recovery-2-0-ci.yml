name: SHORT Recovery 2.0 CI (isolated, no secrets, no orders)
# Test-only. Runs ONLY on the SHORT Recovery 2.0 branch (and manually). No secrets, no id-token, no deploy,
# no Aster access, no production Firebase project.
on:
  push:
    branches: [claude/short-recovery-2-0]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: short-recovery-2-0-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GCLOUD_PROJECT: short-recovery-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: SHORT Recovery 2.0 pure modules
        if: always()
        working-directory: cloud_api
        run: ../tools/ci_report.sh "short recovery pure" 40 python -m unittest -v test_short_recovery_ladder test_short_recovery_runtime test_short_recovery_pair_exit
      - name: SHORT Recovery 2.0 engine
        if: always()
        working-directory: cloud_api
        run: ../tools/ci_report.sh "short recovery engine" 40 python -m unittest -v test_short_recovery_2_0_engine
      - name: SHORT Recovery 2.0 real worker tick
        if: always()
        working-directory: cloud_api
        run: ../tools/ci_report.sh "short recovery worker" 60 python -m unittest -v test_short_recovery_2_0_worker
      - name: Auto Hedge engine + lifecycle regression
        if: always()
        working-directory: cloud_api
        run: ../tools/ci_report.sh "auto hedge regression" 20 pytest -q -rfE -p no:cacheprovider test_aster_position_loss_auto_hedge.py test_aster_position_loss_auto_hedge_lifecycle_contract.py test_aster_position_loss_auto_hedge_lock.py test_aster_position_loss_auto_hedge_owner_gate.py
      - name: Re-Hedge All 1.0 regression
        if: always()
        working-directory: cloud_api
        run: ../tools/ci_report.sh "re-hedge all regression" 20 python -m unittest test_rehedge_all_1_0
      - name: Full backend regression
        if: always()
        working-directory: cloud_api
        run: ../tools/ci_report.sh "backend full pytest" 60 pytest -q -rfE -p no:cacheprovider
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web build + tests
        working-directory: web
        run: npm ci && ../tools/ci_report.sh "web build + tests" 40 npm test
