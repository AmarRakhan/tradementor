name: Diagnose targeted LONG refill 2026-09-21

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/diagnose-target-long-refill-20260921.yml"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Count exact current LONG-entry rejection reasons
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t V < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8')); spec=s['spec']['template']['spec']
          print(spec['containers'][0]['image']); print(spec['serviceAccountName'])
          PY
          )
          JOB="tm-target-reasons-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,os
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          idx=int(os.environ['CLOUD_RUN_TASK_INDEX']); project='tradementor-production'
          digest='1736185e83bf4d709f2d772a03c45f61682e848841e54109f3f054011ba05f16'
          if not firebase_admin._apps: firebase_admin.initialize_app(options={'projectId':project})
          uid=None; page=auth.list_users()
          while page and uid is None:
              for u in page.users:
                  e=str(u.email or '').strip().lower()
                  if e and hashlib.sha256(e.encode()).hexdigest()==digest: uid=u.uid; break
              if uid is None: page=page.get_next_page()
          if not uid: raise SystemExit(1)
          raw=firestore.Client(project=project).collection('asterStrategy2').document(uid).get().to_dict() or {}
          rep=raw.get('multiBbReport') if isinstance(raw.get('multiBbReport'),dict) else {}
          reasons=rep.get('entrySkipReasons') if isinstance(rep.get('entrySkipReasons'),dict) else {}
          def count(pred):
              total=0
              for k,v in reasons.items():
                  if pred(str(k).upper()):
                      try: total+=int(v)
                      except Exception: total+=1
              return min(max(total,0),249)
          price=count(lambda k:k.startswith('PRICE_NOT_BELOW_LOWER_BAND'))
          bbdata=count(lambda k:'BB_DATA_UNAVAILABLE_OR_STALE' in k)
          maxlev=count(lambda k:'MAX_LEVERAGE_BELOW_MINIMUM' in k)
          levdata=count(lambda k:k.startswith('LEVERAGE-DATA:') or 'SYMBOL_LEVERAGE_DATA_UNAVAILABLE' in k)
          notional=count(lambda k:'MAX_NOTIONAL_LIMIT' in k or '5018' in k)
          margin=count(lambda k:'INSUFFICIENT_AVAILABLE_MARGIN' in k)
          known=price+bbdata+maxlev+levdata+notional+margin
          total=sum((int(v) if str(v).isdigit() else 1) for v in reasons.values())
          other=min(max(total-known,0),249)
          metrics={1:price,2:bbdata,3:maxlev,4:levdata,5:notional,6:margin,7:other}
          raise SystemExit(metrics.get(idx,0)+1)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "${V[0]}" --service-account "${V[1]}" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --tasks 8 --parallelism 8 --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          J="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          S="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index:.index,exitCode:([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$J")"
          echo "TARGET_LONG_REASON_CODES $S"
          cleanup
          trap - EXIT
