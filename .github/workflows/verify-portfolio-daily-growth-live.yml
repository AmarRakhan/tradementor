name: Verify portfolio daily growth live

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/verify-portfolio-daily-growth-live.yml]

permissions:
  contents: write
  id-token: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: tradementor-production
      GCP_REGION: europe-west4
      BACKEND_SERVICE: tradementor-api
      WEB_SERVICE: amar-bot-v44-direct-install
      EXPECTED_SHA: a3b64a840ffebc9e5ba60ab4a4b6b9ae97605f21
      WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
      DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Wait for exact source revision on both live services
        shell: bash
        run: |
          short="${EXPECTED_SHA:0:8}"
          ok=0
          for attempt in $(seq 1 60); do
            backend="$(gcloud run services describe "$BACKEND_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
            web="$(gcloud run services describe "$WEB_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
            if python - "$short" "$backend" "$web" <<'PY'
          import json,sys
          short=sys.argv[1]
          def live_revision(raw):
              service=json.loads(raw)
              rows=[r for r in service.get('status',{}).get('traffic',[]) if int(r.get('percent',0))==100]
              assert len(rows)==1, rows
              return rows[0].get('revisionName',''), service.get('status',{}).get('url','')
          b,bu=live_revision(sys.argv[2]); w,wu=live_revision(sys.argv[3])
          assert short in b, (short,b)
          assert short in w, (short,w)
          print(f'BACKEND_REVISION={b}')
          print(f'BACKEND_URL={bu}')
          print(f'WEB_REVISION={w}')
          print(f'WEB_URL={wu}')
          PY
            then
              python - "$short" "$backend" "$web" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          short=sys.argv[1]
          def live_revision(raw):
              service=json.loads(raw); rows=[r for r in service['status'].get('traffic',[]) if int(r.get('percent',0))==100]
              return rows[0]['revisionName'],service['status']['url']
          b,bu=live_revision(sys.argv[2]); w,wu=live_revision(sys.argv[3])
          print(f'BACKEND_REVISION={b}'); print(f'BACKEND_URL={bu}'); print(f'WEB_REVISION={w}'); print(f'WEB_URL={wu}')
          PY
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
      - name: Verify live health and route presence
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$BACKEND_URL/health" > /tmp/health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h['status']=='ready' and h['multiUser'] is True
          PY
          code="$(curl --silent --output /tmp/daily.json --write-out '%{http_code}' "$BACKEND_URL/v1/me/aster/portfolio-growth/daily")"
          test "$code" = 401
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$WEB_URL/" > /tmp/root.html
          grep -q 'Webapp versie 45' /tmp/root.html
      - name: Record verified publication
        shell: bash
        run: |
          cat > .portfolio-daily-growth-live <<EOF
          source-sha=$EXPECTED_SHA
          backend-revision=$BACKEND_REVISION
          web-revision=$WEB_REVISION
          verified-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'TradeMentor Control Plane'
          git config user.email 'actions@users.noreply.github.com'
          git add .portfolio-daily-growth-live
          git commit -m 'Verify compact portfolio growth statistics live'
          git push origin HEAD:amar-crypto-bot-2026-cloud
