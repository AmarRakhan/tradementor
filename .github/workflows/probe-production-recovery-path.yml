name: Probe Production Recovery Path

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/probe-production-recovery-path.yml]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read recovery service gates and audience
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe tradementor-strategy2-recovery-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/recovery.json
          REPORT="$(python - /tmp/recovery.json <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=value['spec']['template']['spec']
          env={x['name']:x.get('value') for x in spec['containers'][0].get('env',[])}
          keys=['MEXC_INTERNAL_AUDIENCE','TRADEMENTOR_ENVIRONMENT','TRADEMENTOR_ALLOW_LIVE','ASTER_LIVE_EXECUTION_ENABLED','ASTER_STRATEGY2_LIVE_ENABLED','ASTER_STRATEGY3_LIVE_ENABLED','ASTER_STRATEGY3_RUNTIME_ENABLED']
          result={'revision':value['status'].get('latestReadyRevisionName'),'url':value['status'].get('url'),**{k:env.get(k) for k in keys}}
          print(json.dumps(result,separators=(',',':')))
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="RECOVERY_CONFIG_PROBE $REPORT"
