name: Probe Production Recovery Path

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/probe-production-recovery-path.yml]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark probe started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_RECOVERY_PROBE2 STARTED commit=$GITHUB_SHA"
      - id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Report authentication outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_OUTCOME: ${{ steps.gcp_auth.outcome }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_RECOVERY_PROBE2 auth=$AUTH_OUTCOME"
      - id: setup_gcloud
        if: steps.gcp_auth.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
      - id: cloud_probe
        if: steps.gcp_auth.outcome == 'success' && steps.setup_gcloud.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="$(gcloud run services describe tradementor-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName,status.url)')"
          SCHEDULER="$(gcloud scheduler jobs describe tradementor-aster-automation-tick --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format='value(state,schedule,httpTarget.uri)')"
          printf '%s\n' "$SERVICE" > /tmp/service.txt
          printf '%s\n' "$SCHEDULER" > /tmp/scheduler.txt
      - name: Report cloud probe outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_OUTCOME: ${{ steps.gcp_auth.outcome }}
          GCLOUD_OUTCOME: ${{ steps.setup_gcloud.outcome }}
          PROBE_OUTCOME: ${{ steps.cloud_probe.outcome }}
        shell: bash
        run: |
          SERVICE="$(cat /tmp/service.txt 2>/dev/null || true)"
          SCHEDULER="$(cat /tmp/scheduler.txt 2>/dev/null || true)"
          gh api "repos/$GITHUB_REPOSITORY/issues/41/comments" -f body="PRODUCTION_RECOVERY_PROBE2 auth=$AUTH_OUTCOME setup=$GCLOUD_OUTCOME probe=$PROBE_OUTCOME service=$SERVICE scheduler=$SCHEDULER"
