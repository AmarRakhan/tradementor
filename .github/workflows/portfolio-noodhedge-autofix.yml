name: Apply Portfolio Noodhedge margin safety

on:
  push:
    branches: [agent-ab/portfolio-noodhedge]
    paths: [.github/workflows/portfolio-noodhedge-autofix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-ab/portfolio-noodhedge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire reserve estimator into emergency runtime and UI
        shell: python
        run: |
          from pathlib import Path

          backend = Path("cloud_api/aster_portfolio_emergency_hedge.py")
          text = backend.read_text(encoding="utf-8")

          old = "from aster_signing import local_eip712_signer\nfrom aster_state import account_information_values\n"
          new = "from aster_signing import local_eip712_signer\nfrom aster_state import account_information_values\nfrom aster_portfolio_emergency_margin import estimate_emergency_margin\n"
          if old not in text: raise SystemExit("backend import anchor missing")
          text = text.replace(old, new, 1)

          old = '        "lastError": str(data.get("lastError", "")),\n        "reference": "file_00000000ca148210b52f9a8befc68d22",\n'
          new = '''        "lastError": str(data.get("lastError", "")),
        "estimatedHedgeNotionalUsd": _number(data.get("estimatedHedgeNotionalUsd")),
        "estimatedHedgeMarginUsd": _number(data.get("estimatedHedgeMarginUsd")),
        "hedgeReserveUsd": _number(data.get("hedgeReserveUsd")),
        "technicalTriggerAvailableUsd": _number(data.get("technicalTriggerAvailableUsd")),
        "availableBalanceUsd": _number(data.get("availableBalanceUsd")),
        "hedgeHeadroomUsd": _number(data.get("hedgeHeadroomUsd")),
        "hedgeFeasibleNow": bool(data.get("hedgeFeasibleNow", True)),
        "technicalSafetyOverride": bool(data.get("technicalSafetyOverride", False)),
        "triggerReason": str(data.get("triggerReason", "")),
        "reference": "file_00000000ca148210b52f9a8befc68d22",
'''
          if old not in text: raise SystemExit("backend public anchor missing")
          text = text.replace(old, new, 1)

          text = text.replace(
              "def _acquire_execution(uid: str, current: float) -> bool:\n",
              "def _acquire_execution(uid: str, current: float, *, technical_override: bool = False) -> bool:\n",
              1,
          )
          old = '''        if status == "ARMED":
            if current > trigger:
                return False
            txn.set(ref, {
                "status": "EXECUTING", "triggeredAt": data.get("triggeredAt") or now,
                "updatedAt": now, "leaseOwner": WORKER_ID,
                "leaseUntil": now + timedelta(seconds=LEASE_SECONDS),
                "lastObservedPortfolioValue": current,
            }, merge=True)
            return True
'''
          new = '''        if status == "ARMED":
            if current > trigger and not technical_override:
                return False
            txn.set(ref, {
                "status": "EXECUTING", "triggeredAt": data.get("triggeredAt") or now,
                "triggerReason": "MARGIN_SAFETY_OVERRIDE" if technical_override and current > trigger else "PORTFOLIO_FLOOR",
                "updatedAt": now, "leaseOwner": WORKER_ID,
                "leaseUntil": now + timedelta(seconds=LEASE_SECONDS),
                "lastObservedPortfolioValue": current,
            }, merge=True)
            return True
'''
          if old not in text: raise SystemExit("backend acquire block missing")
          text = text.replace(old, new, 1)

          old = '''async def _tick_uid(uid: str) -> None:
    try:
        read_client = _client(uid, live=False)
        equity, _available = await asyncio.to_thread(_portfolio_truth, read_client)
        if not _acquire_execution(uid, equity):
            _doc(uid).set({"lastObservedPortfolioValue": equity, "lastCheckedAt": _now()}, merge=True)
            return
        await asyncio.to_thread(execute, uid)
'''
          new = '''async def _tick_uid(uid: str) -> None:
    try:
        read_client = _client(uid, live=False)
        equity, available = await asyncio.to_thread(_portfolio_truth, read_client)
        positions = await asyncio.to_thread(read_client.position_risk)
        estimate = estimate_emergency_margin(positions, available)
        reserve = estimate.public_dict()
        _doc(uid).set({**reserve, "lastObservedPortfolioValue": equity, "lastCheckedAt": _now()}, merge=True)
        if not _acquire_execution(uid, equity, technical_override=estimate.technical_override):
            return
        await asyncio.to_thread(execute, uid)
'''
          if old not in text: raise SystemExit("backend tick block missing")
          text = text.replace(old, new, 1)

          old = '''        client = _client(user["uid"], live=False)
        current, _available = _portfolio_truth(client)
        return _public(_doc(user["uid"]).get().to_dict(), current)
'''
          new = '''        client = _client(user["uid"], live=False)
        current, available = _portfolio_truth(client)
        positions = client.position_risk()
        estimate = estimate_emergency_margin(positions, available).public_dict()
        stored = _doc(user["uid"]).get().to_dict() or {}
        return _public({**stored, **estimate}, current)
'''
          if old not in text: raise SystemExit("backend GET block missing")
          text = text.replace(old, new, 1)

          old = '''        values = calculations(request.start_portfolio_value, request.trigger_portfolio_value)
        # Do not silently replace a saved baseline: this write only happens after the
'''
          new = '''        values = calculations(request.start_portfolio_value, request.trigger_portfolio_value)
        safety_client = _client(uid, live=False)
        _equity, available = _portfolio_truth(safety_client)
        reserve = estimate_emergency_margin(safety_client.position_risk(), available).public_dict()
        # Do not silently replace a saved baseline: this write only happens after the
'''
          if old not in text: raise SystemExit("backend arm anchor missing")
          text = text.replace(old, new, 1)

          old = '''            "startPortfolioValue": request.start_portfolio_value,
            "triggerPortfolioValue": request.trigger_portfolio_value,
            **values, "activatedAt": now, "updatedAt": now, "triggeredAt": None,
'''
          new = '''            "startPortfolioValue": request.start_portfolio_value,
            "triggerPortfolioValue": request.trigger_portfolio_value,
            **values, **reserve, "activatedAt": now, "updatedAt": now, "triggeredAt": None,
'''
          if old not in text: raise SystemExit("backend arm persist anchor missing")
          text = text.replace(old, new, 1)
          backend.write_text(text, encoding="utf-8")

          component = Path("web/components/aster-portfolio-emergency-hedge.tsx")
          text = component.read_text(encoding="utf-8")
          old = '''  lockedAt?: string | null;
  lastError?: string;
};
'''
          new = '''  lockedAt?: string | null;
  lastError?: string;
  estimatedHedgeMarginUsd?: number;
  hedgeReserveUsd?: number;
  technicalTriggerAvailableUsd?: number;
  availableBalanceUsd?: number;
  hedgeHeadroomUsd?: number;
  hedgeFeasibleNow?: boolean;
  technicalSafetyOverride?: boolean;
  triggerReason?: string;
};
'''
          if old not in text: raise SystemExit("UI state anchor missing")
          text = text.replace(old, new, 1)

          old = '      <p className="pnh-sticky-note">Na activatie blijft de hedge actief tot jij handmatig ingrijpt.</p>\n\n      <section className="pnh-summary">'
          new = '''      <div className={state.hedgeFeasibleNow === false ? "pnh-error" : "pnh-message"}><strong>{state.hedgeFeasibleNow === false ? "⚠ Noodreserve nu onvoldoende" : "✓ Noodreserve gecontroleerd"}</strong><br/>Geschatte hedge-reserve {money(state.hedgeReserveUsd)} · beschikbaar {money(state.availableBalanceUsd)}.</div>
      <p className="pnh-sticky-note">De gekozen portfoliobodem is je voorkeur. Als beschikbare marge eerder kritiek wordt, mag de technische veiligheidsgrens eerder hedgen. Na activatie blijft de hedge actief tot jij handmatig ingrijpt.</p>

      <section className="pnh-summary">'''
          if old not in text: raise SystemExit("UI reserve anchor missing")
          text = text.replace(old, new, 1)
          component.write_text(text, encoding="utf-8")
      - name: Validate patched source
        run: |
          python -m py_compile cloud_api/aster_portfolio_emergency_hedge.py cloud_api/aster_portfolio_emergency_margin.py cloud_api/aster_portfolio_emergency_guard.py
          git diff --check
      - name: Commit margin safety integration
        run: |
          git config user.name "TradeMentor CI"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_portfolio_emergency_hedge.py web/components/aster-portfolio-emergency-hedge.tsx
          git diff --cached --check
          git commit -m "feat: trigger emergency hedge before margin reserve is exhausted"
          git push origin HEAD:agent-ab/portfolio-noodhedge
