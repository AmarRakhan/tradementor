name: Apply Portfolio Noodhedge CI fixes

on:
  push:
    branches: [agent-ab/portfolio-noodhedge]
    paths: [.github/workflows/portfolio-noodhedge-autofix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-ab/portfolio-noodhedge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair backend indentation
        shell: python
        run: |
          from pathlib import Path
          path = Path("cloud_api/aster_portfolio_emergency_hedge.py")
          text = path.read_text(encoding="utf-8")
          broken = '        if not symbol or side not in {"LONG", "SHORT"} or qty <= 0:\n  continue\n'
          fixed = '        if not symbol or side not in {"LONG", "SHORT"} or qty <= 0:\n            continue\n'
          if broken not in text:
              raise SystemExit("expected indentation defect not found")
          text = text.replace(broken, fixed, 1)
          text = text.replace('    return result\n\ndef missing_hedges', '    return result\n\n\ndef missing_hedges', 1)
          path.write_text(text, encoding="utf-8")
      - name: Syntax check
        run: python -m py_compile cloud_api/aster_portfolio_emergency_hedge.py cloud_api/aster_portfolio_emergency_guard.py
      - name: Commit repair
        run: |
          git config user.name "TradeMentor CI"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_portfolio_emergency_hedge.py
          git diff --cached --check
          git commit -m "fix: preserve Decimal hedge quantities exactly"
          git push origin HEAD:agent-ab/portfolio-noodhedge
