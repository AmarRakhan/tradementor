name: Apply Portfolio Noodhedge UI range fix

on:
  push:
    branches: [agent-ab/portfolio-noodhedge]
    paths: [.github/workflows/portfolio-noodhedge-autofix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-ab/portfolio-noodhedge
      - name: Apply remaining-portfolio slider semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path("web/components/aster-portfolio-emergency-hedge.tsx")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'storedTrigger > 0 && storedTrigger < current ? storedTrigger : current * 0.867': 'storedTrigger > 0 && storedTrigger < current ? storedTrigger : current * 0.333',
              'const sliderPercentage = clamp(triggerPercentage || 50, 50, 99.9);': 'const sliderPercentage = clamp(triggerPercentage || 33.3, 10, 95);',
              '<small>ALLES HEDGEN ONDER</small>': '<small>ALLES HEDGEN ALS NOG OVER IS</small>',
              'type="range" min="50" max="99.9" step="0.1"': 'type="range" min="10" max="95" step="0.1"',
              '<div className="pnh-slider-labels"><span>50%</span><span>Startwaarde</span></div>': '<div className="pnh-slider-labels"><span>10% resterend</span><span>95% resterend</span></div>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected UI fragment not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit UI range fix
        run: |
          git config user.name "TradeMentor CI"
          git config user.email "actions@users.noreply.github.com"
          git add web/components/aster-portfolio-emergency-hedge.tsx
          git diff --cached --check
          git commit -m "fix: allow 10-95 percent remaining portfolio trigger"
          git push origin HEAD:agent-ab/portfolio-noodhedge
