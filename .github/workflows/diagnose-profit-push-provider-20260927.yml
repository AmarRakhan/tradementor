name: Diagnose Profit Push Provider 20260927
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/diagnose-profit-push-provider-20260927.yml]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: tradementor-production
      WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
      DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-cloud-firestore cryptography
      - name: Read-only Web Push diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from urllib.parse import urlparse
          from google.cloud import firestore
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec

          db=firestore.Client(project="tradementor-production")
          vapid=db.collection("_internalSettings").document("webPushVapidV1").get().to_dict() or {}
          private_pem=str(vapid.get("privatePem") or "")
          stored_public=str(vapid.get("publicKey") or "")
          pair_ok=False
          private_ok=False
          if private_pem:
              try:
                  key=serialization.load_pem_private_key(private_pem.encode(),password=None)
                  private_ok=isinstance(key,ec.EllipticCurvePrivateKey)
                  public_bytes=key.public_key().public_bytes(serialization.Encoding.X962,serialization.PublicFormat.UncompressedPoint)
                  derived=base64.urlsafe_b64encode(public_bytes).rstrip(b"=").decode("ascii")
                  pair_ok=(derived==stored_public)
              except Exception as exc:
                  print("VAPID_PARSE_ERROR",type(exc).__name__)
          print("VAPID_PRESENT",bool(private_pem),bool(stored_public))
          print("VAPID_PRIVATE_PARSE_OK",private_ok)
          print("VAPID_KEYPAIR_MATCH",pair_ok)

          controls=list(db.collection("profitNotificationControls").where("enabled","==",True).stream())
          print("ENABLED_NOTIFICATION_ACCOUNTS",len(controls))
          total=active=0
          summary={}
          for ctl in controls[:100]:
              for doc in db.collection("users").document(ctl.id).collection("devices").where("kind","==","webpush").stream():
                  row=doc.to_dict() or {}
                  total+=1
                  if bool(row.get("active",True)): active+=1
                  host=urlparse(str(row.get("endpoint") or "")).netloc or "unknown"
                  platform=str(row.get("platform") or "unknown")
                  err=str(row.get("lastError") or "NONE")
                  keys=row.get("keys") if isinstance(row.get("keys"),dict) else {}
                  key=(platform,host,err,bool(keys.get("p256dh")),bool(keys.get("auth")),bool(row.get("lastSuccessfulDispatch")))
                  summary[key]=summary.get(key,0)+1
          print("WEBPUSH_SUBSCRIPTIONS",total,"ACTIVE",active)
          for key,count in sorted(summary.items(),key=lambda x:str(x[0])):
              print("SUBSCRIPTION_SUMMARY",count,key)
          PY
