name: Rollback Close Profits 2.0 (traffic back to the pinned previous revisions)
# Only moves Cloud Run traffic back to the two revisions that were live before this release (retained and verified Ready
# by the read-only diagnostic). It deploys nothing, builds nothing and changes no configuration, data or IAM.
# Order for "both": web first (the old web works with either backend), then the backend.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auth_only (default: authentication and read-only checks, no mutation) or deploy"
        required: true
        default: auth_only
        type: choice
        options: [auth_only, deploy]
      confirmation:
        description: "Type ROLLBACK_CLOSE_PROFITS_2_0 (only needed for mode=deploy)"
        required: false
        default: ""
        type: string
      target:
        description: "web, backend or both"
        required: true
        default: both
        type: choice
        options: [both, web, backend]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-rollback
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/gh-release-20261021/providers/github-main
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  WEB_SERVICE: amar-bot-v44-direct-install
  BACKEND_SERVICE: tradementor-api
  PREVIOUS_WEB_REVISION: amar-bot-v44-direct-install-v46-89ab74a0-1
  PREVIOUS_BACKEND_REVISION: tradementor-api-src-f87d6b20-124369
  PREVIOUS_BACKEND_SOURCE_COMMIT: f87d6b201790d612f970355f3b8c4c8766938941
  WEB_URL: https://amar-bot-v44-direct-install-cyyaq5otyq-ez.a.run.app
  BACKEND_URL: https://tradementor-api-604335232956.europe-west4.run.app

jobs:
  auth-only:
    # Authentication proof ONLY. Contains no checkout, build, push, deploy, traffic, config or data-changing step.
    if: inputs.mode == 'auth_only'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Report OIDC claims (claim values only, never the token)
        shell: bash
        run: |
          set -euo pipefail
          RESP="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$WIF_PROVIDER")"
          RESP="$RESP" python3 - <<'PY'
          import base64, json, os
          tok = json.loads(os.environ["RESP"])["value"]
          print("::add-mask::" + tok)
          p = tok.split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("repository","repository_id","repository_owner_id","ref","ref_type","event_name","environment","workflow_ref","job_workflow_ref","workflow_sha","job_workflow_sha","sha","sub","run_id"):
              print(f"CLAIM {k}={c.get(k)}")
          gh = os.environ
          checks = {
            "repository_id": c.get("repository_id") == "1324367697",
            "repository_owner_id": c.get("repository_owner_id") == "313542222",
            "ref": c.get("ref") == "refs/heads/main",
            "event_name": c.get("event_name") == "workflow_dispatch",
            "environment": c.get("environment") == "production",
            "workflow_ref_matches_run": c.get("workflow_ref") == gh["GITHUB_WORKFLOW_REF"],
            "job_workflow_ref_equals_workflow_ref": c.get("job_workflow_ref") == c.get("workflow_ref"),
            "workflow_sha_equals_GITHUB_SHA": c.get("workflow_sha") == gh["GITHUB_SHA"],
          }
          for k, v in checks.items(): print(("PASS " if v else "FAIL ") + "claim-check " + k)
          raise SystemExit(0 if all(checks.values()) else 1)
          PY
      - name: Authenticate deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read-only check of services and rollback revisions
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --format='value(account)'
          gcloud run services describe "$WEB_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)'
          gcloud run services describe "$BACKEND_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)'
          gcloud run revisions describe "$PREVIOUS_WEB_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(metadata.name,status.conditions[0].type,status.conditions[0].status)'
          gcloud run revisions describe "$PREVIOUS_BACKEND_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(metadata.name,status.conditions[0].type,status.conditions[0].status)'

      - name: Auth-only complete
        run: echo "AUTH_ONLY_COMPLETE - no production mutation was executed"

  rollback:
    if: inputs.mode == 'deploy'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify request
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "ROLLBACK_CLOSE_PROFITS_2_0"
          case "$TARGET" in both|web|backend) ;; *) exit 1;; esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Roll back web traffic
        if: inputs.target == 'both' || inputs.target == 'web'
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "$PREVIOUS_WEB_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          gcloud run services update-traffic "$WEB_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$PREVIOUS_WEB_REVISION=100"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$WEB_URL/" | grep -q "Webapp versie 46 · build 601"
          gcloud run services describe "$WEB_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/web-after.json"
          python3 - "$RUNNER_TEMP/web-after.json" "$PREVIOUS_WEB_REVISION" <<'PY'
          import json, sys
          live = [r for r in json.load(open(sys.argv[1]))["status"].get("traffic", []) if int(r.get("percent", 0)) == 100]
          assert len(live) == 1 and live[0].get("revisionName") == sys.argv[2], live
          PY

      - name: Roll back backend traffic
        if: inputs.target == 'both' || inputs.target == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "$PREVIOUS_BACKEND_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          gcloud run services update-traffic "$BACKEND_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$PREVIOUS_BACKEND_REVISION=100"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$BACKEND_URL/health" > "$RUNNER_TEMP/backend-health.json"
          python3 - "$RUNNER_TEMP/backend-health.json" "$PREVIOUS_BACKEND_SOURCE_COMMIT" <<'PY'
          import json, sys
          h = json.load(open(sys.argv[1]))
          assert h.get("status") == "ready" and h.get("sourceCommit") == sys.argv[2], h
          PY
