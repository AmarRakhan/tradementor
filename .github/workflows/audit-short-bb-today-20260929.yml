name: Audit SHORT Bollinger Entries 2026-09-29 v4

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/audit-short-bb-today-20260929.yml]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  OBSERVER_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com
  RESULT_ISSUE: "395"
  START_UTC: "2026-09-28T22:00:00Z"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Authenticate trusted production diagnostic control
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run temporary read-only account snapshot job
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe tradementor-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          PROD_REVISION="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["status"]["latestReadyRevisionName"])' <<<"$SERVICE_JSON")"
          PROD_IMAGE="$(gcloud run revisions describe "$PROD_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.containers[0].image)')"
          RUNTIME_SA="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["spec"]["template"]["spec"]["serviceAccountName"])' <<<"$SERVICE_JSON")"
          test -n "$PROD_IMAGE"; test -n "$RUNTIME_SA"
          JOB="tm-short-bb-audit-${GITHUB_RUN_ID: -7}"
          echo "JOB_NAME=$JOB" >> "$GITHUB_ENV"

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import json
          from datetime import datetime, timezone
          from google.cloud import firestore

          start=datetime.fromisoformat("2026-09-28T22:00:00+00:00")
          db=firestore.Client(project="tradementor-production")
          candidates=[]
          for snap in db.collection("asterStrategy2").where("monitor","==",True).stream():
              raw=snap.to_dict() or {}
              settings=raw.get("settings") if isinstance(raw.get("settings"),dict) else {}
              if str(raw.get("releaseChannel") or "").upper()=="BETA" and settings.get("zoneSoldiersEnabled") is True:
                  candidates.append((snap.id,raw,settings))
          result={"status":"NO_ACCOUNT","settings":{},"shortOpens":[]}
          if candidates:
              _uid,raw,settings=candidates[0]
              rows=[]
              for row in raw.get("orderAttributions",[]) if isinstance(raw.get("orderAttributions"),list) else []:
                  if not isinstance(row,dict): continue
                  if str(row.get("side") or "").upper()!="SHORT": continue
                  if str(row.get("action") or "").upper()!="OPEN_LEG": continue
                  ts=row.get("recordedAt")
                  if not hasattr(ts,"astimezone"): continue
                  ts=ts.astimezone(timezone.utc)
                  if ts < start: continue
                  rows.append({
                      "symbol":str(row.get("symbol") or "").upper(),
                      "recordedAt":ts.isoformat(),
                      "recordedAtMs":int(ts.timestamp()*1000),
                  })
              rows.sort(key=lambda x:x["recordedAtMs"])
              result={
                  "status":"OK",
                  "settings":{
                      "bollingerEnabled":settings.get("bollingerEntryFilter15mEnabled"),
                      "directional":settings.get("directionalBollingerEnabled"),
                      "shortTimeframe":settings.get("bollingerShortTimeframe"),
                      "exposureRefillEnabled":settings.get("exposureRefillEnabled"),
                      "exposureRefillShortTimeframe":settings.get("exposureRefillShortTimeframe"),
                  },
                  "shortOpens":rows,
              }
          print("SHORT_ATTR_AUDIT "+json.dumps(result,separators=(",",":"),sort_keys=True),flush=True)
          PY
          )"

          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB"             --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$PROD_IMAGE" --service-account "$RUNTIME_SA"             --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --set-env-vars "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,TRADEMENTOR_ENVIRONMENT=short-bb-audit-readonly"             --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet

          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/tmp/audit-execute.out 2>/tmp/audit-execute.err

      - name: Re-authenticate as read-only log observer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}

      - name: Read temporary snapshot output
        shell: bash
        run: |
          set -euo pipefail
          JOB="$JOB_NAME"
          RESULT="$(gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB AND textPayload:\"SHORT_ATTR_AUDIT \""             --project "$GCP_PROJECT_ID" --freshness=20m --limit=10 --order=desc --format='value(textPayload)'             | grep 'SHORT_ATTR_AUDIT ' | head -n1)"
          test -n "$RESULT"
          printf '%s\n' "${RESULT#SHORT_ATTR_AUDIT }" > /tmp/short-opens.json
          gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true

      - name: Read today's SHORT pre-order Bollinger PASS logs
        shell: bash
        run: |
          set -euo pipefail
          END_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND timestamp>="'$START_UTC'" AND timestamp<="'$END_UTC'" AND textPayload:"BB_ENTRY_FILTER_SHORT_PASS"'
          gcloud logging read "$FILTER" --project "$GCP_PROJECT_ID" --limit=3000 --order=asc --format=json > /tmp/bb-short-pass.json

      - name: Correlate confirmed SHORT opens to exact pre-order 15m PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/report.md
          import json,re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          data=json.load(open("/tmp/short-opens.json",encoding="utf-8"))
          logs=json.load(open("/tmp/bb-short-pass.json",encoding="utf-8"))
          rx=re.compile(
              r"BB_ENTRY_FILTER_SHORT_PASS symbol=(\S+) side=SHORT livePrice=([^ ]+) "
              r"lowerBand=([^ ]+) upperBand=([^ ]+) timeframe=([^ ]+) timestampMs=(\d+) "
              r"enabled=true stage=([^ ]+) result=PASS reason=([^ ]+)"
          )
          passes=[]
          for item in logs if isinstance(logs,list) else []:
              text=str(item.get("textPayload") or "")
              m=rx.search(text)
              if not m: continue
              symbol,live,lower,upper,tf,ts,stage,reason=m.groups()
              if stage!="pre_order": continue
              try: live=float(live); upper=float(upper); ts=int(ts)
              except Exception: continue
              passes.append({"symbol":symbol.upper(),"live":live,"upper":upper,"timeframe":tf,"checkedAtMs":ts,"reason":reason})

          used=set(); results=[]
          for row in data.get("shortOpens",[]):
              best=None
              for idx,p in enumerate(passes):
                  if idx in used or p["symbol"]!=row["symbol"]: continue
                  delta=row["recordedAtMs"]-p["checkedAtMs"]
                  if delta < -10000 or delta > 180000: continue
                  score=abs(delta)
                  if best is None or score<best[0]: best=(score,idx,p,delta)
              if best is None:
                  results.append({**row,"matched":False})
              else:
                  _,idx,p,delta=best; used.add(idx)
                  results.append({**row,"matched":True,"timeframe":p["timeframe"],"live":p["live"],"upper":p["upper"],"priceAboveUpper":p["live"]>p["upper"],"deltaSec":round(delta/1000,1),"reason":p["reason"]})

          ok=[r for r in results if r.get("matched") and r.get("timeframe")=="15m" and r.get("priceAboveUpper")]
          bad=[r for r in results if r not in ok]
          s=data.get("settings",{})
          print("## SHORT 15m Bollinger audit — 29 sep 2026")
          print()
          print("- Mode: **READ ONLY**")
          print(f"- Confirmed SHORT initial opens today: **{len(results)}**")
          print(f"- Exact pre-order 15m PASS matched: **{len(ok)} / {len(results)}**")
          print(f"- Current SHORT timeframe: **{s.get('shortTimeframe')}**")
          print(f"- Exposure refill enabled: **{s.get('exposureRefillEnabled')}**")
          print(f"- Exposure-refill SHORT timeframe: **{s.get('exposureRefillShortTimeframe')}**")
          print()
          if results:
              print("| Tijd NL | Symbool | Pre-order | TF | Live > upper |")
              print("|---|---|---|---|---|")
              tz=ZoneInfo("Europe/Amsterdam")
              for r in results:
                  t=datetime.fromisoformat(r["recordedAt"]).astimezone(tz).strftime("%H:%M:%S")
                  if r.get("matched"):
                      print(f"| {t} | {r['symbol']} | PASS | {r['timeframe']} | {'JA' if r['priceAboveUpper'] else 'NEE'} |")
                  else:
                      print(f"| {t} | {r['symbol']} | GEEN MATCH | — | — |")
          else:
              print("_Geen confirmed SHORT OPEN_LEG-attributies gevonden binnen vandaag._")
          print()
          print("### Conclusie")
          if results and not bad:
              print("Alle confirmed SHORT initial entries van vandaag hebben vlak vóór order-submit een SHORT Bollinger PASS op **15m**; de gelogde live prijs lag telkens **boven de upper band**.")
          elif not results:
              print("Er zijn vandaag geen confirmed SHORT initial entries gevonden om te toetsen.")
          else:
              print(f"Voor **{len(bad)}** van de **{len(results)}** confirmed SHORT entries ontbreekt een volledige 15m pre-order match. Dat is een audit-afwijking die nader onderzocht moet worden.")
          PY
          gh issue comment "$RESULT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
