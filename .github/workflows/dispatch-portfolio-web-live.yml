name: Dispatch normal web deployment for portfolio growth
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/dispatch-portfolio-web-live.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical V46 deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-shared-v44-testapp.yml -R AmarRakhan/tradementor --ref amar-crypto-bot-2026-cloud

