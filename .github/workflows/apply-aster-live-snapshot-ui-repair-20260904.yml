name: Apply Aster Live Snapshot UI Repair 20260904

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - .github/aster-live-snapshot-ui-repair-20260904.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply repair
        run: python tools/fix_aster_live_snapshot_ui_20260904.py
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run targeted repair test
        working-directory: web
        run: node --test tests/aster-live-snapshot-ui-repair.test.mjs
      - name: Run full web regression suite
        working-directory: web
        run: npm test
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx web/components/aster-recent-trades.tsx web/components/aster-trade-center.module.css web/tests/aster-live-snapshot-ui-repair.test.mjs
          git diff --cached --quiet || git commit -m "Keep confirmed Aster data visible during transient refresh failures"
          git push origin HEAD:amar-crypto-bot-2026-cloud
