name: P0 cancel recovered DCA catch-up 2026-09-12

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/hotfix-cancel-recovered-dca-catchup-20260912.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cancel stale queued DCA levels after recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_api/aster_multi_bb_core.py')
          s=p.read_text()
          old='''        level_offset=max(1,dca_count-catchup_start+1)\n        trigger=catchup_base*((1-catchup_distance)**level_offset if side=="LONG" else (1+catchup_distance)**level_offset)\n        row_info=info_map.get(symbol); leverage=max(1,_i(row.get("leverage")))\n'''
          new='''        level_offset=max(1,dca_count-catchup_start+1)\n        trigger=catchup_base*((1-catchup_distance)**level_offset if side=="LONG" else (1+catchup_distance)**level_offset)\n        # A queued catch-up is only valid while the next originally missed level\n        # is still crossed. If price has recovered, never chase stale DCA levels.\n        # Clear the backlog and resume normal DCA spacing from the last confirmed fill.\n        if existing_target>dca_count and not _dca_due(mark,trigger,side):\n            cancelled=max(0,existing_target-dca_count)\n            st0=dict(st0)\n            for f in ("dcaCatchupTargetCount","dcaCatchupBaseAnchor","dcaCatchupStartCount","dcaCatchupDistance","dcaCatchupQueuedAtMs","dcaCatchupRemaining"):\n                st0.pop(f,None)\n            normal_anchor=_recovery_anchor(st0,entry=entry)\n            normal_allowed=settings.unlimited_dca or dca_count<settings.max_dca\n            normal_trigger=normal_anchor*(1-settings.dca_distance if side=="LONG" else 1+settings.dca_distance) if normal_allowed and normal_anchor>0 else None\n            normal_due=_dca_due(mark,normal_trigger,side) if normal_trigger else False\n            normal_distance_usd=abs(normal_trigger-mark) if normal_trigger else None\n            normal_distance_pct=normal_distance_usd/mark*100.0 if normal_distance_usd is not None and mark>0 else None\n            st0.update({"dcaCatchupCancelledAtMs":timestamp_ms,"dcaCatchupCancelledLevels":cancelled,"nextDcaPrice":normal_trigger,"nextDcaDistanceUsd":normal_distance_usd,"nextDcaDistancePct":normal_distance_pct,"nextDcaDue":normal_due,"nextDcaStatus":"DUE" if normal_due else ("AHEAD" if normal_trigger else "NONE"),"nextDcaNumber":dca_count+1 if normal_trigger else None,"updatedAtMs":timestamp_ms})\n            state[key]=st0\n            action={"kind":"DCA_CATCHUP_CANCELLED_ON_RECOVERY","symbol":symbol,"side":side,"dcaCount":dca_count,"cancelledLevels":cancelled,"oldTargetDcaCount":existing_target,"mark":mark,"nextMissedTrigger":trigger,"nextDcaPrice":normal_trigger}\n            actions.append(action)\n            if not dry_run:\n                ref.collection("audit").add({"event":"DCA_CATCHUP_CANCELLED_ON_RECOVERY","user":uid,**{k:v for k,v in action.items() if k!="kind"},"timestamp":datetime.now(timezone.utc)})\n            continue\n        row_info=info_map.get(symbol); leverage=max(1,_i(row.get("leverage")))\n'''
          if s.count(old)!=1:
              raise SystemExit(f'catch-up insertion anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY

          cat > cloud_api/test_dca_catchup_recovery_cancel.py <<'PY'
          import time
          from aster_multi_bb import run_multi_bb_step
          from test_aster_multi_bb import Client, Ref, cfg

          def _state(mark):
              pos={"symbol":"AAAUSDT","positionSide":"SHORT","positionAmt":"5","entryPrice":"100","markPrice":str(mark),"leverage":"100"}
              raw={"multiBbPositions":{"AAAUSDT|SHORT":{"cycleId":"c1","dcaCount":2,"lastBotFillPrice":100.4,"lastDcaFillPrice":100.4,"lastKnownQty":5,"lastKnownEntry":100,"cycleStartedAtMs":1,"dcaCatchupTargetCount":4,"dcaCatchupBaseAnchor":100.0,"dcaCatchupStartCount":0,"dcaCatchupDistance":.002,"dcaCatchupRemaining":2}}}
              return pos,raw

          def test_recovered_short_cancels_remaining_catchup_instead_of_chasing():
              pos,raw=_state(99.9)
              result=run_multi_bb_step(client=Client(positions=[pos],prices={"AAAUSDT":99.9},leverage=100),ref=Ref(),raw_state=raw,settings=cfg(dcaDistance=.002,maxDca=10,maximumPositions=1,longSlots=0,shortSlots=1),uid="u",account={"availableBalance":"100"},positions=[pos],open_orders=[],timestamp_ms=int(time.time()*1000),dry_run=True)
              assert any(a["kind"]=="DCA_CATCHUP_CANCELLED_ON_RECOVERY" and a["cancelledLevels"]==2 for a in result["actions"])
              assert not any(a["kind"]=="DCA" for a in result["actions"])

          def test_still_crossed_short_keeps_catchup_active():
              pos,raw=_state(100.7)
              result=run_multi_bb_step(client=Client(positions=[pos],prices={"AAAUSDT":100.7},leverage=100),ref=Ref(),raw_state=raw,settings=cfg(dcaDistance=.002,maxDca=10,maximumPositions=1,longSlots=0,shortSlots=1),uid="u",account={"availableBalance":"100"},positions=[pos],open_orders=[],timestamp_ms=int(time.time()*1000),dry_run=True)
              assert any(a["kind"]=="DCA" and a["number"]==3 for a in result["actions"])
              assert not any(a["kind"]=="DCA_CATCHUP_CANCELLED_ON_RECOVERY" for a in result["actions"])
          PY
      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          pip install -r cloud_api/requirements.txt pytest
          python -m py_compile cloud_api/aster_multi_bb_core.py
          python -m pytest -q cloud_api/test_dca_catchup_recovery_cancel.py cloud_api/test_aster_multi_bb.py
          git diff --check
      - name: Commit tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-cancel-recovered-dca-catchup-20260912.yml
          git config user.name 'TradeMentor Safety Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_dca_catchup_recovery_cancel.py .github/workflows/hotfix-cancel-recovered-dca-catchup-20260912.yml
          git commit -m 'Cancel missed DCA catch-up after price recovery'
          git push origin HEAD:amar-crypto-bot-2026-cloud
