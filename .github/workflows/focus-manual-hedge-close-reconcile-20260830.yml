name: Focus Manual Hedge Close Reconcile 20260830

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - tools/add_focus_manual_hedge_close_reconcile_20260830.py
      - .github/workflows/focus-manual-hedge-close-reconcile-20260830.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Apply manual hedge-close reconciliation
        run: python tools/add_focus_manual_hedge_close_reconcile_20260830.py

      - name: Install test dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run complete backend suite
        working-directory: cloud_api
        run: pytest -q

      - name: Verify safety-only contract
        run: |
          grep -q 'FOCUS_MANUAL_HEDGE_CLOSE_RECONCILED' cloud_api/aster_strategy2_focus_trailing.py
          grep -q '"reHedgeArmed": True, "reHedgePrice": last_dca_manual' cloud_api/aster_strategy2_focus_trailing.py
          grep -q 'not bool(state.get("reHedgeArmed"))' cloud_api/aster_strategy2_focus_trailing.py
          grep -q '0.0015' cloud_api/aster_strategy2_focus_trailing.py
          grep -q '0.003' cloud_api/aster_strategy2_focus_trailing.py
          grep -q 'FOCUS_PORTFOLIO_TARGET_CLOSED' cloud_api/aster_strategy2_focus_trailing.py

      - name: Commit verified manual-close reconciliation
        run: |
          git config user.name 'focus-flow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_strategy2_focus_trailing.py \
                  cloud_api/test_focus_manual_hedge_close_reconcile.py \
                  .deploy/focus-portfolio-v7-20260830
          if git diff --cached --quiet; then
            echo 'No diff to commit.'
            exit 0
          fi
          git commit -m 'Reconcile manual Focus hedge close safely'
          git push origin HEAD:amar-crypto-bot-2026-cloud
