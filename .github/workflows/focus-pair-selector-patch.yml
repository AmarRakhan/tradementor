name: Focus Pair Selector Patch
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.focus-pair-selector-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - name: Patch Strategy 2 maker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/components/aster-strategy2-maker.tsx');s=p.read_text()
          imp='import { AsterStrategy2FocusShadow } from "@/components/aster-strategy2-focus-shadow";\n'
          add=imp+'import { AsterStrategy2FocusPairSelector } from "@/components/aster-strategy2-focus-pair-selector";\n'
          if 'aster-strategy2-focus-pair-selector' not in s:
              assert imp in s;s=s.replace(imp,add,1)
          old='{v.focusSelection==="manual"&&<Field label="Focus pair (bijv. BTCUSDT)" value={v.focusPair} set={x=>setV({...v,focusPair:x.toUpperCase()})}/>}'
          new='{v.focusSelection==="manual"&&<AsterStrategy2FocusPairSelector rows={focusRanking} value={v.focusPair} onChange={symbol=>setV(current=>({...current,focusPair:symbol}))}/>}'
          if old in s:s=s.replace(old,new,1)
          elif 'AsterStrategy2FocusPairSelector rows={focusRanking}' not in s:raise SystemExit('manual Focus pair field anchor missing')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'AsterStrategy2FocusPairSelector' web/components/aster-strategy2-maker.tsx
          grep -q 'maxHeight:280' web/components/aster-strategy2-focus-pair-selector.tsx
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/focus-pair-selector-patch.yml .focus-pair-selector-trigger
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add -A
          git commit -m "feat: select Focus pair from scrollable ranking"
          git push origin HEAD:amar-crypto-bot-2026-cloud
