name: Repair orphan SHORT rescue and snapshot v2 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: ['.github/orphan-short-rescue-snapshot-v2-20260917.trigger']

permissions:
  contents: write

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair and corrected regressions
        run: |
          python tools/apply_orphan_short_rescue_and_snapshot_20260917.py
          python tools/fix_orphan_rescue_test_capacity_20260917.py
      - name: Install backend dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest
      - name: Compile backend
        run: python -m compileall -q cloud_api
      - name: Run focused pairing regressions
        working-directory: cloud_api
        run: python -m pytest -q test_short_requires_long_pairing_20260917.py test_aster_bollinger_entry_filter_seat_flow.py test_same_symbol_dual_side_20260906.py test_aster_multi_bb.py
      - name: Run full backend suite
        working-directory: cloud_api
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Run complete web suite
        working-directory: web
        run: npm test
      - name: Commit verified implementation
        run: |
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_short_requires_long_pairing_20260917.py web/lib/aster-snapshot-cache.mjs web/tests/aster-snapshot-position-count.test.mjs
          git commit -m 'Prioritize orphan SHORT rescue LONGs and sync Aster position count'
          git push origin HEAD:amar-crypto-bot-2026-cloud
