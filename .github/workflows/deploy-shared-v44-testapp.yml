name: Deploy Shared V46 Testapp

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - "web/**"
      - ".github/workflows/deploy-shared-v44-testapp.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-web
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: amar-bot-v44-direct-install
  ARTIFACT_REPOSITORY: tradementor
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical repository scope
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$CLOUD_RUN_SERVICE" = "amar-bot-v44-direct-install"
          test "$GCP_PROJECT_ID" = "tradementor-production"

      - name: Verify canonical release-history contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^export const WEBAPP_VERSION = "\([0-9][0-9]*\)";/\1/p' web/lib/app-version.ts)"
          BUILD="$(sed -n 's/^export const WEBAPP_BUILD_NUMBER = "\([0-9][0-9]*\)";/\1/p' web/lib/app-version.ts)"
          test -n "$VERSION"
          test -n "$BUILD"
          test "$VERSION" = "46"
          grep -q 'build: WEBAPP_BUILD_NUMBER' web/lib/release-history.ts
          grep -q 'version: WEBAPP_VERSION' web/lib/release-history.ts
          grep -q 'id: "v46-build-373-release-history"' web/lib/release-history.ts
          echo "WEBAPP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WEBAPP_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
              if printf '%s\n' "$CHANGED" | grep -q '^web/'; then
                printf '%s\n' "$CHANGED" | grep -qx 'web/lib/app-version.ts'
                printf '%s\n' "$CHANGED" | grep -qx 'web/lib/release-history.ts'
              fi
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run complete web build and regression suite
        working-directory: web
        run: npm test

      - name: Verify v46 production-data contract
        shell: bash
        run: |
          grep -q 'amar-bot-shell-v46' web/public/sw.js
          grep -q 'tradementor-api-604335232956.europe-west4.run.app' web/lib/cloud-proxy.ts
          grep -q 'proxyCloud(request, "/v1/me/aster/status", "GET")' web/app/api/exchanges/aster/route.ts
          ! grep -Eqi 'proxyStrategy3Live|mergeAsterProjectStatus' web/app/api/exchanges/aster/route.ts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture canonical service and IAM
        shell: bash
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/service-before.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          service=json.load(open(sys.argv[1],encoding="utf-8"))
          live=[row for row in service["status"].get("traffic",[]) if int(row.get("percent",0))==100]
          assert len(live)==1, live
          print(f'BEFORE_REVISION={live[0]["revisionName"]}')
          print(f'CANONICAL_URL={service["status"]["url"]}')
          PY

      - name: Verify build number advances production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$CANONICAL_URL/?versionCheck=$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-live.html"
          CURRENT_BUILD="$(python - "$RUNNER_TEMP/current-live.html" <<'PY'
          import re, sys
          html=open(sys.argv[1],encoding="utf-8").read()
          match=re.search(r'data-webapp-build="([0-9]+)"', html)
          print(match.group(1) if match else "")
          PY
          )"
          test -n "$CURRENT_BUILD"
          echo "CURRENT_LIVE_BUILD=$CURRENT_BUILD" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python - "$CURRENT_BUILD" "$WEBAPP_BUILD_NUMBER" <<'PY'
          import sys
          current=int(sys.argv[1]); candidate=int(sys.argv[2])
          if candidate <= current:
              raise SystemExit(f"release build must advance production: current={current}, candidate={candidate}")
          PY
          fi

      - name: Build and push V46 web image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/amar-bot-web-v46:$GITHUB_SHA"
          docker build --tag "$IMAGE" web
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy candidate without traffic
        shell: bash
        run: |
          TAG="c-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          SUFFIX="v46-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --set-env-vars "WEBAPP_BUILD_NUMBER=${WEBAPP_BUILD_NUMBER}" \
            --revision-suffix "$SUFFIX" \
            --no-traffic \
            --tag "$TAG" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-candidate.json"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          before=json.load(open(sys.argv[1],encoding="utf-8")); after=json.load(open(sys.argv[2],encoding="utf-8")); tag=sys.argv[3]
          b=before["spec"]["template"]["spec"]; a=after["spec"]["template"]["spec"]
          assert b.get("serviceAccountName")==a.get("serviceAccountName")
          assert b.get("timeoutSeconds")==a.get("timeoutSeconds")
          assert b.get("containerConcurrency")==a.get("containerConcurrency")
          def env_without_build(spec):
              return sorted((x.get("name"),x.get("value")) for x in spec["containers"][0].get("env",[]) if x.get("name")!="WEBAPP_BUILD_NUMBER")
          assert env_without_build(b)==env_without_build(a)
          row=next(x for x in after["status"]["traffic"] if x.get("tag")==tag)
          print(f'CANDIDATE_REVISION={row["revisionName"]}')
          print(f'CANDIDATE_URL={row["url"]}')
          PY

      - name: Verify candidate before traffic
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$CANDIDATE_URL/" > "$RUNNER_TEMP/root.html"
          grep -q "Webapp versie 46 · build ${WEBAPP_BUILD_NUMBER}" "$RUNNER_TEMP/root.html"
          curl --fail --silent --show-error "$CANDIDATE_URL/offline.html" > /dev/null
          curl --fail --silent --show-error "$CANDIDATE_URL/manifest.webmanifest" > /dev/null
          curl --fail --silent --show-error "$CANDIDATE_URL/sw.js" | grep -q 'amar-bot-shell-v46'

      - name: Promote verified candidate to canonical shared testapp
        id: promote
        shell: bash
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$CANDIDATE_REVISION=100"

      - name: Verify canonical URL after promotion
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$CANONICAL_URL/" > "$RUNNER_TEMP/canonical.html"
          grep -q "Webapp versie 46 · build ${WEBAPP_BUILD_NUMBER}" "$RUNNER_TEMP/canonical.html"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-after.json"
          python - "$RUNNER_TEMP/service-after.json" "$CANDIDATE_REVISION" <<'PY'
          import json, sys
          service=json.load(open(sys.argv[1],encoding="utf-8")); candidate=sys.argv[2]
          live=[row for row in service["status"].get("traffic",[]) if int(row.get("percent",0))==100]
          assert len(live)==1 and live[0].get("revisionName")==candidate, live
          PY
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json, sys
          assert json.load(open(sys.argv[1],encoding="utf-8")) == json.load(open(sys.argv[2],encoding="utf-8"))
          PY

      - name: Rollback canonical traffic on failed post-promotion verification
        if: failure() && steps.promote.outcome == 'success'
        shell: bash
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$BEFORE_REVISION=100"

