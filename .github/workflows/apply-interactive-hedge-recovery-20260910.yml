          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          allowed = {
            'cloud_api/aster_hedge_recovery.py',
            'cloud_api/aster_hedge_recovery_api.py',
            'cloud_api/aster_execution.py',
            'cloud_api/test_aster_hedge_recovery.py',
            'cloud_api/test_aster_execution.py',
          }
          extra = paths - allowed
          if extra:
              raise SystemExit(f'unexpected patch files: {sorted(extra)}')
          required = allowed
          if not required <= paths:
              raise SystemExit(f'required patch files missing: {sorted(required - paths)}')
