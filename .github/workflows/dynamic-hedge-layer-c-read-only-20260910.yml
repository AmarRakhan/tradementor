name: Dynamic Hedge Layer C - Real Aster Read Only

on:
  push:
    branches: [feature/dynamic-hedge-liquidation-safety-20260910]
    paths: [.github/dynamic-hedge-layer-c-read-only-20260910.trigger]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dynamic-hedge-layer-c-readonly-20260910
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  SOURCE_SERVICE: tradementor-strategy2-recovery-api

jobs:
  verify-real-aster-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-hedge-liquidation-safety-20260910

      - name: Prove this workflow cannot enable exchange execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/feature/dynamic-hedge-liquidation-safety-20260910"
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/dynamic-hedge-layer-c-read-only-20260910.yml').read_text(encoding='utf-8')
          forbidden = [
              'live_authorized=' + 'True',
              'ASTER_LIVE_EXECUTION_ENABLED=' + 'true',
              'ASTER_DYNAMIC_HEDGE_EXECUTION_ENABLED=' + 'true',
              '.' + 'new_order' + '(',
              '.' + 'place_order' + '(',
              '.' + 'submit_order' + '(',
          ]
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit('Read-only proof failed: mutating token present')
          PY

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify feature risk projection against real Aster GET data only
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="$(gcloud run services describe "$SOURCE_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          IMAGE="$(gcloud run services describe "$SOURCE_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
          test -n "$RUNTIME_SA"
          test -n "$IMAGE"
          JOB="tm-dh-readonly-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(python - <<'PY'
          import base64, pathlib
          sources = {}
          for name in ('aster_dynamic_hedge','aster_cross_risk','aster_dynamic_hedge_verify'):
              raw = pathlib.Path('cloud_api', f'{name}.py').read_bytes()
              sources[name] = base64.b64encode(raw).decode()
          script = f'''import base64, hashlib, json, sys, types\nfrom google.cloud import firestore\n\ndef load_module(name, encoded):\n    module=types.ModuleType(name)\n    module.__file__=name+'.py'\n    sys.modules[name]=module\n    exec(compile(base64.b64decode(encoded), module.__file__, 'exec'), module.__dict__)\n    return module\n\ndynamic=load_module('aster_dynamic_hedge', {sources['aster_dynamic_hedge']!r})\ncross=load_module('aster_cross_risk', {sources['aster_cross_risk']!r})\nverify=load_module('aster_dynamic_hedge_verify', {sources['aster_dynamic_hedge_verify']!r})\nimport main\nfrom aster_gateway import AsterV3Client\n\ndb=firestore.Client(project='tradementor-production')\nresults=[]\nfor doc in db.collection('asterStrategy2').stream():\n    state=doc.to_dict() or {{}}\n    if not (state.get('enabled') or state.get('monitor')):\n        continue\n    account_ref=hashlib.sha256(doc.id.encode()).hexdigest()[:10]\n    try:\n        secret=main.load_aster_secret({{'uid':doc.id}})\n        client=AsterV3Client(signer_address=secret.signer_address,sign_message=main.local_eip712_signer(secret),live_authorized=False)\n        account=client.account_information()\n        positions=client.position_risk()\n        open_orders=client.open_orders()\n        risk=cross.cross_account_risk(account,positions)\n        proof=verify.verify_read_only_projection(account,positions,risk)\n        results.append({{\n            'accountRef':account_ref,\n            'passed':bool(proof.get('passed')),\n            'failureCodes':proof.get('failureCodes',[]),\n            'ordersSubmitted':int(proof.get('ordersSubmitted',-1)),\n            'equity':round(float(risk.get('equity') or 0),8),\n            'maintenanceMargin':round(float(risk.get('maintenanceMarginUsd') or 0),8),\n            'availableBalance':round(float(account.get('availableBalance') or 0),8),\n            'marginBuffer':round(float(risk.get('marginBufferUsd') or 0),8),\n            'bufferRatio':None if risk.get('bufferRatio') is None else round(float(risk.get('bufferRatio')),8),\n            'longExposure':round(float(risk.get('longNotional') or 0),8),\n            'shortExposure':round(float(risk.get('shortNotional') or 0),8),\n            'grossExposure':round(float(risk.get('grossExposure') or 0),8),\n            'signedNetExposure':round(float(risk.get('signedNetExposure') or 0),8),\n            'hedgeCoveragePercent':round(float(risk.get('hedgeCoveragePercent') or 0),8),\n            'liquidationRiskPct':round(float(risk.get('liquidationRiskPct') or 0),8),\n            'liquidationSafetyStatus':str(risk.get('liquidationSafetyStatus','DATA_ONBETROUWBAAR')),\n            'activePositionCount':int(risk.get('positionCountIncluded') or 0),\n            'openOrderCount':len(open_orders) if isinstance(open_orders,list) else -1,\n        }})\n    except Exception as exc:\n        results.append({{'accountRef':account_ref,'passed':False,'failureCodes':['READ_EXCEPTION'],'errorType':type(exc).__name__}})\nsummary={{\n    'readOnly':True,\n    'liveAuthorized':False,\n    'ordersSubmitted':sum(int(x.get('ordersSubmitted',0)) for x in results),\n    'accounts':len(results),\n    'passed':sum(1 for x in results if x.get('passed')),\n    'failed':sum(1 for x in results if not x.get('passed')),\n    'results':results,\n}}\nprint('DYNAMIC_HEDGE_LAYER_C_READONLY '+json.dumps(summary,sort_keys=True,separators=(',',':')))\nif not results or any(not x.get('passed') for x in results) or summary['ordersSubmitted'] != 0:\n    raise SystemExit(2)\n'''
          print(base64.b64encode(script.encode()).decode())
          PY
          )"

          gcloud run jobs deploy "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,FIREBASE_AUTH_PROJECT_ID=$GCP_PROJECT_ID,TRADEMENTOR_ENVIRONMENT=dynamic-hedge-layer-c-readonly,ASTER_LIVE_EXECUTION_ENABLED=false,ASTER_DYNAMIC_HEDGE_EXECUTION_ENABLED=false" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet

          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/tmp/dh-layer-c-exec.out 2>/tmp/dh-layer-c-exec.err
          EXEC_RC=$?
          set -e
          sleep 3
          RESULT="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"DYNAMIC_HEDGE_LAYER_C_READONLY\"" --project "$GCP_PROJECT_ID" --freshness 10m --limit 1 --order desc --format='value(textPayload)' || true)"
          echo "$RESULT"
          if [ -z "$RESULT" ]; then
            echo 'Layer C produced no read-only result.' >&2
            cat /tmp/dh-layer-c-exec.err >&2 || true
            exit 3
          fi
          if [ "$EXEC_RC" -ne 0 ]; then
            echo "Layer C exchange-read verification failed rc=$EXEC_RC" >&2
            exit "$EXEC_RC"
          fi
          grep -q '"liveAuthorized":false' <<<"$RESULT"
          grep -q '"ordersSubmitted":0' <<<"$RESULT"
          grep -q '"failed":0' <<<"$RESULT"
          cleanup
          trap - EXIT
