name: Apply short DCA persistence fix 2026-09-06
on:
  push:
    branches: [fix/short-dca-persistence-20260906]
    paths:
      - '.github/workflows/apply-short-dca-persistence-20260906.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-dca-persistence-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_short_dca_persistence_20260906.py
      - name: Run targeted tests
        working-directory: cloud_api
        run: python -m pytest -q test_aster_side_settings_persistence.py test_aster_portfolio_tp_mode.py test_aster_pair_overrides.py
      - name: Commit verified patch
        run: |
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/main.py cloud_api/test_aster_side_settings_persistence.py
          git commit -m 'Preserve side-specific DCA settings on legacy saves'
          git push origin HEAD:fix/short-dca-persistence-20260906
