name: Dispatch P0 DCA production 2026-09-12

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/dispatch-p0-dca-production-20260912.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: dispatch-p0-dca-production-20260912
  cancel-in-progress: false

jobs:
  dispatch-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - name: Verify P0 backend hotfix is present
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'blocked_side=""' cloud_api/main.py
          if grep -F 'blocked_side="SHORT" if long_exposure>short_exposure else "LONG" if short_exposure>long_exposure else ""' cloud_api/main.py; then
            echo 'unsafe aggregate Strategy 2 side blocking is still present' >&2
            exit 1
          fi
          grep -F 'dynamic_strategy_order_guard(dynamic_ref,intent,account,positions)' cloud_api/main.py

      - name: Dispatch production backend deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloud-production.yml/dispatches \
            -f ref='amar-crypto-bot-2026-cloud' \
            -f inputs[confirmation]='DEPLOY_PRODUCTION_BACKEND'

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dispatch-p0-dca-production-20260912.yml
          git config user.name 'TradeMentor Safety Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows/dispatch-p0-dca-production-20260912.yml
          git commit -m 'Remove P0 DCA production dispatcher'
          git push origin HEAD:amar-crypto-bot-2026-cloud
