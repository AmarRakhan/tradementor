name: Repair auto-derived fixed position size 2026-09-21 (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: repair-auto-derived-fixed-size-20260921
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  REPAIR_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  ISSUE_NUMBER: '190'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.REPAIR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run exact-account state-only repair
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t SERVICE_VALUES < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          service=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=service['spec']['template']['spec']
          print(spec['containers'][0]['image'])
          print(spec['serviceAccountName'])
          PY
          )
          IMAGE="${SERVICE_VALUES[0]}"
          RUNTIME_SA="${SERVICE_VALUES[1]}"
          JOB="tm-sizefix-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from google.cloud import firestore

          PROJECT='tradementor-production'
          db=firestore.Client(project=PROJECT)

          def f(v,default=0.0):
              try:return float(v)
              except (TypeError,ValueError):return default

          def i(v,default=-1):
              try:return int(round(float(v)))
              except (TypeError,ValueError):return default

          def near(v,target):return abs(f(v,-999999.0)-target)<1e-9

          matches=[]
          for snap in db.collection('asterStrategy2').stream():
              raw=snap.to_dict() or {}
              s=raw.get('settings') if isinstance(raw.get('settings'),dict) else {}
              long_margin=f(s.get('entryMarginLongUsd',s.get('entryMarginLong',s.get('entryMarginUsd'))))
              short_margin=f(s.get('entryMarginShortUsd',s.get('entryMarginShort',s.get('entryMarginUsd'))))
              fingerprint=(
                  i(s.get('maximumPositions'))==60 and i(s.get('longSlots'))==30 and i(s.get('shortSlots'))==30 and
                  i(s.get('universeTopN'))==350 and i(s.get('minimumLeverage'))==20 and
                  str(s.get('entrySizingMode','')).lower() in {'notional','margin'} and
                  near(s.get('entryNotionalLongUsd',s.get('entryNotionalLong')),8.0) and
                  near(s.get('entryNotionalShortUsd',s.get('entryNotionalShort')),6.0) and
                  0 < long_margin <= 1.0 and 0 < short_margin <= 1.0 and
                  str(s.get('takeProfitMode','')).upper()=='PORTFOLIO'
              )
              if fingerprint:matches.append((snap,raw,s,long_margin,short_margin))

          if len(matches)!=1:
              print('FIXED_SIZE_REPAIR '+json.dumps({'status':'REFUSED_NOT_UNIQUE','matchCount':len(matches),'ordersSent':0,'settingsChanged':False},sort_keys=True))
              raise SystemExit(21)

          snap,raw,old,long_margin,short_margin=matches[0]
          current=snap.reference.get().to_dict() or {}
          s=current.get('settings') if isinstance(current.get('settings'),dict) else {}
          mode=str(s.get('entrySizingMode','')).lower()
          # Re-validate the exact account fingerprint immediately before any write.
          if mode not in {'notional','margin'} or not near(s.get('entryNotionalLongUsd',s.get('entryNotionalLong')),8.0) or not near(s.get('entryNotionalShortUsd',s.get('entryNotionalShort')),6.0):
              print('FIXED_SIZE_REPAIR '+json.dumps({'status':'REFUSED_STATE_CHANGED','ordersSent':0,'settingsChanged':False},sort_keys=True))
              raise SystemExit(22)

          changed=False
          version=max(i(current.get('configVersion'),1),i(s.get('version'),1))
          if mode=='notional':
              version+=1
              new=dict(s)
              new['entrySizingMode']='margin'
              new['version']=version
              # Crucial: do not modify either stored margin or notional amount.
              now=datetime.now(timezone.utc)
              snap.reference.set({
                  'settings':new,'configVersion':version,'updatedAt':now,'settingsChangedAt':now,
                  'lastReason':'Vaste positieomvang veilig teruggezet naar marginmodus; bestaande LONG/SHORT-margin behouden; 0 orders'
              },merge=True)
              snap.reference.collection('configHistory').add({
                  'version':version,'oldValue':s,'newValue':new,
                  'source':'repair-auto-derived-fixed-size-20260921','timestamp':now
              })
              snap.reference.collection('audit').add({
                  'event':'ENTRY_SIZING_MODE_RESTORED_TO_MARGIN','oldMode':'notional','newMode':'margin',
                  'entryMarginLongUsd':long_margin,'entryMarginShortUsd':short_margin,
                  'ordersSent':0,'timestamp':now
              })
              changed=True

          verified=snap.reference.get().to_dict() or {}
          vs=verified.get('settings') if isinstance(verified.get('settings'),dict) else {}
          verified_long=f(vs.get('entryMarginLongUsd',vs.get('entryMarginLong',vs.get('entryMarginUsd'))))
          verified_short=f(vs.get('entryMarginShortUsd',vs.get('entryMarginShort',vs.get('entryMarginUsd'))))
          ok=(str(vs.get('entrySizingMode','')).lower()=='margin' and
              abs(verified_long-long_margin)<1e-12 and abs(verified_short-short_margin)<1e-12 and
              near(vs.get('entryNotionalLongUsd',vs.get('entryNotionalLong')),8.0) and
              near(vs.get('entryNotionalShortUsd',vs.get('entryNotionalShort')),6.0))
          if not ok:
              print('FIXED_SIZE_REPAIR '+json.dumps({'status':'VERIFY_FAILED','ordersSent':0,'settingsChanged':changed},sort_keys=True))
              raise SystemExit(23)

          result={
              'status':'REPAIRED_AND_VERIFIED' if changed else 'ALREADY_REPAIRED_AND_VERIFIED',
              'ordersSent':0,'settingsChanged':changed,
              'accountRef':hashlib.sha256(snap.id.encode()).hexdigest()[:12],
              'entrySizingMode':'margin','entryMarginLongUsd':verified_long,'entryMarginShortUsd':verified_short,
              'preservedEntryNotionalLongUsd':f(vs.get('entryNotionalLongUsd',vs.get('entryNotionalLong'))),
              'preservedEntryNotionalShortUsd':f(vs.get('entryNotionalShortUsd',vs.get('entryNotionalShort'))),
              'configVersion':verified.get('configVersion')
          }
          print('FIXED_SIZE_REPAIR '+json.dumps(result,sort_keys=True,separators=(',',':')))
          raise SystemExit(0)
          PY
          )"

          set +e
          gcloud run jobs deploy "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet \
            >"$RUNNER_TEMP/deploy.log" 2>&1
          DEPLOY_RC=$?
          EXEC_RC=99
          if [ "$DEPLOY_RC" -eq 0 ]; then
            gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait \
              >"$RUNNER_TEMP/execute.log" 2>&1
            EXEC_RC=$?
          fi
          if [ "$DEPLOY_RC" -eq 0 ] && [ "$EXEC_RC" -eq 0 ]; then
            echo '{"status":"VERIFIED_BY_EXECUTION","ordersSent":0,"settingsChangedOrAlreadyCorrect":true}' > "$RUNNER_TEMP/result.json"
          else
            python - "$DEPLOY_RC" "$EXEC_RC" "$RUNNER_TEMP/deploy.log" "$RUNNER_TEMP/execute.log" > "$RUNNER_TEMP/diagnostic.json" <<'PY'
          import json,sys,re
          deploy_rc=int(sys.argv[1]);exec_rc=int(sys.argv[2])
          def safe_tail(path):
              try:text=open(path,encoding='utf-8',errors='replace').read()
              except Exception:return ""
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              tail=" | ".join(lines[-8:])
              tail=re.sub(r'projects/[^/\s]+/secrets/[^/\s]+','projects/[redacted]/secrets/[redacted]',tail)
              tail=re.sub(r'(?i)(token|authorization|privatekey|private_key)\s*[:=]\s*\S+',r'\1=[redacted]',tail)
              return tail[:1200]
          print(json.dumps({"status":"WORKFLOW_DIAGNOSTIC","ordersSent":0,"settingsChanged":False,
                            "deployRc":deploy_rc,"executeRc":exec_rc,
                            "deployTail":safe_tail(sys.argv[3]),"executeTail":safe_tail(sys.argv[4])},
                           sort_keys=True,separators=(',',':')))
          PY
          fi
          cleanup
          trap - EXIT
          set -e

      - name: Publish sanitized repair proof
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/result.json" ]; then
            {
              echo "## Fixed-position settings repair"
              echo
              sed 's/^/    /' "$RUNNER_TEMP/result.json"
              echo
              echo "The exact account fingerprint finished with margin mode verified. No orders were submitted and position/DCA/TP state was not reset."
            } > "$RUNNER_TEMP/comment.md"
          elif [ -s "$RUNNER_TEMP/diagnostic.json" ]; then
            {
              echo "## Fixed-position repair diagnostic"
              echo
              sed 's/^/    /' "$RUNNER_TEMP/diagnostic.json"
              echo
              echo "No orders were submitted and no settings were changed."
            } > "$RUNNER_TEMP/comment.md"
          else
            echo "Repair workflow produced no sanitized result. No order action was requested." > "$RUNNER_TEMP/comment.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
