name: Verify Bollinger Lifecycle 15m

on:
  push:
    branches:
      - agent/bollinger-entry-filter-15m-20260913
    paths:
      - "cloud_api/**"
      - "web/**"
      - ".github/workflows/verify-bollinger-lifecycle-15m-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bollinger-entry-filter-15m-20260913

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Bollinger focused and lifecycle regression
        working-directory: cloud_api
        run: >-
          pytest -q
          test_aster_bollinger_entry_filter.py
          test_aster_bollinger_entry_filter_seat_flow.py
          test_aster_bollinger_entry_filter_lifecycle.py

      - name: Full backend regression
        working-directory: cloud_api
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Bollinger web contract
        working-directory: web
        run: node --experimental-strip-types --test tests/aster-bollinger-entry-filter-15m.test.mjs

      - name: Production web build
        working-directory: web
        run: npm run build
