name: Portfolio Noodhedge CI

on:
  push:
    branches: [agent-ab/portfolio-noodhedge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - run: pip install -r cloud_api/requirements.txt pytest
      - name: Emergency hedge tests
        working-directory: cloud_api
        run: pytest -q test_aster_portfolio_emergency_hedge.py
      - name: Full backend regression suite
        working-directory: cloud_api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
