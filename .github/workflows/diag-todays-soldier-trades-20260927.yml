name: Diagnose today's soldier trades 2026-09-27

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/diag-todays-soldier-trades-20260927.yml"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  OBSERVER_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run read-only today's soldier-trade analysis
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t V < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));sp=s['spec']['template']['spec']
          print(sp['containers'][0]['image']);print(sp['serviceAccountName'])
          PY
          )
          JOB="tm-today-soldiers-${GITHUB_RUN_ID: -7}"
          MARKER="TODAYSOLDIERS_${GITHUB_RUN_ID}"
          echo "DIAG_JOB=$JOB" >> "$GITHUB_ENV"
          echo "DIAG_MARKER=$MARKER" >> "$GITHUB_ENV"

          SCRIPT="$(base64 -w0 <<'PY'
          import json,os,math
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from google.cloud import firestore
          import main

          def n(v,d=0.0):
              try:
                  x=float(v);return x if math.isfinite(x) else d
              except Exception:return d
          def to_ms(v):
              if isinstance(v,datetime):
                  x=v if v.tzinfo else v.replace(tzinfo=timezone.utc)
                  return int(x.astimezone(timezone.utc).timestamp()*1000)
              if isinstance(v,(int,float)): return int(v)
              if isinstance(v,str):
                  try:return int(datetime.fromisoformat(v.replace('Z','+00:00')).timestamp()*1000)
                  except Exception:return int(n(v))
              return 0
          def iso_local(ms):
              if not ms:return None
              return datetime.fromtimestamp(ms/1000,timezone.utc).astimezone(ZoneInfo('Europe/Amsterdam')).isoformat()

          db=firestore.Client(project='tradementor-production')
          owner=db.collection('systemConfiguration').document('continuityDashboardV1').get().to_dict() or {}
          uid=str(owner.get('ownerUid') or '').strip()
          if not uid:
              print(os.environ['MARKER']+'='+json.dumps({'error':'OWNER_NOT_CONFIGURED'}),flush=True);raise SystemExit

          local=ZoneInfo('Europe/Amsterdam')
          now=datetime.now(timezone.utc)
          local_now=now.astimezone(local)
          day_start_local=local_now.replace(hour=0,minute=0,second=0,microsecond=0)
          day_start_utc=day_start_local.astimezone(timezone.utc)
          day_start_ms=int(day_start_utc.timestamp()*1000)

          ref=main.aster_strategy2_reference(uid).collection('audit')
          audits=[]
          for d in ref.where('timestamp','>=',day_start_utc).stream():
              v=d.to_dict() or {}; v['_id']=d.id
              v['_ms']=to_ms(v.get('timestamp',v.get('timestampMs')))
              audits.append(v)
          audits.sort(key=lambda x:x['_ms'])

          entries=[]
          tps=[]
          for a in audits:
              ev=str(a.get('event') or '').upper()
              role=str(a.get('soldierRole') or '').upper()
              sid=str(a.get('soldierId') or '').strip()
              if role not in {'ZONE_BASE','EXPOSURE_BALANCER'} or not sid:
                  continue
              row={
                  'event':ev,
                  'symbol':str(a.get('symbol') or '').upper(),
                  'side':str(a.get('side') or '').upper(),
                  'soldierId':sid,
                  'soldierRole':role,
                  'originZone':a.get('originZone'),
                  'atMs':a['_ms'],
                  'atLocal':iso_local(a['_ms']),
              }
              if ev=='MULTI_BB_ENTRY':
                  entries.append(row)
              elif ev=='MULTI_BB_TP':
                  row.update({
                      'currentZoneAtClose':a.get('currentZoneAtClose'),
                      'homecoming':bool(a.get('homecoming')),
                      'zoneMission':bool(a.get('zoneMission')),
                      'soldierStatusAfterClose':a.get('soldierStatusAfterClose'),
                  })
                  tps.append(row)

          # Match each entry to the first same-soldier TP after entry and before any later entry for that soldier.
          by_sid_entries={}
          for e in entries: by_sid_entries.setdefault(e['soldierId'],[]).append(e)
          by_sid_tps={}
          for t in tps: by_sid_tps.setdefault(t['soldierId'],[]).append(t)

          rows=[]
          for sid, arr in by_sid_entries.items():
              arr=sorted(arr,key=lambda x:x['atMs'])
              closes=sorted(by_sid_tps.get(sid,[]),key=lambda x:x['atMs'])
              for i,e in enumerate(arr):
                  next_entry=arr[i+1]['atMs'] if i+1<len(arr) else 10**30
                  close=next((t for t in closes if e['atMs']<=t['atMs']<next_entry),None)
                  rows.append({
                      'symbol':e['symbol'],
                      'side':e['side'],
                      'soldierId':sid,
                      'soldierRole':e['soldierRole'],
                      'entryTimeLocal':e['atLocal'],
                      'entryAtMs':e['atMs'],
                      'entryZone':e.get('originZone'),
                      'status':'CLOSED' if close else 'OPEN',
                      'closeTimeLocal':close.get('atLocal') if close else None,
                      'closeAtMs':close.get('atMs') if close else None,
                      'closeZone':close.get('currentZoneAtClose') if close else None,
                      'homecoming':close.get('homecoming') if close else False,
                      'zoneMission':close.get('zoneMission') if close else False,
                      'soldierStatusAfterClose':close.get('soldierStatusAfterClose') if close else None,
                  })

          rows.sort(key=lambda x:x['entryAtMs'])
          output={
              'generatedAt':now.isoformat(),
              'localDate':local_now.date().isoformat(),
              'timezone':'Europe/Amsterdam',
              'readOnly':True,
              'entryCount':len(rows),
              'closedCount':sum(1 for r in rows if r['status']=='CLOSED'),
              'openCount':sum(1 for r in rows if r['status']=='OPEN'),
              'rows':rows,
          }
          print(os.environ['MARKER']+'='+json.dumps(output,separators=(',',':'),sort_keys=True,default=str),flush=True)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "${V[0]}" --service-account "${V[1]}" --set-env-vars "MARKER=$MARKER"             --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT'))"             --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 240s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null

      - name: Authenticate observer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}

      - name: Collect and publish result
        shell: bash
        run: |
          set -euo pipefail
          for N in $(seq 1 15); do
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\""               --project "$GCP_PROJECT_ID" --freshness=15m --limit=100 --order=desc --format=json > "$RUNNER_TEMP/logs.json"
            python - "$DIAG_MARKER" "$RUNNER_TEMP/logs.json" > "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          m=sys.argv[1]+'=';rows=json.load(open(sys.argv[2],encoding='utf-8'))
          def walk(x):
              if isinstance(x,str):yield x
              elif isinstance(x,dict):
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          for row in rows:
              for s in walk(row):
                  if m in s:
                      raw=s[s.index(m)+len(m):].splitlines()[0]
                      json.loads(raw);print(raw);raise SystemExit
          PY
            [ -s "$RUNNER_TEMP/result.json" ] && break
            sleep 3
          done
          test -s "$RUNNER_TEMP/result.json"
          mkdir -p .diagnostics
          cp "$RUNNER_TEMP/result.json" .diagnostics/todays-soldier-trades-20260927.json
          git config user.name "TradeMentor Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add .diagnostics/todays-soldier-trades-20260927.json
          git diff --cached --quiet && exit 0
          git commit -m "Record today's soldier trades diagnostic"
          git push origin HEAD:amar-crypto-bot-2026-cloud

      - name: Re-authenticate deploy for cleanup
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${DIAG_JOB:-}" ]; then gcloud run jobs delete "$DIAG_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true; fi
