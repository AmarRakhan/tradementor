name: Diagnose Aster scheduler audit 20261001

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/diagnose-aster-scheduler-audit-20261001.yml"

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: tradementor-production
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  ISSUE_NUMBER: "209"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read Cloud Scheduler audit mutations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gcloud logging read \
            'protoPayload.serviceName="cloudscheduler.googleapis.com"' \
            --project "$GCP_PROJECT_ID" --freshness=36h --limit=200 --order=desc --format=json \
            > "$RUNNER_TEMP/scheduler-audit.json" || echo '[]' > "$RUNNER_TEMP/scheduler-audit.json"
          python - "$RUNNER_TEMP/scheduler-audit.json" > "$RUNNER_TEMP/result.md" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8"))
          print("## Aster Scheduler audit · read-only")
          matched=[]
          for row in rows if isinstance(rows,list) else []:
              p=row.get("protoPayload") or {}
              method=str(p.get("methodName") or "")
              resource=str(p.get("resourceName") or "")
              request=p.get("request") or {}
              request_name=str(request.get("name") or request.get("job",{}).get("name") or "")
              hay=(resource+" "+request_name+" "+str(request)).lower()
              if "aster" not in hay and "tradementor" not in hay:
                  continue
              if not any(word in method.lower() for word in ("createjob","updatejob","deletejob","pausejob","resumejob")):
                  continue
              auth=p.get("authenticationInfo") or {}
              principal=str(auth.get("principalEmail") or "")
              actor=("service-account:"+principal.split("@",1)[0] if principal.endswith(".gserviceaccount.com")
                     else "user" if principal else "unknown")
              job=(resource or request_name).split("/")[-1] or "unknown"
              matched.append((str(row.get("timestamp") or ""),method.split(".")[-1],job,actor))
          print(f"- Mutaties gevonden in laatste 36u: **{len(matched)}**")
          for ts,method,job,actor in matched[:30]:
              print(f"- {ts} · **{method}** · `{job}` · actor={actor}")
          if not matched:
              print("- Geen relevante create/update/delete/pause/resume auditregels zichtbaar met deze observer.")
          print("\n_Read-only; geen Scheduler-, IAM- of tradingstate gewijzigd._")
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
