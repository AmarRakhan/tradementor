name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - ci/memory-fix-ae7da92
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build public debug APK and run unit tests
        run: |
          ./gradlew :app:assemblePublicDebug :app:testAdminDebugUnitTest :app:testPublicDebugUnitTest
