name: Android CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "cloud_api/**"
      - "trading_server/**"
      - "cloud/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "cloud_api/**"
      - "trading_server/**"
      - "cloud/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APKs and run unit tests
        run: |
          ./gradlew :app:assembleDebug :app:testAdminDebugUnitTest :app:testPublicDebugUnitTest \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            --max-workers=2
