name: Diagnose SHORT entries after 7-slot cap read-only 2026-09-18

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-short-open-after-seven-cap-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-short-after-seven-readonly
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare managed cycle start times with 7-7 cap time
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t VALUES < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));spec=s['spec']['template']['spec']
          print(spec['containers'][0]['image']);print(spec['serviceAccountName'])
          PY
          )
          IMAGE="${VALUES[0]}"; RUNTIME_SA="${VALUES[1]}"; JOB="tm-sh7-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,os
          from datetime import datetime,timezone
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore

          project='tradementor-production'
          digest='b4dfb7301bb40602e4b2225367437495652a360f6d4a071b8851c6324a82556d'
          idx=int(os.environ['CLOUD_RUN_TASK_INDEX'])
          if not firebase_admin._apps: firebase_admin.initialize_app(options={'projectId':project})
          db=firestore.Client(project=project)

          uid=None
          page=auth.list_users()
          while page and uid is None:
              for u in page.users:
                  e=str(u.email or '').strip().lower()
                  if e and hashlib.sha256(e.encode()).hexdigest()==digest: uid=u.uid; break
              if uid is None: page=page.get_next_page()
          if not uid: raise SystemExit(1)

          ref=db.collection('asterStrategy2').document(uid)
          raw=ref.get().to_dict() or {}
          state=raw.get('multiBbPositions') if isinstance(raw.get('multiBbPositions'),dict) else {}

          seven_at=None
          for h in ref.collection('configHistory').stream():
              row=h.to_dict() or {};new=row.get('newValue') if isinstance(row.get('newValue'),dict) else {}
              ts=row.get('timestamp')
              try: hit=int(new.get('longSlots',-1))==7 and int(new.get('shortSlots',-1))==7 and int(new.get('maximumPositions',-1))==14
              except Exception: hit=False
              if hit and isinstance(ts,datetime):
                  ts=ts.replace(tzinfo=timezone.utc) if ts.tzinfo is None else ts.astimezone(timezone.utc)
                  if seven_at is None or ts>seven_at: seven_at=ts

          after_short=before_short=unknown_short=0
          after_long=before_long=unknown_long=0
          for key,row in state.items():
              if not isinstance(row,dict): continue
              side='SHORT' if str(key).endswith('|SHORT') else ('LONG' if str(key).endswith('|LONG') else '')
              if not side: continue
              started=row.get('cycleStartedAtMs')
              try: started_ms=int(float(started or 0))
              except Exception: started_ms=0
              if not seven_at or started_ms<=0:
                  if side=='SHORT': unknown_short+=1
                  else: unknown_long+=1
                  continue
              started_dt=datetime.fromtimestamp(started_ms/1000,tz=timezone.utc)
              if started_dt>seven_at:
                  if side=='SHORT': after_short+=1
                  else: after_long+=1
              else:
                  if side=='SHORT': before_short+=1
                  else: before_long+=1

          metrics={1:after_short,2:before_short,3:unknown_short,4:after_long,5:before_long,6:unknown_long,7:1 if seven_at else 0}
          raise SystemExit(min(max(int(metrics.get(idx,0)),0),249)+1)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --service-account "$RUNTIME_SA" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --tasks 8 --parallelism 8 --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index:.index,exitCode:([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          printf 'SHORT_AFTER_SEVEN_STATUS %s\n' "$STATUS"
          cleanup
          trap - EXIT
