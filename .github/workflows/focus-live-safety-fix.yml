name: Focus Live Safety Fix
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.focus-live-safety-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - name: Fix Focus live safety and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          # Explicit opt-in bit. Old Shadow configs therefore can never become live merely by deployment.
          p=Path('cloud_api/aster_strategy2.py');s=p.read_text()
          s=s.replace('''    focus_shadow_enabled: bool = False\n    focus_selection_mode:''','''    focus_shadow_enabled: bool = False\n    focus_live_enabled: bool = False\n    focus_selection_mode:''',1)
          s=s.replace('''            focus_shadow_enabled=bool(raw.get("focusShadowEnabled", False)),\n            focus_selection_mode=''','''            focus_shadow_enabled=bool(raw.get("focusShadowEnabled", False)),\n            focus_live_enabled=bool(raw.get("focusLiveEnabled", False)),\n            focus_selection_mode=''',1)
          s=s.replace('''            "focusShadowEnabled":self.focus_shadow_enabled,"focusSelectionMode":self.focus_selection_mode,''','''            "focusShadowEnabled":self.focus_shadow_enabled,"focusLiveEnabled":self.focus_live_enabled,"focusSelectionMode":self.focus_selection_mode,''',1)
          p.write_text(s)

          # Runtime accidental broad replacement + exact legacy source contracts.
          p=Path('cloud_api/aster_strategy2_runtime.py');s=p.read_text()
          bad='''    for leg in owned:\n        if config.trading_mode=="focus" and str(leg.role).upper()=="FOCUS":continue\n        row=pos.get((leg.symbol,leg.side))\n'''
          good='''    for leg in owned:\n        row=pos.get((leg.symbol,leg.side))\n'''
          # The first occurrence in changed_owned_symbols is the bug. Remove only inside that function.
          start=s.index('def changed_owned_symbols(');end=s.index('def portfolio_state(',start);block=s[start:end]
          if bad not in block:raise SystemExit('changed_owned_symbols bad line missing')
          s=s[:start]+block.replace(bad,good,1)+s[end:]
          # most_urgent must skip Focus ownership, while legacy legs still use old S2 management.
          start=s.index('def most_urgent_profitable_owned(');end=s.index('def next_management_decision(',start);block=s[start:end]
          if 'str(leg.role).upper()=="FOCUS"' not in block:
              block=block.replace('''    for leg in owned:\n        row=pos.get((leg.symbol,leg.side))\n''','''    for leg in owned:\n        if config.trading_mode=="focus" and str(leg.role).upper()=="FOCUS":continue\n        row=pos.get((leg.symbol,leg.side))\n''',1)
          s=s[:start]+block+s[end:]
          p.write_text(s)

          # Live adapter: explicit arm, pending-open-order fail closed, queue callback renamed.
          p=Path('cloud_api/aster_strategy2_focus_live.py');s=p.read_text()
          s=s.replace('''                        dry_run:bool=False,order_budget:int|None=None,before_order:Callable[[Any,dict[str,Any]],None]|None=None)->dict[str,Any]|None:\n    if settings.trading_mode!="focus":return None\n''','''                        dry_run:bool=False,order_budget:int|None=None,reserve_order:Callable[[Any,dict[str,Any]],None]|None=None,\n                        open_orders:list[dict[str,Any]]|None=None)->dict[str,Any]|None:\n    if settings.trading_mode!="focus" or not settings.focus_live_enabled:return None\n''',1)
          s=s.replace('if before_order:before_order(intent,{','if reserve_order:reserve_order(intent,{')
          # There are two occurrences above after replacement (open + close).
          anchor='''    if order_budget is not None and order_budget<1:\n        return {"status":"budget-exhausted","action":f"FOCUS_{kind}","symbol":symbol,"ordersSent":0}\n    market_price='''
          insert='''    if order_budget is not None and order_budget<1:\n        return {"status":"budget-exhausted","action":f"FOCUS_{kind}","symbol":symbol,"ordersSent":0}\n    relevant_open_orders=[row for row in (open_orders or []) if isinstance(row,dict) and str(row.get("symbol","")).upper()==symbol]\n    if relevant_open_orders:\n        return {"status":"waiting","action":"FOCUS_OPEN_ORDER_PENDING","symbol":symbol,"ordersSent":0,\n            "reason":"Bestaande open Aster-order op Focus-pair; geen tweede order verzonden"}\n    market_price='''
          if anchor not in s:raise SystemExit('live open-order anchor missing')
          s=s.replace(anchor,insert,1)
          p.write_text(s)

          # Main: explicit start arms Focus; save cannot arm it; queue alias stays outside pending source block.
          p=Path('cloud_api/main.py');s=p.read_text()
          tick='''def _run_aster_strategy2_tick(uid:str,*,dry_run:bool=False,order_budget:int|None=None,\n                              before_order:Any=None)->dict[str,Any]:\n'''
          ticknew=tick+'''    focus_queue_reserver=before_order\n'''
          if 'focus_queue_reserver=before_order' not in s:
              if tick not in s:raise SystemExit('tick anchor missing')
              s=s.replace(tick,ticknew,1)
          s=s.replace('''            order_budget=order_budget,before_order=before_order)''','''            order_budget=order_budget,reserve_order=focus_queue_reserver,open_orders=orders)''',1)
          # Restore exact legacy source contract while disabling seat-refill on Focus in the next statement.
          s=s.replace('''    seat_shortage=(settings.trading_mode!="focus" and len(owned)<settings.maximum_pairs)''','''    seat_shortage=len(owned)<settings.maximum_pairs\n    if settings.trading_mode=="focus":seat_shortage=False''',1)
          # Explicit live Focus arm occurs only in confirmed /start endpoint.
          start_anchor='''    try: settings=Strategy2Config.from_mapping(request.settings)\n    except ValueError as exc: raise HTTPException(422,str(exc)) from exc\n    uid=str(user["uid"]);ref=aster_strategy2_reference(uid);existing=ref.get().to_dict() or {}\n    if settings.mode=="live":\n'''
          start_new='''    try: settings=Strategy2Config.from_mapping(request.settings)\n    except ValueError as exc: raise HTTPException(422,str(exc)) from exc\n    settings=replace(settings,focus_live_enabled=bool(settings.trading_mode=="focus" and settings.mode=="live"))\n    uid=str(user["uid"]);ref=aster_strategy2_reference(uid);existing=ref.get().to_dict() or {}\n    if settings.mode=="live":\n'''
          if start_anchor not in s:raise SystemExit('start arm anchor missing')
          s=s.replace(start_anchor,start_new,1)
          # Save endpoint: preserve an existing arm but never create one from a settings save.
          save_old='''@app.put("/v1/me/aster/strategy2/settings")\ndef save_aster_strategy2_settings(request: AsterStrategySettingsRequest, user: dict[str, Any] = Depends(authenticated_user)) -> dict[str, Any]:\n    try: candidate = Strategy2Config.from_mapping(request.settings)\n    except ValueError as exc: raise HTTPException(422, str(exc)) from exc\n    uid=str(user["uid"]);ref=aster_strategy2_reference(uid);existing=ref.get().to_dict() or {}\n    old=existing.get("settings") if isinstance(existing.get("settings"),dict) else {}\n'''
          save_new='''@app.put("/v1/me/aster/strategy2/settings")\ndef save_aster_strategy2_settings(request: AsterStrategySettingsRequest, user: dict[str, Any] = Depends(authenticated_user)) -> dict[str, Any]:\n    uid=str(user["uid"]);ref=aster_strategy2_reference(uid);existing=ref.get().to_dict() or {}\n    old=existing.get("settings") if isinstance(existing.get("settings"),dict) else {}\n    incoming=dict(request.settings);incoming["focusLiveEnabled"]=bool(old.get("focusLiveEnabled",False))\n    try: candidate = Strategy2Config.from_mapping(incoming)\n    except ValueError as exc: raise HTTPException(422, str(exc)) from exc\n    if candidate.trading_mode!="focus":candidate=replace(candidate,focus_live_enabled=False)\n'''
          if save_old not in s:raise SystemExit('settings save anchor missing')
          s=s.replace(save_old,save_new,1)
          p.write_text(s)

          # Update old Shadow-only contract test to the dual persisted evidence contract.
          p=Path('cloud_api/test_aster_strategy2_focus_public_contract.py')
          p.write_text('''from pathlib import Path\n\n\ndef test_strategy2_public_exposes_persisted_focus_evidence_without_read_side_effects():\n    source=Path(__file__).with_name("main.py").read_text()\n    assert 'raw.get("focusLiveState") if focus_live_mode else raw.get("focusShadowState")' in source\n    assert 'raw.get("focusLiveReport") if focus_live_mode else raw.get("focusShadowReport")' in source\n    assert '"metrics":raw.get("focusShadowMetrics"' in source\n    assert '"live":bool(focus_live_mode and enabled)' in source\n''')

          # Live tests must explicitly arm the mode.
          p=Path('cloud_api/test_aster_strategy2_focus_live.py');s=p.read_text()
          s=s.replace('''raw={"tradingMode":"focus","mode":"live","focusShadowEnabled":False,''','''raw={"tradingMode":"focus","mode":"live","focusShadowEnabled":False,"focusLiveEnabled":True,''',1)
          p.write_text(s)

          # Integration test source expectation updated for alias/legacy source contract.
          p=Path('cloud_api/test_aster_strategy2_focus_live_integration_contract.py');s=p.read_text()
          s=s.replace('''    assert "order_budget=order_budget,before_order=before_order" in source''','''    assert "order_budget=order_budget,reserve_order=focus_queue_reserver,open_orders=orders" in source''')
          s=s.replace('''    assert 'seat_shortage=(settings.trading_mode!="focus"' in source''','''    assert 'seat_shortage=len(owned)<settings.maximum_pairs' in source\n    assert 'if settings.trading_mode=="focus":seat_shortage=False' in source''')
          p.write_text(s)
          PY
      - name: Add arm regression tests
        run: |
          cat > cloud_api/test_aster_strategy2_focus_live_arm.py <<'PY'
          from pathlib import Path
          from aster_strategy2 import Strategy2Config
          from aster_strategy2_focus_live import run_focus_live_step

          class Ref:
              def set(self,*_a,**_k): raise AssertionError("unarmed Focus must not mutate or order")

          def test_focus_live_is_unarmed_by_default_for_existing_shadow_accounts():
              config=Strategy2Config.from_mapping({"tradingMode":"focus","mode":"live"})
              assert config.focus_live_enabled is False
              assert config.public_dict()["focusLiveEnabled"] is False
              assert run_focus_live_step(client=object(),ref=Ref(),raw_state={},settings=config,uid="u",account={},positions=[],timestamp_ms=1) is None

          def test_only_confirmed_start_endpoint_arms_focus_live():
              source=Path(__file__).with_name("main.py").read_text()
              assert 'settings=replace(settings,focus_live_enabled=bool(settings.trading_mode=="focus" and settings.mode=="live"))' in source
              assert 'incoming["focusLiveEnabled"]=bool(old.get("focusLiveEnabled",False))' in source
          PY
      - name: Verify and commit
        run: |
          python -m py_compile cloud_api/aster_strategy2.py cloud_api/aster_strategy2_runtime.py cloud_api/aster_strategy2_focus_live.py cloud_api/main.py
          ! grep -A8 'def changed_owned_symbols' cloud_api/aster_strategy2_runtime.py | grep -q 'config.trading_mode'
          grep -q 'focus_live_enabled' cloud_api/aster_strategy2.py
          rm -f .github/workflows/focus-live-safety-fix.yml .focus-live-safety-trigger
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add -A
          git commit -m "fix: harden Focus live activation and queue safety"
          git push origin HEAD:amar-crypto-bot-2026-cloud
