name: Fix Focus Manual Full Universe
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch manual Focus universe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter=Path('cloud_api/aster_strategy2_focus_adapter.py')
          s=adapter.read_text()
          old='''    raw: list[tuple[str, float, float]] = []\n    for row in tickers:\n        if not isinstance(row, dict): continue\n        symbol = str(row.get("symbol", "")).upper()\n        if symbol not in allowed: continue\n        change = _f(row.get("priceChangePercent")) / 100.0\n        quote_volume = _f(row.get("quoteVolume"))\n        if change <= 0 or quote_volume <= 0: continue\n        raw.append((symbol, change, quote_volume))\n    raw.sort(key=lambda x: x[1], reverse=True)\n'''
          new='''    ticker_by_symbol = {str(row.get("symbol", "")).upper(): row for row in tickers if isinstance(row, dict)}\n    raw: list[tuple[str, float, float]] = []\n    for symbol in allowed:\n        row = ticker_by_symbol.get(symbol, {})\n        change = _f(row.get("priceChangePercent")) / 100.0\n        quote_volume = max(0.0, _f(row.get("quoteVolume")))\n        raw.append((symbol, change, quote_volume))\n    raw.sort(key=lambda x: x[1], reverse=True)\n'''
          assert old in s
          adapter.write_text(s.replace(old,new,1))

          focus=Path('cloud_api/aster_strategy2_focus.py')
          s=focus.read_text()
          old='''    if selection_mode=="manual":\n        selected=next((r for r in ranking if r.symbol==manual_pair.upper().strip() and r.eligible),None)\n        return selected,ranking,"handmatige Focus-selectie" if selected else "handmatige pair niet beschikbaar/eligible"\n'''
          new='''    if selection_mode=="manual":\n        selected=next((r for r in ranking if r.symbol==manual_pair.upper().strip()),None)\n        return selected,ranking,"handmatige Focus-selectie" if selected else "handmatige pair niet beschikbaar op Aster"\n'''
          assert old in s
          focus.write_text(s.replace(old,new,1))

          ui=Path('web/components/aster-strategy2-focus-pair-selector.tsx')
          s=ui.read_text()
          old=''' const eligible=useMemo(()=>source.filter(row=>row.eligible!==false&&String(row.symbol||"").trim()).filter(row=>String(row.symbol||"").toUpperCase().includes(query.toUpperCase().trim())),[source,query]);'''
          new=''' const eligible=useMemo(()=>source.filter(row=>String(row.symbol||"").trim()).filter(row=>String(row.symbol||"").toUpperCase().includes(query.toUpperCase().trim())),[source,query]);'''
          assert old in s
          ui.write_text(s.replace(old,new,1))
          PY
      - name: Add regression tests
        shell: bash
        run: |
          cat >> cloud_api/test_aster_strategy2_focus.py <<'PY'

          def test_manual_selection_can_choose_noneligible_tradable_pair():
              markets=[FocusMarket('HYPEUSDT',10,-.05,50_000_000,1.0,())]
              selected,ranking,reason=select_focus_pair(markets,selection_mode='manual',manual_pair='HYPEUSDT',minimum_quote_volume=10_000_000)
              assert selected is not None and selected.symbol=='HYPEUSDT'
              assert selected.eligible is False
              assert reason=='handmatige Focus-selectie'
          PY
          cat >> cloud_api/test_aster_strategy2_focus_adapter.py <<'PY'

          def test_market_adapter_keeps_negative_and_zero_change_tradable_pairs_for_manual_search():
              class AllPairsClient(FakeClient):
                  def public_exchange_info(self):
                      return {'symbols':[{'symbol':'HYPEUSDT','quoteAsset':'USDT','status':'TRADING','contractType':'PERPETUAL'},{'symbol':'MUUSDT','quoteAsset':'USDT','status':'TRADING','contractType':'PERPETUAL'}]}
                  def ticker_24h(self): return [{'symbol':'HYPEUSDT','priceChangePercent':'-5','quoteVolume':'1000000'},{'symbol':'MUUSDT','priceChangePercent':'0','quoteVolume':'0'}]
                  def ticker_prices(self): return [{'symbol':'HYPEUSDT','price':'10'},{'symbol':'MUUSDT','price':'80'}]
                  def klines(self,*_args): return []
              rows=current_focus_markets(AllPairsClient(),Strategy2Config.from_mapping({'tradingMode':'focus','minimumQuoteVolume24hUsdt':10_000_000}))
              assert {row.symbol for row in rows}=={'HYPEUSDT','MUUSDT'}
          PY
      - name: Run Focus regressions
        shell: bash
        run: |
          pip install -q -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q test_aster_strategy2_focus.py test_aster_strategy2_focus_adapter.py test_aster_strategy2_focus_live.py test_aster_strategy2_focus_live_execution_paths.py
      - name: Commit patch and remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/fix-focus-manual-full-universe.yml
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add cloud_api/aster_strategy2_focus_adapter.py cloud_api/aster_strategy2_focus.py web/components/aster-strategy2-focus-pair-selector.tsx cloud_api/test_aster_strategy2_focus.py cloud_api/test_aster_strategy2_focus_adapter.py .github/workflows/fix-focus-manual-full-universe.yml
          git commit -m 'fix: show full Aster universe for manual Focus pair selection'
          git push origin HEAD:amar-crypto-bot-2026-cloud
