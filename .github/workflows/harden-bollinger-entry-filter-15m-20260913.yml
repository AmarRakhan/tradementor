name: Harden Bollinger Entry Filter 15m

on:
  push:
    branches: [agent/bollinger-entry-filter-15m-20260913]
    paths:
      - ".github/scripts/harden_bollinger_entry_filter_15m.py"
      - ".github/workflows/harden-bollinger-entry-filter-15m-20260913.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bollinger-entry-filter-15m-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - run: python .github/scripts/harden_bollinger_entry_filter_15m.py
      - run: pip install -r cloud_api/requirements.txt pytest
      - name: Run Bollinger unit and seat-flow tests
        working-directory: cloud_api
        run: pytest -q test_aster_bollinger_entry_filter.py test_aster_bollinger_entry_filter_seat_flow.py
      - name: Full backend regression
        working-directory: cloud_api
        run: pytest -q
      - name: Commit hardening
        run: |
          git config user.name "OpenAI Bollinger Entry Filter Agent"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_aster_bollinger_entry_filter_seat_flow.py
          git diff --cached --check
          git commit -m "Harden Bollinger seat filling and waiting state"
          git push origin HEAD:agent/bollinger-entry-filter-15m-20260913
