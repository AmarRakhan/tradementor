name: Focus 2.0 Builder

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - tools/focus_v2_builder.py
      - tools/focus_v2_builder_fix.py
      - .github/workflows/focus-v2-builder.yml

permissions:
  contents: write

env:
  PYTHONPATH: cloud_api

jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, 'focus-v2-builder applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply Focus 2.0 patch
        run: |
          python tools/focus_v2_builder_fix.py
          python tools/focus_v2_builder.py
      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Compile changed backend
        run: python -m py_compile cloud_api/aster_strategy2.py cloud_api/aster_strategy2_focus_live.py cloud_api/aster_strategy2_focus_v2.py
      - name: Run Focus 2.0 and existing Focus tests
        working-directory: cloud_api
        run: pytest -q test_aster_strategy2_focus_v2.py test_focus_hedge_profit_gate_contract.py test_aster_strategy2_focus.py test_aster_strategy2_focus_live.py test_aster_strategy2_focus_multi.py
      - name: Run full backend tests
        working-directory: cloud_api
        run: pytest -q
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "TradeMentor Focus 2.0 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_strategy2.py cloud_api/aster_strategy2_focus_live.py cloud_api/aster_strategy2_focus_v2.py cloud_api/test_aster_strategy2_focus_v2.py web/components/aster-strategy2-maker.tsx
          git commit -m "feat: add isolated Focus 2.0 protected long builder [focus-v2-builder applied]"
          git push origin HEAD:amar-crypto-bot-2026-cloud
