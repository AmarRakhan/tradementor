name: Probe spike-tellingen (publiek, geen secrets, geen orders)
on:
  push:
    branches: [claude/probe-spike-counts]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/probe/spike_day_probe.py tools/probe/tradable.txt "$RUNNER_TEMP/counts.json" tools/probe/low_fee.txt
      - name: Data naar branch probe-data-counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/counts.json" spike-counts.json
          git init -q && git config user.name probe-bot && git config user.email noreply@github.com
          git checkout -q --orphan probe-data-counts && git add . && git commit -qm "probe data [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-data-counts
