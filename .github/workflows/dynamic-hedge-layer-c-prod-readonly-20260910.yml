name: Dynamic Hedge Layer C - Production Read Only

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - .github/dynamic-hedge-layer-c-prod-readonly-20260910.trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dynamic-hedge-layer-c-prod-readonly-20260910
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  SOURCE_SERVICE: tradementor-strategy2-recovery-api
  FEATURE_SHA: 44b93fa684067ceb17006d79f8173a5d95119410

jobs:
  verify-real-aster-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted production workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: production-src

      - name: Check out exact tested Dynamic Hedge source read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_SHA }}
          path: feature-src

      - name: Prove this workflow is GET-only and execution-disabled
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          python - <<'PY'
          from pathlib import Path
          p = Path('production-src/.github/workflows/dynamic-hedge-layer-c-prod-readonly-20260910.yml')
          text = p.read_text(encoding='utf-8')
          forbidden = [
              'live_authorized=' + 'True',
              'ASTER_LIVE_EXECUTION_ENABLED=' + 'true',
              'ASTER_DYNAMIC_HEDGE_EXECUTION_ENABLED=' + 'true',
              '.' + 'new_order' + '(',
              '.' + 'place_order' + '(',
              '.' + 'submit_order' + '(',
              '.' + 'execute_decision' + '(',
              '.' + 'execute_leg' + '(',
              '.' + 'execute_close' + '(',
          ]
          if any(token in text for token in forbidden):
              raise SystemExit('Read-only proof failed: mutating token present')
          required = [
              'live_authorized=False',
              'ASTER_LIVE_EXECUTION_ENABLED=false',
              'ASTER_DYNAMIC_HEDGE_EXECUTION_ENABLED=false',
              'account_information()',
              'position_risk()',
              'open_orders()',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('Read-only proof failed: required guard/read missing')
          print('Static Layer C proof PASS: GET-only, live execution disabled')
          PY

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify tested feature projection against real Aster GET data only
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="$(gcloud run services describe "$SOURCE_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          IMAGE="$(gcloud run services describe "$SOURCE_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
          test -n "$RUNTIME_SA"
          test -n "$IMAGE"
          JOB="tm-dh-readonly-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(python - <<'PY'
          import base64, pathlib
          root = pathlib.Path('feature-src/cloud_api')
          sources = {}
          for name in ('aster_dynamic_hedge','aster_cross_risk','aster_dynamic_hedge_verify'):
              sources[name] = base64.b64encode((root / f'{name}.py').read_bytes()).decode()
          feature_sha = '44b93fa684067ceb17006d79f8173a5d95119410'
          script = f'''import base64, hashlib, json, sys, types\nfrom google.cloud import firestore\n\ndef load_module(name, encoded):\n    module=types.ModuleType(name)\n    module.__file__=name+'.py'\n    sys.modules[name]=module\n    exec(compile(base64.b64decode(encoded), module.__file__, 'exec'), module.__dict__)\n    return module\n\ndynamic=load_module('aster_dynamic_hedge', {sources['aster_dynamic_hedge']!r})\ncross=load_module('aster_cross_risk', {sources['aster_cross_risk']!r})\nverify=load_module('aster_dynamic_hedge_verify', {sources['aster_dynamic_hedge_verify']!r})\nimport main\nfrom aster_gateway import AsterV3Client\n\ndb=firestore.Client(project='tradementor-production')\nresults=[]\nfor doc in db.collection('asterStrategy2').stream():\n    state=doc.to_dict() or {{}}\n    if not (state.get('enabled') or state.get('monitor')):\n        continue\n    account_ref=hashlib.sha256(doc.id.encode()).hexdigest()[:10]\n    try:\n        secret=main.load_aster_secret({{'uid':doc.id}})\n        client=AsterV3Client(signer_address=secret.signer_address,sign_message=main.local_eip712_signer(secret),live_authorized=False)\n        account=client.account_information()\n        positions=client.position_risk()\n        open_orders=client.open_orders()\n        risk=cross.cross_account_risk(account,positions)\n        proof=verify.verify_read_only_projection(account,positions,risk)\n        results.append({{\n            'accountRef':account_ref,\n            'passed':bool(proof.get('passed')),\n            'failureCodes':proof.get('failureCodes',[]),\n            'ordersSubmitted':int(proof.get('ordersSubmitted',-1)),\n            'equity':risk.get('equity'),\n            'maintenanceMargin':risk.get('maintenanceMarginUsd'),\n            'availableBalance':account.get('availableBalance'),\n            'marginBuffer':risk.get('marginBufferUsd'),\n            'bufferRatio':risk.get('bufferRatio'),\n            'longExposure':risk.get('longNotional'),\n            'shortExposure':risk.get('shortNotional'),\n            'grossExposure':risk.get('grossExposure'),\n            'signedNetExposure':risk.get('signedNetExposure'),\n            'hedgeCoveragePercent':risk.get('hedgeCoveragePercent'),\n            'liquidationRiskPct':risk.get('liquidationRiskPct'),\n            'liquidationSafetyStatus':risk.get('liquidationSafetyStatus'),\n            'activePositionCount':risk.get('positionCountIncluded'),\n            'openOrderCount':len(open_orders) if isinstance(open_orders,list) else -1,\n        }})\n    except Exception as exc:\n        results.append({{'accountRef':account_ref,'passed':False,'failureCodes':['READ_EXCEPTION'],'errorType':type(exc).__name__}})\nsummary={{\n    'readOnly':True,\n    'featureSha':feature_sha,\n    'liveAuthorized':False,\n    'ordersSubmitted':sum(int(x.get('ordersSubmitted',0)) for x in results),\n    'accounts':len(results),\n    'passed':sum(1 for x in results if x.get('passed')),\n    'failed':sum(1 for x in results if not x.get('passed')),\n}}\nprint('DYNAMIC_HEDGE_LAYER_C_READONLY '+json.dumps(summary,sort_keys=True,separators=(',',':')))\nif not results:\n    raise SystemExit(2)\nif any(not x.get('passed') for x in results):\n    raise SystemExit(3)\nif summary['ordersSubmitted'] != 0:\n    raise SystemExit(4)\n'''
          print(base64.b64encode(script.encode()).decode())
          PY
          )"

          gcloud run jobs deploy "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,FIREBASE_AUTH_PROJECT_ID=$GCP_PROJECT_ID,TRADEMENTOR_ENVIRONMENT=dynamic-hedge-layer-c-readonly,ASTER_LIVE_EXECUTION_ENABLED=false,ASTER_DYNAMIC_HEDGE_EXECUTION_ENABLED=false" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet

          # The container itself contains the assertions above. Cloud Run returns
          # success only if: at least one active account was read, every raw-vs-
          # projection comparison passed, and ordersSubmitted stayed exactly zero.
          gcloud run jobs execute "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
          echo 'LAYER_C_PASS: real Aster GET data matched the tested Dynamic Hedge projection; liveAuthorized=false; ordersSubmitted=0.'
          cleanup
          trap - EXIT
