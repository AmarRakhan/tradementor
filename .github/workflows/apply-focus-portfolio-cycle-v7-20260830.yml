name: Apply Focus Portfolio Cycle V7 20260830

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - tools/apply_focus_portfolio_cycle_v7_20260830.py
      - tools/fix_focus_portfolio_v7_test_newlines.py
      - tools/update_focus_portfolio_v7_contract_tests.py
      - tools/fix_focus_portfolio_v7_contract_migration.py
      - .github/workflows/apply-focus-portfolio-cycle-v7-20260830.yml

permissions:
  contents: write

concurrency:
  group: focus-portfolio-cycle-v7-20260830
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Apply portfolio-cycle v7 migration
        run: |
          python tools/apply_focus_portfolio_cycle_v7_20260830.py
          python tools/fix_focus_portfolio_v7_test_newlines.py
          python tools/fix_focus_portfolio_v7_contract_migration.py
          python tools/update_focus_portfolio_v7_contract_tests.py

      - name: Install backend test dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run v7 and Focus regression tests
        working-directory: cloud_api
        run: |
          pytest -q \
            test_focus_portfolio_cycle_v7.py \
            test_focus_simple_deterministic_flow.py \
            test_aster_strategy2_focus_trailing.py \
            test_aster_strategy2_focus_live_execution_paths.py \
            test_aster_realtime.py \
            test_aster_realtime_integration.py

      - name: Run full backend suite
        working-directory: cloud_api
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify v7 contract in generated source
        shell: bash
        run: |
          grep -q 'def portfolio_target_reached' cloud_api/aster_strategy2_focus_trailing.py
          grep -q 'FOCUS_HEDGE_RELEASED_MECHANICAL' cloud_api/aster_strategy2_focus_trailing.py
          grep -q 'FOCUS_REHEDGE_ACTIVE' cloud_api/aster_strategy2_focus_trailing.py
          grep -q 'Alles sluiten bij portfoliogroei' web/components/aster-strategy2-maker.tsx
          python - <<'PY'
          from pathlib import Path
          src=Path('cloud_api/aster_strategy2_focus_trailing.py').read_text()
          section=src.split('# v7 mechanical SHORT release.',1)[1].split('# Legacy non-simple Focus TP only.',1)[0]
          assert 'net_green_ready' not in section
          assert 'protectionReserveReady' not in section
          assert 'reHedgeArmed' in section
          assert src.index('target_now = bool(simple_flow') < src.index('# Hard invariant: a confirmed LONG DCA')
          print('v7 contract source verification OK')
          PY

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'focus-portfolio-v7-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            cloud_api/aster_strategy2_focus_trailing.py \
            cloud_api/test_focus_portfolio_cycle_v7.py \
            cloud_api/test_focus_simple_deterministic_flow.py \
            cloud_api/test_aster_strategy2_focus_trailing.py \
            web/components/aster-strategy2-maker.tsx
          if git diff --cached --quiet; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git commit -m 'Replace Focus Strategy 2 with portfolio-cycle v7'
          git push origin HEAD:amar-crypto-bot-2026-cloud
