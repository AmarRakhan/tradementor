name: Check portfolio growth web deployment
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/diagnose-portfolio-web-after-dispatch.yml]
permissions:
  contents: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
      DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with: {ref: amar-crypto-bot-2026-cloud, fetch-depth: 0}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          sleep 45
          gcloud run services describe amar-bot-v44-direct-install --project tradementor-production --region europe-west4 --format='value(status.traffic[0].revisionName)' > .portfolio-web-live-check
          git config user.name 'TradeMentor Control Plane'; git config user.email 'actions@users.noreply.github.com'
          git add .portfolio-web-live-check; git commit -m 'Record portfolio web live revision'; git push origin HEAD:amar-crypto-bot-2026-cloud
