name: Public Aster Top350 1m LONG Bollinger scan 20260921

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tradementor-public-top350-1m-longscan
  cancel-in-progress: true

env:
  RESULT_ISSUE: '209'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan live public Aster Top-350 with production Bollinger rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/publicscan.json"
          import json,math,time,urllib.parse,urllib.request,concurrent.futures

          BASE='https://fapi.asterdex.com'
          UA={'User-Agent':'tradementor-readonly-diagnostic/1.0'}
          def get(path,timeout=15):
              req=urllib.request.Request(BASE+path,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.loads(r.read().decode())

          info=get('/fapi/v3/exchangeInfo')
          ticks=get('/fapi/v3/ticker/24hr')
          prices=get('/fapi/v3/ticker/price')
          allowed={str(x.get('symbol','')).upper() for x in info.get('symbols',[]) if str(x.get('quoteAsset','USDT')).upper()=='USDT' and str(x.get('status','TRADING')).upper()=='TRADING'}
          ranked=[]
          for row in ticks if isinstance(ticks,list) else []:
              s=str(row.get('symbol','')).upper()
              if s not in allowed or not s.endswith('USDT'): continue
              try:v=float(row.get('quoteVolume',row.get('quoteVolume24h',0)) or 0)
              except:v=0
              if v>0:ranked.append((s,v))
          ranked.sort(key=lambda x:(-x[1],x[0]))
          top=[s for s,_ in ranked[:350]]
          pmap={str(x.get('symbol','')).upper():float(x.get('price') or 0) for x in prices if isinstance(x,dict)}

          def one(symbol):
              try:
                  q=urllib.parse.urlencode({'interval':'1m','symbol':symbol,'limit':25})
                  rows=get('/fapi/v1/klines?'+q)
                  if not isinstance(rows,list) or len(rows)<20:return ('error',symbol,None,None,None)
                  closes=[float(r[4] if isinstance(r,(list,tuple)) else r.get('close',r.get('c'))) for r in rows[-20:]]
                  mean=sum(closes)/20
                  var=sum((x-mean)**2 for x in closes)/20
                  lower=mean-2*math.sqrt(max(0,var))
                  price=float(pmap.get(symbol,0))
                  if price<=0 or lower<=0:return ('error',symbol,None,None,None)
                  dist=(lower-price)/lower*100
                  return ('pass' if price<lower else 'reject',symbol,price,lower,dist)
              except Exception as e:
                  return ('error',symbol,None,None,None)

          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for r in ex.map(one,top):out.append(r)
          passes=[r for r in out if r[0]=='pass']
          rejects=[r for r in out if r[0]=='reject']
          errors=[r for r in out if r[0]=='error']
          passes.sort(key=lambda r:r[4],reverse=True)
          print(json.dumps({
             'topCount':len(top),'passCount':len(passes),'rejectCount':len(rejects),'errorCount':len(errors),
             'signals':[{'symbol':r[1],'price':r[2],'lower':r[3],'belowLowerPct':r[4]} for r in passes[:25]],
             'checkedAtMs':int(time.time()*1000)
          },separators=(',',':')))
          PY

      - name: Publish public market result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - "$RUNNER_TEMP/publicscan.json" > "$RUNNER_TEMP/result.md" <<'PY'
          import json,sys,datetime
          print('## Publieke Aster Top-350 · 1m LONG Bollinger scan')
          print()
          try:d=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:d={}
          if not d:
              print('- Resultaat: **scan niet leesbaar**')
          else:
              print(f"- Top-N markten: **{d.get('topCount')}**")
              print(f"- LONG-signaal nu (live prijs < 20×1m lower Bollinger): **{d.get('passCount')}**")
              print(f"- Geen LONG-signaal: **{d.get('rejectCount')}**")
              print(f"- Marktdatafouten: **{d.get('errorCount')}**")
              sig=d.get('signals') or []
              if sig:
                  print()
                  print('### Actuele LONG-signalen')
                  for x in sig:
                      print(f"- `{x['symbol']}` · {x['belowLowerPct']:.4f}% onder lower band")
              ts=d.get('checkedAtMs')
              if ts:
                  print()
                  print('- Gemeten: **'+datetime.datetime.fromtimestamp(ts/1000,datetime.timezone.utc).isoformat()+'**')
          print()
          print('_Publieke marktdata; geen accountdata gelezen en niets gewijzigd._')
          PY
          gh issue comment "$RESULT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"