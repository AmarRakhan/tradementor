name: Dharma Thuis Canonical Auth Probe

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/dharma-thuis-canonical-auth-probe.yml"

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify non-deploy probe
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          echo "Auth only; no build or deployment."

      - name: Authenticate only
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Confirm accepted identity
        run: echo "Canonical WIF authentication accepted."
