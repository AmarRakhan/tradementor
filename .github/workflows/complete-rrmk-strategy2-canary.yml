name: Verify rrmk Strategy 2 after canary read-only
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/complete-rrmk-strategy2-canary.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL: rrmk18@outlook.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify current state and Aster exchange truth
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-postverify-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          spec=json.load(open(sys.argv[1]))["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"]);print(spec["serviceAccountName"])
          PY
          )
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import json,os
          from datetime import datetime,timezone
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          from main import load_aster_secret,local_eip712_signer
          from aster_gateway import AsterV3Client
          app=firebase_admin.initialize_app(options={"projectId":"tradementor-production"},name="rrmk-postverify")
          user=auth.get_user_by_email(os.environ["TARGET_EMAIL"],app=app)
          db=firestore.Client(project="tradementor-amar-20260813")
          ref=db.collection("asterStrategy2").document(user.uid)
          state=ref.get().to_dict() or {}
          canary=ref.collection("canaries").document("open-fill-close-v1").get().to_dict() or {}
          secret=load_aster_secret({"uid":user.uid})
          client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)
          positions=client.position_risk()
          open_orders=client.open_orders()
          active=[x for x in positions if abs(float(x.get("positionAmt") or 0))>0]
          eth=[x for x in active if str(x.get("symbol","")).upper()=="ETHUSDT"]
          last_tick=state.get("lastTickAt")
          age=None
          if isinstance(last_tick,datetime):
              stamp=last_tick.replace(tzinfo=timezone.utc) if last_tick.tzinfo is None else last_tick.astimezone(timezone.utc)
              age=max(0,int((datetime.now(timezone.utc)-stamp).total_seconds()))
          out={"readOnly":True,"ordersSent":0,"stateWrites":0,"canaryStatus":str(canary.get("status","")).upper(),"canaryValidated":bool(state.get("canaryValidated")),"liveReady":bool(state.get("liveReady")),"enabled":bool(state.get("enabled")),"monitor":bool(state.get("monitor")),"phase":str(state.get("phase","")),"lastReason":str(state.get("lastReason","")),"heartbeatAgeSeconds":age,"activePositions":len(active),"ethActivePositions":len(eth),"openOrders":len(open_orders),"unassignedPositions":int(state.get("unassignedPositions",0) or 0)}
          print("POST_VERIFY "+json.dumps(out,separators=(",",":")))
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "${VALUES[0]}" --service-account "${VALUES[1]}" --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" --set-env-vars "TARGET_EMAIL=$TARGET_EMAIL,GOOGLE_CLOUD_QUOTA_PROJECT=tradementor-production,GOOGLE_CLOUD_PROJECT=tradementor-amar-20260813" --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"POST_VERIFY \"" --project "$GCP_PROJECT_ID" --freshness 30m --limit 5 --order desc --format='value(textPayload)'
