name: Apply Focus hedge profit gate once

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/apply-focus-hedge-profit-gate-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - name: Patch Focus hedge close rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          multi = Path('cloud_api/aster_strategy2_focus_multi.py')
          text = multi.read_text()

          old = '''def _close_evidence(client:Any,*,uid:str,leg:OwnedLeg,mark:float,reason:str,target_usdt:float=0.0)->CloseEvidence:
              trades=client.user_trades(leg.symbol,limit=500);income=client.income_history(limit=500)
              relevant=[x for x in trades if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("positionSide","")).upper()==leg.side and int(_f(x.get("time",x.get("timestamp",0))))>=leg.created_at_ms]
              entry_fees=sum(abs(_f(x.get("commission"))) for x in relevant)
              funding=sum(_f(x.get("income")) for x in income if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("incomeType","")).upper()=="FUNDING_FEE" and int(_f(x.get("time",0)))>=leg.created_at_ms)
              notional=leg.quantity*mark
              return CloseEvidence(uid,leg.symbol,leg.side,"strategy2:MULTI_FOCUS",reason,leg.quantity,leg.weighted_entry,mark,
                  _gross_pnl(leg.side,leg.weighted_entry,mark,leg.quantity),entry_fees,notional*.0005,funding,notional*.001,
                  ownership_reliable=True,fills_reliable=bool(relevant),prices_reliable=mark>0,costs_reliable=True,
                  minimum_positive_buffer=target_usdt if target_usdt>0 else None)
          '''
          new = '''def _close_evidence(client:Any,*,uid:str,leg:OwnedLeg,mark:float,reason:str,target_usdt:float=0.0,quantity:float|None=None)->CloseEvidence:
              trades=client.user_trades(leg.symbol,limit=500);income=client.income_history(limit=500)
              relevant=[x for x in trades if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("positionSide","")).upper()==leg.side and int(_f(x.get("time",x.get("timestamp",0))))>=leg.created_at_ms]
              close_quantity=min(leg.quantity,max(0.0,_f(quantity,leg.quantity))) if quantity is not None else leg.quantity
              ratio=min(1.0,close_quantity/max(leg.quantity,1e-12))
              entry_fees=sum(abs(_f(x.get("commission"))) for x in relevant)*ratio
              funding=sum(_f(x.get("income")) for x in income if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("incomeType","")).upper()=="FUNDING_FEE" and int(_f(x.get("time",0)))>=leg.created_at_ms)*ratio
              notional=close_quantity*mark
              return CloseEvidence(uid,leg.symbol,leg.side,"strategy2:MULTI_FOCUS",reason,close_quantity,leg.weighted_entry,mark,
                  _gross_pnl(leg.side,leg.weighted_entry,mark,close_quantity),entry_fees,notional*.0005,funding,notional*.001,
                  ownership_reliable=True,fills_reliable=bool(relevant),prices_reliable=mark>0,costs_reliable=True,
                  minimum_positive_buffer=target_usdt if target_usdt>0 else None)
          '''
          if old not in text:
              raise SystemExit('multi _close_evidence block not found')
          text = text.replace(old, new, 1)

          old = '''            else:
                          # Protection correction is not a profit-taking exit. It may reduce
                          # an oversized hedge even when that hedge leg itself is negative.
                          intent=AsterOrderIntent(prefix,symbol,PositionSide(correction_side),plan.quantity,"CLOSE")
                          reserve_correction(intent)
                          raw_result,_recovered=client.submit_order_once(intent,config=AsterAutomationConfig(enabled=True,mode="live"),confirm=True,hedge_mode_confirmed=True,risk_approved=True)
                          if not isinstance(raw_result,dict): raise RuntimeError("hedge-correctie gaf geen geldige Aster response")
                          result={"result":raw_result}
          '''
          new = '''            else:
                          hedge_liq=_f((hedge_row or {}).get("liquidationPrice"));hedge_liq_distance=abs(mark-hedge_liq)/mark if hedge_liq>0 and mark>0 else 1.0
                          safety_override=maint_ratio>=settings.emergency_margin_ratio or hedge_liq_distance<.05
                          try:
                              hedge_evidence=_close_evidence(client,uid=uid,leg=hedge_leg,mark=mark,reason="parked hedge correction",quantity=float(plan.quantity))
                          except Exception as exc:
                              state.update({"status":"PARKED","pendingAction":"HEDGE_CLOSE_BLOCKED","recoveryStatus":f"hedge-close kostendata onbetrouwbaar: {exc}","lastReconciledAt":timestamp_ms});states[slot_id]=state
                              _audit(ref,"FOCUS_HEDGE_CLOSE_BLOCKED",slot_id=slot_id,symbol=symbol,side=correction_side,reason="netto PnL niet betrouwbaar; hedge blijft staan",netPnl=None,quantity=float(plan.quantity))
                              return {"status":"waiting","action":"FOCUS_HEDGE_CLOSE_BLOCKED","slotId":slot_id,"symbol":symbol,"ordersSent":0,"reason":"netto PnL niet betrouwbaar"}
                          if not safety_override and hedge_evidence.expected_net<=0:
                              state.update({"status":"PARKED","pendingAction":"HEDGE_CLOSE_BLOCKED","recoveryStatus":f"hedge-close geblokkeerd: netto PnL {hedge_evidence.expected_net:.8f} <= 0","lastReconciledAt":timestamp_ms});states[slot_id]=state
                              _audit(ref,"FOCUS_HEDGE_CLOSE_BLOCKED",slot_id=slot_id,symbol=symbol,side=correction_side,reason="netto PnL <= 0; hedge blijft staan",netPnl=hedge_evidence.expected_net,grossPnl=hedge_evidence.gross_pnl,entryFees=hedge_evidence.entry_fees,closeFee=hedge_evidence.close_fee,funding=hedge_evidence.funding,slippageBuffer=hedge_evidence.slippage_buffer,quantity=float(plan.quantity))
                              return {"status":"waiting","action":"FOCUS_HEDGE_CLOSE_BLOCKED","slotId":slot_id,"symbol":symbol,"ordersSent":0,"reason":"netto PnL <= 0","netPnl":hedge_evidence.expected_net}
                          if safety_override:
                              _audit(ref,"FOCUS_HEDGE_CLOSE_SAFETY_OVERRIDE",slot_id=slot_id,symbol=symbol,side=correction_side,reason="expliciete margin/liquidatie-nood",netPnl=hedge_evidence.expected_net,maintenanceMarginRatio=maint_ratio,liquidationDistance=hedge_liq_distance)
                          intent=AsterOrderIntent(prefix,symbol,PositionSide(correction_side),plan.quantity,"CLOSE")
                          reserve_correction(intent)
                          raw_result,_recovered=client.submit_order_once(intent,config=AsterAutomationConfig(enabled=True,mode="live"),confirm=True,hedge_mode_confirmed=True,risk_approved=True)
                          if not isinstance(raw_result,dict): raise RuntimeError("hedge-correctie gaf geen geldige Aster response")
                          result={"result":raw_result}
          '''
          if old not in text:
              raise SystemExit('multi hedge correction close block not found')
          text = text.replace(old, new, 1)
          multi.write_text(text)

          single = Path('cloud_api/aster_strategy2_focus_live.py')
          text = single.read_text()
          old = '''    relevant=[x for x in trades if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("positionSide","")).upper()=="LONG" and int(_f(x.get("time",x.get("timestamp",0))))>=leg.created_at_ms]
              ratio=min(1.0,quantity/max(leg.quantity,1e-12));entry_fees=sum(abs(_f(x.get("commission"))) for x in relevant)*ratio
              funding=sum(_f(x.get("income")) for x in income if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("incomeType","")).upper()=="FUNDING_FEE" and int(_f(x.get("time",0)))>=leg.created_at_ms)*ratio
              notional=quantity*mark;gross=(mark-leg.weighted_entry)*quantity
              return CloseEvidence(uid,leg.symbol,"LONG","strategy2:FOCUS",reason,quantity,leg.weighted_entry,mark,gross,
          '''
          new = '''    relevant=[x for x in trades if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("positionSide","")).upper()==leg.side and int(_f(x.get("time",x.get("timestamp",0))))>=leg.created_at_ms]
              ratio=min(1.0,quantity/max(leg.quantity,1e-12));entry_fees=sum(abs(_f(x.get("commission"))) for x in relevant)*ratio
              funding=sum(_f(x.get("income")) for x in income if isinstance(x,dict) and str(x.get("symbol","")).upper()==leg.symbol
                  and str(x.get("incomeType","")).upper()=="FUNDING_FEE" and int(_f(x.get("time",0)))>=leg.created_at_ms)*ratio
              notional=quantity*mark;gross=(mark-leg.weighted_entry)*quantity if leg.side=="LONG" else (leg.weighted_entry-mark)*quantity
              return CloseEvidence(uid,leg.symbol,leg.side,"strategy2:FOCUS",reason,quantity,leg.weighted_entry,mark,gross,
          '''
          if old not in text:
              raise SystemExit('single _close_evidence side block not found')
          text = text.replace(old, new, 1)

          old = '''        action="OPEN" if diff>0 else "CLOSE"
                  intent_id="s2fr-"+hashlib.sha256(f"{uid}|{parked.cycle_id}|{parked.symbol}|{action}|{round(qty_needed,12)}".encode()).hexdigest()[:16]
          '''
          new = '''        action="OPEN" if diff>0 else "CLOSE"
                  if action=="CLOSE":
                      hedge_leg=next((x for x in _owned(raw_state) if x.symbol==parked.symbol and x.side=="SHORT" and str(x.role).upper()=="FOCUS_HEDGE"),None)
                      equity=_f(account.get("totalMarginBalance"),_f(account.get("totalWalletBalance")));maint_ratio=_f(account.get("totalMaintMargin"))/equity if equity>0 else 1.0
                      hedge_row=_position_side_for(positions,parked.symbol,"SHORT") or {};hedge_liq=_f(hedge_row.get("liquidationPrice"));hedge_liq_distance=abs(mark-hedge_liq)/mark if hedge_liq>0 and mark>0 else 1.0
                      safety_override=maint_ratio>=settings.emergency_margin_ratio or hedge_liq_distance<.05
                      if hedge_leg is None:
                          _audit(ref,"FOCUS_HEDGE_CLOSE_BLOCKED",symbol=parked.symbol,side="SHORT",reason="bewezen hedge ownership ontbreekt",netPnl=None,quantity=qty_needed)
                          return {"status":"waiting","action":"FOCUS_HEDGE_CLOSE_BLOCKED","symbol":parked.symbol,"ordersSent":0,"reason":"bewezen hedge ownership ontbreekt"}
                      try:evidence=_close_evidence(client,uid=uid,leg=hedge_leg,row=hedge_row,quantity=qty_needed,mark=mark,reason="restart/cycle reconciliation")
                      except Exception as exc:
                          _audit(ref,"FOCUS_HEDGE_CLOSE_BLOCKED",symbol=parked.symbol,side="SHORT",reason=f"netto PnL niet betrouwbaar: {exc}",netPnl=None,quantity=qty_needed)
                          return {"status":"waiting","action":"FOCUS_HEDGE_CLOSE_BLOCKED","symbol":parked.symbol,"ordersSent":0,"reason":"netto PnL niet betrouwbaar"}
                      if not safety_override and evidence.expected_net<=0:
                          _audit(ref,"FOCUS_HEDGE_CLOSE_BLOCKED",symbol=parked.symbol,side="SHORT",reason="netto PnL <= 0; hedge blijft staan",netPnl=evidence.expected_net,grossPnl=evidence.gross_pnl,entryFees=evidence.entry_fees,closeFee=evidence.close_fee,funding=evidence.funding,slippageBuffer=evidence.slippage_buffer,quantity=qty_needed)
                          return {"status":"waiting","action":"FOCUS_HEDGE_CLOSE_BLOCKED","symbol":parked.symbol,"ordersSent":0,"reason":"netto PnL <= 0","netPnl":evidence.expected_net}
                      if safety_override:_audit(ref,"FOCUS_HEDGE_CLOSE_SAFETY_OVERRIDE",symbol=parked.symbol,side="SHORT",reason="expliciete margin/liquidatie-nood",netPnl=evidence.expected_net,maintenanceMarginRatio=maint_ratio,liquidationDistance=hedge_liq_distance)
                  intent_id="s2fr-"+hashlib.sha256(f"{uid}|{parked.cycle_id}|{parked.symbol}|{action}|{round(qty_needed,12)}".encode()).hexdigest()[:16]
          '''
          if old not in text:
              raise SystemExit('single parked correction action block not found')
          text = text.replace(old, new, 1)
          single.write_text(text)

          test = Path('cloud_api/test_focus_hedge_profit_gate_contract.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_multi_focus_hedge_close_is_net_profit_gated():\n    src=Path("cloud_api/aster_strategy2_focus_multi.py").read_text()\n    assert "FOCUS_HEDGE_CLOSE_BLOCKED" in src\n    assert "hedge_evidence.expected_net<=0" in src\n    assert "FOCUS_HEDGE_CLOSE_SAFETY_OVERRIDE" in src\n    assert "oversized hedge even when that hedge leg itself is negative" not in src\n\n\ndef test_single_focus_parked_short_close_is_net_profit_gated():\n    src=Path("cloud_api/aster_strategy2_focus_live.py").read_text()\n    assert "FOCUS_HEDGE_CLOSE_BLOCKED" in src\n    assert "evidence.expected_net<=0" in src\n    assert "bewezen hedge ownership ontbreekt" in src\n    assert "str(x.get(\\"positionSide\\",\\"\\")).upper()==leg.side" in src\n''')
          PY
      - name: Run focused tests
        run: |
          python -m pytest -q \
            cloud_api/test_focus_hedge_profit_gate_contract.py \
            cloud_api/test_aster_close_guard.py \
            cloud_api/test_aster_strategy2_focus_live.py \
            cloud_api/test_aster_strategy2_focus_multi.py
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-focus-hedge-profit-gate-once.yml
          git config user.name "OpenAI Focus Patch"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_strategy2_focus_live.py cloud_api/aster_strategy2_focus_multi.py cloud_api/test_focus_hedge_profit_gate_contract.py .github/workflows/apply-focus-hedge-profit-gate-once.yml
          git commit -m "fix: keep Focus hedge until net profitable"
          git push origin HEAD:amar-crypto-bot-2026-cloud
