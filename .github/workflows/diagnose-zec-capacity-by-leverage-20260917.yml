name: Compare ZEC capacity by leverage 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-zec-capacity-by-leverage-20260917.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base='https://fapi.asterdex.com/fapi/v1/remainingOpenableNotionalValue'
          for symbol in ('ZECUSDT','BTCUSDT','ETHUSDT'):
              print('symbol',symbol)
              for lev in (20,25,50,60,75,100,125,150,200):
                  url=f'{base}?symbol={symbol}&leverage={lev}'
                  req=urllib.request.Request(url,headers={'User-Agent':'TradeMentor-diagnostic/1.0'})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          p=json.load(r)
                      print(lev,p.get('remainingOpenableNotionalValue'))
                  except urllib.error.HTTPError as e:
                      print(lev,'HTTP',e.code,e.read().decode('utf-8','replace')[:160])
          PY
