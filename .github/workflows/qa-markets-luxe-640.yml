name: QA 644 Markets Black Luxe
on:
  push:
    branches: [claude/markets-luxe-qa]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Visual QA
        id: qa
        working-directory: web
        continue-on-error: true
        run: |
          npx vite --config tests/visual/markets-v644-vite.config.ts >/tmp/vite.log 2>&1 &
          for i in {1..40}; do curl --fail --silent http://127.0.0.1:4176/tests/visual/markets-v644.html >/dev/null && break; sleep 1; done
          node tests/visual/markets-v644-screenshots.mjs > /tmp/qa.log 2>&1; code=$?
          cp /tmp/qa.log artifacts/markets-v644/qa.log; tail -40 /tmp/vite.log > artifacts/markets-v644/vite.log || true
          exit $code
      - name: Results to data branch
        if: always()
        run: |
          echo "::notice::QA outcome=${{ steps.qa.outcome }}"
          mv web/artifacts/markets-v644 /tmp/qa-out
          git config user.name "markets-qa"; git config user.email "noreply@anthropic.com"
          git checkout --orphan claude/markets-luxe-qa-data; git rm -rqf .; mkdir -p qa; cp -r /tmp/qa-out/. qa/
          echo "${{ steps.qa.outcome }} ${{ github.sha }}" > qa/outcome.txt
          git add qa && git commit -qm "QA 644 screenshots [skip ci]" && git push -f origin claude/markets-luxe-qa-data
