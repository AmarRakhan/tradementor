name: Deploy Cloud Production Backend

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - "cloud_api/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-backend
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  SCHEDULER_JOB: tradementor-aster-automation-tick
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  test-and-deploy:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[strategy2-test-only]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4

      - name: Verify immutable repository scope
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$GCP_PROJECT_ID" = "tradementor-production"
          test "$GCP_REGION" = "europe-west4"
          test "$CLOUD_RUN_SERVICE" = "tradementor-api"
          test "$SCHEDULER_JOB" = "tradementor-aster-automation-tick"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run all backend tests
        working-directory: cloud_api
        run: pytest -q

      - name: Authenticate to Google Cloud without stored keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture production configuration
        shell: bash
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/service-before.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          spec = service["spec"]["template"]["spec"]
          variables = {item["name"]: item.get("value") for item in spec["containers"][0].get("env", [])}
          assert variables.get("ASTER_LIVE_EXECUTION_ENABLED") == "true"
          assert variables.get("ASTER_STRATEGY2_LIVE_ENABLED") == "true"
          # Preserve the existing production environment exactly. Historical
          # Strategy-3 flags are harmless here because the generic production
          # endpoint is source-locked to Strategies 1 and 2 below.
          runtime_service_account = spec.get("serviceAccountName")
          service_url = service["status"]["url"]
          assert runtime_service_account and service_url.startswith("https://")
          print(f"RUNTIME_SERVICE_ACCOUNT={runtime_service_account}")
          print(f"SERVICE_URL={service_url}")
          PY
          # Fail before building or promoting when Scheduler API/IAM cannot
          # even read the production location.
          gcloud scheduler jobs list --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --limit=1 >/dev/null

      - name: Build and push backend image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:$GITHUB_SHA"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy candidate without production traffic
        shell: bash
        run: |
          REVISION_SUFFIX="gh-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --image "$IMAGE"             --revision-suffix "$REVISION_SUFFIX"             --no-traffic             --tag "$TAG"
          gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/service-candidate.json"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))
          after = json.load(open(sys.argv[2], encoding="utf-8"))
          tag = sys.argv[3]
          before_spec = before["spec"]["template"]["spec"]
          after_spec = after["spec"]["template"]["spec"]
          assert before_spec.get("serviceAccountName") == after_spec.get("serviceAccountName")
          assert before_spec.get("timeoutSeconds") == after_spec.get("timeoutSeconds")
          assert before_spec.get("containerConcurrency") == after_spec.get("containerConcurrency")
          assert before_spec["containers"][0].get("env", []) == after_spec["containers"][0].get("env", [])
          candidate = next(row for row in after["status"]["traffic"] if row.get("tag") == tag)
          print(f'CANDIDATE_URL={candidate["url"]}')
          print(f'CANDIDATE_REVISION={candidate["revisionName"]}')
          PY

      - name: Verify candidate health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$CANDIDATE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          PY

      - name: Configure paused one-minute Strategy 1 and 2 scheduler
        shell: bash
        run: |
          TARGET="$SERVICE_URL/internal/aster-automation/tick"
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs pause "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION"
          else
            # A newly created job can briefly exist before it is paused. Its
            # bootstrap target is therefore the read-only health endpoint and
            # can never place or close an order.
            gcloud scheduler jobs create http "$SCHEDULER_JOB" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --schedule "* * * * *" \
              --time-zone "Etc/UTC" \
              --uri "$SERVICE_URL/health" \
              --http-method GET
            gcloud scheduler jobs pause "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION"
          fi
          gcloud scheduler jobs update http "$SCHEDULER_JOB" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --schedule "* * * * *" \
            --time-zone "Etc/UTC" \
            --uri "$TARGET" \
            --http-method POST \
            --oidc-service-account-email "$RUNTIME_SERVICE_ACCOUNT" \
            --oidc-token-audience "$SERVICE_URL"

      - name: Verify paused scheduler target identity and isolation
        shell: bash
        run: |
          JOB_DESCRIPTION="$RUNNER_TEMP/strategy2-production-scheduler.json"
          gcloud scheduler jobs describe "$SCHEDULER_JOB" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format=json > "$JOB_DESCRIPTION"
          python - "$JOB_DESCRIPTION" "$SERVICE_URL" "$RUNTIME_SERVICE_ACCOUNT" <<'PY'
          import json
          import sys

          job = json.load(open(sys.argv[1], encoding="utf-8"))
          service_url, runtime_service_account = sys.argv[2:]
          assert job["state"] == "PAUSED"
          assert job["schedule"] == "* * * * *"
          assert job["timeZone"] == "Etc/UTC"
          assert job["httpTarget"]["uri"] == service_url + "/internal/aster-automation/tick"
          assert job["httpTarget"]["httpMethod"] == "POST"
          assert job["httpTarget"]["oidcToken"]["audience"] == service_url
          assert job["httpTarget"]["oidcToken"]["serviceAccountEmail"] == runtime_service_account
          assert "/internal/aster-strategy3/tick" not in job["httpTarget"]["uri"]
          PY

      - name: Promote verified revision
        shell: bash
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --to-revisions "$CANDIDATE_REVISION=100"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format='value(status.url)')"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$SERVICE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          PY

      - name: Resume verified Strategy 1 and 2 scheduler
        shell: bash
        run: |
          gcloud scheduler jobs resume "$SCHEDULER_JOB" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION"
          test "$(gcloud scheduler jobs describe "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format='value(state)')" = "ENABLED"

      - name: Verify Cloud Run IAM is unchanged
        shell: bash
        run: |
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))
          after = json.load(open(sys.argv[2], encoding="utf-8"))
          assert before == after
          PY
