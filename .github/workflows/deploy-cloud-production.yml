name: Deploy Cloud Production Backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PRODUCTION_BACKEND"
        required: true
        type: string
      source_commit:
        description: "Exact 40-character repository commit to build, test and deploy"
        required: true
        type: string
      request_issue:
        description: "Optional GitHub issue number for agent feedback"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: tradementor-production-backend
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Check out exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Authorize exact-source production deployment
        shell: bash
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "${{ inputs.confirmation }}" = "DEPLOY_PRODUCTION_BACKEND"
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$REQUESTED_SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Verify immutable repository scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$GCP_PROJECT_ID" = "tradementor-production"
          test "$GCP_REGION" = "europe-west4"
          test "$CLOUD_RUN_SERVICE" = "tradementor-api"
          git fetch origin amar-crypto-bot-2026-cloud --quiet
          git merge-base --is-ancestor "$SOURCE_COMMIT" "origin/amar-crypto-bot-2026-cloud"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run all backend tests
        working-directory: cloud_api
        run: pytest -q

      - name: Authenticate to Google Cloud without stored keys
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture production configuration and rollback point
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=capture-service-metadata" >> "$GITHUB_ENV"
          gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/service-before.json"
          echo "DEPLOY_PHASE=capture-iam-policy" >> "$GITHUB_ENV"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/service-before.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          spec = service["spec"]["template"]["spec"]
          variables = {item["name"]: item.get("value") for item in spec["containers"][0].get("env", [])}
          assert variables.get("ASTER_LIVE_EXECUTION_ENABLED") == "true"
          assert variables.get("ASTER_STRATEGY2_LIVE_ENABLED") == "true"
          runtime_service_account = spec.get("serviceAccountName")
          service_url = service["status"]["url"]
          assert runtime_service_account and service_url.startswith("https://")
          traffic = service["status"].get("traffic", [])
          live = next((row for row in traffic if int(row.get("percent", 0)) == 100), None)
          assert live and live.get("revisionName")
          print(f"RUNTIME_SERVICE_ACCOUNT={runtime_service_account}")
          print(f"SERVICE_URL={service_url}")
          print(f"PREVIOUS_REVISION={live['revisionName']}")
          PY
          echo "DEPLOY_PHASE=capture-current-health" >> "$GITHUB_ENV"
          PREVIOUS_HEALTH_FILE="$RUNNER_TEMP/previous-health.json"
          PREVIOUS_HEALTH_HTTP="$(curl --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o "$PREVIOUS_HEALTH_FILE" -w '%{http_code}' "$SERVICE_URL/health" || true)"
          test "$PREVIOUS_HEALTH_HTTP" = "200"
          python - "$PREVIOUS_HEALTH_FILE" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          health = json.load(open(sys.argv[1], encoding="utf-8"))
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          previous = health.get("sourceCommit") or health.get("imageSourceCommit") or ""
          assert previous
          print(f"PREVIOUS_SOURCE_COMMIT={previous}")
          PY

      - name: Select exact image strategy
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=select-image" >> "$GITHUB_ENV"
          if [ "$SOURCE_COMMIT" = "$PREVIOUS_SOURCE_COMMIT" ]; then
            PREVIOUS_IMAGE="$(gcloud run revisions describe "$PREVIOUS_REVISION" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='value(spec.containers[0].image)')"
            test -n "$PREVIOUS_IMAGE"
            echo "REUSE_LIVE_IMAGE=true" >> "$GITHUB_ENV"
            echo "IMAGE=$PREVIOUS_IMAGE" >> "$GITHUB_ENV"
            echo "DEPLOYMENT_PROOF_MODE=existing-live-image" >> "$GITHUB_ENV"
          else
            echo "REUSE_LIVE_IMAGE=false" >> "$GITHUB_ENV"
            echo "DEPLOYMENT_PROOF_MODE=new-image" >> "$GITHUB_ENV"
          fi

      - name: Build and push backend image
        if: env.REUSE_LIVE_IMAGE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=build-image" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:$SOURCE_COMMIT"
          docker build --build-arg "SOURCE_COMMIT=$SOURCE_COMMIT" --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy candidate without production traffic
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=deploy-candidate" >> "$GITHUB_ENV"
          RUN_SUFFIX="${GITHUB_RUN_ID: -6}"
          REVISION_SUFFIX="src-${SOURCE_COMMIT:0:8}-$RUN_SUFFIX"
          TAG="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud run services update "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --image "$IMAGE"             --revision-suffix "$REVISION_SUFFIX"             --update-env-vars "TRADEMENTOR_SOURCE_COMMIT=$SOURCE_COMMIT,ASTER_REALTIME_WORKER=true,ASTER_REALTIME_EXECUTION_ENABLED=true,ASTER_PROFIT_SWEEP_LIVE_ENABLED=true,ASTER_EMERGENCY_HEDGE_WORKER=false"             --no-traffic             --tag "$TAG"
          gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/service-candidate.json"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json
          import os
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))
          after = json.load(open(sys.argv[2], encoding="utf-8"))
          tag = sys.argv[3]
          before_spec = before["spec"]["template"]["spec"]
          after_spec = after["spec"]["template"]["spec"]
          assert before_spec.get("serviceAccountName") == after_spec.get("serviceAccountName")
          assert before_spec.get("timeoutSeconds") == after_spec.get("timeoutSeconds")
          assert before_spec.get("containerConcurrency") == after_spec.get("containerConcurrency")
          before_env = {item["name"]: item.get("value") for item in before_spec["containers"][0].get("env", [])}
          after_env = {item["name"]: item.get("value") for item in after_spec["containers"][0].get("env", [])}
          expected_env = dict(before_env)
          expected_env.update({"TRADEMENTOR_SOURCE_COMMIT":os.environ["SOURCE_COMMIT"],"ASTER_REALTIME_WORKER":"true","ASTER_REALTIME_EXECUTION_ENABLED":"true","ASTER_PROFIT_SWEEP_LIVE_ENABLED":"true","ASTER_EMERGENCY_HEDGE_WORKER":"false"})
          assert after_env == expected_env
          candidate = next(row for row in after["status"]["traffic"] if row.get("tag") == tag)
          print(f'CANDIDATE_URL={candidate["url"]}')
          print(f'CANDIDATE_REVISION={candidate["revisionName"]}')
          PY

      - name: Verify candidate health and route contract
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=verify-candidate" >> "$GITHUB_ENV"
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$CANDIDATE_URL/health")"
          OPENAPI="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 "$CANDIDATE_URL/openapi.json")"
          python - "$HEALTH" "$OPENAPI" <<'PY'
          import json
          import os
          import sys

          health = json.loads(sys.argv[1])
          openapi = json.loads(sys.argv[2])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          assert health["sourceCommit"] == os.environ["SOURCE_COMMIT"]
          assert health["imageSourceCommit"] == os.environ["SOURCE_COMMIT"]
          paths = openapi.get("paths", {})
          assert "/health" in paths
          PY

      - name: Promote verified revision
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=promote" >> "$GITHUB_ENV"
          echo "PROMOTION_ATTEMPTED=true" >> "$GITHUB_ENV"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --to-revisions "$CANDIDATE_REVISION=100"

      - name: Verify production after promotion
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_PHASE=verify-production" >> "$GITHUB_ENV"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format='value(status.url)')"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          HEALTH="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SERVICE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json
          import os
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          assert health["sourceCommit"] == os.environ["SOURCE_COMMIT"]
          assert health["imageSourceCommit"] == os.environ["SOURCE_COMMIT"]
          PY

      - name: Verify Cloud Run IAM is unchanged
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))
          after = json.load(open(sys.argv[2], encoding="utf-8"))
          assert before == after
          PY

      - name: Publish successful deployment to agent issue
        if: ${{ success() && inputs.request_issue != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ISSUE: ${{ inputs.request_issue }}
        run: |
          set -euo pipefail
          {
            echo "## Production backend deployment complete"
            echo
            echo "- Status: **SUCCESS**"
            echo "- Source commit: $SOURCE_COMMIT"
            echo "- Live revision: $CANDIDATE_REVISION"
            echo "- Previous revision: $PREVIOUS_REVISION"
            echo "- Health: **ready**"
            echo "- Image mode: $DEPLOYMENT_PROOF_MODE"
            echo "- Rollback point retained: $PREVIOUS_REVISION"
          } > "$RUNNER_TEMP/deploy-result.md"
          gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/deploy-result.md"
          gh issue close "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Roll back failed promotion
        if: ${{ failure() && env.PROMOTION_ATTEMPTED == 'true' && env.PREVIOUS_REVISION != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production verification failed; restoring $PREVIOUS_REVISION"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --to-revisions "$PREVIOUS_REVISION=100"
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format='value(status.url)')"
          HEALTH="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SERVICE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json
          import os
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ready"
          assert health["multiUser"] is True
          assert (health.get("sourceCommit") or health.get("imageSourceCommit")) == os.environ["PREVIOUS_SOURCE_COMMIT"]
          PY

      - name: Publish failed deployment to agent issue
        if: ${{ failure() && inputs.request_issue != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ISSUE: ${{ inputs.request_issue }}
        run: |
          set -euo pipefail
          {
            echo "## Production backend deployment failed"
            echo
            echo "- Status: **FAILED**"
            echo "- Failed phase: ${DEPLOY_PHASE:-unknown}"
            echo "- Source commit: ${SOURCE_COMMIT:-unknown}"
            echo "- Candidate revision: ${CANDIDATE_REVISION:-not-created}"
            echo "- Previous production revision: ${PREVIOUS_REVISION:-unknown}"
            echo "- Promotion attempted: ${PROMOTION_ATTEMPTED:-false}"
            echo
            echo "The issue is intentionally left open for investigation. If promotion had already occurred, the rollback step was attempted automatically."
          } > "$RUNNER_TEMP/deploy-failure.md"
          gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/deploy-failure.md"

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/service-before.json
            ${{ runner.temp }}/service-candidate.json
            ${{ runner.temp }}/iam-before.json
            ${{ runner.temp }}/iam-after.json
          if-no-files-found: ignore
          retention-days: 14
