name: Build 484 Production Preflight

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/build484-production-preflight.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: build484-production-preflight
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  OBSERVER_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com
  TARGET_SOURCE_COMMIT: c075fe347399ceca4424c7ce83d46d8dce0100bb

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted branch history
        uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - name: Authenticate read-only observer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture exact live production source
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --format=json > "$RUNNER_TEMP/service-live.json"

          SERVICE_URL="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["status"]["url"])' "$RUNNER_TEMP/service-live.json")"
          LIVE_REVISION="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); rows=d["status"].get("traffic",[]); live=next(x for x in rows if int(x.get("percent",0))==100); print(live["revisionName"])' "$RUNNER_TEMP/service-live.json")"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$SERVICE_URL/health" > "$RUNNER_TEMP/health-live.json"

          python - "$RUNNER_TEMP/health-live.json" "$LIVE_REVISION" <<'PY'
          import json, os, re, sys
          health=json.load(open(sys.argv[1],encoding="utf-8"))
          assert health.get("status")=="ready"
          assert health.get("multiUser") is True
          live=(health.get("sourceCommit") or health.get("imageSourceCommit") or "").strip()
          assert re.fullmatch(r"[0-9a-f]{40}",live), live
          print(f"LIVE_SOURCE_COMMIT={live}")
          print(f"LIVE_REVISION={sys.argv[2]}")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write(f"LIVE_SOURCE_COMMIT={live}\n")
              out.write(f"LIVE_REVISION={sys.argv[2]}\n")
          PY

      - name: Verify target and calculate exact live-to-Build-484 delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$LIVE_SOURCE_COMMIT^{commit}"
          git cat-file -e "$TARGET_SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$LIVE_SOURCE_COMMIT" "$TARGET_SOURCE_COMMIT"
          git diff --name-only "$LIVE_SOURCE_COMMIT" "$TARGET_SOURCE_COMMIT" | sort -u > "$RUNNER_TEMP/changed-files.txt"
          git diff --stat "$LIVE_SOURCE_COMMIT" "$TARGET_SOURCE_COMMIT" > "$RUNNER_TEMP/diff-stat.txt"

          python tools/runtime_contract_impact.py             --files-file "$RUNNER_TEMP/changed-files.txt"             --backend-tests-file "$RUNNER_TEMP/backend-tests.txt"             --web-tests-file "$RUNNER_TEMP/web-tests.txt"             --summary "$GITHUB_STEP_SUMMARY"             --json > "$RUNNER_TEMP/impact.json"

          {
            echo "## Build 484 production preflight"
            echo
            echo "- Live source: `$LIVE_SOURCE_COMMIT`"
            echo "- Target source: `$TARGET_SOURCE_COMMIT`"
            echo "- Live revision: `$LIVE_REVISION`"
            echo "- Changed files: **$(wc -l < "$RUNNER_TEMP/changed-files.txt")**"
            echo
            echo "### Changed files"
            sed 's/^/- /' "$RUNNER_TEMP/changed-files.txt"
            echo
            echo "### Diff stat"
            echo '~~~'
            cat "$RUNNER_TEMP/diff-stat.txt"
            echo '~~~'
            echo
            echo "### Impact selector"
            echo '~~~json'
            cat "$RUNNER_TEMP/impact.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Safety assertion — preflight cannot mutate production
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ASTER_PRIVATE_KEY:-}"
          test -z "${ASTER_API_KEY:-}"
          echo "PRE-FLIGHT ONLY: no deploy, no traffic change, no Firestore write, no exchange order."
