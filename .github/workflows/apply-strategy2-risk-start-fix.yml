name: Apply Strategy 2 risk-start fix

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/apply-strategy2-risk-start-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused fix and regression tests
        env:
          PATCH_B64: 
        shell: bash
        run: |
          echo "$PATCH_B64" | base64 -d | git apply --check
          echo "$PATCH_B64" | base64 -d | git apply
          python -m pip install -q -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q test_aster_strategy2_execution.py test_aster_close_guard.py test_aster_strategy_status.py
          python -m py_compile aster_strategy2_execution.py main.py test_aster_strategy2_execution.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add cloud_api/aster_strategy2_execution.py cloud_api/main.py cloud_api/test_aster_strategy2_execution.py
          git commit -m "fix(strategy2): handle portfolio risk denial without start failure"
          git push origin HEAD:amar-crypto-bot-2026-cloud
