name: P0 manual pair DCA execution recovery 2026-09-07

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/manual-pair-dca-execution-recovery-20260907.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-manual-pair-dca-execution-recovery-20260907
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply P0 manual-pair DCA recovery
        run: python tools/apply_manual_pair_dca_execution_recovery_20260907.py

      - name: Install backend test dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run critical manual DCA regressions
        working-directory: cloud_api
        run: python -m pytest -q test_aster_multi_bb.py -k 'manual or dca'

      - name: Run full Multi DCA regressions
        working-directory: cloud_api
        run: python -m pytest -q test_aster_multi_bb.py test_manual_hybrid_seats_20260906.py

      - name: Verify P0 source markers
        run: |
          set -euo pipefail
          grep -q 'SELECTED_POSITION_STATE_RECOVERED' cloud_api/aster_multi_bb_core.py
          grep -q 'recoveredFromSelectedOpenPosition' cloud_api/aster_multi_bb_core.py
          grep -q 'key=(symbol, side)' cloud_api/aster_multi_bb_core.py
          grep -q 'len(sides) > 1 and settings.asymmetric_hedge_enabled' cloud_api/aster_multi_bb_core.py

      - name: Commit verified P0 backend fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_aster_multi_bb.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Fix manual-selected positions missing DCA management state'
          git push origin HEAD:amar-crypto-bot-2026-cloud
