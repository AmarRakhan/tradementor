name: Dharma Thuis Auth Probe

on:
  push:
    branches:
      - aavansh-trading-v1
    paths:
      - ".github/workflows/dharma-thuis-auth-probe.yml"

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify this is only an auth probe
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/aavansh-trading-v1"
          echo "No build, deploy, or Cloud Run mutation is performed by this workflow."

      - name: Authenticate only
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Confirm accepted identity
        run: echo "WIF authentication accepted for Aavansh branch."
