name: Verify Aster trade data read after rollback 2026-09-21

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - '.github/workflows/verify-aster-trade-read-after-rollback-20260921.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify exact account can read Aster state
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          eval "$(python - "$SERVICE_JSON" <<'PY'
          import json,shlex,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=s['spec']['template']['spec']
          env={x['name']:x.get('value','') for x in spec['containers'][0].get('env',[])}
          print('IMAGE='+shlex.quote(spec['containers'][0]['image']))
          print('RUNTIME_SA='+shlex.quote(spec['serviceAccountName']))
          print('SOURCE='+shlex.quote(env.get('TRADEMENTOR_SOURCE_COMMIT','')))
          PY
          )"
          test "$SOURCE" = "0a01bcd57c84daf6093d39c66aa2f69835964a38"
          JOB="tm-aster-read-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SCRIPT_B64=''
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --service-account "$RUNTIME_SA" --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          RC=$?
          set -e
          cleanup
          trap - EXIT
          if [ "$RC" -ne 0 ]; then
            echo "Aster read-only account verification failed (sanitized). No settings or orders were changed."
            exit "$RC"
          fi
          echo "Aster read-only account verification succeeded. No settings or orders were changed."
