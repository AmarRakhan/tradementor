name: Verify Aster trade data read after rollback 2026-09-21

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - '.github/workflows/verify-aster-trade-read-after-rollback-20260921.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify exact account can read Aster state
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          eval "$(python - "$SERVICE_JSON" <<'PY'
          import json,shlex,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=s['spec']['template']['spec']
          image=spec['containers'][0]['image']
          sa=spec['serviceAccountName']
          env={x['name']:x.get('value','') for x in spec['containers'][0].get('env',[])}
          source=env.get('TRADEMENTOR_SOURCE_COMMIT','')
          print('IMAGE='+shlex.quote(image))
          print('RUNTIME_SA='+shlex.quote(sa))
          print('SOURCE='+shlex.quote(source))
          PY
          )"
          test "$SOURCE" = "c156d4e9db9b8a76bfa1b93ba5e6ec665d5f2711"

          JOB="tm-aster-read-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(python - <<'PY'
          import base64
          script=r"""
import sys
import main

def f(v):
    try:return float(v)
    except:return 0.0
def i(v):
    try:return int(float(v))
    except:return 0
def near(v,t):
    return abs(f(v)-t) < 1e-9

matches=[]
for snap in main.db.collection("asterStrategy2").stream():
    raw=snap.to_dict() or {}
    s=raw.get("settings") if isinstance(raw.get("settings"),dict) else {}
    lm=f(s.get("entryMarginLongUsd",s.get("entryMarginLong",s.get("entryMarginUsd"))))
    sm=f(s.get("entryMarginShortUsd",s.get("entryMarginShort",s.get("entryMarginUsd"))))
    if (i(s.get("maximumPositions"))==60 and i(s.get("longSlots"))==30 and i(s.get("shortSlots"))==30
        and i(s.get("universeTopN"))==350 and i(s.get("minimumLeverage"))==20
        and str(s.get("entrySizingMode","")).lower()=="margin"
        and near(s.get("entryNotionalLongUsd",s.get("entryNotionalLong")),8.0)
        and near(s.get("entryNotionalShortUsd",s.get("entryNotionalShort")),6.0)
        and 0 < lm <= 1.0 and 0 < sm <= 1.0):
        matches.append(snap.id)
if len(matches)!=1:
    raise SystemExit(21)

user={"uid":matches[0]}
try:
    secret=main.load_aster_secret(user)
except Exception:
    raise SystemExit(22)
try:
    result=main.inspect_aster(secret)
except Exception:
    raise SystemExit(23)
if result.get("configured") is not True or result.get("credentialsVerified") is not True:
    raise SystemExit(24)
if int(result.get("tradableSymbols") or 0) <= 0:
    raise SystemExit(25)
raise SystemExit(0)
"""
          print(base64.b64encode(script.encode()).decode())
          PY
          )"

          gcloud run jobs deploy "$JOB"             --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --service-account "$RUNTIME_SA"             --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 180s --quiet

          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          RC=$?
          set -e
          cleanup
          trap - EXIT
          if [ "$RC" -ne 0 ]; then
            echo "Aster read-only account verification failed (sanitized). No settings or orders were changed."
            exit "$RC"
          fi
          echo "Aster read-only account verification succeeded. No settings or orders were changed."
