name: Diagnose Build 573 Account Chart
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/diagnose-build573-account-chart.yml]
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAGNOSTIC_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAGNOSTIC_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read account/chart production errors
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND severity>=ERROR' --project "$GCP_PROJECT_ID" --freshness=3h --limit=300 --order=desc --format=json > errors.json
          python - <<'PY'
          import json
          rows=json.load(open("errors.json",encoding="utf-8"))
          for r in rows:
              req=r.get("httpRequest") or {}
              url=str(req.get("requestUrl") or "")
              text=str(r.get("textPayload") or "")
              payload=r.get("jsonPayload")
              msg=text or (json.dumps(payload,ensure_ascii=False) if payload else "")
              if req.get("status")==500 or "Traceback" in msg or "Exception" in msg or "daily_equity_range" in msg or "_aster_account_daily_range" in msg:
                  print(json.dumps({
                    "ts":r.get("timestamp"),
                    "severity":r.get("severity"),
                    "revision":(r.get("resource") or {}).get("labels",{}).get("revision_name"),
                    "status":req.get("status"),
                    "url":url,
                    "trace":r.get("trace"),
                    "message":msg[:12000]
                  },ensure_ascii=False))
          PY
