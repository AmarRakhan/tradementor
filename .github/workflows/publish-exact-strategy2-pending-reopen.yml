name: Publish Exact Strategy 2 Pending Reopen Commit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_EXACT_8C8830E
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-exact-commit:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmation == 'PUBLISH_EXACT_8C8830E' }}
    env:
      TARGET_BRANCH: codex/strategy2-pending-reopen-flow
      TARGET_SHA: 8c8830eec3e283cefec06404ac7b2161cd9b5905
      TARGET_TREE: 3e77831c785eb9f4f21d2aaee8be18cb548e74a7
      TARGET_PARENT: e903656409f883d87144444abd569067bc689926
      EXPECTED_REMOTE_HEAD: 3d81c5baefe9bc236d6f26d144fba7f608c33854
      BUNDLE_SHA256: 4372a501fbc234e2bc0ddd7a28708ce82d4d3af0cc8943c0eb373b1c749d2b42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc6e9aac7816a6ae8c2a298aa0ca37aee76306ad
          fetch-depth: 0

      - name: Restore and verify exact local commit objects
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/exact.bundle"
          echo "$BUNDLE_SHA256  $RUNNER_TEMP/exact.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/exact.bundle"
          git fetch "$RUNNER_TEMP/exact.bundle" "refs/heads/$TARGET_BRANCH:refs/remotes/exact/publish"
          test "$(git rev-parse refs/remotes/exact/publish)" = "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA^{tree}")" = "$TARGET_TREE"
          test "$(git rev-parse "$TARGET_SHA^")" = "$TARGET_PARENT"
          test "$(git rev-parse "$TARGET_PARENT^")" = "fc6e9aac7816a6ae8c2a298aa0ca37aee76306ad"
          git cat-file -e "$TARGET_SHA:cloud_api/main.py"
          actual_files="$(git diff-tree --no-commit-id --name-only -r "$TARGET_SHA" | sort)"
          expected_files="$(printf '%s\n' cloud_api/main.py cloud_api/test_strategy2_dynamic_leverage_guard.py cloud_api/test_strategy2_pending_reopen_flow.py | sort)"
          test "$actual_files" = "$expected_files"
          git diff-tree --check "$TARGET_SHA^" "$TARGET_SHA"

      - name: Test exact commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_SHA"
          python -m pip install --disable-pip-version-check -q -r cloud_api/requirements.txt pytest
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          cd cloud_api
          pytest -q

      - name: Publish atomically with lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/lease-check"
          test "$(git rev-parse refs/remotes/origin/lease-check)" = "$EXPECTED_REMOTE_HEAD"
          git push origin \
            "--force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_REMOTE_HEAD" \
            "$TARGET_SHA:refs/heads/$TARGET_BRANCH"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_sha" = "$TARGET_SHA"
          echo "REMOTE_COMMIT_SHA=$remote_sha"
          git diff-tree --no-commit-id --name-status -r "$TARGET_SHA"
          echo "Nothing was merged or deployed."
