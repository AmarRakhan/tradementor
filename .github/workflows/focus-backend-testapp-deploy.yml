name: Focus Backend Testapp Deploy
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.focus-backend-testapp-trigger]
permissions:
  contents: write
  id-token: write
concurrency:
  group: tradementor-production-backend
  cancel-in-progress: false
env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - name: Verify exact safe scope
        run: |
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$CLOUD_RUN_SERVICE" = "tradementor-api"
          grep -q 'live_authorized=False' cloud_api/aster_strategy2_focus_adapter.py
          ! grep -Eq 'submit_order|new_order\(' cloud_api/aster_strategy2_focus_adapter.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Test backend
        run: |
          pip install -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Capture production config and IAM
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/service-before.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1])); spec=s['spec']['template']['spec']; env={x['name']:x.get('value') for x in spec['containers'][0].get('env',[])}
          assert env.get('ASTER_STRATEGY2_LIVE_ENABLED')=='true'
          print('SERVICE_URL='+s['status']['url'])
          PY
      - name: Build and push exact backend
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:$GITHUB_SHA"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy candidate with zero traffic
        run: |
          SUFFIX="focus-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          TAG="focus-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --revision-suffix "$SUFFIX" --no-traffic --tag "$TAG" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-candidate.json"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          b=json.load(open(sys.argv[1])); a=json.load(open(sys.argv[2])); tag=sys.argv[3]
          bs=b['spec']['template']['spec']; ass=a['spec']['template']['spec']
          assert bs.get('serviceAccountName')==ass.get('serviceAccountName')
          assert bs.get('timeoutSeconds')==ass.get('timeoutSeconds')
          assert bs.get('containerConcurrency')==ass.get('containerConcurrency')
          assert bs['containers'][0].get('env',[])==ass['containers'][0].get('env',[])
          row=next(x for x in a['status']['traffic'] if x.get('tag')==tag)
          print('CANDIDATE_REVISION='+row['revisionName']); print('CANDIDATE_URL='+row['url'])
          PY
      - name: Verify Focus route before traffic
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$CANDIDATE_URL/health" > "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$CANDIDATE_URL/openapi.json" > "$RUNNER_TEMP/openapi.json"
          python - "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/openapi.json" <<'PY'
          import json,sys
          h=json.load(open(sys.argv[1])); o=json.load(open(sys.argv[2]))
          assert h.get('status')=='ready' and h.get('multiUser') is True
          assert '/v1/me/aster/strategy2/focus/shadow' in o.get('paths',{})
          PY
      - name: Promote candidate to production API
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$CANDIDATE_REVISION=100" --quiet
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$SERVICE_URL/health" > "$RUNNER_TEMP/health-after.json"
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$SERVICE_URL/openapi.json" > "$RUNNER_TEMP/openapi-after.json"
          python - "$RUNNER_TEMP/health-after.json" "$RUNNER_TEMP/openapi-after.json" <<'PY'
          import json,sys
          h=json.load(open(sys.argv[1])); o=json.load(open(sys.argv[2]))
          assert h.get('status')=='ready' and h.get('multiUser') is True
          assert '/v1/me/aster/strategy2/focus/shadow' in o.get('paths',{})
          PY
      - name: Verify IAM unchanged
        run: |
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))==json.load(open(sys.argv[2]))
          PY
      - name: Remove one-shot deploy files
        run: |
          rm -f .github/workflows/focus-backend-testapp-deploy.yml .focus-backend-testapp-trigger
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add -A
          git commit -m "chore: remove Focus backend one-shot deploy"
          git push origin HEAD:amar-crypto-bot-2026-cloud
