name: Read-only Amar Strategy 2 settings diagnosis

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/diagnose-amar-s2-settings-readonly.yml"]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL_HASH: 6368246d6bce5a3f828f28b960c8215b17e79b8ba94811df4f01f1b17a03282a
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read sanitized Strategy 2 state only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          echo PROBE_STARTED > "$RUNNER_TEMP/diag-stage"
          JOB="tm-s2-readonly-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          echo SERVICE_DESCRIBED > "$RUNNER_TEMP/diag-stage"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image' "$SERVICE_JSON")"
          RUNTIME_SERVICE_ACCOUNT="$(jq -r '.spec.template.spec.serviceAccountName' "$SERVICE_JSON")"
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,json,os,re
          from datetime import datetime
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={"projectId":"tradementor-production"})
          db=firestore.Client(project=os.environ["GCP_PROJECT_ID"])
          target=os.environ["TARGET_EMAIL_HASH"]; matches=[]; page=auth.list_users()
          while page:
              for u in page.users:
                  if hashlib.sha256(((u.email or "").strip().lower()).encode()).hexdigest()==target: matches.append(u.uid)
              page=page.get_next_page()
          if len(matches)!=1:
              print("S2_DIAGNOSIS_JSON="+json.dumps({"diagnosis":"TARGET_MATCH_ERROR","matches":len(matches)}),flush=True); raise SystemExit(2)
          snap=db.collection("asterStrategy2").document(matches[0]).get(); state=snap.to_dict() or {}
          blocked=re.compile(r"(secret|token|password|passphrase|api.?key|private.?key|credential|email|uid)",re.I)
          def clean(v,k="",d=0):
              if blocked.search(str(k)): return "<redacted>"
              if d>6: return "<depth-limit>"
              if isinstance(v,datetime): return v.isoformat()
              if isinstance(v,dict): return {str(a):clean(b,str(a),d+1) for a,b in v.items() if not blocked.search(str(a))}
              if isinstance(v,list):
                  if str(k)=="ownedLegs":
                      return {"count":len(v),"long":sum(1 for x in v if isinstance(x,dict) and str(x.get("side","")).upper()=="LONG"),"short":sum(1 for x in v if isinstance(x,dict) and str(x.get("side","")).upper()=="SHORT")}
                  return [clean(x,k,d+1) for x in v[:25]] if len(v)<=25 else {"count":len(v),"sample":[clean(x,k,d+1) for x in v[:5]]}
              if isinstance(v,(str,int,float,bool)) or v is None: return v if len(str(v))<=500 else str(v)[:500]+"<truncated>"
              return str(v)[:500]
          print("S2_DIAGNOSIS_JSON="+json.dumps({"diagnosis":"S2_ACCOUNT_STATE","documentExists":snap.exists,"state":clean(state)},sort_keys=True,default=str),flush=True)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,TARGET_EMAIL_HASH=$TARGET_EMAIL_HASH" --tasks 1 --max-retries 0 --task-timeout 120s --quiet >/dev/null
          echo JOB_DEPLOYED > "$RUNNER_TEMP/diag-stage"
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          echo JOB_EXECUTED > "$RUNNER_TEMP/diag-stage"
          RESULT="$(gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB" --project "$GCP_PROJECT_ID" --freshness 10m --limit 50 --order=asc --format='value(textPayload)' | sed -n 's/^S2_DIAGNOSIS_JSON=//p' | tail -1)"
          test -n "$RESULT"
          echo SANITIZED_RESULT_READ > "$RUNNER_TEMP/diag-stage"
          BODY="$(jq -rn --arg r "$RESULT" '"READ_ONLY_S2_DIAGNOSIS\n\n```json\n"+$r+"\n```"')"
          gh api "repos/$GITHUB_REPOSITORY/issues/9/comments" --input - <<<"$(jq -n --arg body "$BODY" '{body:$body}')"

      - name: Report safe stage marker
        if: always()
        shell: bash
        run: |
          STAGE="$(cat "$RUNNER_TEMP/diag-stage" 2>/dev/null || echo PRE_PROBE_FAILURE)"
          BODY="READ_ONLY_S2_WORKFLOW_STAGE=$STAGE; outcome=${{ steps.probe.outcome }}"
          gh api "repos/$GITHUB_REPOSITORY/issues/9/comments" -f body="$BODY"
