name: Read-only Amar Strategy 2 settings diagnosis

on:
  pull_request:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/diagnose-amar-s2-settings-readonly.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL_HASH: 6368246d6bce5a3f828f28b960c8215b17e79b8ba94811df4f01f1b17a03282a
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read sanitized Strategy 2 state only
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-readonly-${GITHUB_RUN_ID: -6}"
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image' "$SERVICE_JSON")"
          RUNTIME_SERVICE_ACCOUNT="$(jq -r '.spec.template.spec.serviceAccountName' "$SERVICE_JSON")"
          test -n "$IMAGE"
          test -n "$RUNTIME_SERVICE_ACCOUNT"

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib, json, os, re
          from datetime import datetime
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore

          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={"projectId": "tradementor-production"})
          db = firestore.Client(project=os.environ["GCP_PROJECT_ID"])
          target_hash = os.environ["TARGET_EMAIL_HASH"]
          matches = []
          page = auth.list_users()
          while page:
              for u in page.users:
                  email = (u.email or "").strip().lower()
                  if hashlib.sha256(email.encode()).hexdigest() == target_hash:
                      matches.append(u.uid)
              page = page.get_next_page()
          if len(matches) != 1:
              print(json.dumps({"diagnosis": "TARGET_MATCH_ERROR", "matches": len(matches)}), flush=True)
              raise SystemExit(2)
          uid = matches[0]
          snap = db.collection("asterStrategy2").document(uid).get()
          state = snap.to_dict() or {}

          blocked = re.compile(r"(secret|token|password|passphrase|api.?key|private.?key|credential|email|uid)", re.I)
          def clean(value, key="", depth=0):
              if blocked.search(str(key)):
                  return "<redacted>"
              if depth > 6:
                  return "<depth-limit>"
              if isinstance(value, datetime):
                  return value.isoformat()
              if isinstance(value, dict):
                  return {str(k): clean(v, str(k), depth+1) for k,v in value.items() if not blocked.search(str(k))}
              if isinstance(value, list):
                  if str(key) == "ownedLegs":
                      longs=sum(1 for x in value if isinstance(x,dict) and str(x.get("side","")).upper()=="LONG")
                      shorts=sum(1 for x in value if isinstance(x,dict) and str(x.get("side","")).upper()=="SHORT")
                      return {"count":len(value),"long":longs,"short":shorts}
                  if len(value) > 25:
                      return {"count": len(value), "sample": [clean(x, key, depth+1) for x in value[:5]]}
                  return [clean(x, key, depth+1) for x in value]
              if isinstance(value, (str,int,float,bool)) or value is None:
                  text=str(value)
                  return value if len(text) <= 500 else text[:500]+"<truncated>"
              return str(value)[:500]

          result = {
              "diagnosis": "S2_ACCOUNT_STATE",
              "documentExists": snap.exists,
              "state": clean(state),
          }
          print("S2_DIAGNOSIS_JSON="+json.dumps(result, sort_keys=True, default=str), flush=True)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,TARGET_EMAIL_HASH=$TARGET_EMAIL_HASH"             --tasks 1 --max-retries 0 --task-timeout 120s --quiet >/dev/null
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB"             --project "$GCP_PROJECT_ID" --freshness 10m --limit 50 --order=asc --format='value(textPayload)'             | sed -n 's/^S2_DIAGNOSIS_JSON=/S2_DIAGNOSIS_JSON=/p'
