name: Diagnose Aster trade data outage V2 2026-09-21

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - '.github/workflows/diag-aster-trade-data-outage-v2-20260921.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect current service and recent Aster traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api"'             --project "$GCP_PROJECT_ID" --freshness=90m --limit 2000 --format=json > "$RUNNER_TEMP/logs.json"
          python - "$RUNNER_TEMP/service.json" "$RUNNER_TEMP/logs.json" <<'PY'
          import json,re,sys,urllib.parse,collections
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=json.load(open(sys.argv[2],encoding='utf-8'))
          traffic=s.get('status',{}).get('traffic',[])
          live=[x for x in traffic if int(x.get('percent',0))==100]
          env={x['name']:x.get('value') for x in s['spec']['template']['spec']['containers'][0].get('env',[])}
          print('TRADE_DIAG_V2 live_revision='+(live[0].get('revisionName','') if live else 'NONE'))
          print('TRADE_DIAG_V2 source_commit='+str(env.get('TRADEMENTOR_SOURCE_COMMIT','')))
          print('TRADE_DIAG_V2 realtime_worker='+str(env.get('ASTER_REALTIME_WORKER','')))
          status=collections.Counter(); aster=collections.Counter(); paths=collections.Counter(); errors=[]
          for r in rows:
              h=r.get('httpRequest') or {}
              st=int(h.get('status') or 0)
              if st: status[st]+=1
              url=str(h.get('requestUrl') or '')
              path=urllib.parse.urlsplit(url).path if url else ''
              if path:
                  paths[(path,st)]+=1
              if '/v1/me/aster/' in path:
                  aster[(path,st)]+=1
              sev=str(r.get('severity') or '')
              msg=str(r.get('textPayload') or (r.get('jsonPayload') or {}).get('message') or '')
              if st>=400 or sev in {'ERROR','CRITICAL','ALERT','EMERGENCY'} or re.search(r'exception|traceback|timeout|failed|asterapierror',msg,re.I):
                  clean=re.sub(r'0x[a-fA-F0-9]{40}','0x[REDACTED]',msg)
                  clean=re.sub(r'Bearer\s+\S+','Bearer [REDACTED]',clean,flags=re.I)
                  errors.append((str(r.get('timestamp','')),sev,st,path,clean[:260]))
          print('TRADE_DIAG_V2 http='+json.dumps(dict(status),sort_keys=True))
          print('TRADE_DIAG_V2 aster='+json.dumps({f'{k[0]}::{k[1]}':v for k,v in aster.items()},sort_keys=True))
          for (p,st),n in paths.most_common(35):
              print('TRADE_DIAG_V2 path='+json.dumps({'path':p,'status':st,'count':n},sort_keys=True))
          print('TRADE_DIAG_V2 error_count='+str(len(errors)))
          for e in errors[-100:]:
              print('TRADE_DIAG_V2 error='+json.dumps(e,ensure_ascii=False))
          PY


      - name: Extract targeted 5xx routes and exception roots
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND httpRequest.status>=500' \
            --project "$GCP_PROJECT_ID" --freshness=30m --limit=250 --format=json > "$RUNNER_TEMP/http5xx.json"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api"' \
            --project "$GCP_PROJECT_ID" --freshness=30m --limit=10000 --format=json > "$RUNNER_TEMP/all30m.json"
          python - "$RUNNER_TEMP/http5xx.json" "$RUNNER_TEMP/all30m.json" <<'PY'
          import collections,json,re,sys,urllib.parse
          http=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=json.load(open(sys.argv[2],encoding='utf-8'))
          paths=collections.Counter()
          for r in http:
              h=r.get('httpRequest') or {}
              u=str(h.get('requestUrl') or '')
              p=urllib.parse.urlsplit(u).path if u else ''
              paths[(p,int(h.get('status') or 0))]+=1
          print('TRADE_ROOT http5xx_count='+str(len(http)))
          for (p,st),n in paths.most_common():
              print('TRADE_ROOT 5xx='+json.dumps({'path':p,'status':st,'count':n},sort_keys=True))
          matcher=re.compile(r'(File\s+"(?:/workspace|/app|/srv)|/cloud_api/|main\.py|aster_gateway\.py|profit_sweep|TypeError:|ValueError:|AttributeError:|RuntimeError:|KeyError:|AssertionError:|CancelledError|ClientDisconnect|EndOfStream|WouldBlock|BrokenPipeError|AsterApiError|AsterSubmissionUncertain|ExceptionGroup:|BaseExceptionGroup:)',re.I)
          seen=set(); roots=[]
          for r in rows:
              msg=str(r.get('textPayload') or (r.get('jsonPayload') or {}).get('message') or '')
              if not msg or not matcher.search(msg):
                  continue
              clean=re.sub(r'0x[a-fA-F0-9]{40}','0x[REDACTED]',msg)
              clean=re.sub(r'Bearer\s+\S+','Bearer [REDACTED]',clean,flags=re.I)
              clean=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}','[EMAIL]',clean)
              clean=clean.strip()[:900]
              key=clean
              if key in seen: continue
              seen.add(key)
              roots.append((str(r.get('timestamp','')),str(r.get('severity') or ''),clean))
          print('TRADE_ROOT unique_root_lines='+str(len(roots)))
          for row in roots[:200]:
              print('TRADE_ROOT line='+json.dumps(row,ensure_ascii=False))
          PY


      - name: Verify post-fix Aster status errors
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND httpRequest.requestUrl:"/v1/me/aster/status"' \
            --project "$GCP_PROJECT_ID" --freshness=5m --limit=500 --format=json > "$RUNNER_TEMP/aster-status-5m.json"
          python - "$RUNNER_TEMP/aster-status-5m.json" <<'PY'
          import collections,json,sys
          rows=json.load(open(sys.argv[1],encoding='utf-8'))
          counts=collections.Counter(int((r.get('httpRequest') or {}).get('status') or 0) for r in rows)
          failures=[r for r in rows if int((r.get('httpRequest') or {}).get('status') or 0)>=500]
          latest=max((str(r.get('timestamp','')) for r in rows),default='')
          latest_failure=max((str(r.get('timestamp','')) for r in failures),default='')
          print('POSTFIX_ASTER_STATUS count='+str(len(rows)))
          print('POSTFIX_ASTER_STATUS statuses='+json.dumps(dict(counts),sort_keys=True))
          print('POSTFIX_ASTER_STATUS failures='+str(len(failures)))
          print('POSTFIX_ASTER_STATUS latest='+latest)
          print('POSTFIX_ASTER_STATUS latest_failure='+latest_failure)
          PY

# rerun-after-base-order-hotfix-99be76b
