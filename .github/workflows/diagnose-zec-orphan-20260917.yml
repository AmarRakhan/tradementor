name: Diagnose ZEC orphan priority 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-zec-orphan-20260917.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-production
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-api
      WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
      DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only diagnostic session
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Query production logs around reported ZEC miss
        shell: bash
        run: |
          set -euo pipefail
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-api" AND resource.labels.revision_name="tradementor-api-osp-7c59fc49-1" AND timestamp>="2026-09-17T19:58:00Z" AND timestamp<="2026-09-17T20:08:00Z" AND ("ZEC" OR "ORPHAN" OR "SHORT_REQUIRES_LONG" OR "ENTRY_SKIP")'
          gcloud logging read "$FILTER" --project "$GCP_PROJECT_ID" --limit 200 --order=asc --format='table(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.symbol,jsonPayload.side,jsonPayload.reason)' || true
          echo '--- focused raw message count ---'
          gcloud logging read "$FILTER" --project "$GCP_PROJECT_ID" --limit 200 --format='value(timestamp)' | wc -l
