name: Diagnose ZEC runtime state via service identity 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-zec-runtime-state-impersonated-20260917.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-production
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-api
      WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
      DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q google-cloud-firestore google-auth
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read one uniquely matching sanitized Strategy-2 runtime report
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$RUNTIME_SA"
          RUNTIME_SA="$RUNTIME_SA" python - <<'PY'
          import json, os
          import google.auth
          from google.auth import impersonated_credentials
          from google.cloud import firestore
          from google.cloud.firestore_v1.base_query import FieldFilter

          source,_=google.auth.default(scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds=impersonated_credentials.Credentials(
              source_credentials=source,
              target_principal=os.environ['RUNTIME_SA'],
              target_scopes=['https://www.googleapis.com/auth/datastore'],
              lifetime=600,
          )
          db=firestore.Client(project=os.environ['GCP_PROJECT_ID'],credentials=creds)
          q=(db.collection('asterStrategy2')
             .where(filter=FieldFilter('enabled','==',True))
             .where(filter=FieldFilter('settings.longSlots','==',32))
             .where(filter=FieldFilter('settings.shortSlots','==',13)))
          matches=[]
          for snap in q.stream():
              raw=snap.to_dict() or {}
              report=raw.get('multiBbReport') if isinstance(raw.get('multiBbReport'),dict) else {}
              positions=raw.get('multiBbPositions') if isinstance(raw.get('multiBbPositions'),dict) else {}
              orphan=list(report.get('orphanShortSymbols') or [])
              if 'ZECUSDT' in orphan or ('ZECUSDT|SHORT' in positions and 'ZECUSDT|LONG' not in positions):
                  matches.append(raw)
          print('unique_zec_runtime_matches',len(matches))
          if len(matches)!=1:
              raise SystemExit('No unique matching ZEC runtime document; refusing broader account scan/output')
          raw=matches[0]
          settings=raw.get('settings') if isinstance(raw.get('settings'),dict) else {}
          report=raw.get('multiBbReport') if isinstance(raw.get('multiBbReport'),dict) else {}
          positions=raw.get('multiBbPositions') if isinstance(raw.get('multiBbPositions'),dict) else {}
          zec=positions.get('ZECUSDT|SHORT') if isinstance(positions.get('ZECUSDT|SHORT'),dict) else {}
          safe={
            'settings': {k:settings.get(k) for k in ['maximumPositions','longSlots','shortSlots','shortRequiresLongEnabled','bollingerEntryFilter15mEnabled','bollingerEntryFilterTimeframe','minimumLeverage','entryMarginUsd','entryNotionalUsd','entrySizingMode']},
            'report': {k:report.get(k) for k in ['updatedAtMs','entryStatus','entryReason','activeLong','activeShort','remainingLong','remainingShort','accountPositionCount','accountRemainingCapacity','orphanShortSymbols','orphanLongPending','entrySkipReasons','candidateCount','scannedCandidateCount','executableCandidateCount']},
            'zecShort': {k:zec.get(k) for k in ['dcaCount','leverage','lastKnownQty','lastKnownEntry']},
            'zecActions': [a for a in list(report.get('actions') or []) if isinstance(a,dict) and str(a.get('symbol','')).upper()=='ZECUSDT'],
          }
          print(json.dumps(safe,indent=2,sort_keys=True,default=str))
          PY
