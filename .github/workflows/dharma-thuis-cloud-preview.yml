name: Deploy Dharma Thuis Preview

on:
  push:
    branches:
      - dharma-thuis-pwa-preview
    paths:
      - 'dharma-thuis-pwa/**'
      - '.github/workflows/dharma-thuis-cloud-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dharma-thuis-cloud-preview
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: dharma-thuis-preview
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  GCP_DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Verify isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dharma-thuis-pwa-preview"
          test "$CLOUD_RUN_SERVICE" = "dharma-thuis-preview"
          test "$CLOUD_RUN_SERVICE" != "tradementor-api"
          test "$CLOUD_RUN_SERVICE" != "tradementor-api-staging"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push isolated static image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/dharma-thuis-preview:${GITHUB_SHA}"
          docker build --tag "$IMAGE" dharma-thuis-pwa
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy isolated public preview
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --image "$IMAGE"             --port 8080             --allow-unauthenticated             --quiet

      - name: Verify live PWA
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$SERVICE_URL/" >/dev/null
          curl --fail --silent --show-error "$SERVICE_URL/manifest.webmanifest" | grep -q '"name": "Dharma Thuis"'
          curl --fail --silent --show-error "$SERVICE_URL/sw.js" | grep -q 'dharma-thuis-preview'
          echo "Dharma Thuis live at: $SERVICE_URL"
