name: Repair exact Strategy 2 secret access

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/repair-s2-target-secret-access.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_SECRET_HASH: 8559c95f13f015d9525b4a83e0a5a4daf53b611e8db81513fb83e3e30836de46
      TARGET_UID_HASH: 44246fcb6d4b8400bc3944e50d1b62682399fb50e5bad2ad7729eae09910b94c
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Grant the isolated runtime access to its exact existing secret
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          RUNTIME_SERVICE_ACCOUNT="$(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["spec"]["template"]["spec"]["serviceAccountName"])
          PY
          )"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          FIRESTORE_URL="https://firestore.googleapis.com/v1/projects/$GCP_PROJECT_ID/databases/(default)/documents/asterStrategy2?pageSize=300"
          RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "$FIRESTORE_URL")"
          UID_MATCHES=()
          while IFS= read -r candidate_uid; do
            if test "$(printf %s "$candidate_uid" | sha256sum | cut -d' ' -f1)" = "$TARGET_UID_HASH"; then
              UID_MATCHES+=("$candidate_uid")
            fi
          done < <(jq -r '.documents[]?.name | split("/")[-1]' <<<"$RESPONSE")
          test "${#UID_MATCHES[@]}" -eq 1
          SECRET_ID="tradementor-aster-${UID_MATCHES[0]}"
          test "$(printf %s "$SECRET_ID" | sha256sum | cut -d' ' -f1)" = "$TARGET_SECRET_HASH"
          MEMBER="serviceAccount:$RUNTIME_SERVICE_ACCOUNT"
          POLICY="$RUNNER_TEMP/policy.json"
          gcloud secrets get-iam-policy "$SECRET_ID" --project "$GCP_PROJECT_ID" --format=json > "$POLICY"
          if ! python - "$POLICY" "$MEMBER" <<'PY'
          import json,sys
          policy=json.load(open(sys.argv[1],encoding="utf-8"));member=sys.argv[2]
          raise SystemExit(0 if any(x.get("role")=="roles/secretmanager.secretAccessor" and member in x.get("members",[]) for x in policy.get("bindings",[])) else 1)
          PY
          then
            gcloud secrets add-iam-policy-binding "$SECRET_ID" --project "$GCP_PROJECT_ID" \
              --member "$MEMBER" --role roles/secretmanager.secretAccessor --quiet >/dev/null
          fi
          gcloud secrets get-iam-policy "$SECRET_ID" --project "$GCP_PROJECT_ID" --format=json > "$POLICY"
          python - "$POLICY" "$MEMBER" <<'PY'
          import json,sys
          policy=json.load(open(sys.argv[1],encoding="utf-8"));member=sys.argv[2]
          assert any(x.get("role")=="roles/secretmanager.secretAccessor" and member in x.get("members",[]) for x in policy.get("bindings",[]))
          print("SECRET_ACCESS_REPAIRED target=exact runtimeBinding=true secretPayloadRead=false")
          PY
