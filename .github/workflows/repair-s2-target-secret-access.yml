name: Repair exact Strategy 2 secret access

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/repair-s2-target-secret-access.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_SECRET_HASH: 8559c95f13f015d9525b4a83e0a5a4daf53b611e8db81513fb83e3e30836de46
      TARGET_UID_HASH: 44246fcb6d4b8400bc3944e50d1b62682399fb50e5bad2ad7729eae09910b94c
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Grant the isolated runtime access to its exact existing secret
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          RUNTIME_SERVICE_ACCOUNT="$(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["spec"]["template"]["spec"]["serviceAccountName"])
          PY
          )"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          IMAGE="$(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["spec"]["template"]["spec"]["containers"][0]["image"])
          PY
          )"
          JOB="tm-s2-iam-lookup-${GITHUB_RUN_ID: -6}"
          LOOKUP_KEY="$(openssl rand -hex 32)"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import base64,hashlib,os
          from google.cloud import firestore
          target=os.environ["TARGET_UID_HASH"]
          rows=[x.id for x in firestore.Client(project=os.environ["GCP_PROJECT_ID"]).collection("asterStrategy2").stream()
                if hashlib.sha256(x.id.encode()).hexdigest()==target]
          if len(rows)!=1: raise SystemExit(220+min(len(rows),9))
          raw=rows[0].encode(); key=bytes.fromhex(os.environ["LOOKUP_KEY"])
          print("ENCRYPTED_UID="+base64.b64encode(bytes(v^key[i%len(key)] for i,v in enumerate(raw))).decode(),flush=True)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" --command python \
            --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,TARGET_UID_HASH=$TARGET_UID_HASH,LOOKUP_KEY=$LOOKUP_KEY" \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet >/dev/null
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          CIPHER="$(gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=$JOB" \
            --project "$GCP_PROJECT_ID" --freshness 10m --limit 20 --format='value(textPayload,jsonPayload.message)' | sed -n 's/^ENCRYPTED_UID=//p' | head -1)"
          test -n "$CIPHER"
          TARGET_UID="$(python - "$CIPHER" "$LOOKUP_KEY" <<'PY'
          import base64,sys
          raw=base64.b64decode(sys.argv[1]);key=bytes.fromhex(sys.argv[2])
          print(bytes(v^key[i%len(key)] for i,v in enumerate(raw)).decode())
          PY
          )"
          test "$(printf %s "$TARGET_UID" | sha256sum | cut -d' ' -f1)" = "$TARGET_UID_HASH"
          cleanup
          trap - EXIT
          SECRET_ID="tradementor-aster-${TARGET_UID}"
          test "$(printf %s "$SECRET_ID" | sha256sum | cut -d' ' -f1)" = "$TARGET_SECRET_HASH"
          MEMBER="serviceAccount:$RUNTIME_SERVICE_ACCOUNT"
          POLICY="$RUNNER_TEMP/policy.json"
          gcloud secrets get-iam-policy "$SECRET_ID" --project "$GCP_PROJECT_ID" --format=json > "$POLICY"
          if ! python - "$POLICY" "$MEMBER" <<'PY'
          import json,sys
          policy=json.load(open(sys.argv[1],encoding="utf-8"));member=sys.argv[2]
          raise SystemExit(0 if any(x.get("role")=="roles/secretmanager.secretAccessor" and member in x.get("members",[]) for x in policy.get("bindings",[])) else 1)
          PY
          then
            gcloud secrets add-iam-policy-binding "$SECRET_ID" --project "$GCP_PROJECT_ID" \
              --member "$MEMBER" --role roles/secretmanager.secretAccessor --quiet >/dev/null
          fi
          gcloud secrets get-iam-policy "$SECRET_ID" --project "$GCP_PROJECT_ID" --format=json > "$POLICY"
          python - "$POLICY" "$MEMBER" <<'PY'
          import json,sys
          policy=json.load(open(sys.argv[1],encoding="utf-8"));member=sys.argv[2]
          assert any(x.get("role")=="roles/secretmanager.secretAccessor" and member in x.get("members",[]) for x in policy.get("bindings",[]))
          print("SECRET_ACCESS_REPAIRED target=exact runtimeBinding=true secretPayloadRead=false")
          PY
