name: Agent Strategy 2 Reentry Tier Runner

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - .github/workflows/agent-strategy2-reentry-tiers-runner.yml

permissions:
  contents: write

jobs:
  patch-test-agent-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-strategy2-reentry-leverage-tiers-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Apply isolated implementation patch
        run: python .github/scripts/patch_strategy2_reentry_tiers.py
      - name: Adjust validation expectations
        run: python .github/scripts/patch_strategy2_reentry_tiers_followup.py
      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Run complete backend suite
        working-directory: cloud_api
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run complete web build and tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Commit validated implementation to isolated branch
        run: |
          git config user.name "OpenAI Strategy 2 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api web
          test -n "$(git status --porcelain)"
          git commit -m "Fix Strategy 2 reentry and dynamic Aster leverage tiers"
          git push origin HEAD:agent-strategy2-reentry-leverage-tiers-20260901
