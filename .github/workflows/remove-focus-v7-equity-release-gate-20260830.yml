name: Remove Focus V7 Equity Release Gate 20260830

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - tools/remove_focus_v7_equity_release_gate_20260830.py
      - .github/workflows/remove-focus-v7-equity-release-gate-20260830.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Remove third hedge-release condition
        run: python tools/remove_focus_v7_equity_release_gate_20260830.py

      - name: Install test dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run focused Strategy-2 tests
        working-directory: cloud_api
        run: |
          pytest -q \
            test_focus_simple_deterministic_flow.py \
            test_aster_strategy2_focus_trailing.py \
            test_aster_strategy2_focus_live_execution_paths.py

      - name: Commit verified change
        run: |
          git config user.name 'focus-flow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_strategy2_focus_trailing.py
          if git diff --cached --quiet; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git commit -m 'Remove equity gate from Focus hedge release'
          git push origin HEAD:amar-crypto-bot-2026-cloud
