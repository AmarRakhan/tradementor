name: Remove Focus V7 Equity Release Gate 20260830

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - tools/remove_focus_v7_equity_release_gate_20260830.py
      - .github/workflows/remove-focus-v7-equity-release-gate-20260830.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Migrate stale release regression tests only
        run: python tools/remove_focus_v7_equity_release_gate_20260830.py

      - name: Install test dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run complete backend suite
        working-directory: cloud_api
        run: pytest -q

      - name: Commit test-only migration
        run: |
          git config user.name 'focus-flow-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            cloud_api/test_aster_strategy2_focus_trailing.py \
            cloud_api/test_focus_portfolio_cycle_v7.py \
            cloud_api/test_focus_v7_emergency_equity_lock.py \
            cloud_api/test_focus_v7_net_green_release.py
          if git diff --cached --quiet; then
            echo 'No stale test diff to commit.'
            exit 0
          fi
          git commit -m 'Align Focus release tests with approved gate removal'
          git push origin HEAD:amar-crypto-bot-2026-cloud
