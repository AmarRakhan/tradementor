name: Control Plane Diagnose

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.control-plane/diagnose-request.json]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-amar-20260813
  GCP_REGION: europe-west4

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out diagnostic request
        uses: actions/checkout@v4
      - name: Validate diagnostic request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SCOPE="$(python - <<'PY'
          import json
          with open('.control-plane/diagnose-request.json', encoding='utf-8') as f:
              request = json.load(f)
          scope = request.get('scope', 'all')
          if scope not in {'all', 'production', 'staging'}:
              raise SystemExit('invalid diagnostic scope')
          print(scope)
          PY
          )"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
      - name: Authenticate diagnostic identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Collect read-only cloud diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = "tradementor-amar-20260813"
          test "$GCP_REGION" = "europe-west4"
          mkdir -p control-plane-report
          printf 'generatedAt=%s\nproject=%s\nregion=%s\nscope=%s\nrequestCommit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GCP_PROJECT_ID" "$GCP_REGION" "${{ steps.request.outputs.scope }}" "$GITHUB_SHA" > control-plane-report/summary.txt
          gcloud run services list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > control-plane-report/cloud-run-services.json
          gcloud run revisions list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > control-plane-report/cloud-run-revisions.json
          gcloud scheduler jobs list --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json > control-plane-report/scheduler-jobs.json
          gcloud logging read 'resource.type="cloud_run_revision" AND severity>=ERROR' --project "$GCP_PROJECT_ID" --freshness=60m --limit=100 --format=json > control-plane-report/recent-cloud-run-errors.json
          printf '%s\n' 'mode=READ_ONLY' 'orders=DISALLOWED' 'deploy=DISALLOWED' 'schedulerMutation=DISALLOWED' 'trafficMutation=DISALLOWED' > control-plane-report/safety.txt
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-diagnostic-${{ github.run_id }}
          path: control-plane-report/
          retention-days: 7
