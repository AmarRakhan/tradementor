name: Fix hard orphan LONG seat priority 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/fix-hard-orphan-long-seat-priority-20260917.yml'

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest
      - name: Add strict orphan reservation regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_api/test_short_requires_long_pairing_20260917.py')
          s=p.read_text()
          marker='def test_pairing_truth_refresh_failure_blocks_new_seat_allocation():'
          assert marker in s
          tests='''

def test_bollinger_off_orphan_long_inherits_existing_leverage_after_minimum_change():
    short = pos("ZECUSDT", "SHORT"); short["leverage"] = "75"
    client = Client(positions=[short], tickers=[{"symbol":"XCUUSDT","quoteVolume":"999999"}],
                    prices={"XCUUSDT":100,"ZECUSDT":100}, leverage=100)
    result = run_multi_bb_step(
        client=client, ref=Ref(), raw_state=state_for("ZECUSDT","SHORT"),
        settings=cfg(maximumPositions=2,longSlots=1,shortSlots=1,
                     shortRequiresLongEnabled=True,minimumLeverage=100,universeTopN=1,
                     bollingerEntryFilter15mEnabled=False),
        uid="u",account={"availableBalance":"1000"},positions=[short],open_orders=[],
        timestamp_ms=int(time.time()*1000),dry_run=True)
    entries=[a for a in result["actions"] if a.get("kind")=="ENTRY"]
    assert entries and entries[0]["symbol"]=="ZECUSDT" and entries[0]["side"]=="LONG", result
    assert entries[0]["leverage"]==75
    assert entries[0].get("orphanShortPriority") is True
    assert not any(a.get("symbol")=="XCUUSDT" and a.get("kind")=="ENTRY" for a in result["actions"])


def test_bollinger_off_failed_orphan_rescue_keeps_last_long_seat_reserved():
    class BrokenZec(Client):
        def leverage_brackets(self,symbol=None):
            sym=symbol or "XCUUSDT"
            if sym=="ZECUSDT": raise RuntimeError("temporary ZEC leverage data failure")
            return super().leverage_brackets(sym)
    short=pos("ZECUSDT","SHORT"); short["leverage"]="75"
    client=BrokenZec(positions=[short],tickers=[{"symbol":"XCUUSDT","quoteVolume":"999999"}],
                     prices={"XCUUSDT":100,"ZECUSDT":100},leverage=100)
    result=run_multi_bb_step(
        client=client,ref=Ref(),raw_state=state_for("ZECUSDT","SHORT"),
        settings=cfg(maximumPositions=2,longSlots=1,shortSlots=1,shortRequiresLongEnabled=True,
                     minimumLeverage=50,universeTopN=1,bollingerEntryFilter15mEnabled=False),
        uid="u",account={"availableBalance":"1000"},positions=[short],open_orders=[],
        timestamp_ms=int(time.time()*1000),dry_run=True)
    assert not [a for a in result["actions"] if a.get("kind")=="ENTRY"], result
    assert any(a.get("symbol")=="XCUUSDT" and a.get("reason")=="ORPHAN_LONG_SEAT_RESERVED" for a in result["actions"])
    assert result["orphanLongReservedSlots"]==1
    assert result["orphanLongReservedRemaining"]==1


def test_bollinger_off_only_unreserved_long_seats_can_fill_normally():
    class BrokenZec(Client):
        def leverage_brackets(self,symbol=None):
            sym=symbol or "XCUUSDT"
            if sym=="ZECUSDT": raise RuntimeError("temporary ZEC leverage data failure")
            return super().leverage_brackets(sym)
    short=pos("ZECUSDT","SHORT"); short["leverage"]="75"
    tickers=[{"symbol":"XCUUSDT","quoteVolume":"3000"},{"symbol":"AAAUSDT","quoteVolume":"2000"},{"symbol":"BBBUSDT","quoteVolume":"1000"}]
    client=BrokenZec(positions=[short],tickers=tickers,
                     prices={"ZECUSDT":100,"XCUUSDT":100,"AAAUSDT":100,"BBBUSDT":100},leverage=100)
    result=run_multi_bb_step(
        client=client,ref=Ref(),raw_state=state_for("ZECUSDT","SHORT"),
        settings=cfg(maximumPositions=4,longSlots=3,shortSlots=1,shortRequiresLongEnabled=True,
                     minimumLeverage=50,universeTopN=3,bollingerEntryFilter15mEnabled=False),
        uid="u",account={"availableBalance":"1000"},positions=[short],open_orders=[],
        timestamp_ms=int(time.time()*1000),dry_run=True)
    entries=[a for a in result["actions"] if a.get("kind")=="ENTRY" and a.get("side")=="LONG"]
    assert len(entries)==2, result
    assert result["remainingLong"]==1
    assert result["orphanLongReservedRemaining"]==1
    assert any(a.get("reason")=="ORPHAN_LONG_SEAT_RESERVED" for a in result["actions"])

