name: Fix hard orphan LONG seat priority 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/fix-hard-orphan-long-seat-priority-20260917.yml'

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest
      - name: Add regressions for strict free-LONG orphan reservation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_api/test_short_requires_long_pairing_20260917.py')
          s=p.read_text()
          marker='def test_pairing_truth_refresh_failure_blocks_new_seat_allocation():'
          assert marker in s
          block='''\n\ndef test_bollinger_off_orphan_long_uses_existing_leverage_even_below_current_minimum():\n    # Realistic ZEC case: the live contract is already 75x, while Aster can\n    # support a higher leverage and the current configured minimum may have\n    # been raised later. Rescue must inherit 75x instead of rejecting the pair.\n    short = pos("ZECUSDT", "SHORT")\n    short["leverage"] = "75"\n    client = Client(\n        positions=[short],\n        tickers=[{"symbol": "XCUUSDT", "quoteVolume": "999999"}],\n        prices={"XCUUSDT": 100, "ZECUSDT": 100}, leverage=100,\n    )\n    result = run_multi_bb_step(\n        client=client, ref=Ref(), raw_state=state_for("ZECUSDT", "SHORT"),\n        settings=cfg(maximumPositions=2, longSlots=1, shortSlots=1,\n                     shortRequiresLongEnabled=True, minimumLeverage=100, universeTopN=1,\n                     bollingerEntryFilter15mEnabled=False),\n        uid="u", account={"availableBalance": "1000"}, positions=[short],\n        open_orders=[], timestamp_ms=int(time.time() * 1000), dry_run=True,\n    )\n    entries = [row for row in result["actions"] if row.get("kind") == "ENTRY"]\n    assert entries, result\n    assert entries[0]["symbol"] == "ZECUSDT"\n    assert entries[0]["side"] == "LONG"\n    assert entries[0]["leverage"] == 75\n    assert entries[0].get("orphanShortPriority") is True\n    assert not any(row.get("symbol") == "XCUUSDT" and row.get("kind") == "ENTRY" for row in result["actions"])\n\n\ndef test_bollinger_off_failed_orphan_rescue_keeps_its_long_seat_reserved():\n    class BrokenZecLeverageClient(Client):\n        def leverage_brackets(self, symbol=None):\n            sym = symbol or "XCUUSDT"\n            if sym == "ZECUSDT":\n                raise RuntimeError("temporary ZEC leverage data failure")\n            return super().leverage_brackets(sym)\n\n    short = pos("ZECUSDT", "SHORT")\n    short["leverage"] = "75"\n    client = BrokenZecLeverageClient(\n        positions=[short],\n        tickers=[{"symbol": "XCUUSDT", "quoteVolume": "999999"}],\n        prices={"XCUUSDT": 100, "ZECUSDT": 100}, leverage=100,\n    )\n    result = run_multi_bb_step(\n        client=client, ref=Ref(), raw_state=state_for("ZECUSDT", "SHORT"),\n        settings=cfg(maximumPositions=2, longSlots=1, shortSlots=1,\n                     shortRequiresLongEnabled=True, minimumLeverage=50, universeTopN=1,\n                     bollingerEntryFilter15mEnabled=False),\n        uid="u", account={"availableBalance": "1000"}, positions=[short],\n        open_orders=[], timestamp_ms=int(time.time() * 1000), dry_run=True,\n    )\n    assert not [row for row in result["actions"] if row.get("kind") == "ENTRY"], result\n    assert any(row.get("symbol") == "ZECUSDT" and str(row.get("reason", "")).startswith("leverage-data:") for row in result["actions"])\n    assert any(row.get("symbol") == "XCUUSDT" and row.get("reason") == "ORPHAN_LONG_SEAT_RESERVED" for row in result["actions"])\n    assert result.get("orphanLongReservedSlots") == 1\n    assert result.get("orphanLongReservedRemaining") == 1\n\n'''
          s=s.replace('\n'+marker, block+'\n'+marker)
          p.write_text(s)
          PY
      - name: Prove current implementation violates the strict rule
        shell: bash
        run: |
          set +e
          cd cloud_api
          python -m pytest -q test_short_requires_long_pairing_20260917.py -k 'bollinger_off_orphan_long_uses_existing_leverage_even_below_current_minimum or bollinger_off_failed_orphan_rescue_keeps_its_long_seat_reserved'
          rc=$?
          set -e
          test "$rc" -ne 0
          echo STRICT_ORPHAN_PRIORITY_REGRESSION_REPRODUCED
      - name: Apply strict orphan LONG reservation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_api/aster_multi_bb_core.py')
          s=p.read_text()
          old='''    # New seats: fill immediately from Top-N volume after leverage/order/margin checks.\n    scanned_candidates = 0\n    executable_candidates = 0\n    minimum_margin_rejections: list[float] = []\n    for ranked_row in candidates:\n'''
          new='''    # With Bollinger OFF, orphan SHORTs reserve the corresponding number of\n    # free LONG seats before ordinary scanner candidates may consume them.\n    # This turns orphan priority into a hard allocator invariant instead of only\n    # a list ordering preference. With Bollinger ON, existing behavior remains:\n    # only currently valid Bollinger candidates compete for a seat.\n    orphan_long_reserved_slots = (\n        min(long_need, len(rescue_rows))\n        if settings.short_requires_long_enabled and not settings.bollinger_entry_filter_15m_enabled\n        else 0\n    )\n    orphan_long_rescue_filled = 0\n\n    # New seats: fill immediately from Top-N volume after leverage/order/margin checks.\n    scanned_candidates = 0\n    executable_candidates = 0\n    minimum_margin_rejections: list[float] = []\n    for ranked_row in candidates:\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''        symbol = ranked_row["symbol"]\n        if symbol == "HYPEUSDT":\n'''
          new='''        symbol = ranked_row["symbol"]\n        orphan_priority = bool(ranked_row.get("orphanShortPriority"))\n        if symbol == "HYPEUSDT":\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''        if maximum < settings.minimum_leverage:\n            actions.append({"kind": "ENTRY_SKIP", "symbol": symbol, "reason": f"MAX_LEVERAGE_BELOW_MINIMUM: {maximum}x < {settings.minimum_leverage}x"}); continue\n        if ranked_row.get("orphanShortPriority") and long_need > 0:\n'''
          new='''        if maximum < settings.minimum_leverage and not orphan_priority:\n            actions.append({"kind": "ENTRY_SKIP", "symbol": symbol, "reason": f"MAX_LEVERAGE_BELOW_MINIMUM: {maximum}x < {settings.minimum_leverage}x"}); continue\n        if orphan_priority and long_need > 0:\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''        if short_requires_long_gate and side == "SHORT" and f"{symbol}|LONG" not in active:\n            actions.append({"kind": "ENTRY_SKIP", "symbol": symbol, "side": "SHORT", "reason": "SHORT_REQUIRES_LONG", "stage": "final_side"})\n            continue\n\n        paired = bool(settings.asymmetric_hedge_enabled)\n'''
          new='''        if short_requires_long_gate and side == "SHORT" and f"{symbol}|LONG" not in active:\n            actions.append({"kind": "ENTRY_SKIP", "symbol": symbol, "side": "SHORT", "reason": "SHORT_REQUIRES_LONG", "stage": "final_side"})\n            continue\n\n        # Do not let an unrelated LONG steal a seat that is reserved for an\n        # exchange-confirmed orphan SHORT. If several LONG seats are free, only\n        # the unreserved remainder may still be used by ordinary candidates.\n        orphan_reserved_remaining = max(0, orphan_long_reserved_slots - orphan_long_rescue_filled)\n        if (not orphan_priority and side == "LONG" and orphan_reserved_remaining > 0\n                and long_need <= orphan_reserved_remaining):\n            actions.append({"kind": "ENTRY_SKIP", "symbol": symbol, "side": "LONG",\n                            "reason": "ORPHAN_LONG_SEAT_RESERVED",\n                            "reservedRemaining": orphan_reserved_remaining})\n            continue\n\n        paired = bool(settings.asymmetric_hedge_enabled)\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''                existing_leverage = max(1, _i(orphan_short.get("leverage")))\n                if existing_leverage < settings.minimum_leverage:\n                    raise ValueError(f"{symbol}: bestaande SHORT leverage {existing_leverage}x < minimum {settings.minimum_leverage}x")\n                rows = tier_bracket_rows(bracket_payload, symbol)\n'''
          new='''                existing_leverage = max(1, _i(orphan_short.get("leverage")))\n                # The configured minimum applies to brand-new exposure. An\n                # orphan rescue does not choose a new contract leverage: it must\n                # inherit the already-live SHORT leverage, even if settings were\n                # raised after that SHORT was opened.\n                rows = tier_bracket_rows(bracket_payload, symbol)\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''                tier = {"exchangeMaxLeverage": maximum,\n                        "forcedBelowConfiguredMinimum": False,\n                        "configuredMinimum": settings.minimum_leverage,\n                        "orphanContractLeverage": existing_leverage}\n'''
          new='''                tier = {"exchangeMaxLeverage": maximum,\n                        "forcedBelowConfiguredMinimum": existing_leverage < settings.minimum_leverage,\n                        "configuredMinimum": settings.minimum_leverage,\n                        "orphanContractLeverage": existing_leverage}\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''        if ranked_row.get("orphanShortPriority"):\n            entry_action.update({"orphanShortPriority": True, "pairedContractLeverage": plan.leverage})\n'''
          new='''        if orphan_priority:\n            entry_action.update({"orphanShortPriority": True, "pairedContractLeverage": plan.leverage})\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''        available -= total_required if consumed == 2 else required; sent += consumed\n\n    managed_long = sum(1 for key in state if key.endswith("|LONG") and key in active)\n'''
          new='''        available -= total_required if consumed == 2 else required; sent += consumed\n        if orphan_priority and side == "LONG":\n            orphan_long_rescue_filled += 1\n\n    managed_long = sum(1 for key in state if key.endswith("|LONG") and key in active)\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''              "orphanShortSymbols": orphan_short_symbols,\n              "orphanLongPending": [symbol for symbol in orphan_short_symbols if f"{symbol}|LONG" not in active and f"{symbol}|LONG" not in state],\n'''
          new='''              "orphanShortSymbols": orphan_short_symbols,\n              "orphanLongPending": [symbol for symbol in orphan_short_symbols if f"{symbol}|LONG" not in active and f"{symbol}|LONG" not in state],\n              "orphanLongReservedSlots": orphan_long_reserved_slots,\n              "orphanLongRescueFilled": orphan_long_rescue_filled,\n              "orphanLongReservedRemaining": max(0, orphan_long_reserved_slots - orphan_long_rescue_filled),\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Compile backend
        run: python -m compileall -q cloud_api
      - name: Run focused pairing regressions
        working-directory: cloud_api
        run: python -m pytest -q test_short_requires_long_pairing_20260917.py test_aster_bollinger_entry_filter_seat_flow.py test_same_symbol_dual_side_20260906.py test_aster_multi_bb.py
      - name: Run full backend suite
        working-directory: cloud_api
        run: python -m pytest -q
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py cloud_api/test_short_requires_long_pairing_20260917.py
          git diff --cached --quiet && { echo 'No repair to commit'; exit 1; }
          git commit -m 'Reserve free LONG seats for orphan SHORT pairs'
          git push origin HEAD:amar-crypto-bot-2026-cloud
