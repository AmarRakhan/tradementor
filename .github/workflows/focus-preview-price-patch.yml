name: Focus Preview Price Patch
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.focus-preview-price-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - name: Use current Focus price in exposure preview
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('cloud_api/main.py');text=main.read_text()
          anchor='''        "moneyGrabber":{"enabled":bool(settings.get("moneyGrabberEnabled",False)),\n            "activated":bool(raw.get("moneyGrabberActivated",False)),"round":mg_round,"pairs":mg_pairs,\n            "freeSymbols":max(0,counts["uniqueMarketCount"]-len(mg_pairs)),\n            "partialSymbols":sum(str(x.get("status",""))=="PARTIAL_PROTECTION" for x in mg_pairs if isinstance(x,dict)),\n            "lockedSymbols":sum(str(x.get("status",""))=="LOCKED" for x in mg_pairs if isinstance(x,dict)),\n            "recoverySymbols":sum(str(x.get("status",""))=="RECOVERY" for x in mg_pairs if isinstance(x,dict))},\n'''
          replacement=anchor+'''        "focus":{"state":raw.get("focusShadowState",{}) if isinstance(raw.get("focusShadowState"),dict) else {},\n            "report":raw.get("focusShadowReport",{}) if isinstance(raw.get("focusShadowReport"),dict) else {},\n            "metrics":raw.get("focusShadowMetrics",{}) if isinstance(raw.get("focusShadowMetrics"),dict) else {},\n            "ordersSent":0,"updatedAt":raw.get("focusShadowAt")},\n'''
          if '"focus":{"state":raw.get("focusShadowState"' not in text:
              if anchor not in text:raise SystemExit('public focus anchor missing')
              text=text.replace(anchor,replacement,1)
          main.write_text(text)

          maker=Path('web/components/aster-strategy2-maker.tsx');text=maker.read_text()
          old=''' const focusStart=focusStartNotional({sizingMode:(v.focusCompound?"equity_pct":v.focusSizing),fixedUsd:num(v.focusStart),equityPct:num(v.focusEquityPct)/100,equity,maxStartUsd:num(v.focusMaxStart)});\n const focusPreview=useMemo(()=>focusExposurePreview({entryPrice:100,startNotional:focusStart,dcaEnabled:v.focusDca,dcaNotional:num(v.focusDcaAmount),dcaMultiplier:num(v.focusDcaMultiplier),maxDca:Math.min(MAX_FOCUS_DCA,Math.max(0,Math.round(num(v.focusMaxDca)))),dcaDistancePct:num(v.focusDcaDistance)/100,dcaMode:v.focusDcaMode,leverage:Math.max(1,Math.round(num(v.leverage))),equity,availableMargin,focusBudgetNotional:num(v.focusBudget)}),[focusStart,v.focusDca,v.focusDcaAmount,v.focusDcaMultiplier,v.focusMaxDca,v.focusDcaDistance,v.focusDcaMode,v.leverage,v.focusBudget,equity,availableMargin]);\n const focusStatus=(state.focus&&typeof state.focus==="object"?state.focus:{}) as Record<string,unknown>;\n'''
          new=''' const focusStart=focusStartNotional({sizingMode:(v.focusCompound?"equity_pct":v.focusSizing),fixedUsd:num(v.focusStart),equityPct:num(v.focusEquityPct)/100,equity,maxStartUsd:num(v.focusMaxStart)});\n const focusStatus=(state.focus&&typeof state.focus==="object"?state.focus:{}) as Record<string,unknown>;\n const focusReport=(focusStatus.report&&typeof focusStatus.report==="object"?focusStatus.report:{}) as Record<string,unknown>;\n const focusRanking=Array.isArray(focusReport.ranking)?focusReport.ranking.filter((x):x is Record<string,unknown>=>Boolean(x&&typeof x==="object")):[];\n const focusActiveState=(focusStatus.state&&typeof focusStatus.state==="object"?focusStatus.state:{}) as Record<string,unknown>;\n const focusSelectedPair=(v.focusSelection==="manual"?v.focusPair:String(focusActiveState.activePair||focusReport.selectedPair||"")).toUpperCase().trim();\n const focusMarket=focusRanking.find(row=>String(row.symbol||"").toUpperCase()===focusSelectedPair)||focusRanking[0];\n const focusCurrentPrice=Math.max(0,money(focusMarket?.price,0));\n const focusPreview=useMemo(()=>focusExposurePreview({entryPrice:focusCurrentPrice>0?focusCurrentPrice:100,startNotional:focusStart,dcaEnabled:v.focusDca,dcaNotional:num(v.focusDcaAmount),dcaMultiplier:num(v.focusDcaMultiplier),maxDca:Math.min(MAX_FOCUS_DCA,Math.max(0,Math.round(num(v.focusMaxDca)))),dcaDistancePct:num(v.focusDcaDistance)/100,dcaMode:v.focusDcaMode,leverage:Math.max(1,Math.round(num(v.leverage))),equity,availableMargin,focusBudgetNotional:num(v.focusBudget)}),[focusCurrentPrice,focusStart,v.focusDca,v.focusDcaAmount,v.focusDcaMultiplier,v.focusMaxDca,v.focusDcaDistance,v.focusDcaMode,v.leverage,v.focusBudget,equity,availableMargin]);\n'''
          if old not in text:raise SystemExit('maker preview block missing')
          text=text.replace(old,new,1)
          # Add concise live pair evidence to the Focus sizing step if present.
          sizing='''{title:"Hoe groot is de Focus-instap?",help:"Vast USD of percentage van actuele portfolio-equity. Compounding gebruikt steeds de actuele equity binnen de harde maximums.",body:<><Select label="Sizing" value={v.focusSizing} set={x=>setV({...v,focusSizing:x==="equity_pct"?"equity_pct":"fixed_usd"})} options={["fixed_usd","equity_pct"]} labels={{fixed_usd:"Vast USD",equity_pct:"% van actuele equity"}}/>'''
          if sizing in text and 'Actuele Focus-prijs' not in text:
              text=text.replace(sizing,sizing+'{focusCurrentPrice>0&&<div className="strategy-message"><b>Actuele Focus-prijs:</b> {focusSelectedPair||String(focusMarket?.symbol||"—")} · ${focusCurrentPrice.toLocaleString(undefined,{maximumFractionDigits:8})}</div>}',1)
          maker.write_text(text)
          PY
      - name: Verify preview uses exchange-backed Focus price
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('cloud_api/main.py').read_text();maker=Path('web/components/aster-strategy2-maker.tsx').read_text()
          assert '"focus":{"state":raw.get("focusShadowState"' in main
          assert 'const focusCurrentPrice=' in maker
          assert 'entryPrice:focusCurrentPrice>0?focusCurrentPrice:100' in maker
          assert 'Actuele Focus-prijs' in maker
          PY
      - name: Remove patch workflow and commit
        run: |
          rm -f .github/workflows/focus-preview-price-patch.yml .focus-preview-price-trigger
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "fix: use current Focus pair price in exposure preview"
          git push origin HEAD:amar-crypto-bot-2026-cloud
