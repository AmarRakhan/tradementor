name: Dispatch Bollinger seat hotfix production backend

on:
  push:
    branches:
      - agent/fix-bb-independent-side-scan-20260913
    paths:
      - ".github/workflows/dispatch-bb-hotfix-backend-20260913.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production backend deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-cloud-production.yml \
            -R AmarRakhan/tradementor \
            --ref amar-crypto-bot-2026-cloud \
            -f confirmation=DEPLOY_PRODUCTION_BACKEND
