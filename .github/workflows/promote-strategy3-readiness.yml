name: Promote tested Strategy 3 readiness fix

on:
  push:
    branches:
      - agent/strategy3-live-deploy-a05d348
    paths:
      - ".github/workflows/promote-strategy3-readiness.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-strategy3-readiness-live
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-amar-20260813
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-strategy3-live-api
  SOURCE_COMMIT: a05d348349db38ba6e0e109ed3083517a9d67396
  REVISION_SUFFIX: readiness-a05d348
  REVISION_TAG: s3fix-a05d348

jobs:
  test-simulate-stage-and-promote:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out exact deployment branch
        uses: actions/checkout@v4

      - name: Prove exact tested source
        shell: bash
        run: |
          test "$(git hash-object cloud_api/main.py)" = "7d8e283ab4c5b82e815bd266aedd1e7856d6470f"
          test "$(git hash-object cloud_api/test_aster_strategy3_live_scheduler.py)" = "d7c10df5fda56a239e96baa90a9c5b8bdb6e102b"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend test dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run all backend tests and simulations
        working-directory: cloud_api
        run: |
          python -m py_compile main.py
          pytest -q
          pytest -q test_aster_strategy3.py test_aster_strategy3_live_safety.py test_aster_strategy3_runtime.py test_aster_strategy3_readiness_scale.py test_aster_strategy3_live_scheduler.py test_aster_strategy3_stress.py

      - name: Verify immutable runtime boundaries in source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("cloud_api/main.py").read_text(encoding="utf-8")
          required = [
              '@app.post("/internal/aster-strategy3/tick")',
              "auth_app = identity_app(",
              "app=auth_app",
              "recent_id_token(",
              "maximum_age_seconds=600",
              "existing_data_read_bridge",
              'account_authorized=bool(existing.get("canaryValidated")) and bool(existing.get("liveAccountAuthorized"))',
              'revalidated=account_authorized and bool(report.get("liveReady"))',
              'probe_symbol=(owned_symbols or active_symbols or ["BTCUSDT"])[0]',
          ]
          for item in required:
              assert item in source, item
          PY

      - name: Authenticate to isolated Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture current live revision and configuration
        shell: bash
        run: |
          OLD_SERVICE="$RUNNER_TEMP/old-service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OLD_SERVICE"
          OLD_REVISION="$(python - "$OLD_SERVICE" <<'PY'
          import json, sys
          service=json.load(open(sys.argv[1], encoding="utf-8"))
          live=[row for row in service["status"]["traffic"] if int(row.get("percent",0))==100]
          assert len(live)==1, service["status"]["traffic"]
          print(live[0]["revisionName"])
          PY
          )"
          test -n "$OLD_REVISION"
          echo "OLD_REVISION=$OLD_REVISION" >> "$GITHUB_ENV"

      - name: Build and push candidate image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/strategy3-live-api:$SOURCE_COMMIT"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy isolated candidate with zero general traffic
        shell: bash
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --image "$IMAGE"             --revision-suffix "$REVISION_SUFFIX"             --tag "$REVISION_TAG"             --no-traffic
          NEW_REVISION="$CLOUD_RUN_SERVICE-$REVISION_SUFFIX"
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"

      - name: Verify candidate configuration and zero traffic
        shell: bash
        run: |
          OLD_REV="$RUNNER_TEMP/old-revision.json"
          NEW_REV="$RUNNER_TEMP/new-revision.json"
          SERVICE="$RUNNER_TEMP/candidate-service.json"
          gcloud run revisions describe "$OLD_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$OLD_REV"
          gcloud run revisions describe "$NEW_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$NEW_REV"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE"
          python - "$OLD_REV" "$NEW_REV" "$SERVICE" "$OLD_REVISION" "$NEW_REVISION" <<'PY'
          import copy, json, sys
          old=json.load(open(sys.argv[1], encoding="utf-8"))
          new=json.load(open(sys.argv[2], encoding="utf-8"))
          service=json.load(open(sys.argv[3], encoding="utf-8"))
          old_name,new_name=sys.argv[4],sys.argv[5]
          assert new["status"]["conditions"][0]["status"] == "True"
          old_spec=copy.deepcopy(old["spec"])
          new_spec=copy.deepcopy(new["spec"])
          old_spec["containers"][0]["image"]="<candidate-image>"
          new_spec["containers"][0]["image"]="<candidate-image>"
          assert old_spec == new_spec, "Candidate runtime configuration drifted"
          positive=[row for row in service["status"]["traffic"] if int(row.get("percent",0))>0]
          assert len(positive)==1 and positive[0]["revisionName"]==old_name and int(positive[0]["percent"])==100
          tagged=[row for row in service["status"]["traffic"] if row.get("revisionName")==new_name and row.get("tag")=="s3fix-a05d348"]
          assert tagged and int(tagged[0].get("percent",0))==0
          PY
          TAG_URL="$(python - "$SERVICE" "$NEW_REVISION" <<'PY'
          import json, sys
          service=json.load(open(sys.argv[1], encoding="utf-8"))
          rows=[row for row in service["status"]["traffic"] if row.get("revisionName")==sys.argv[2] and row.get("tag")=="s3fix-a05d348"]
          assert len(rows)==1 and rows[0].get("url")
          print(rows[0]["url"])
          PY
          )"
          echo "TAG_URL=$TAG_URL" >> "$GITHUB_ENV"

      - name: Smoke-test candidate without trading actions
        shell: bash
        run: |
          curl --fail --silent --show-error "$TAG_URL/health" > "$RUNNER_TEMP/candidate-health.json"
          curl --fail --silent --show-error "$TAG_URL/openapi.json" > "$RUNNER_TEMP/candidate-openapi.json"
          python - "$RUNNER_TEMP/candidate-health.json" "$RUNNER_TEMP/candidate-openapi.json" <<'PY'
          import json, sys
          health=json.load(open(sys.argv[1], encoding="utf-8"))
          api=json.load(open(sys.argv[2], encoding="utf-8"))
          assert health["status"]=="ready"
          assert health["environment"]=="strategy3-live"
          assert health["ordersEnabled"] is False
          assert health["dataProject"]=="tradementor-amar-20260813"
          assert health["identityProject"]=="tradementor-production"
          assert "/internal/aster-strategy3/tick" in api["paths"]
          assert "/v1/me/aster/strategy3/readiness" in api["paths"]
          PY

      - name: Promote candidate and rollback automatically on verification failure
        shell: bash
        run: |
          set -Eeuo pipefail
          promoted=0
          rollback() {
            if [ "$promoted" = "1" ]; then
              gcloud run services update-traffic "$CLOUD_RUN_SERVICE"                 --project "$GCP_PROJECT_ID"                 --region "$GCP_REGION"                 --to-revisions "$OLD_REVISION=100"
            fi
          }
          trap rollback ERR
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"             --project "$GCP_PROJECT_ID"             --region "$GCP_REGION"             --to-revisions "$NEW_REVISION=100"
          promoted=1
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$SERVICE_URL/health" > "$RUNNER_TEMP/live-health.json"
          curl --fail --silent --show-error "$SERVICE_URL/openapi.json" > "$RUNNER_TEMP/live-openapi.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/live-service.json"
          python - "$RUNNER_TEMP/live-health.json" "$RUNNER_TEMP/live-openapi.json" "$RUNNER_TEMP/live-service.json" "$NEW_REVISION" <<'PY'
          import json, sys
          health=json.load(open(sys.argv[1], encoding="utf-8"))
          api=json.load(open(sys.argv[2], encoding="utf-8"))
          service=json.load(open(sys.argv[3], encoding="utf-8"))
          assert health["status"]=="ready" and health["environment"]=="strategy3-live"
          assert health["ordersEnabled"] is False
          assert "/internal/aster-strategy3/tick" in api["paths"]
          live=[row for row in service["status"]["traffic"] if int(row.get("percent",0))==100]
          assert len(live)==1 and live[0]["revisionName"]==sys.argv[4]
          PY
          trap - ERR
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Report successful live promotion
        run: |
          echo "Previous revision: $OLD_REVISION"
          echo "Live revision: $NEW_REVISION"
          echo "Service URL: $SERVICE_URL"
