name: Diagnose failed Strategy 3 readiness candidate

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/diagnose-strategy3-readiness-candidate.yml"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read failed revision condition
        run: |
          gcloud run revisions describe tradementor-strategy3-live-api-readiness-a05d348             --project tradementor-amar-20260813             --region europe-west4             --format=json
      - name: Read startup errors only
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tradementor-strategy3-live-api" AND resource.labels.revision_name="tradementor-strategy3-live-api-readiness-a05d348" AND severity>=ERROR'             --project tradementor-amar-20260813             --limit 100             --order asc             --format=json
