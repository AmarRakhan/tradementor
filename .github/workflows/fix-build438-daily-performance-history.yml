name: Finalize Build 438 web contract

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/fix-build438-daily-performance-history.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: build438-web-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Align pinned Auto Hedge build contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("web/tests/position-loss-auto-hedge.test.mjs")
          s=p.read_text(encoding="utf-8")
          if 'WEBAPP_BUILD_NUMBER = "437"' not in s:
              raise SystemExit("expected pinned Build 437 contract not found")
          p.write_text(s.replace('WEBAPP_BUILD_NUMBER = "437"','WEBAPP_BUILD_NUMBER = "438"',1),encoding="utf-8")
          PY

      - name: Run complete web regression suite
        run: |
          cd web
          npm ci
          npm test

      - name: Commit regression sync without recursive deploy
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TradeMentor Control Plane'
          git config user.email 'actions@users.noreply.github.com'
          git add web/tests/position-loss-auto-hedge.test.mjs
          git commit -m 'Build 438: sync Auto Hedge build regression contract'
          git push origin HEAD:amar-crypto-bot-2026-cloud
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Build 438 web deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-shared-v44-testapp.yml --repo "$GITHUB_REPOSITORY" --ref amar-crypto-bot-2026-cloud
