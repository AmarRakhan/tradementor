# Build 416 owner-only zone-soldier backend dispatch. The canonical production workflow
# still performs exact-source tests, zero-traffic candidate verification and rollback.
name: Dispatch Botconfigurator V2 production backend 2026-09-23

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/dispatch-botconfigurator-v2-production-20260923.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded exact-source production backend workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-cloud-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref amar-crypto-bot-2026-cloud \
            -f confirmation=DEPLOY_PRODUCTION_BACKEND \
            -f source_commit="$GITHUB_SHA"
