name: Verify missed DCA catch-up 2026-09-12

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/verify-dca-catchup-20260912.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud_api/requirements.txt pytest
      - name: Run DCA regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile cloud_api/aster_multi_bb_core.py
          python -m pytest -q cloud_api/test_aster_multi_bb.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'cloud_api')
          import aster_multi_bb
          assert aster_multi_bb._missed_dca_levels(100.95,100.0,'SHORT',.002)==4
          assert aster_multi_bb._missed_dca_levels(99.0,100.0,'LONG',.002)==5
          assert aster_multi_bb._missed_dca_levels(100.1,100.0,'SHORT',.002)==0
          print('missed-DCA level counter PASS')
          PY
