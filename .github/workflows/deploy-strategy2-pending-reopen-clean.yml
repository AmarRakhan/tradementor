name: Deploy Strategy 2 Pending Reopen No Traffic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PENDING_REOPEN_ZERO_TRAFFIC"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-strategy2-test-live-control
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-amar-20260813
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
  SCHEDULER_JOB: tradementor-strategy2-test-live-tick
  CANDIDATE_TAG: prflow
  CANDIDATE_COMMIT: c95585207148e8acd0ff5e6261581492d000023a

jobs:
  test-build-no-traffic:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Check out exact clean candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}

      - name: Prove immutable test-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/codex/strategy2-pending-reopen-flow-clean"
          test "${{ inputs.confirmation }}" = "DEPLOY_PENDING_REOPEN_ZERO_TRAFFIC"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$GCP_PROJECT_ID" = "tradementor-amar-20260813"
          test "$GCP_REGION" = "europe-west4"
          test "$CLOUD_RUN_SERVICE" = "tradementor-strategy2-test-live-api"
          test "$SCHEDULER_JOB" = "tradementor-strategy2-test-live-tick"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Run complete backend suite
        working-directory: cloud_api
        run: |
          pip install -r requirements.txt pytest
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          pytest -q

      - name: Authenticate to isolated Google Cloud test project
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Capture immutable pre-deploy boundary
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud scheduler jobs describe "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json > "$RUNNER_TEMP/scheduler-before.json"
          RUNTIME_SERVICE_ACCOUNT="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          echo "RUNTIME_SERVICE_ACCOUNT=$RUNTIME_SERVICE_ACCOUNT" >> "$GITHUB_ENV"

      - name: Build exact clean candidate image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/strategy2-test-live-api:$CANDIDATE_COMMIT"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy tagged revision with zero traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --command uvicorn \
            --args "strategy2_test_entrypoint:app,--host,0.0.0.0,--port,8080" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --no-traffic \
            --tag "$CANDIDATE_TAG" \
            --quiet

      - name: Verify health, zero traffic and unchanged scheduler
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-after.json"
          gcloud scheduler jobs describe "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json > "$RUNNER_TEMP/scheduler-after.json"
          CANDIDATE_URL="$(python - "$RUNNER_TEMP/service-after.json" <<'PY'
          import json,sys
          service=json.load(open(sys.argv[1],encoding="utf-8"))
          tagged=next(row for row in service["status"]["traffic"] if row.get("tag")=="prflow")
          assert tagged.get("percent",0)==0
          print(tagged["url"])
          PY
          )"
          HEALTH="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$CANDIDATE_URL/health")"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-after.json" "$RUNNER_TEMP/scheduler-before.json" "$RUNNER_TEMP/scheduler-after.json" "$HEALTH" <<'PY'
          import json,sys
          before,after,job_before,job_after=map(lambda path:json.load(open(path,encoding="utf-8")),sys.argv[1:5])
          health=json.loads(sys.argv[5])
          assert health["status"]=="ready"
          def scheduler_config(job):
              target=job.get("httpTarget",{});oidc=target.get("oidcToken",{})
              return {
                  "name":job.get("name"),"schedule":job.get("schedule"),"timeZone":job.get("timeZone"),
                  "state":job.get("state"),"attemptDeadline":job.get("attemptDeadline"),
                  "retryConfig":job.get("retryConfig",{}),
                  "httpTarget":{"uri":target.get("uri"),"httpMethod":target.get("httpMethod"),
                      "headers":target.get("headers",{}),"body":target.get("body"),
                      "oidcToken":{"serviceAccountEmail":oidc.get("serviceAccountEmail"),"audience":oidc.get("audience")}},
              }
          assert scheduler_config(job_before)==scheduler_config(job_after)
          before_live=next((row for row in before["status"]["traffic"] if int(row.get("percent",0))>0),None)
          after_live=next((row for row in after["status"]["traffic"] if int(row.get("percent",0))>0),None)
          assert before_live and after_live
          assert before_live.get("revisionName")==after_live.get("revisionName")
          assert before_live.get("percent")==after_live.get("percent")
          tagged=next(row for row in after["status"]["traffic"] if row.get("tag")=="prflow")
          assert tagged.get("percent",0)==0
          PY
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"

      - name: Publish candidate URL
        run: echo "$CANDIDATE_URL"
