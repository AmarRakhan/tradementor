name: Dispatch Strategy 2 action preview production backend

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/dispatch-strategy2-action-preview-production.yml]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production backend candidate flow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloud-production.yml --repo AmarRakhan/tradementor --ref amar-crypto-bot-2026-cloud -f confirmation=DEPLOY_PRODUCTION_BACKEND
