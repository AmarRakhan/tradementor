name: Apply Aster Quick Trade Phase 2

on:
  push:
    branches:
      - agent-aster-markets-quick-trade-settings
    paths:
      - tools/apply_aster_quick_trade_phase2.py
      - .github/workflows/apply-aster-quick-trade-phase2.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-phase2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-aster-markets-quick-trade-settings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r cloud_api/requirements.txt pytest
      - name: Apply phase 2 patch
        run: python tools/apply_aster_quick_trade_phase2.py
      - name: Run focused backend tests
        working-directory: cloud_api
        run: python -m pytest -q test_aster_quick_trade.py test_aster_quick_trade_profiles.py test_aster_strategy2_state.py
      - name: Run web tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Commit generated changes
        run: |
          git config user.name "Aster Rebuild Agent"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_multi_bb.py cloud_api/main.py cloud_api/test_aster_quick_trade.py web/app/api/exchanges/aster/strategy2/quick-trade/route.ts web/components/markets-page.tsx web/components/markets-page.module.css web/tests/markets-quick-trade.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[agent-phase2] Add Markets Strategy 2 quick trade flow"
          git push origin HEAD:agent-aster-markets-quick-trade-settings
