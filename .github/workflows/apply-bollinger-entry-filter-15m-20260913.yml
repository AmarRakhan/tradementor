name: Apply Bollinger Entry Filter 15m

on:
  push:
    branches:
      - agent/bollinger-entry-filter-15m-20260913
    paths:
      - ".github/scripts/apply_bollinger_entry_filter_15m.py"
      - ".github/workflows/apply-bollinger-entry-filter-15m-20260913.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bollinger-entry-filter-15m-20260913
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Apply isolated implementation
        run: python .github/scripts/apply_bollinger_entry_filter_15m.py

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Focused backend tests
        working-directory: cloud_api
        run: pytest -q test_aster_bollinger_entry_filter.py

      - name: Backend syntax guard
        run: python -m py_compile cloud_api/aster_bollinger_entry_filter.py cloud_api/aster_multi_bb_core.py cloud_api/aster_multi_bb.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Focused web contract
        working-directory: web
        run: node --experimental-strip-types --test tests/aster-bollinger-entry-filter-15m.test.mjs

      - name: Production web build
        working-directory: web
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "OpenAI Bollinger Entry Filter Agent"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/aster_bollinger_entry_filter.py cloud_api/aster_multi_bb_core.py cloud_api/test_aster_bollinger_entry_filter.py web/components/aster-bollinger-entry-filter-15m-card.tsx web/components/aster-profit-lock-ladder-bridge.tsx web/tests/aster-bollinger-entry-filter-15m.test.mjs
          git diff --cached --check
          git commit -m "Add optional 15m Bollinger primary-entry filter"
          git push origin HEAD:agent/bollinger-entry-filter-15m-20260913
