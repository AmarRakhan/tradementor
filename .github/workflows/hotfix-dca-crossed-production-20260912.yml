name: Hotfix crossed DCA trigger production 2026-09-12

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/hotfix-dca-crossed-production-20260912.yml'

permissions:
  contents: write

concurrency:
  group: hotfix-dca-crossed-production-20260912
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch crossed DCA execution state and presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          backend = Path('cloud_api/aster_multi_bb_core.py')
          text = backend.read_text()

          old = '''def _recovery_anchor(state: dict[str, Any], *, entry: float) -> float:\n    \"\"\"Deterministic DCA anchor priority used by reconciliation.\"\"\"\n    for field in (\"lastDcaFillPrice\", \"lastManualFillPrice\", \"lastBotFillPrice\", \"strategyAnchorPrice\"):\n        value = _f(state.get(field))\n        if value > 0:\n            return value\n    return entry if _i(state.get(\"dcaCount\")) == 0 and entry > 0 else 0.0\n'''
          new = old + '''\n\ndef _dca_due(mark: float, trigger: float, side: str) -> bool:\n    \"\"\"True once the active DCA trigger has been crossed in the position direction.\"\"\"\n    if mark <= 0 or trigger <= 0:\n        return False\n    return mark <= trigger if side == \"LONG\" else mark >= trigger\n'''
          if text.count(old) != 1:
              raise SystemExit('backend recovery anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    next_dca_distance_usd = abs(next_dca_price - mark) if next_dca_price else None\n    next_dca_distance_pct = next_dca_distance_usd / mark * 100 if next_dca_distance_usd is not None else None\n    return {'''
          new = '''    next_dca_distance_usd = abs(next_dca_price - mark) if next_dca_price else None\n    next_dca_distance_pct = next_dca_distance_usd / mark * 100 if next_dca_distance_usd is not None else None\n    next_dca_due = _dca_due(mark, next_dca_price, side) if next_dca_price else False\n    return {'''
          if text.count(old) != 1:
              raise SystemExit('backend preview distance anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        \"nextDcaDistancePct\": next_dca_distance_pct,\n        \"nextDcaNumber\": dca_count + 1 if next_dca_price else None,'''
          new = '''        \"nextDcaDistancePct\": next_dca_distance_pct,\n        \"nextDcaDue\": next_dca_due,\n        \"nextDcaStatus\": \"DUE\" if next_dca_due else (\"AHEAD\" if next_dca_price else \"NONE\"),\n        \"nextDcaNumber\": dca_count + 1 if next_dca_price else None,'''
          if text.count(old) != 1:
              raise SystemExit('backend preview return anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        trigger = anchor * (1 - settings.dca_distance if side == \"LONG\" else 1 + settings.dca_distance)\n        due = mark <= trigger if side == \"LONG\" else mark >= trigger\n        if not due: continue'''
          new = '''        trigger = anchor * (1 - settings.dca_distance if side == \"LONG\" else 1 + settings.dca_distance)\n        due = _dca_due(mark, trigger, side)\n        if not due: continue'''
          if text.count(old) != 1:
              raise SystemExit('backend trigger comparator anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''            st = dict(st0); st.update({\"dcaCount\": dca_count + 1, \"lastBotFillPrice\": fill_price, \"lastDcaFillPrice\": fill_price,\n                \"lastKnownQty\": new_qty, \"lastKnownEntry\": new_entry, \"lastBotDcaAtMs\": timestamp_ms, \"updatedAtMs\": timestamp_ms,\n                \"leverage\": int(tier[\"leverage\"]), \"lastTierReductionAtMs\": timestamp_ms if tier[\"tierReduction\"] else st0.get(\"lastTierReductionAtMs\")}); state[key] = st'''
          new = '''            next_count = dca_count + 1\n            next_allowed = settings.unlimited_dca or next_count < settings.max_dca\n            next_trigger = fill_price * (1 - settings.dca_distance if side == \"LONG\" else 1 + settings.dca_distance) if next_allowed and fill_price > 0 else None\n            next_due = _dca_due(mark, next_trigger, side) if next_trigger else False\n            next_distance_usd = abs(next_trigger - mark) if next_trigger else None\n            next_distance_pct = next_distance_usd / mark * 100.0 if next_distance_usd is not None and mark > 0 else None\n            st = dict(st0); st.update({\"dcaCount\": next_count, \"lastBotFillPrice\": fill_price, \"lastDcaFillPrice\": fill_price,\n                \"lastKnownQty\": new_qty, \"lastKnownEntry\": new_entry, \"lastBotDcaAtMs\": timestamp_ms, \"updatedAtMs\": timestamp_ms,\n                \"nextDcaPrice\": next_trigger, \"nextDcaDistanceUsd\": next_distance_usd, \"nextDcaDistancePct\": next_distance_pct,\n                \"nextDcaDue\": next_due, \"nextDcaStatus\": \"DUE\" if next_due else (\"AHEAD\" if next_trigger else \"NONE\"),\n                \"nextDcaNumber\": next_count + 1 if next_trigger else None,\n                \"leverage\": int(tier[\"leverage\"]), \"lastTierReductionAtMs\": timestamp_ms if tier[\"tierReduction\"] else st0.get(\"lastTierReductionAtMs\")}); state[key] = st'''
          if text.count(old) != 1:
              raise SystemExit('backend confirmed-fill anchor mismatch')
          text = text.replace(old, new, 1)
          backend.write_text(text)

          frontend = Path('web/components/aster-recent-trades.tsx')
          text = frontend.read_text()
          old = '''  const detailDcaCount = detailDcaPresentation.filledDcaCount;\n  const detailNextDcaPrice = detailDcaPresentation.nextDcaPrice;\n  const detailNextDcaNumber = detailDcaPresentation.nextDcaNumber;'''
          new = '''  const detailDcaCount = detailDcaPresentation.filledDcaCount;\n  const detailNextDcaPrice = detailDcaPresentation.nextDcaPrice;\n  const detailNextDcaNumber = detailDcaPresentation.nextDcaNumber;\n  const detailDcaTriggerCrossed = Boolean(\n    detailCurrentPrice !== null && detailCurrentPrice > 0 && detailNextDcaPrice !== null && detailNextDcaPrice > 0 &&\n    ((detailMainSide === \"LONG\" && detailCurrentPrice <= detailNextDcaPrice) || (detailMainSide === \"SHORT\" && detailCurrentPrice >= detailNextDcaPrice)),\n  );\n  const detailOppositeDcaTriggerCrossed = Boolean(\n    detailCurrentPrice !== null && detailCurrentPrice > 0 && detailOppositeNextDcaPrice !== null && detailOppositeNextDcaPrice > 0 &&\n    ((detailOppositeSide === \"LONG\" && detailCurrentPrice <= detailOppositeNextDcaPrice) || (detailOppositeSide === \"SHORT\" && detailCurrentPrice >= detailOppositeNextDcaPrice)),\n  );\n  const detailComputedDcaDistancePct = detailCurrentPrice !== null && detailCurrentPrice > 0 && detailNextDcaPrice !== null && detailNextDcaPrice > 0\n    ? Math.abs(detailNextDcaPrice - detailCurrentPrice) / detailCurrentPrice * 100\n    : detailNextDcaDistancePct;'''
          if text.count(old) != 1:
              raise SystemExit('frontend DCA presentation anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''  const detailDcaDistanceLabel = signedDistance(detailNextDcaDistancePct);'''
          new = '''  const detailDcaDistanceLabel = detailDcaTriggerCrossed ? \"DCA bereikt · uitvoering wordt gecontroleerd\" : signedDistance(detailComputedDcaDistancePct);'''
          if text.count(old) != 1:
              raise SystemExit('frontend distance label anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    detailNextDcaPrice && detailNextDcaPrice > 0 && detailNextDcaNumber !== null\n      ? ['''
          new = '''    detailNextDcaPrice && detailNextDcaPrice > 0 && detailNextDcaNumber !== null && !detailDcaTriggerCrossed\n      ? ['''
          if text.count(old) != 1:
              raise SystemExit('frontend DCA chart-level anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    ...(detailNextDcaPrice && detailNextDcaPrice > 0 && detailNextDcaNumber !== null\n      ? ['''
          new = '''    ...(detailNextDcaPrice && detailNextDcaPrice > 0 && detailNextDcaNumber !== null && !detailDcaTriggerCrossed\n      ? ['''
          if text.count(old) != 1:
              raise SystemExit('frontend planned DCA anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    ...(detailOppositeNextDcaPrice && detailOppositeNextDcaPrice > 0 && detailOppositeNextDcaNumber !== null\n      ? ['''
          new = '''    ...(detailOppositeNextDcaPrice && detailOppositeNextDcaPrice > 0 && detailOppositeNextDcaNumber !== null && !detailOppositeDcaTriggerCrossed\n      ? ['''
          if text.count(old) != 1:
              raise SystemExit('frontend opposite planned DCA anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''<strong>{detailNextDcaPrice && detailNextDcaNumber !== null ? `${money(detailNextDcaPrice)} · DCA ${Math.round(detailNextDcaNumber)}` : \"Geen volgende DCA beschikbaar\"}</strong>'''
          new = '''<strong>{detailNextDcaPrice && detailNextDcaNumber !== null ? `${money(detailNextDcaPrice)} · DCA ${Math.round(detailNextDcaNumber)}${detailDcaTriggerCrossed ? \" · BEREIKT\" : \"\"}` : \"Geen volgende DCA beschikbaar\"}</strong>'''
          if text.count(old) != 1:
              raise SystemExit('frontend main DCA summary anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''<strong>{detailOppositeNextDcaPrice && detailOppositeNextDcaNumber !== null ? `${money(detailOppositeNextDcaPrice)} · DCA ${Math.round(detailOppositeNextDcaNumber)}` : \"Geen volgende DCA beschikbaar\"}</strong>'''
          new = '''<strong>{detailOppositeNextDcaPrice && detailOppositeNextDcaNumber !== null ? `${money(detailOppositeNextDcaPrice)} · DCA ${Math.round(detailOppositeNextDcaNumber)}${detailOppositeDcaTriggerCrossed ? \" · BEREIKT\" : \"\"}` : \"Geen volgende DCA beschikbaar\"}</strong>'''
          if text.count(old) != 1:
              raise SystemExit('frontend opposite DCA summary anchor mismatch')
          text = text.replace(old, new, 1)
          frontend.write_text(text)
          PY

      - name: Safety regression checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile cloud_api/aster_multi_bb_core.py
          python - <<'PY'
          from pathlib import Path
          b = Path('cloud_api/aster_multi_bb_core.py').read_text()
          f = Path('web/components/aster-recent-trades.tsx').read_text()
          assert 'def _dca_due(' in b
          assert '"nextDcaDue": next_dca_due' in b
          assert 'next_trigger = fill_price *' in b
          assert 'nextDcaNumber": next_count + 1 if next_trigger else None' in b
          assert 'detailDcaTriggerCrossed' in f
          assert 'DCA bereikt · uitvoering wordt gecontroleerd' in f
          assert '&& !detailDcaTriggerCrossed' in f
          assert '&& !detailOppositeDcaTriggerCrossed' in f
          assert b.count('execute_leg_once(client, plan, side=PositionSide(side), action="OPEN", id_prefix=f"mbb-dca-') == 1
          PY
          node --test web/tests/dca-detail-reconciliation.test.mjs
          git diff --check

      - name: Commit tested production hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-dca-crossed-production-20260912.yml
          git config user.name 'TradeMentor Safety Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb_core.py web/components/aster-recent-trades.tsx .github/workflows/hotfix-dca-crossed-production-20260912.yml
          git commit -m 'Fix crossed DCA trigger state and display'
          git push origin HEAD:amar-crypto-bot-2026-cloud
