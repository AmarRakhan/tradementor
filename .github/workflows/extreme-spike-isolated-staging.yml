name: Extreme Spike isolated staging candidate
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STAGE_SPIKE_ONLY"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: extreme-spike-migration-staging
  cancel-in-progress: false
jobs:
  isolated-stage:
    if: github.ref == 'refs/heads/fix/extreme-spike-zone-regression-gate-20261013'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      PROJECT: tradementor-migration-20260812
      REGION: europe-west4
      SERVICE: tradementor-migration-api
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolated target
        run: |
          test "${{ inputs.confirmation }}" = "STAGE_SPIKE_ONLY"
          test "$PROJECT" = "tradementor-migration-20260812"
          test "$SERVICE" = "tradementor-migration-api"
          test "$GITHUB_REF" = "refs/heads/fix/extreme-spike-zone-regression-gate-20261013"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Spike gates
        run: |
          python -m pip install httpx
          PYTHONPATH=cloud_api python -m unittest -v \
            cloud_api.test_aster_extreme_spike_filter \
            cloud_api.test_aster_extreme_spike_config \
            cloud_api.test_aster_spike_real_scanner_dry_run \
            cloud_api.test_aster_spike_pre_mutation
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.MIGRATION_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MIGRATION_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify isolation before any build
        run: |
          test -n "${{ vars.MIGRATION_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ vars.MIGRATION_GCP_DEPLOY_SERVICE_ACCOUNT }}"
          gcloud config set project "$PROJECT"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/spike-service.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/spike-service.json'))
          container=data['spec']['template']['spec']['containers'][0]
          env={x['name']:x.get('value') for x in container.get('env',[])}
          assert env.get('GOOGLE_CLOUD_PROJECT')=='tradementor-migration-20260812'
          assert env.get('FIREBASE_AUTH_PROJECT_ID')=='tradementor-migration-20260812'
          for name in ('TRADEMENTOR_ALLOW_LIVE','ASTER_LIVE_EXECUTION_ENABLED','ASTER_STRATEGY2_LIVE_ENABLED'):
              assert env.get(name)=='false',name
          PY
      - name: Verify existing Cloud Build or submit asynchronously
        shell: bash
        run: |
          set -euo pipefail
          # A previous staging attempt created this build but could not stream logs.
          PREVIOUS_BUILD=6cf17786-3df1-47d8-a57b-77f55be4c6f4
          BUILD_ID=""
          if [ "$GITHUB_SHA" = "497bade7dd9fb81a77a611637f2a360c384634e7" ]; then
            PRIOR_STATUS="$(gcloud builds describe "$PREVIOUS_BUILD" --project="$PROJECT" --region="$REGION" --format='value(status)' 2>/dev/null || true)"
            if [ "$PRIOR_STATUS" = "SUCCESS" ]; then
              BUILD_ID="$PREVIOUS_BUILD"
              echo "Reusing already successful isolated Cloud Build $BUILD_ID"
            elif [ "$PRIOR_STATUS" = "WORKING" ] || [ "$PRIOR_STATUS" = "QUEUED" ] || [ "$PRIOR_STATUS" = "PENDING" ]; then
              BUILD_ID="$PREVIOUS_BUILD"
              echo "Waiting for previously started isolated Cloud Build $BUILD_ID"
            fi
          fi
          if [ -z "$BUILD_ID" ]; then
            gcloud builds submit cloud_api --project="$PROJECT" --region="$REGION" \
              --gcs-source-staging-dir "gs://run-sources-$PROJECT-$REGION/spike766-source" \
              --tag "$REGION-docker.pkg.dev/$PROJECT/tradementor/spike-staging:$GITHUB_SHA" \
              --async --format='value(id)' > /tmp/spike-build-id
            BUILD_ID="$(tr -d '\r\n' < /tmp/spike-build-id)"
            test -n "$BUILD_ID"
            echo "Submitted new isolated Cloud Build $BUILD_ID"
          fi
          for n in $(seq 1 90); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project="$PROJECT" --region="$REGION" --format='value(status)')"
            case "$STATUS" in
              SUCCESS) echo "Isolated Cloud Build succeeded: $BUILD_ID"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Isolated Cloud Build ended with $STATUS: $BUILD_ID"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Isolated Cloud Build timed out waiting for completion: $BUILD_ID"
          exit 1
      - name: Deploy zero-traffic candidate revision
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT/tradementor/spike-staging:$GITHUB_SHA" \
            --no-traffic --tag spike766 \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT,FIREBASE_PROJECT_ID=$PROJECT,FIREBASE_AUTH_PROJECT_ID=$PROJECT,TRADEMENTOR_ENV=staging,TRADEMENTOR_ENVIRONMENT=staging,TRADEMENTOR_ALLOW_LIVE=false,ASTER_LIVE_EXECUTION_ENABLED=false,ASTER_STRATEGY2_LIVE_ENABLED=false,ASTER_STRATEGY3_LIVE_ENABLED=false,MEXC_LIVE_EXECUTION_ENABLED=false" \
            --quiet
      - name: Confirm revision has no live traffic
        run: |
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='json(status.traffic)' > /tmp/spike-traffic.json
          python - <<'PY'
          import json
          entries=json.load(open('/tmp/spike-traffic.json')).get('status',{}).get('traffic',[])
          tagged=[x for x in entries if x.get('tag')=='spike766']
          assert tagged, "candidate tag missing"
          assert all(int(x.get('percent') or 0)==0 for x in tagged),"candidate received traffic"
          print("Isolated staging candidate deployed with zero normal service traffic")
          PY
