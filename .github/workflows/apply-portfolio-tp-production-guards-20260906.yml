name: Apply Portfolio TP production guards 2026-09-06

on:
  push:
    branches: [feature/portfolio-tp-mode-20260906]
    paths:
      - '.github/portfolio-tp-production-guards-20260906.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-tp-production-guards-20260906
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portfolio-tp-mode-20260906
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply state-preserving mode switch and stop guards
        run: python tools/patch_portfolio_tp_production_guards_20260906.py

      - name: Restore exact Portfolio Growth helpers if needed
        run: python tools/restore_portfolio_growth_helpers_20260906.py

      - name: Install backend test dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run Portfolio TP, race, and Portfolio Growth contract tests
        working-directory: cloud_api
        run: python -m pytest -q test_aster_portfolio_tp_mode.py test_aster_portfolio_tp_races.py test_portfolio_growth_route_contract.py

      - name: Verify production guard source contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('cloud_api/main.py').read_text()
          portfolio=Path('cloud_api/aster_multi_bb_portfolio.py').read_text()
          required=[
            'activeStatePreserved',
            'Multi DCA-instellingen live bijgewerkt; actieve positie-, DCA- en cycle-state behouden',
            'finishingPortfolioExit',
            'portfolio_exit_active',
            '_run_aster_strategy2_queue_scan(uid,maximum_orders=MAX_ORDERS_PER_ACCOUNT_SCAN)',
            'def _portfolio_growth_client',
            'def _portfolio_daily_growth',
            'def _portfolio_growth_estimate',
            '"PARTIAL_FAIL_CLOSED"',
          ]
          for item in required:
            assert item in main, item
          assert 'latest_mode != "PORTFOLIO"' in portfolio
          assert 'extra={**base_extra, "monitor": False}' in portfolio
          PY

      - name: Commit verified guards
        run: |
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/main.py cloud_api/aster_multi_bb_portfolio.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Restore Portfolio Growth helpers and keep TP race guards'
          git push origin HEAD:feature/portfolio-tp-mode-20260906
