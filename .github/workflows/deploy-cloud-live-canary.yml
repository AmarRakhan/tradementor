# Canary-only Aster service. Continuous live orders and every scheduler remain disabled.
name: Deploy Cloud Live Canary

on:
  workflow_dispatch:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - "cloud_api/**"
      - ".github/workflows/deploy-cloud-live-canary.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-cloud-live-canary
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-amar-20260813
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-live-canary-api
  FIREBASE_AUTH_PROJECT_ID: tradementor-production

jobs:
  test-and-deploy:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[strategy2-test-only]') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run backend tests
        working-directory: cloud_api
        run: pytest -q

      - name: Authenticate to isolated Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify immutable canary scope
        shell: bash
        run: |
          test "$GCP_PROJECT_ID" = "tradementor-amar-20260813"
          test "$FIREBASE_AUTH_PROJECT_ID" = "tradementor-production"
          test "$CLOUD_RUN_SERVICE" = "tradementor-live-canary-api"

      - name: Build and push canary container
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/live-canary-api:${GITHUB_SHA}"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy canary-only service
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,TRADEMENTOR_ENV=live-canary,TRADEMENTOR_ENVIRONMENT=live-canary,FIREBASE_AUTH_PROJECT_ID=$FIREBASE_AUTH_PROJECT_ID,TRADEMENTOR_ALLOW_LIVE=false,ASTER_LIVE_EXECUTION_ENABLED=false,ASTER_STRATEGY2_LIVE_ENABLED=false,ASTER_STRATEGY3_LIVE_ENABLED=false,ASTER_STRATEGY3_RUNTIME_ENABLED=false,ASTER_STRATEGY3_CANARY_ENABLED=true,MEXC_LIVE_EXECUTION_ENABLED=false,MEXC_AUTOMATION_EXECUTION_ENABLED=false" \
            --allow-unauthenticated

      - name: Verify deployed canary boundary
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          HEALTH="$(curl --fail --silent --show-error "$SERVICE_URL/health")"
          SERVICE_DESCRIPTION="$RUNNER_TEMP/live-canary-service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > "$SERVICE_DESCRIPTION"
          python - "$HEALTH" "$SERVICE_DESCRIPTION" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          service = json.load(open(sys.argv[2], encoding="utf-8"))
          variables = {
              item["name"]: item.get("value")
              for item in service["spec"]["template"]["spec"]["containers"][0]["env"]
          }
          assert health["environment"] == "live-canary"
          assert health["ordersEnabled"] is False
          assert health["dataProject"] == "tradementor-amar-20260813"
          assert health["identityProject"] == "tradementor-production"
          assert variables["ASTER_STRATEGY3_CANARY_ENABLED"] == "true"
          assert variables["TRADEMENTOR_ENVIRONMENT"] == "live-canary"
          assert variables["ASTER_STRATEGY3_RUNTIME_ENABLED"] == "false"
          assert variables["TRADEMENTOR_ALLOW_LIVE"] == "false"
          assert variables["ASTER_LIVE_EXECUTION_ENABLED"] == "false"
          assert variables["ASTER_STRATEGY2_LIVE_ENABLED"] == "false"
          assert variables["ASTER_STRATEGY3_LIVE_ENABLED"] == "false"
          assert variables["MEXC_LIVE_EXECUTION_ENABLED"] == "false"
          assert variables["MEXC_AUTOMATION_EXECUTION_ENABLED"] == "false"
          PY

      - name: Publish canary service URL
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)'
