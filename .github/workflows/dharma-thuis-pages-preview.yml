name: Dharma Thuis PWA Preview

on:
  push:
    branches:
      - dharma-thuis-pwa-preview
    paths:
      - 'dharma-thuis-pwa/**'
      - '.github/workflows/dharma-thuis-pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dharma-thuis-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Dharma Thuis site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dharma-thuis-pwa
      - name: Deploy Dharma Thuis
        id: deployment
        uses: actions/deploy-pages@v4
