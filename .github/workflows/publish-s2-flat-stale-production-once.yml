name: Publish S2 Flat Stale Ownership Production Once

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/publish-s2-flat-stale-production-once.yml]

permissions:
  contents: write
  id-token: write

concurrency:
  group: tradementor-production-backend
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - name: Verify one-shot scope and fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/amar-crypto-bot-2026-cloud"
          test "$GCP_PROJECT_ID" = "tradementor-production"
          test "$GCP_REGION" = "europe-west4"
          test "$CLOUD_RUN_SERVICE" = "tradementor-api"
          python - <<'PY'
          from pathlib import Path
          s=Path('cloud_api/aster_strategy2_runtime.py').read_text()
          assert 'if not active:\n        return [],[],[]' in s
          assert 'Historical/duplicate stale claims must not keep a' in s
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Regression check flat account
        working-directory: cloud_api
        run: |
          python - <<'PY'
          from aster_strategy2_runtime import transfer_active_ownership_to_strategy2
          from aster_strategy2_state import OwnedLeg
          leg=OwnedLeg(strategy_id='aster-strategy-2',engine_type='strategy2',symbol='BTCUSDT',side='LONG',cycle_id='old',config_version=1,quantity=1,weighted_entry=1)
          transferred,missing,errors=transfer_active_ownership_to_strategy2(positions=[],strategy2_legs=[leg,leg])
          assert transferred == [] and missing == [] and errors == []
          PY

      - name: Run all backend tests
        working-directory: cloud_api
        run: pytest -q

      - name: Authenticate production deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Capture production configuration
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          python - "$RUNNER_TEMP/service-before.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          service=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=service['spec']['template']['spec']
          env={x['name']:x.get('value') for x in spec['containers'][0].get('env',[])}
          assert env.get('ASTER_LIVE_EXECUTION_ENABLED') == 'true'
          assert env.get('ASTER_STRATEGY2_LIVE_ENABLED') == 'true'
          sa=spec.get('serviceAccountName'); url=service['status']['url']
          assert sa and url.startswith('https://')
          print(f'RUNTIME_SERVICE_ACCOUNT={sa}')
          print(f'SERVICE_URL={url}')
          PY

      - name: Build and push production image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/tradementor-api:s2-flat-${GITHUB_SHA}"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy candidate without traffic
        shell: bash
        run: |
          set -euo pipefail
          REVISION_SUFFIX="s2flat-${GITHUB_SHA:0:8}-${GITHUB_RUN_ATTEMPT}"
          TAG="s2flat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --revision-suffix "$REVISION_SUFFIX" --no-traffic --tag "$TAG"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service-candidate.json"
          python - "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-candidate.json" "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          before=json.load(open(sys.argv[1],encoding='utf-8')); after=json.load(open(sys.argv[2],encoding='utf-8')); tag=sys.argv[3]
          b=before['spec']['template']['spec']; a=after['spec']['template']['spec']
          assert b.get('serviceAccountName') == a.get('serviceAccountName')
          assert b.get('timeoutSeconds') == a.get('timeoutSeconds')
          assert b.get('containerConcurrency') == a.get('containerConcurrency')
          assert b['containers'][0].get('env',[]) == a['containers'][0].get('env',[])
          candidate=next(x for x in after['status']['traffic'] if x.get('tag') == tag)
          print(f'CANDIDATE_URL={candidate["url"]}')
          print(f'CANDIDATE_REVISION={candidate["revisionName"]}')
          PY

      - name: Verify candidate health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$CANDIDATE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1]); assert h['status']=='ready'; assert h['multiUser'] is True
          PY

      - name: Promote candidate to production
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$CANDIDATE_REVISION=100"
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$SERVICE_URL/health")"
          python - "$HEALTH" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1]); assert h['status']=='ready'; assert h['multiUser'] is True
          PY

      - name: Verify IAM unchanged
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/iam-after.json"
          python - "$RUNNER_TEMP/iam-before.json" "$RUNNER_TEMP/iam-after.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))
          PY

      - name: Record production verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .control-plane
          printf 'verifiedAt=%s\nsource=%s\nrevision=%s\nservice=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$CANDIDATE_REVISION" "$CLOUD_RUN_SERVICE" > .control-plane/s2-flat-production-verified.txt
          git config user.name "TradeMentor Control Plane"
          git config user.email "actions@users.noreply.github.com"
          git add .control-plane/s2-flat-production-verified.txt
          git commit -m "Verify S2 flat stale ownership production publish"
          git push origin HEAD:amar-crypto-bot-2026-cloud
