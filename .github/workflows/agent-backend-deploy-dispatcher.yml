name: Agent Backend Deploy Dispatcher

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: startsWith(github.event.issue.title, '[AGENT-CONTROL] deploy backend') && github.event.issue.user.login == 'AmarRakhan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: amar-crypto-bot-2026-cloud
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REQUEST_BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate requested production source
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(printf '%s\n' "$REQUEST_BODY" | sed -nE 's/^[[:space:]]*commit:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' | head -1 | tr 'A-F' 'a-f')"
          test "${#COMMIT}" -eq 40
          git init -q /tmp/source-check
          cd /tmp/source-check
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --filter=blob:none origin "$TARGET_BRANCH" "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" "FETCH_HEAD"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run full backend tests on exact production commit
        working-directory: cloud_api
        run: pytest -q

      - name: Dispatch hardened production backend workflow
        shell: bash
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloud-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f confirmation=DEPLOY_PRODUCTION_BACKEND \
            -f source_commit="$COMMIT" \
            -f request_issue="$ISSUE_NUMBER"

      - name: Confirm dispatch in request issue
        shell: bash
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Validated backend production deployment requested for `$COMMIT`. The hardened deployment workflow will post the final production revision or failure/rollback result back to this issue."

      - name: Report rejected deployment request
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Backend deployment request was **rejected before deployment**. Required conditions: requester must be AmarRakhan, the body must contain `commit: <40-char SHA>`, that SHA must be an ancestor of amar-crypto-bot-2026-cloud, and the dispatcher must successfully run the full backend test suite on that exact SHA before dispatch."
