name: Agent Backend Deploy Dispatcher

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: startsWith(github.event.issue.title, '[AGENT-CONTROL] deploy backend') && github.event.issue.user.login == 'AmarRakhan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: amar-crypto-bot-2026-cloud
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REQUEST_BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact tested production commit
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(printf '%s\n' "$REQUEST_BODY" | sed -nE 's/^[[:space:]]*commit:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' | head -1 | tr 'A-F' 'a-f')"
          test "${#COMMIT}" -eq 40

          BRANCH_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          test "$COMMIT" = "$BRANCH_HEAD"

          SUCCESS_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-backend-ci.yml/runs?branch=$TARGET_BRANCH&status=success&per_page=30" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$COMMIT\")] | length")"

          if [ "$SUCCESS_COUNT" -lt 1 ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "No successful Cloud Backend CI exists yet for exact head `$COMMIT`. Starting exact-head validation now."
            gh workflow run cloud-backend-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"

            CI_RESULT=""
            for _ in $(seq 1 40); do
              RUN_ROW="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-backend-ci.yml/runs?branch=$TARGET_BRANCH&per_page=30" \
                --jq "[.workflow_runs[] | select(.head_sha == \"$COMMIT\")] | sort_by(.created_at) | reverse | .[0] | if . == null then \"\" else [.id,.status,(.conclusion // \"\")] | @tsv end")"
              if [ -n "$RUN_ROW" ]; then
                RUN_STATUS="$(printf '%s' "$RUN_ROW" | cut -f2)"
                RUN_CONCLUSION="$(printf '%s' "$RUN_ROW" | cut -f3)"
                if [ "$RUN_STATUS" = "completed" ]; then
                  CI_RESULT="$RUN_CONCLUSION"
                  break
                fi
              fi
              sleep 10
            done
            test "$CI_RESULT" = "success"
          fi

          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          test "$CURRENT_HEAD" = "$COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Dispatch hardened production backend workflow
        shell: bash
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          test "$CURRENT_HEAD" = "$COMMIT"
          gh workflow run deploy-cloud-production.yml             --repo "$GITHUB_REPOSITORY"             --ref "$TARGET_BRANCH"             -f confirmation=DEPLOY_PRODUCTION_BACKEND             -f request_issue="$ISSUE_NUMBER"

      - name: Confirm dispatch in request issue
        shell: bash
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Validated backend production deployment requested for `$COMMIT`. The hardened deployment workflow will post the final production revision or failure/rollback result back to this issue."

      - name: Report rejected deployment request
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Backend deployment request was **rejected before deployment**. Required conditions: requester must be AmarRakhan, the body must contain `commit: <40-char SHA>`, that SHA must still be the exact head of `amar-crypto-bot-2026-cloud`, and Cloud Backend CI for that SHA must succeed (the dispatcher will start exact-head CI automatically when needed)."
