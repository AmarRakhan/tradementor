name: Verify hard global Zone Warriors cap 20261001

on:
  push:
    branches:
      - fix/hard-global-zone-cap-scanner-20261001
    paths:
      - "cloud_api/aster_multi_bb_core.py"
      - "cloud_api/test_aster_zone_soldiers_integration.py"
      - "cloud_api/test_strategy2_untracked_seat_refill_20260918.py"
      - ".github/workflows/verify-hard-global-zone-cap-20261001.yml"

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - run: pip install -q -r cloud_api/requirements.txt pytest
      - name: Compile changed runtime
        run: python -m py_compile cloud_api/aster_multi_bb_core.py
      - name: Run focused regressions
        working-directory: cloud_api
        run: pytest -q test_aster_zone_soldiers_integration.py test_strategy2_untracked_seat_refill_20260918.py test_aster_multi_bb.py
