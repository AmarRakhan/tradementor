name: Apply Focus V7 Net Green Release 20260830

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - .deploy/focus-v7-net-green-release-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt
      - name: Apply protected net-green release
        run: python tools/apply_focus_v7_net_green_release_20260830.py
      - name: Install test dependencies
        run: pip install -r cloud_api/requirements.txt pytest
      - name: Run focused Strategy 2 release tests
        run: |
          cd cloud_api
          pytest -q test_focus_v7_net_green_release.py test_focus_v7_emergency_equity_lock.py test_focus_portfolio_cycle_v7.py test_focus_simple_deterministic_flow.py test_aster_strategy2_focus_trailing.py
      - name: Run complete backend suite
        run: |
          cd cloud_api
          pytest -q
      - name: Commit verified release guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_api/aster_strategy2_focus_trailing.py cloud_api/test_focus_v7_net_green_release.py cloud_api/test_focus_v7_emergency_equity_lock.py cloud_api/test_focus_simple_deterministic_flow.py cloud_api/test_aster_strategy2_focus_trailing.py
          git commit -m 'Require net-green Strategy 2 hedge release'
          git push origin HEAD:amar-crypto-bot-2026-cloud
