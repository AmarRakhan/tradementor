name: Fix Snapshot profit source of truth

on:
  push:
    branches:
      - fix/snapshot-profit-source-of-truth-20260909-final

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger snapshot profit source-of-truth fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snapshot-profit-source-of-truth-20260909-final
          fetch-depth: 0

      - name: Apply source-of-truth fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one regex replacement, found {count}")
              p.write_text(updated)

          # 1. One canonical >= $0.50 selector/preview for Tradecentrum + Portfolio Snapshot.
          sub_once(
              "cloud_api/aster_profit_close.py",
              r'def profit_preview\(rows: Iterable\[dict\[str, Any\]\]\) -> dict\[str, Any\]:\n.*?\n\n\ndef strict_profit_preview',
              '''def profit_preview(rows: Iterable[dict[str, Any]]) -> dict[str, Any]:
              """Canonical Tradecentrum/Snapshot preview from one exchange-truth read."""
              materialized = list(rows)
              positions = profitable_positions(materialized)
              long_positions = [item for item in positions if item["side"] == "LONG"]
              short_positions = [item for item in positions if item["side"] == "SHORT"]

              def bucket(selected: list[dict[str, Any]]) -> dict[str, Any]:
                  return {
                      "eligible": selected,
                      "eligibleCount": len(selected),
                      "totalProfitUsd": round(sum(item["unrealizedPnl"] for item in selected), 8),
                  }

              return {
                  "eligible": positions,
                  "eligibleCount": len(positions),
                  "totalProfitUsd": round(sum(item["unrealizedPnl"] for item in positions), 8),
                  "minimumProfitUsd": MINIMUM_PROFIT_USD,
                  "comparison": "greater_than_or_equal",
                  "long": bucket(long_positions),
                  "short": bucket(short_positions),
                  "all": bucket(positions),
              }


          def strict_profit_preview''',
          )

          # 2. Extend the existing working close-profitable route with an optional side query.
          replace_once(
              "cloud_api/main.py",
              '''def close_profitable_aster_positions(
              request: AsterProfitableCloseRequest,
              user: dict[str, Any] = Depends(authenticated_user),
          ) -> dict[str, Any]:
              """Close only still-profitable Aster legs after explicit user confirmation."""
              if not request.confirm:''',
              '''def close_profitable_aster_positions(
              request: AsterProfitableCloseRequest,
              side: str = "ALL",
              user: dict[str, Any] = Depends(authenticated_user),
          ) -> dict[str, Any]:
              """Close only still-profitable Aster legs after explicit user confirmation."""
              scope = str(side).upper().strip()
              if scope not in {"ALL", "LONG", "SHORT"}:
                  raise HTTPException(422, "Profit close scope moet ALL, LONG of SHORT zijn")
              if not request.confirm:''',
          )
          replace_once(
              "cloud_api/main.py",
              '    action_hash = hashlib.sha256(f"{uid}:{request.idempotency_key}".encode()).hexdigest()\n',
              '    action_hash = hashlib.sha256(f"{uid}:{scope}:{request.idempotency_key}".encode()).hexdigest()\n',
          )
          replace_once(
              "cloud_api/main.py",
              '            "uid": uid, "status": "prepared", "minimumProfitUsd": MINIMUM_PROFIT_USD,\n',
              '            "uid": uid, "scope": scope, "status": "prepared", "minimumProfitUsd": MINIMUM_PROFIT_USD,\n',
          )
          replace_once(
              "cloud_api/main.py",
              '        initial = profitable_positions(client.position_risk())\n        for index, candidate in enumerate(initial, 1):\n',
              '        initial = profitable_positions(client.position_risk())\n        if scope != "ALL":\n            initial = [candidate for candidate in initial if candidate["side"] == scope]\n        for index, candidate in enumerate(initial, 1):\n',
          )
          replace_once(
              "cloud_api/main.py",
              '        result = {\n            "closedCount": len(closed), "skippedCount": len(skipped), "failedCount": len(failed),\n',
              '        result = {\n            "scope": scope,\n            "closedCount": len(closed), "skippedCount": len(skipped), "failedCount": len(failed),\n',
          )
          replace_once(
              "cloud_api/main.py",
              '            "event": "BULK_PROFIT_CLOSE_COMPLETED", "uid": uid, "actionId": action_hash,\n',
              '            "event": "BULK_PROFIT_CLOSE_COMPLETED", "uid": uid, "scope": scope, "actionId": action_hash,\n',
          )

          # 3. Point the Snapshot buttons at the proven Tradecentrum preview/close routes.
          component = "web/components/aster-portfolio-snapshot-enhancer.tsx"
          replace_once(component, '  comparison: "strictly_greater_than";\n', '  comparison: "greater_than_or_equal";\n')
          replace_once(component, 'authenticatedRequest("/api/exchanges/aster/positions/snapshot-profit-close-preview", { cache: "no-store" })', 'authenticatedRequest("/api/exchanges/aster/positions/profitable-close-preview", { cache: "no-store" })')
          replace_once(component, 'payload?.comparison === "strictly_greater_than"', 'payload?.comparison === "greater_than_or_equal"')
          replace_once(component, 'Alleen posities die bij de servercontrole nog steeds meer dan US$ 0,50 winst hebben worden gesloten. Doorgaan?', 'Alleen posities die bij de servercontrole nog steeds minimaal US$ 0,50 winst hebben worden gesloten. Doorgaan?')
          replace_once(component, 'await authenticatedRequest("/api/exchanges/aster/positions/snapshot-close-profitable", {', 'await authenticatedRequest(`/api/exchanges/aster/positions/close-profitable?side=${scope}`, {')
          replace_once(component, '          side: scope,\n', '')

          # 4. Update the regression contract to require the shared routes and inclusive threshold.
          test_file = "web/tests/aster-compact-portfolio-snapshot.test.mjs"
          p = Path(test_file)
          text = p.read_text()
          text = text.replace("snapshot-profit-close-preview", "profitable-close-preview")
          text = text.replace("snapshot-close-profitable", "close-profitable")
          text = text.replace('comparison: "strictly_greater_than"', 'comparison: "greater_than_or_equal"')
          if "snapshot-profit-close-preview" in text or "snapshot-close-profitable" in text or "strictly_greater_than" in text:
              raise SystemExit("Snapshot test still references the deprecated parallel profit pipeline")
          p.write_text(text)

          contract = Path("cloud_api/test_aster_profit_close_contract.py")
          contract_text = contract.read_text()
          marker = '''def test_bulk_close_is_sequential_and_holds_strategy_queue_lease():\n'''
          addition = '''def test_bulk_close_supports_long_short_all_from_the_same_route():\n    route = route_source()\n    assert 'side: str = "ALL"' in route\n    assert 'scope not in {"ALL", "LONG", "SHORT"}' in route\n    assert 'candidate["side"] == scope' in route\n    assert 'f"{uid}:{scope}:{request.idempotency_key}"' in route\n\n\n'''
          if addition not in contract_text:
              if marker not in contract_text:
                  raise SystemExit("Cloud contract insertion marker missing")
              contract.write_text(contract_text.replace(marker, addition + marker, 1))
          PY

      - name: Verify backend selector and syntax
        shell: bash
        run: |
          python -m py_compile cloud_api/main.py cloud_api/aster_profit_close.py
          PYTHONPATH=cloud_api python - <<'PY'
          from aster_profit_close import profit_preview

          rows = [
              {"symbol":"LITUSDT","positionSide":"LONG","positionAmt":"1","markPrice":"1","unRealizedProfit":"1.16"},
              {"symbol":"UNIUSDT","positionSide":"LONG","positionAmt":"1","markPrice":"1","unRealizedProfit":"0.98"},
              {"symbol":"WLDUSDT","positionSide":"SHORT","positionAmt":"-1","markPrice":"1","unRealizedProfit":"1.51"},
              {"symbol":"ICPUSDT","positionSide":"SHORT","positionAmt":"-1","markPrice":"1","unRealizedProfit":"0.62"},
              {"symbol":"TRUMPUSDT","positionSide":"SHORT","positionAmt":"-1","markPrice":"1","unRealizedProfit":"0.60"},
              {"symbol":"ARBUSD","positionSide":"SHORT","positionAmt":"-1","markPrice":"1","unRealizedProfit":"0.48"},
          ]
          preview = profit_preview(rows)
          assert preview["comparison"] == "greater_than_or_equal"
          assert preview["long"]["eligibleCount"] == 2
          assert abs(preview["long"]["totalProfitUsd"] - 2.14) < 1e-9
          assert preview["short"]["eligibleCount"] == 3
          assert abs(preview["short"]["totalProfitUsd"] - 2.73) < 1e-9
          assert preview["all"]["eligibleCount"] == 5
          assert abs(preview["all"]["totalProfitUsd"] - 4.87) < 1e-9
          PY

      - name: Verify frontend contracts
        working-directory: web
        shell: bash
        run: |
          node --test tests/aster-close-profitable.test.mjs tests/aster-compact-portfolio-snapshot.test.mjs

      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "Amar Crypto Bot Fix"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_api/main.py cloud_api/aster_profit_close.py cloud_api/test_aster_profit_close_contract.py web/components/aster-portfolio-snapshot-enhancer.tsx web/tests/aster-compact-portfolio-snapshot.test.mjs
          git diff --cached --check
          git commit -m "Unify Snapshot profit actions with Tradecentrum"
          git push origin HEAD:fix/snapshot-profit-source-of-truth-20260909-final
