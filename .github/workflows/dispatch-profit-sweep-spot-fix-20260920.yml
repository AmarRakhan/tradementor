    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/dispatch-profit-sweep-spot-fix-20260920.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-production:
    if: github.event.head_commit.message == 'Dispatch Profit Sweep idempotent recovery production'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production backend workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: 1de810af01c47f31fc5cc294d50e585aaed49bfb
        run: |
          set -euo pipefail
          gh workflow run deploy-cloud-production.yml \
            --repo "$GITHUB_REPOSITORY" \
