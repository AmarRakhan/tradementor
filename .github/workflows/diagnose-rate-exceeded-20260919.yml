name: Diagnose production rate exceeded 2026-09-19

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-rate-exceeded-20260919.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Read production services and live responses
        shell: bash
        run: |
          set -u
          for SERVICE in tradementor-api amar-bot-v44-direct-install; do
            echo "=== SERVICE $SERVICE ==="
            gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/$SERVICE.json"
            python - "/tmp/$SERVICE.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=s.get('spec',{}).get('template',{}).get('spec',{})
          meta=s.get('spec',{}).get('template',{}).get('metadata',{})
          ann=meta.get('annotations',{}) or {}
          containers=spec.get('containers',[]) or [{}]
          c=containers[0]
          print('url=',s.get('status',{}).get('url'))
          print('latestReadyRevision=',s.get('status',{}).get('latestReadyRevisionName'))
          print('latestCreatedRevision=',s.get('status',{}).get('latestCreatedRevisionName'))
          print('containerConcurrency=',spec.get('containerConcurrency'))
          print('timeoutSeconds=',spec.get('timeoutSeconds'))
          print('minScale=',ann.get('autoscaling.knative.dev/minScale'))
          print('maxScale=',ann.get('autoscaling.knative.dev/maxScale'))
          print('cpuThrottling=',ann.get('run.googleapis.com/cpu-throttling'))
          print('resources=',c.get('resources'))
          print('traffic=',[(x.get('revisionName'),x.get('percent'),x.get('tag')) for x in s.get('status',{}).get('traffic',[]) if x.get('percent')])
          PY
            URL="$(python - "/tmp/$SERVICE.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('status',{}).get('url',''))
          PY
          )"
            if [ "$SERVICE" = "tradementor-api" ]; then PATHNAME="/health"; else PATHNAME="/"; fi
            echo "=== HTTP $URL$PATHNAME ==="
            curl -sS -D "/tmp/$SERVICE.headers" -o "/tmp/$SERVICE.body" --max-time 20 "$URL$PATHNAME" || true
            head -30 "/tmp/$SERVICE.headers" || true
            echo "--- BODY ---"
            head -c 1000 "/tmp/$SERVICE.body" || true
            echo
          done

      - name: Read recent Cloud Run 429 and 5xx logs
        shell: bash
        run: |
          set -u
          for SERVICE in tradementor-api amar-bot-v44-direct-install; do
            echo "=== $SERVICE 429 LOGS ==="
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND httpRequest.status=429" --project "$GCP_PROJECT_ID" --freshness=2h --limit=100 --format=json > "/tmp/$SERVICE-429.json" || true
            python - "/tmp/$SERVICE-429.json" <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: rows=[]
          print('count=',len(rows))
          for x in rows[:30]:
              h=x.get('httpRequest',{}) or {}
              print(x.get('timestamp'), h.get('status'), h.get('requestMethod'), h.get('requestUrl'), 'latency=',h.get('latency'), 'revision=',x.get('resource',{}).get('labels',{}).get('revision_name'), 'text=',x.get('textPayload') or (x.get('jsonPayload') or {}).get('message'))
          PY
            echo "=== $SERVICE 5XX LOGS ==="
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND httpRequest.status>=500" --project "$GCP_PROJECT_ID" --freshness=2h --limit=60 --format=json > "/tmp/$SERVICE-5xx.json" || true
            python - "/tmp/$SERVICE-5xx.json" <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: rows=[]
          print('count=',len(rows))
          for x in rows[:20]:
              h=x.get('httpRequest',{}) or {}
              print(x.get('timestamp'), h.get('status'), h.get('requestUrl'), 'revision=',x.get('resource',{}).get('labels',{}).get('revision_name'))
          PY
          done

      - name: Read all Cloud Run service capacity
        shell: bash
        run: |
          set -u
          gcloud run services list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/all-run-services.json
          python - /tmp/all-run-services.json <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding='utf-8'))
          print('serviceCount=',len(rows))
          for s in rows:
              spec=s.get('spec',{}).get('template',{}).get('spec',{})
              meta=s.get('spec',{}).get('template',{}).get('metadata',{})
              ann=meta.get('annotations',{}) or {}
              c=(spec.get('containers') or [{}])[0]
              limits=(c.get('resources') or {}).get('limits',{})
              traffic=[(x.get('revisionName'),x.get('percent')) for x in s.get('status',{}).get('traffic',[]) if x.get('percent')]
              print(s.get('metadata',{}).get('name'),
                    'conc=',spec.get('containerConcurrency'),
                    'min=',ann.get('autoscaling.knative.dev/minScale'),
                    'max=',ann.get('autoscaling.knative.dev/maxScale'),
                    'cpu=',limits.get('cpu'),'mem=',limits.get('memory'),
                    'traffic=',traffic)
          PY

      - name: Probe max-5 backend candidate directly
        shell: bash
        run: |
          set -u
          URL="https://capfix-api-35422507387-1---tradementor-api-cyyaq5otyq-ez.a.run.app/health"
          echo "=== MAX5 CANDIDATE ==="
          for i in 1 2 3; do
            CODE="$(curl -sS -o /tmp/max5-body -w '%{http_code}' --max-time 20 "$URL" || true)"
            echo "attempt=$i code=$CODE body=$(head -c 300 /tmp/max5-body || true)"
            sleep 2
          done

      - name: Verify exact live revision images and scheduler
        shell: bash
        run: |
          set -u
          for SERVICE in tradementor-api amar-bot-v44-direct-install; do
            REV="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | python -c 'import json,sys; s=json.load(sys.stdin); print(next(x["revisionName"] for x in s["status"]["traffic"] if int(x.get("percent",0) or 0)==100))')"
            echo "=== LIVE REVISION $SERVICE $REV ==="
            gcloud run revisions describe "$REV" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/$SERVICE-live-rev.json"
            python - "/tmp/$SERVICE-live-rev.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=r.get('spec',{})
          c=(spec.get('containers') or [{}])[0]
          env={x.get('name'):x.get('value') for x in c.get('env',[]) if x.get('name') in {'TRADEMENTOR_SOURCE_COMMIT','TRADEMENTOR_IMAGE_SOURCE_COMMIT','ASTER_LIVE_EXECUTION_ENABLED','ASTER_STRATEGY2_LIVE_ENABLED','ASTER_REALTIME_WORKER','ASTER_REALTIME_EXECUTION_ENABLED'}}
          print('image=',c.get('image'))
          print('env=',env)
          print('concurrency=',spec.get('containerConcurrency'))
          print('serviceAccount=',spec.get('serviceAccountName'))
          PY
          done
          echo '=== SCHEDULER ==='
          gcloud scheduler jobs describe tradementor-aster-automation-tick --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json > /tmp/scheduler.json || true
          python - /tmp/scheduler.json <<'PY'
          import json,sys
          try:s=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:s={}
          print('state=',s.get('state'))
          print('schedule=',s.get('schedule'))
          print('lastAttemptTime=',s.get('lastAttemptTime'))
          print('status=',s.get('status'))
          print('uri=',(s.get('httpTarget') or {}).get('uri'))
          PY

      - name: Read costly legacy inventory
        shell: bash
        run: |
          set -u
          echo '=== APP ENGINE SERVICES ==='
          gcloud app services list --project "$GCP_PROJECT_ID" --format=json > /tmp/app-services.json || true
          python - /tmp/app-services.json <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: rows=[]
          print('count=',len(rows))
          for x in rows: print(x.get('id'),x.get('split'))
          PY
          echo '=== APP ENGINE VERSIONS ==='
          gcloud app versions list --project "$GCP_PROJECT_ID" --format=json > /tmp/app-versions.json || true
          python - /tmp/app-versions.json <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: rows=[]
          print('count=',len(rows))
          for x in rows[:50]:
              print(x.get('service'),x.get('id'),x.get('servingStatus'),x.get('instanceClass'),x.get('trafficSplit'),x.get('lastDeployedTime'))
          PY
          echo '=== WORKSTATION CLUSTERS ==='
          gcloud workstations clusters list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/ws-clusters.json || true
          python - /tmp/ws-clusters.json <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: rows=[]
          print('count=',len(rows))
          for x in rows: print(x.get('name'),x.get('state'),x.get('createTime'))
          PY


# diagnostic pass 3 marker

# live revision verification
