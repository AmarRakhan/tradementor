name: Dynamic Hedge + Liquidation Safety CI 2026-09-10

on:
  push:
    branches: [feature/dynamic-hedge-liquidation-safety-20260910]
    paths:
      - '.github/dynamic-hedge-liquidation-safety-20260910.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-hedge-liquidation-safety-20260910
  cancel-in-progress: false

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-hedge-liquidation-safety-20260910
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded Dynamic Hedge integrations
        run: |
          python tools/apply_dynamic_hedge_execution_hardening_20260910.py
          python tools/apply_dynamic_hedge_multi_bb_ownership_20260910.py
          if grep -q 'run_dynamic_hedge_sequence(' cloud_api/main.py \
             && grep -q 'begin_manual_action(dynamic_hedge_ref, request.side, live_rows)' cloud_api/main.py \
             && grep -q 'begin_manual_action(dynamic_hedge_ref, "ALL", client.position_risk())' cloud_api/main.py \
             && grep -q 'install_aster_dynamic_hedge_routes(' cloud_api/main.py; then
            echo 'Dynamic Hedge main.py integration already present after production sync; do not inject it twice.'
          else
            python tools/apply_dynamic_hedge_liquidation_safety_20260910.py
          fi
          python tools/apply_dynamic_hedge_fast_sequence_20260910.py

      - name: Install backend dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run Dynamic Hedge, fast sequence, close-isolation, read-only verification and scenario tests
        working-directory: cloud_api
        run: >-
          python -m pytest -q
          test_aster_dynamic_hedge.py
          test_aster_dynamic_hedge_api.py
          test_aster_dynamic_hedge_manual.py
          test_aster_dynamic_hedge_verify.py
          test_aster_dynamic_hedge_execution.py
          test_aster_dynamic_hedge_execution_hardening.py
          test_aster_dynamic_hedge_sequence.py
          test_aster_dynamic_hedge_multi_bb_ownership.py
          test_dynamic_hedge_scenario_matrix_20260910.py
          test_dynamic_hedge_main_integration_20260910.py
          test_aster_cross_risk.py
          test_aster_profit_close.py
          test_aster_profit_close_contract.py
          test_aster_manual_close_contract.py
          test_same_symbol_dual_side_20260906.py
          test_focus_manual_hedge_close_reconcile.py
          test_aster_gateway.py
          test_aster_execution.py
          test_aster_multi_bb.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run existing Portfolio Snapshot contracts
        working-directory: web
        run: |
          test -f tests/portfolio-snapshot-close-profit.test.mjs && node --experimental-strip-types --test tests/portfolio-snapshot-close-profit.test.mjs || true
          test -f tests/aster-profit-close-route.test.mjs && node --experimental-strip-types --test tests/aster-profit-close-route.test.mjs || true

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Commit generated integrations only after all tests pass
        run: |
          git config user.name 'TradeMentor Safety Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/main.py cloud_api/aster_multi_bb.py cloud_api/aster_dynamic_hedge_execution.py
          if git diff --cached --quiet; then
            echo 'No generated integration changes to commit.'
            exit 0
          fi
          git commit -m 'Wire fast Dynamic Hedge sequence and safety ownership'
          git push origin HEAD:feature/dynamic-hedge-liquidation-safety-20260910
