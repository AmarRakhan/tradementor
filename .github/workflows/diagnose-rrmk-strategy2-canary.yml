name: Diagnose rrmk stuck Strategy 2 canary read-only
on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [".github/workflows/diagnose-rrmk-strategy2-canary.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL: rrmk18@outlook.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read canary and authoritative Aster evidence
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-canary-diag-${GITHUB_RUN_ID: -6}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          readarray -t VALUES < <(python - "$SERVICE_JSON" <<'PY'
          import json,sys
          spec=json.load(open(sys.argv[1]))["spec"]["template"]["spec"]
          print(spec["containers"][0]["image"])
          print(spec["serviceAccountName"])
          PY
          )
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore
          from main import load_aster_secret,local_eip712_signer
          from aster_gateway import AsterV3Client

          app=firebase_admin.initialize_app(options={"projectId":"tradementor-production"},name="rrmk-canary-diag")
          user=auth.get_user_by_email(os.environ["TARGET_EMAIL"],app=app)
          db=firestore.Client(project="tradementor-amar-20260813")
          ref=db.collection("asterStrategy2").document(user.uid)
          strategy=ref.get().to_dict() or {}
          canary=ref.collection("canaries").document("open-fill-close-v1").get().to_dict() or {}
          symbol=str(canary.get("symbol","")).upper()
          prefix=str(canary.get("intentPrefix",""))
          started=canary.get("startedAt")
          if not symbol or not prefix or not isinstance(started,datetime):
              raise SystemExit("DIAG_BLOCKED_INCOMPLETE_CANARY_IDENTITY")
          started=started.replace(tzinfo=timezone.utc) if started.tzinfo is None else started.astimezone(timezone.utc)
          secret=load_aster_secret({"uid":user.uid})
          client=AsterV3Client(signer_address=secret.signer_address,sign_message=local_eip712_signer(secret),live_authorized=False)
          begin=int((started-timedelta(minutes=10)).timestamp()*1000)
          positions=client.position_risk(symbol)
          open_orders=client.open_orders(symbol)
          orders=client.all_orders(symbol,start_time=begin,limit=1000)
          fills=client.user_trades(symbol,start_time=begin,limit=1000)
          def cid(x): return str(x.get("clientOrderId",x.get("origClientOrderId","")))
          def pick(x,fields): return {k:x.get(k) for k in fields if k in x}
          pos_fields=["symbol","positionSide","positionAmt","entryPrice","markPrice","unRealizedProfit","liquidationPrice","leverage","updateTime"]
          ord_fields=["symbol","side","positionSide","status","type","origQty","executedQty","avgPrice","price","reduceOnly","closePosition","orderId","clientOrderId","origClientOrderId","time","updateTime"]
          fill_fields=["symbol","side","positionSide","qty","price","quoteQty","commission","commissionAsset","realizedPnl","orderId","clientOrderId","origClientOrderId","time"]
          out={
            "readOnly":True,"ordersSent":0,"stateWrites":0,
            "canary":{"status":str(canary.get("status","")).upper(),"symbol":symbol,"intentPrefix":prefix,"startedAt":started.isoformat()},
            "strategy":{"canaryValidated":bool(strategy.get("canaryValidated",False)),"liveReady":bool(strategy.get("liveReady",False)),"enabled":bool(strategy.get("enabled",False)),"monitor":bool(strategy.get("monitor",False)),"phase":str(strategy.get("phase","")),"lastReason":str(strategy.get("lastReason",""))},
            "aster":{"activePositions":[pick(x,pos_fields) for x in positions if abs(float(x.get("positionAmt") or 0))>0],"openOrders":[pick(x,ord_fields) for x in open_orders],"matchingOrders":[pick(x,ord_fields) for x in orders if cid(x).startswith(prefix)],"matchingFills":[pick(x,fill_fields) for x in fills if cid(x).startswith(prefix)],"recentOrders":[pick(x,ord_fields) for x in orders[-20:]],"recentFills":[pick(x,fill_fields) for x in fills[-20:]]}
          }
          print("CANARY_DIAG "+json.dumps(out,separators=(",",":"),default=str))
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "${VALUES[0]}" --service-account "${VALUES[1]}" --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))" --set-env-vars "TARGET_EMAIL=$TARGET_EMAIL,GOOGLE_CLOUD_QUOTA_PROJECT=tradementor-production,GOOGLE_CLOUD_PROJECT=tradementor-amar-20260813" --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"CANARY_DIAG \"" --project "$GCP_PROJECT_ID" --freshness 30m --limit 5 --order desc --format='value(textPayload)'
