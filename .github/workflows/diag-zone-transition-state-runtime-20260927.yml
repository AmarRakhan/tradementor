name: Diagnose zone transition state runtime 2026-09-27

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - ".github/workflows/diag-zone-transition-state-runtime-20260927.yml"

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  OBSERVER_SERVICE_ACCOUNT: github-tradementor-observer@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run read-only zone-state probe
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t V < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));sp=s['spec']['template']['spec'];print(sp['containers'][0]['image']);print(sp['serviceAccountName'])
          PY
          )
          JOB="tm-zonestate-${GITHUB_RUN_ID: -7}";MARKER="ZONESTATE_${GITHUB_RUN_ID}"
          echo "DIAG_JOB=$JOB" >> "$GITHUB_ENV";echo "DIAG_MARKER=$MARKER" >> "$GITHUB_ENV"
          SCRIPT="$(base64 -w0 <<'PY'
          import json,os
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from google.cloud import firestore
          import main

          db=firestore.Client(project='tradementor-production')
          owner=db.collection('systemConfiguration').document('continuityDashboardV1').get().to_dict() or {}
          uid=str(owner.get('ownerUid') or '').strip()
          state=main.aster_strategy2_reference(uid).get().to_dict() or {}
          z=state.get('zoneSoldierState') if isinstance(state.get('zoneSoldierState'),dict) else {}
          pools=z.get('pools') if isinstance(z.get('pools'),dict) else {}
          def local(ms):
              if not ms:return None
              return datetime.fromtimestamp(int(ms)/1000,timezone.utc).astimezone(ZoneInfo('Europe/Amsterdam')).isoformat()
          out={
            'activeZone':z.get('activeZone'),
            'previousZone':z.get('previousZone'),
            'activatedAtMs':z.get('activatedAtMs'),
            'activatedAtLocal':local(z.get('activatedAtMs')),
            'lastConfirmedZoneTransition':z.get('lastConfirmedZoneTransition'),
            'pools':{str(k):{
              'zone':v.get('zone'),
              'activationCount':v.get('activationCount'),
              'lastActivatedAtMs':v.get('lastActivatedAtMs'),
              'lastActivatedAtLocal':local(v.get('lastActivatedAtMs')),
            } for k,v in pools.items() if isinstance(v,dict)}
          }
          print(os.environ['MARKER']+'='+json.dumps(out,separators=(',',':'),sort_keys=True,default=str),flush=True)
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "${V[0]}" --service-account "${V[1]}" --set-env-vars "MARKER=$MARKER" --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT'))" --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}
      - name: Collect and publish
        shell: bash
        run: |
          set -euo pipefail
          for N in $(seq 1 15); do
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\"" --project "$GCP_PROJECT_ID" --freshness=15m --limit=100 --order=desc --format=json > "$RUNNER_TEMP/logs.json"
            python - "$DIAG_MARKER" "$RUNNER_TEMP/logs.json" > "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          m=sys.argv[1]+'=';rows=json.load(open(sys.argv[2],encoding='utf-8'))
          def walk(x):
              if isinstance(x,str):yield x
              elif isinstance(x,dict):
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          for row in rows:
              for s in walk(row):
                  if m in s:
                      raw=s[s.index(m)+len(m):].splitlines()[0];json.loads(raw);print(raw);raise SystemExit
          PY
            [ -s "$RUNNER_TEMP/result.json" ] && break
            sleep 2
          done
          test -s "$RUNNER_TEMP/result.json"
          mkdir -p .diagnostics
          cp "$RUNNER_TEMP/result.json" .diagnostics/zone-transition-state-runtime-20260927.json
          git config user.name "TradeMentor Diagnostics";git config user.email "actions@users.noreply.github.com"
          git add .diagnostics/zone-transition-state-runtime-20260927.json
          git diff --cached --quiet && exit 0
          git commit -m "Record zone transition state runtime diagnostic"
          git push origin HEAD:amar-crypto-bot-2026-cloud
      - uses: google-github-actions/auth@v2
        if: always()
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${DIAG_JOB:-}" ]; then gcloud run jobs delete "$DIAG_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true; fi
