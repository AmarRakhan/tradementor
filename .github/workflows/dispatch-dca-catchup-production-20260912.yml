name: Dispatch verified DCA catch-up production 2026-09-12

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/dispatch-dca-catchup-production-20260912.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
      - name: Verify catch-up engine is present
        run: |
          grep -F 'def _missed_dca_levels' cloud_api/aster_multi_bb_core.py
          grep -F 'dcaCatchupTargetCount' cloud_api/aster_multi_bb_core.py
      - name: Dispatch production backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloud-production.yml --repo AmarRakhan/tradementor --ref amar-crypto-bot-2026-cloud -f confirmation=DEPLOY_PRODUCTION_BACKEND
      - name: Remove one-shot dispatcher
        run: |
          rm -f .github/workflows/dispatch-dca-catchup-production-20260912.yml
          git config user.name 'TradeMentor Safety Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/dispatch-dca-catchup-production-20260912.yml
          git commit -m 'Remove DCA catch-up production dispatcher'
          git push origin HEAD:amar-crypto-bot-2026-cloud
