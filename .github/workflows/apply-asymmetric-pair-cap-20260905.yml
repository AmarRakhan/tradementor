name: Apply asymmetric pair cap repair 2026-09-05

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/asymmetric-pair-cap-20260905.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asymmetric-pair-cap-20260905
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply pair-cycle capacity repair
        run: python tools/apply_asymmetric_pair_cap_20260905.py

      - name: Install backend test dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q cloud_api

      - name: Run asymmetric pair-cap and Multi DCA regressions
        working-directory: cloud_api
        run: python -m pytest -q test_asymmetric_hedge_20260904.py test_aster_multi_bb.py

      - name: Commit verified repair
        run: |
          git config user.name 'TradeMentor Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud_api/aster_multi_bb.py cloud_api/test_asymmetric_hedge_20260904.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Fix asymmetric linked pair capacity refill'
          git push origin HEAD:amar-crypto-bot-2026-cloud
