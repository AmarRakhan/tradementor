name: Inspect ZEC public capacity payload 2026-09-17

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-zec-public-capacity-payload-20260917.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import json,urllib.request
          url='https://fapi.asterdex.com/fapi/v1/remainingOpenableNotionalValue?symbol=ZECUSDT&leverage=75'
          req=urllib.request.Request(url,headers={'User-Agent':'TradeMentor-diagnostic/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              payload=json.load(r)
          print(json.dumps(payload,sort_keys=True))
          PY
