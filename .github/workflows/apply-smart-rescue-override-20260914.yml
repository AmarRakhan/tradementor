name: Apply Smart Rescue Override 20260914

on:
  push:
    branches:
      - agent/smart-rescue-override-20260914
    paths:
      - ".github/workflows/apply-smart-rescue-override-20260914.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/smart-rescue-override-20260914
          fetch-depth: 0

      - name: Apply integration patch
        run: python tools/apply_smart_rescue_override.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r cloud_api/requirements.txt pytest

      - name: Run Smart Rescue override tests
        working-directory: cloud_api
        run: pytest -q test_aster_smart_rescue_override.py test_aster_smart_rescue_override_routes.py test_aster_smart_rescue.py test_aster_smart_rescue_simulation.py

      - name: Compile backend
        run: python -m py_compile cloud_api/main.py cloud_api/aster_smart_rescue_override.py

      - name: Run full backend suite
        working-directory: cloud_api
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build and run full web suite
        working-directory: web
        run: npm test

      - name: Commit verified implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch changes"
            exit 0
          fi
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_api/main.py web/components/aster-pair-settings-overlay.tsx
          git commit -m "Integrate Smart Rescue active-cycle override"
          git push origin HEAD:agent/smart-rescue-override-20260914

# Revalidated with hermetic route contract tests; no ADC required.
