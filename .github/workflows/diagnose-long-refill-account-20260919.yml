name: Diagnose LONG refill account state 2026-09-19

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-long-refill-account-20260919.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-long-refill-account-readonly
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Read runtime identity and current account state
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t VALUES < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=s['spec']['template']['spec']
          print(s['status']['url'])
          print(spec['containers'][0]['image'])
          print(spec['serviceAccountName'])
          live=[x for x in s['status'].get('traffic',[]) if int(x.get('percent',0) or 0)==100]
          print(live[0]['revisionName'] if len(live)==1 else '')
          PY
          )
          SERVICE_URL="${VALUES[0]}"; IMAGE="${VALUES[1]}"; RUNTIME_SA="${VALUES[2]}"; LIVE_REVISION="${VALUES[3]}"
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$SERVICE_URL/health")"
          python - "$HEALTH" "$LIVE_REVISION" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1])
          print("LONG_REFILL_RUNTIME",json.dumps({
              "liveRevision":sys.argv[2],
              "sourceCommit":h.get("sourceCommit"),
              "imageSourceCommit":h.get("imageSourceCommit"),
              "status":h.get("status"),
          },sort_keys=True))
          PY

          JOB="tm-longrefill-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,os
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore

          project='tradementor-production'
          target_digest='b4dfb7301bb40602e4b2225367437495652a360f6d4a071b8851c6324a82556d'
          idx=int(os.environ['CLOUD_RUN_TASK_INDEX'])
          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={'projectId':project})
          db=firestore.Client(project=project)

          uid=None
          page=auth.list_users()
          while page and uid is None:
              for u in page.users:
                  normalized=str(u.email or '').strip().lower()
                  if normalized and hashlib.sha256(normalized.encode()).hexdigest()==target_digest:
                      uid=u.uid
                      break
              if uid is None:
                  page=page.get_next_page()
          if not uid:
              raise SystemExit(1)

          raw=(db.collection('asterStrategy2').document(uid).get().to_dict() or {})
          settings=raw.get('settings') if isinstance(raw.get('settings'),dict) else {}
          report=raw.get('multiBbReport') if isinstance(raw.get('multiBbReport'),dict) else {}
          state=raw.get('multiBbPositions') if isinstance(raw.get('multiBbPositions'),dict) else {}

          def b(v): return 1 if v is True else 0
          def i(v,default=0):
              try:return int(round(float(v)))
              except Exception:return default
          def pack(a,bv):
              return min(max(i(a),0),14)*15+min(max(i(bv),0),14)

          flags=(b(settings.get('asymmetricHedgeModeEnabled'))
                 | (b(settings.get('shortRequiresLongEnabled'))<<1)
                 | (b(settings.get('bollingerEntryFilter15mEnabled'))<<2)
                 | (b(raw.get('enabled'))<<3)
                 | (b(raw.get('monitor'))<<4))
          status_map={
              'WAITING_CAPACITY':1,'WAITING_ACCOUNT_CAP':2,'WAITING_BOLLINGER_ENTRY':3,
              'ORDER_REJECTED':4,'READY_FOR_ENTRY':5,'PARTIAL_FILL_SUBMITTED':6,
              'ENTRY_SUBMITTED':7,'POSITION_ALREADY_OPEN':8,'WAITING_BUDGET':9,
              'WAITING_EXCHANGE':10,'PARTIAL_FILL_PLANNED':11,'ENTRY_PLANNED':12,
          }
          reasons=report.get('entrySkipReasons') if isinstance(report.get('entrySkipReasons'),dict) else {}
          reason_mask=0
          for key in reasons:
              s=str(key).upper()
              if 'LEVERAGE' in s: reason_mask|=1
              if 'MARGIN' in s or 'BUDGET' in s: reason_mask|=2
              if 'SHORT_REQUIRES_LONG' in s: reason_mask|=4
              if 'SLOT_CAP' in s or 'CAPACITY' in s: reason_mask|=8
              if 'NOTIONAL' in s or '5018' in s: reason_mask|=16
              if 'BB_' in s or 'BOLLINGER' in s or 'PRICE_' in s: reason_mask|=32

          metrics={
              0:1,
              1:flags,
              2:min(max(i(settings.get('minimumLeverage')),0),249),
              3:min(max(i(float(settings.get('entryMarginUsd') or 0)*100),0),249),
              4:min(max(i(settings.get('universeTopN')),0),249),
              5:pack(settings.get('longSlots'),settings.get('shortSlots')),
              6:pack(report.get('activeLong'),report.get('activeShort')),
              7:pack(report.get('remainingLong'),report.get('remainingShort')),
              8:status_map.get(str(report.get('entryStatus') or ''),0),
              9:min(max(i(report.get('accountPositionCount')),0),249),
              10:min(max(i(report.get('accountRemainingCapacity')),0),249),
              11:min(max(i(report.get('candidateCount')),0),249),
              12:min(max(i(report.get('scannedCandidateCount')),0),249),
              13:min(max(i(report.get('executableCandidateCount')),0),249),
              14:min(max(len(state),0),249),
              15:min(max(reason_mask,0),249),
          }
          raise SystemExit(metrics.get(idx,0)+1)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --service-account "$RUNTIME_SA" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --tasks 16 --parallelism 4 --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index:.index,exitCode:([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          printf 'LONG_REFILL_ACCOUNT_STATUS %s\n' "$STATUS"

          cleanup
          trap - EXIT
