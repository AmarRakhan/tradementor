name: Dispatch Focus V2 Production Deploy Once

on:
  push:
    branches: [agent/dispatch-focus-v2-prod-20260829]
    paths: ['.github/workflows/one-shot-dispatch-focus-v2-prod.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AmarRakhan/tradementor/actions/workflows/deploy-cloud-production.yml/dispatches \
            -d '{"ref":"amar-crypto-bot-2026-cloud","inputs":{"confirmation":"DEPLOY_PRODUCTION_BACKEND"}}'
