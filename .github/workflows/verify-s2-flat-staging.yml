name: Verify S2 Flat Fix Staging

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths: [.github/workflows/verify-s2-flat-staging.yml]

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: tradementor-amar-20260813
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-staging-api

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amar-crypto-bot-2026-cloud
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Wait for patched staging revision and verify health
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = "tradementor-amar-20260813"
          test "$CLOUD_RUN_SERVICE" = "tradementor-staging-api"
          found=""
          for i in $(seq 1 24); do
            image="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
            if echo "$image" | grep -q 's2-flat-stale-'; then found="$image"; break; fi
            sleep 10
          done
          test -n "$found"
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          health="$(curl --fail --silent --show-error "$url/health")"
          python - "$health" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1])
          assert h['environment']=='staging'
          assert h['ordersEnabled'] is False
          assert h['dataProject']=='tradementor-amar-20260813'
          PY
          printf 'verifiedAt=%s\nservice=%s\nimage=%s\nhealth=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$CLOUD_RUN_SERVICE" "$found" "$health" > .control-plane/s2-flat-staging-verified.txt
      - name: Commit verification marker
        run: |
          git config user.name "TradeMentor Control Plane"
          git config user.email "actions@users.noreply.github.com"
          git add .control-plane/s2-flat-staging-verified.txt
          git commit -m "Verify flat Strategy-2 fix on staging"
          git push origin HEAD:amar-crypto-bot-2026-cloud
