name: Aster Markets Final Acceptance

on:
  push:
    branches: [agent-aster-markets-quick-trade-settings]
    paths:
      - tools/apply_aster_markets_final_phase.py
      - .github/workflows/aster-markets-final-acceptance.yml

permissions:
  contents: write

jobs:
  acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[agent-final-markets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-aster-markets-quick-trade-settings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final integration patch
        run: python tools/apply_aster_markets_final_phase.py
      - name: Static acceptance contract
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('web/app/page.tsx').read_text()
          maker=Path('web/components/aster-strategy2-maker.tsx').read_text()
          markets=Path('web/components/markets-page.tsx').read_text()
          nav=page[page.index('const destinations:'):page.index('const exchangeCopy:')]
          assert 'id: "markets"' in nav and 'id: "aster"' in nav and 'id: "journey"' in nav and 'id: "wallet"' in nav
          assert 'id: "hyperliquid"' not in nav and 'id: "positions"' not in nav and 'id: "risk"' not in nav and 'id: "admin"' not in nav
          assert 'active === "markets" ? <MarketsPage' in page
          assert 'AsterPerformancePanel' not in page
          assert '<ProfilePanel side="LONG"' in maker and '<ProfilePanel side="SHORT"' in maker
          assert 'maker-overlay' not in maker and 'Strategy Maker openen' not in maker
          assert 'Pair override' in maker and 'Reset naar standaard' in maker
          assert 'SafeTradingChart' in markets and 'mode="aster-detail"' in markets
          assert 'OPENING' in markets and 'FAILED' in markets and 'ACTIVE LONG' in markets
          PY
      - name: Install and run web build + complete tests
        working-directory: web
        run: |
          npm ci
          npm test -- --runInBand
      - name: Install backend test dependencies
        run: python -m pip install -q -r cloud_api/requirements.txt
      - name: Run focused Strategy 2 backend tests
        working-directory: cloud_api
        run: python -m pytest -q test_aster_quick_trade_profiles.py test_aster_quick_trade.py
      - name: Commit generated integration
        run: |
          git config user.name "Aster Rebuild Agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/app/page.tsx web/app/premium-next.css web/tests/rendered-html.test.mjs web/tests/aster-markets-final-acceptance.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[agent-final-markets] Integrate four-tab Markets and final acceptance fixes"
          git push origin HEAD:agent-aster-markets-quick-trade-settings
