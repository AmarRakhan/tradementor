name: Deploy Dharma Thuis PWA

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-dharma-thuis-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dharma-thuis-pwa-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: dharma-thuis-pwa
  ARTIFACT_REPOSITORY: tradementor
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DEPLOY_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com
  SOURCE_BRANCH: dharma-thuis-pwa-preview

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify isolated deployment target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CLOUD_RUN_SERVICE" = "dharma-thuis-pwa"
          test "$CLOUD_RUN_SERVICE" != "amar-bot-v44-direct-install"
          test "$CLOUD_RUN_SERVICE" != "tradementor-api"
          test "$CLOUD_RUN_SERVICE" != "tradementor-api-staging"
          test "$CLOUD_RUN_SERVICE" != "aavansh-trading-v1"

      - name: Checkout isolated Dharma source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Verify PWA contract before build
        shell: bash
        run: |
          set -euo pipefail
          test -f dharma-thuis-pwa/index.html
          test -f dharma-thuis-pwa/manifest.webmanifest
          test -f dharma-thuis-pwa/sw.js
          test -f dharma-thuis-pwa/offline.html
          test -f dharma-thuis-pwa/icon.svg
          grep -q '"name": "Dharma Thuis"' dharma-thuis-pwa/manifest.webmanifest
          grep -q '"display": "standalone"' dharma-thuis-pwa/manifest.webmanifest
          grep -q '"sizes": "192x192"' dharma-thuis-pwa/manifest.webmanifest
          grep -q '"sizes": "512x512"' dharma-thuis-pwa/manifest.webmanifest
          grep -q '"purpose": "maskable"' dharma-thuis-pwa/manifest.webmanifest
          grep -q 'cache.add("/offline.html")' dharma-thuis-pwa/sw.js
          grep -q "serviceWorker.register('/sw.js" dharma-thuis-pwa/index.html
          ! grep -q 'beforeinstallprompt' dharma-thuis-pwa/index.html

      - name: Authenticate to Google Cloud from approved main ref
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Dharma PWA image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/dharma-thuis-pwa:${GITHUB_SHA}"
          docker build --tag "$IMAGE" dharma-thuis-pwa
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy separate public Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --port 8080 \
            --min-instances 0 \
            --max-instances 2 \
            --allow-unauthenticated \
            --quiet

      - name: Verify live Samsung PWA requirements
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

          curl --fail --silent --show-error --retry 8 --retry-delay 3 "$SERVICE_URL/" > "$RUNNER_TEMP/root.html"
          grep -q 'Dharma Thuis' "$RUNNER_TEMP/root.html"

          curl --fail --silent --show-error "$SERVICE_URL/manifest.webmanifest" > "$RUNNER_TEMP/manifest.json"
          grep -q '"name": "Dharma Thuis"' "$RUNNER_TEMP/manifest.json"
          grep -q '"display": "standalone"' "$RUNNER_TEMP/manifest.json"

          curl --fail --silent --show-error "$SERVICE_URL/sw.js" | grep -q 'dharma-thuis-shell-v1'
          curl --fail --silent --show-error "$SERVICE_URL/offline.html" | grep -q 'Dharma Thuis'

          test "$(curl -sI "$SERVICE_URL/icon-192.png" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' | tail -1)" = "image/png"
          test "$(curl -sI "$SERVICE_URL/icon-512.png" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' | tail -1)" = "image/png"

          echo "Dharma Thuis direct install URL: $SERVICE_URL"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Dharma Thuis PWA"
            echo ""
            echo "- Direct install URL: $SERVICE_URL"
            echo "- Cloud Run service: $CLOUD_RUN_SERVICE"
            echo "- Source branch: $SOURCE_BRANCH"
            echo "- Existing TradeMentor/Aavansh services: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
