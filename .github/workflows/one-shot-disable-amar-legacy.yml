name: One-shot disable Amar legacy strategies for exclusive Strategy 2

on:
  push:
    branches:
      - amar-crypto-bot-2026-cloud
    paths:
      - ".github/workflows/one-shot-disable-amar-legacy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  disable:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: tradementor-amar-20260813
      GCP_REGION: europe-west4
      CLOUD_RUN_SERVICE: tradementor-strategy2-test-live-api
      TARGET_EMAIL: Amar_rakhan@hotmail.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Disable only legacy Strategy 1 and 3 after strict proof
        shell: bash
        run: |
          set -euo pipefail
          JOB="tm-s2-transfer-${GITHUB_RUN_ID: -6}"
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          SERVICE_JSON="$RUNNER_TEMP/service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image' "$SERVICE_JSON")"
          RUNTIME_SERVICE_ACCOUNT="$(jq -r '.spec.template.spec.serviceAccountName' "$SERVICE_JSON")"
          test -n "$IMAGE"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          SCRIPT_B64="$(base64 -w0 <<'PY'
          from datetime import datetime, timezone
          from google.cloud import firestore

          verified_uid = "mQpS3sbpa8eMUIkPaWUP1TabyZq1"
          db = firestore.Client(project="tradementor-amar-20260813")
          s1_ref = db.collection("asterAutomation").document(verified_uid)
          s2_ref = db.collection("asterStrategy2").document(verified_uid)
          s3_ref = db.collection("asterStrategy3").document(verified_uid)

          def keys(state, strategy_ids, engines):
              result = set()
              rows = state.get("ownedLegs") if isinstance(state.get("ownedLegs"), list) else []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  sid = str(row.get("strategy_id", row.get("strategyId", ""))).lower()
                  eng = str(row.get("engine_type", row.get("engineType", ""))).lower()
                  symbol = str(row.get("symbol", "")).upper()
                  side = str(row.get("side", "")).upper()
                  if sid in strategy_ids and eng in engines and symbol and side in {"LONG", "SHORT"}:
                      result.add((symbol, side))
              return result

          s1_snap, s2_snap, s3_snap = s1_ref.get(), s2_ref.get(), s3_ref.get()
          if not s2_snap.exists:
              raise SystemExit(42)
          s1, s2, s3 = s1_snap.to_dict() or {}, s2_snap.to_dict() or {}, s3_snap.to_dict() or {}
          s1_keys = keys(s1, {"aster-strategy-1", "strategy_1"}, {"strategy1", "strategy_1"})
          s2_keys = keys(s2, {"aster-strategy-2"}, {"strategy2"})
          s3_keys = keys(s3, {"aster-strategy-3"}, {"strategy3"})
          collisions = (s1_keys & s2_keys) | (s1_keys & s3_keys) | (s2_keys & s3_keys)
          if not (bool(s2.get("enabled")) and bool(s2.get("monitor")) and bool(s2.get("exclusiveOwnership"))
                  and int(s2.get("unassignedPositions", 0) or 0) == 0 and not collisions and len(s2_keys) == 68):
              raise SystemExit(43)

          now = datetime.now(timezone.utc)
          reason = "Administratief uitgeschakeld na bewezen exclusieve Strategy-2-ownership"
          batch = db.batch()
          batch.set(s1_ref, {"enabled": False, "monitor": False, "phase": "DISABLED_FOR_STRATEGY2_EXCLUSIVE",
                             "lastReason": reason, "updatedAt": now}, merge=True)
          batch.set(s3_ref, {"enabled": False, "monitor": False, "rapidBuildRequested": False,
                             "phase": "DISABLED_FOR_STRATEGY2_EXCLUSIVE",
                             "lastReason": reason, "updatedAt": now}, merge=True)
          batch.commit()

          s1_after, s2_after, s3_after = s1_ref.get().to_dict() or {}, s2_ref.get().to_dict() or {}, s3_ref.get().to_dict() or {}
          legacy = bool(s1_after.get("enabled") or s1_after.get("monitor") or s3_after.get("enabled") or s3_after.get("monitor"))
          unchanged = (bool(s2_after.get("enabled")) and bool(s2_after.get("monitor"))
                       and bool(s2_after.get("exclusiveOwnership"))
                       and len(keys(s2_after, {"aster-strategy-2"}, {"strategy2"})) == 68
                       and int(s2_after.get("unassignedPositions", 0) or 0) == 0)
          if legacy or not unchanged:
              raise SystemExit(44)
          print("ADMIN_TRANSFER_OK strategy2Owned=68 ordersSent=0 schedulerChanged=0 deleted=0")
          PY
          )"
          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT"             --command python --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"                         --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 300s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
          RC=$?
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by="~metadata.creationTimestamp" --format="value(metadata.name)")"
          gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json
          test "$RC" -eq 0
          gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          trap - EXIT
