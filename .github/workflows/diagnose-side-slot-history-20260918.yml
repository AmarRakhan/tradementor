name: Diagnose Strategy 2 side-slot history read-only 2026-09-18

on:
  push:
    branches: [amar-crypto-bot-2026-cloud]
    paths:
      - '.github/workflows/diagnose-side-slot-history-20260918.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-production-side-slot-history-readonly
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tradementor-production
  GCP_REGION: europe-west4
  CLOUD_RUN_SERVICE: tradementor-api
  WIF_PROVIDER: projects/604335232956/locations/global/workloadIdentityPools/github/providers/tradementor-production
  DIAG_SERVICE_ACCOUNT: github-tradementor-deploy@tradementor-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DIAG_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Encode recent LONG-SHORT slot history in task statuses
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          readarray -t VALUES < <(python - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8'));spec=s['spec']['template']['spec']
          print(spec['containers'][0]['image']);print(spec['serviceAccountName'])
          PY
          )
          IMAGE="${VALUES[0]}"; RUNTIME_SA="${VALUES[1]}"; JOB="tm-slothist-${GITHUB_RUN_ID: -7}"
          cleanup(){ gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          SCRIPT_B64="$(base64 -w0 <<'PY'
          import hashlib,os
          from datetime import datetime,timezone
          import firebase_admin
          from firebase_admin import auth
          from google.cloud import firestore

          project='tradementor-production'
          target_digest='b4dfb7301bb40602e4b2225367437495652a360f6d4a071b8851c6324a82556d'
          idx=int(os.environ['CLOUD_RUN_TASK_INDEX'])
          if not firebase_admin._apps:
              firebase_admin.initialize_app(options={'projectId':project})
          db=firestore.Client(project=project)
          uid=None
          page=auth.list_users()
          while page and uid is None:
              for u in page.users:
                  email=str(u.email or '').strip().lower()
                  if email and hashlib.sha256(email.encode()).hexdigest()==target_digest:
                      uid=u.uid;break
              if uid is None: page=page.get_next_page()
          if not uid: raise SystemExit(1)

          ref=db.collection('asterStrategy2').document(uid)
          rows=[]
          floor=datetime.min.replace(tzinfo=timezone.utc)
          for h in ref.collection('configHistory').stream():
              row=h.to_dict() or {};old=row.get('oldValue') if isinstance(row.get('oldValue'),dict) else {};new=row.get('newValue') if isinstance(row.get('newValue'),dict) else {}
              try:
                  item={'timestamp':row.get('timestamp'),
                        'oldLong':int(old.get('longSlots') or 0),'oldShort':int(old.get('shortSlots') or 0),
                        'newLong':int(new.get('longSlots') or 0),'newShort':int(new.get('shortSlots') or 0)}
              except Exception:
                  continue
              if (item['oldLong'],item['oldShort'])!=(item['newLong'],item['newShort']): rows.append(item)
          rows.sort(key=lambda x:x['timestamp'] if isinstance(x['timestamp'],datetime) else floor,reverse=True)
          rows=rows[:8]

          def pack(a,b): return min(max(a,0),14)*15+min(max(b,0),14)
          metrics={}
          for n,row in enumerate(rows):
              metrics[1+n]=pack(row['oldLong'],row['oldShort'])
              metrics[9+n]=pack(row['newLong'],row['newShort'])
              ts=row['timestamp']
              age=249
              if isinstance(ts,datetime):
                  ts=ts.replace(tzinfo=timezone.utc) if ts.tzinfo is None else ts.astimezone(timezone.utc)
                  age=min(max(int((datetime.now(timezone.utc)-ts).total_seconds()/60),0),249)
              metrics[17+n]=age
          metrics[25]=len(rows)
          raise SystemExit(min(max(int(metrics.get(idx,0)),0),249)+1)
          PY
          )"

          gcloud run jobs deploy "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION"             --image "$IMAGE" --service-account "$RUNTIME_SA" --command python             --args=-c,"import base64;exec(base64.b64decode('$SCRIPT_B64'))"             --tasks 26 --parallelism 6 --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait >/dev/null 2>&1
          set -e
          EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit 1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          TASKS_JSON="$(gcloud run jobs executions tasks list --execution "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          STATUS="$(jq -c '[.. | objects | select((.index? | type) == "number") | {index:.index,exitCode:([.. | objects | .exitCode? | select(type == "number")][0] // -1)}] | unique_by(.index) | sort_by(.index)' <<<"$TASKS_JSON")"
          printf 'SIDE_SLOT_HISTORY_STATUS %s\n' "$STATUS"
          cleanup
          trap - EXIT
