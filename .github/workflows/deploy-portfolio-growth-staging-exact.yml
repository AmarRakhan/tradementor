name: Deploy Portfolio Growth Exact Commit To Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PORTFOLIO_GROWTH_STAGING_E948F07"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradementor-cloud-staging
  cancel-in-progress: false

env:
  EXACT_SHA: e948f07a620e41ece7838c94ca36ff258dff0c46
  GCP_PROJECT_ID: tradementor-amar-20260813
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: tradementor
  CLOUD_RUN_SERVICE: tradementor-staging-api
  FIREBASE_AUTH_PROJECT_ID: tradementor-production

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Authorize exact staging deployment
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "${{ inputs.confirmation }}" = "DEPLOY_PORTFOLIO_GROWTH_STAGING_E948F07"

      - name: Check out exact proven commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact source and immutable scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$GITHUB_REPOSITORY" = "AmarRakhan/tradementor"
          test "$GCP_PROJECT_ID" = "tradementor-amar-20260813"
          test "$CLOUD_RUN_SERVICE" = "tradementor-staging-api"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install and test backend
        run: |
          pip install -r cloud_api/requirements.txt pytest
          cd cloud_api
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test web
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Authenticate to isolated staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push staging image
        shell: bash
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/staging-api:$EXACT_SHA"
          docker build --tag "$IMAGE" cloud_api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy staging with every trading path disabled
        shell: bash
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,TRADEMENTOR_ENV=staging,TRADEMENTOR_ENVIRONMENT=staging,FIREBASE_AUTH_PROJECT_ID=$FIREBASE_AUTH_PROJECT_ID,TRADEMENTOR_READ_SOURCE_URL=https://tradementor-api-604335232956.europe-west4.run.app,TRADEMENTOR_ALLOW_LIVE=false,ASTER_LIVE_EXECUTION_ENABLED=false,ASTER_STRATEGY2_LIVE_ENABLED=false,ASTER_STRATEGY3_LIVE_ENABLED=false,MEXC_LIVE_EXECUTION_ENABLED=false" \
            --allow-unauthenticated

      - name: Verify staging health and exact image
        shell: bash
        run: |
          SERVICE_JSON="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          SERVICE_URL="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"]["url"])' <<< "$SERVICE_JSON")"
          REVISION="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"]["latestReadyRevisionName"])' <<< "$SERVICE_JSON")"
          HEALTH="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$SERVICE_URL/health")"
          python - "$HEALTH" "$REVISION" <<'PY'
          import json, sys
          health = json.loads(sys.argv[1])
          assert health["environment"] == "staging"
          assert health["ordersEnabled"] is False
          assert health["dataProject"] == "tradementor-amar-20260813"
          assert health["identityProject"] == "tradementor-production"
          print(f"staging_revision={sys.argv[2]}")
          print("orders_enabled=false")
          PY
