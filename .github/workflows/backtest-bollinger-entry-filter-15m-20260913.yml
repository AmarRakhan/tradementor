name: Backtest Bollinger Entry Filter 15m

on:
  push:
    branches:
      - agent/bollinger-entry-filter-15m-20260913
    paths:
      - ".github/scripts/backtest_bollinger_entry_filter_15m.py"
      - ".github/workflows/backtest-bollinger-entry-filter-15m-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bollinger-entry-filter-15m-20260913

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud_api/requirements.txt

      - name: Install backtest dependencies
        run: pip install httpx==0.28.1

      - name: Historical no-lookahead replay
        env:
          BB_BACKTEST_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
          BB_BACKTEST_HOURS: "48"
          BB_BACKTEST_HORIZON_MINUTES: "60"
          BB_BACKTEST_DCA_PCT: "0.30"
        run: python .github/scripts/backtest_bollinger_entry_filter_15m.py

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: bollinger-entry-filter-backtest
          path: artifacts/bollinger-entry-filter-backtest.json
          if-no-files-found: error
