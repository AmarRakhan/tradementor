  <style>:root{--kids-bg:#fff8ed;--kids-ink:#3d241c;--kids-orange:#ff7a1a;--kids-pink:#ff6d7e;--kids-blue:#2d9bea;--adult-bg:#f5efe3;--adult-ink:#17372c;--adult-green:#0d4a36;--adult-gold:#c99a4b;--line:rgba(42,38,32,.12);--shadow:0 18px 50px rgba(68,43,17,.12)}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--kids-bg);color:var(--kids-ink);padding-bottom:88px;transition:.25s ease} body.adult{background:var(--adult-bg);color:#17231e} button,input{font:inherit} button{cursor:pointer} img{display:block;max-width:100%}
.topbar{position:sticky;top:0;z-index:20;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2));backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.topbar.kids{background:rgba(255,248,237,.88)}.topbar.adult{background:rgba(245,239,227,.9)}
.brand{border:0;background:none;font-weight:800;font-size:19px;display:flex;align-items:center;gap:9px;color:inherit}.lotus{color:var(--kids-orange);font-size:26px}.adult .lotus{color:var(--adult-gold)}.top-actions{display:flex;gap:10px}.pill,.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:10px 14px}.icon-btn{width:42px;height:42px;padding:0}
.shell{width:min(1180px,calc(100% - 32px));margin:24px auto 0}.hero{position:relative;overflow:hidden;border-radius:32px;box-shadow:var(--shadow)}.hero>img{width:100%;height:460px;object-fit:cover}.kids-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,250,240,.96) 0%,rgba(255,250,240,.75) 38%,transparent 68%)}.hero-copy,.adult-overlay{position:absolute;z-index:2;left:46px;top:50%;transform:translateY(-50%);max-width:450px}.hero-copy h1,.adult-overlay h1{font-size:clamp(36px,5vw,64px);line-height:1.03;margin:8px 0 15px}.hero-copy p,.adult-overlay p{font-size:18px;line-height:1.6}.eyebrow,.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.hero-buttons{display:flex;gap:12px;margin-top:22px}.primary,.secondary,.adult-button{border:0;border-radius:16px;padding:14px 20px;font-weight:800}.primary{background:var(--kids-orange);color:#fff;box-shadow:0 10px 24px rgba(255,122,26,.25)}.secondary{background:#fff;color:var(--kids-ink)}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:42px 4px 18px}.section-head h2{margin:5px 0 0;font-size:30px}.link{border:0;background:none;color:inherit;opacity:.72}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.content-card{border-radius:24px;overflow:hidden;background:rgba(255,255,255,.72);box-shadow:0 8px 28px rgba(39,27,11,.07);border:1px solid rgba(255,255,255,.8);transition:.2s;cursor:pointer}.content-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.content-card>img{width:100%;height:230px;object-fit:cover;object-position:top}.card-copy{padding:18px;position:relative;min-height:154px}.card-copy h3{font-size:25px;margin:8px 0 5px}.card-copy p{margin:0;opacity:.68;line-height:1.45;padding-right:30px}.mini-tag{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.12em;opacity:.55}.round{position:absolute;right:16px;bottom:16px;width:38px;height:38px;border:0;border-radius:50%;background:#fff}.kid-cards .round{color:var(--kids-orange)}
.family-banner{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center;margin:30px 0;background:#1c1d42;color:#fff;border-radius:28px;padding:18px;overflow:hidden}.family-banner img{height:310px;width:100%;object-fit:cover;border-radius:20px}.family-banner>div{padding:20px}.family-banner h2{font-size:32px;margin:8px 0}.family-banner p{opacity:.8;line-height:1.6}.duo,.adult-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0 40px}.soft-card{display:flex;gap:16px;align-items:center;padding:24px;border-radius:22px;background:#fff;border:1px solid var(--line)}.soft-card h3{margin:0 0 5px}.soft-card p{margin:0;opacity:.68}.bubble{font-size:34px}.progress{height:7px;background:#eee;border-radius:999px;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--kids-orange),#ffc04f);border-radius:inherit}
.adult-hero>img{filter:saturate(.78) brightness(.68);height:430px}.adult-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,45,31,.84),rgba(6,45,31,.35),transparent)}.adult-overlay{color:#fff}.adult-overlay h1{font-family:Georgia,'Times New Roman',serif;font-weight:700}.continue-card{display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:center;background:#fbf7ee;border:1px solid rgba(13,74,54,.12);padding:18px;border-radius:24px;margin-top:24px}.continue-cover img{width:150px;height:104px;object-fit:cover;border-radius:16px}.continue-copy h2{font-family:Georgia,'Times New Roman',serif;font-size:28px;margin:6px 0}.continue-copy p{margin:0 0 10px;opacity:.68}.progress.dark i{background:var(--adult-green)}.adult-button{background:var(--adult-green);color:#fff}.adult-cards .content-card{background:#fbf7ee}.adult-cards .card-copy h3,.adult-shell h2,.page-title h1{font-family:Georgia,'Times New Roman',serif}.adult-cards .round{background:var(--adult-green);color:#fff}.quote-card,.stat-card{border-radius:24px;padding:30px;background:var(--adult-green);color:#fff}.quote-card blockquote{font-family:Georgia,'Times New Roman',serif;font-size:27px;line-height:1.35;margin:12px 0}.quote-card p{opacity:.72}.stat-card{background:#fbf7ee;color:#17231e}.stat-card strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:58px;color:var(--adult-green);margin-top:8px}
.bottom-nav{position:fixed;z-index:30;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));height:68px;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(18,18,18,.14);backdrop-filter:blur(24px)}.bottom-nav.kids{background:rgba(255,255,255,.9)}.bottom-nav.adult{background:rgba(251,247,238,.92)}.bottom-nav button{border:0;background:none;border-radius:16px;color:inherit;font-size:11px;display:grid;place-items:center;gap:2px}.bottom-nav button span{font-size:20px}.bottom-nav.kids .active{background:#fff1df;color:var(--kids-orange)}.bottom-nav.adult .active{background:#e7efe9;color:var(--adult-green)}
.page-title{padding:26px 4px}.page-title h1{font-size:48px;margin:8px 0}.page-title p{font-size:18px;opacity:.67}.search{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:14px 18px;border-radius:18px;margin-bottom:22px}.search input{border:0;outline:0;background:none;width:100%;font-size:16px}.subpage .cards{grid-template-columns:repeat(3,1fr)}.story-page{padding-bottom:30px}.back{border:0;background:none;padding:8px 0 18px;color:inherit}.story-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;background:#fff;border-radius:28px;padding:18px}.story-hero img{width:100%;height:480px;object-fit:cover;border-radius:20px;object-position:top}.story-hero h1{font-size:48px;margin:7px 0}.lesson,.reader{margin-top:22px;background:#fff;border-radius:24px;padding:28px}.lesson-pills{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.lesson-pills span{padding:9px 13px;background:#fff4e7;border-radius:999px}.reader nav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}.reader nav button{border:0;background:none;padding:11px 16px}.reader nav .active{background:#e7efe9;border-radius:12px;color:var(--adult-green);font-weight:700}.reader article{max-width:790px}.reader p,.reader dd{line-height:1.75;color:#4b514e}.reader dt{font-family:Georgia,'Times New Roman',serif;font-size:22px;margin-top:15px}
.modal-backdrop{position:fixed;z-index:100;inset:0;background:rgba(12,18,15,.48);display:grid;place-items:center;padding:20px;backdrop-filter:blur(10px)}.settings-modal{width:min(620px,100%);background:#fff;border-radius:28px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.24)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:34px;margin:5px 0}.setting-group{padding:22px 0;border-top:1px solid var(--line)}.setting-group label{display:block;font-weight:800;margin-bottom:12px}.segmented{display:grid;grid-template-columns:1fr 1fr;background:#f1eee8;padding:5px;border-radius:16px}.segmented button{border:0;background:transparent;border-radius:12px;padding:14px;font-weight:700}.segmented .active{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}.help{font-size:13px;opacity:.6;line-height:1.5}.preview-switch{border-radius:18px;padding:18px;display:grid;gap:4px}.preview-switch.kids{background:#fff2df;color:#6b3412}.preview-switch.adult{background:#e6eee8;color:var(--adult-green)}.preview-switch span{font-size:13px;opacity:.72}

      <div class="continue-copy"><span class="kicker">Bhagavad Gita</span><h2>${t('continue')}</h2><p>Hoofdstuk 2 · De aard van de ziel</p><div class="progress dark"><i style="width:60%"></i></div><small>60% voltooid</small></div>
      <button class="adult-button">Ga verder →</button>
    </section>

    <section class="section-head"><div><span class="kicker">Kennisbank</span><h2>${t('themes')}</h2></div><button class="link" data-nav="library">Alle thema’s →</button></section>
    <section class="cards adult-cards">${adultCards.map((c,i)=>card(c,i)).join('')}</section>

    <section class="adult-grid">
      <article class="quote-card"><span>ॐ</span><blockquote>“Kennis van onze traditie verbindt ons met wie we werkelijk zijn.”</blockquote><p>Leer in je eigen tempo, zonder voorkennis.</p></article>
      <article class="stat-card"><span class="kicker">${t('progress')}</span><strong>42%</strong><p>3 van 5 thema’s gestart</p><div class="progress dark"><i style="width:42%"></i></div></article>
    </section>
  </main>`;
}

function card(c,i){
  return `<article class="content-card" data-story="${i}"><img src="${c[2]}" alt="${c[0]}"/><div class="card-copy"><span class="mini-tag">${state.mode === 'kids' ? 'Verhaal' : 'Thema'}</span><h3>${c[0]}</h3><p>${c[1]}</p><button class="round">→</button></div></article>`
}

function libraryPage(){
  const isKids = state.mode === 'kids';
  const items = isKids ? kidsCards : adultCards;
  return `<main class="shell subpage ${state.mode}-shell">
    <div class="page-title"><span class="kicker">${isKids ? 'Ontdek' : 'Bibliotheek'}</span><h1>${isKids ? 'Kies een verhaal' : 'Blijf ontdekken'}</h1><p>${isKids ? 'Kleine verhalen, grote waarden.' : 'Tijdloze wijsheid voor het leven van nu.'}</p></div>
    <div class="search">⌕ <input placeholder="${isKids ? 'Zoek verhalen of personages…' : 'Zoek in verhalen, audio, video of gebeden…'}" /></div>
    <section class="cards ${isKids?'kid-cards':'adult-cards'}">${items.concat(items).map((c,i)=>card(c,i)).join('')}</section>
  </main>`;
}

function storyPage(i=0){
 const isKids=state.mode==='kids';
 const item=(isKids?kidsCards:adultCards)[i%3];
 return `<main class="shell story-page ${state.mode}-shell">
   <button class="back" data-nav="${isKids?'stories':'library'}">← Terug</button>
   <section class="story-hero"><img src="${item[2]}" alt="${item[0]}"/><div><span class="kicker">${isKids?'Verhaal':'Verdieping'}</span><h1>${item[0]}</h1><p>${item[1]}</p></div></section>
   ${isKids ? `<section class="lesson"><h2>Wat gaan we leren?</h2><div class="lesson-pills"><span>❤️ Liefde</span><span>🦁 Moed</span><span>🤝 Helpen</span></div><p>Luister naar het verhaal, bekijk de afbeeldingen en beantwoord daarna drie simpele vragen.</p><button class="primary">▶ Start verhaal</button></section>` : `<section class="reader"><nav><button class="active">Overzicht</button><button>Personen</button><button>Tijdlijn</button><button>Betekenis</button></nav><article><h2>Samenvatting</h2><p>Deze leerroute plaatst het verhaal in zijn historische, religieuze en filosofische context. Belangrijke begrippen worden apart uitgelegd en gekoppeld aan het dagelijks leven.</p><h3>Belangrijke begrippen</h3><dl><dt>Dharma</dt><dd>Plicht, juiste handelwijze en leven in overeenstemming met morele waarden.</dd><dt>Bhakti</dt><dd>Toegewijde liefde en een persoonlijke relatie met het goddelijke.</dd></dl></article></section>`}
 </main>`;
}

function settings(){
  return `<div class="modal-backdrop" data-modal-close><section class="settings-modal" onclick="event.stopPropagation()">
    <div class="modal-head"><div><span class="kicker">Dharma Thuis</span><h2>${t('settings')}</h2></div><button class="icon-btn" data-modal-close>✕</button></div>
    <div class="setting-group"><label>${t('experience')}</label><div class="segmented"><button data-mode="kids" class="${state.mode==='kids'?'active':''}">🪷 ${t('kids')}</button><button data-mode="adult" class="${state.mode==='adult'?'active':''}">📖 ${t('adult')}</button></div><p class="help">Je wisselt alleen de ervaring. Je account, taal en voortgang blijven hetzelfde.</p></div>
    <div class="setting-group"><label>${t('language')}</label><div class="segmented"><button data-lang="nl" class="${state.lang==='nl'?'active':''}">🇳🇱 Nederlands</button><button data-lang="en" class="${state.lang==='en'?'active':''}">🇬🇧 English</button></div></div>
    <div class="setting-group"><label>App</label><p class="help">Na installatie opent Dharma Thuis als een zelfstandige app via Samsung Internet of Chrome.</p></div>
    <div class="preview-switch ${state.mode}"><strong>${state.mode==='kids'?'Kindermodus actief':'Volwassen modus actief'}</strong><span>${state.mode==='kids'?'Speelser, visueler, kortere lessen en quizzen.':'Rustiger, diepere uitleg, context en praktische toepassing.'}</span></div>
  </section></div>`;
}

function bottomNav(){
 const kids=state.mode==='kids';
 const nav = kids ? [['home','⌂',t('home')],['stories','▤',t('stories')],['learn','✦',t('learn')],['festivals','☀',t('festivals')],['profile','◉',t('profile')]] : [['home','⌂',t('home')],['library','▤',t('library')],['practice','✦',t('practice')],['family','♙',t('family')],['profile','◉',t('profile')]];
 return `<nav class="bottom-nav ${state.mode}">${nav.map(n=>`<button data-nav="${n[0]}" class="${state.page===n[0]?'active':''}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;
}

function render(){
  let content;
  if(state.page==='home') content = state.mode==='kids'?kidsHome():adultHome();
  else if(state.page==='stories' || state.page==='library') content=libraryPage();
  else if(state.page.startsWith('story-')) content=storyPage(Number(state.page.split('-')[1]||0));
  else content=libraryPage();
  document.body.className=state.mode;
  $('#app').innerHTML = topbar()+content+bottomNav();
  bind();
}
function bind(){
  document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=()=>document.body.insertAdjacentHTML('beforeend',settings()));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav; render(); window.scrollTo({top:0,behavior:'smooth'});});
  document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{state.page='story-'+b.dataset.story;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-lang-toggle]').forEach(b=>b.onclick=()=>{state.lang=state.lang==='nl'?'en':'nl';localStorage.setItem('dharma-lang',state.lang);render();});
}
document.addEventListener('click',e=>{
  const mode=e.target.closest('[data-mode]'); if(mode){state.mode=mode.dataset.mode;state.page='home';localStorage.setItem('dharma-mode',state.mode);document.querySelector('.modal-backdrop')?.remove();render();}
  const lang=e.target.closest('[data-lang]'); if(lang){state.lang=lang.dataset.lang;localStorage.setItem('dharma-lang',state.lang);document.querySelector('.modal-backdrop')?.remove();render();}
  if(e.target.matches('[data-modal-close]')) document.querySelector('.modal-backdrop')?.remove();
});
render();
</script>
